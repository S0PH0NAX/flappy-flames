<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Dragon Conqueror</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b1a">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>

<!-- Level & Cutscene Audio Tracks -->
  <audio id="bgMusic" src="assets/audio/battleground_remastered.mp3" loop preload="auto"></audio>
  <audio id="uiMusic" src="assets/audio/EpicOrchestralFantasy.mp3" loop preload="auto"></audio>
  <audio id="cutsceneMusic" src="assets/audio/Dark Descent.mp3" loop preload="auto"></audio>

  <!-- Sound Effects Preload (Only existing files) -->
  <audio id="sfxBoost" src="assets/audio/wings_flap_large.flac" preload="auto"></audio>
  <audio id="sfxRockBreak" src="assets/audio/rock_breaking.flac" preload="auto"></audio>
  <audio id="sfxArrow" src="assets/audio/swish_3.wav" preload="auto"></audio>
  <audio id="sfxBoulder" src="assets/audio/cannon_01.ogg" preload="auto"></audio>

  <!-- Celebration Audio Elements -->
  <audio id="sfxFireworks" src="assets/audio/fw_loop.ogg" preload="auto"></audio>

  <!-- Royal Entrance Audio Elements -->
  <audio id="sfxQueenEntrance" src="assets/audio/lets_go_i_cant_stand_another_minute_here.ogg" preload="auto"></audio>
  <audio id="sfxKingEntrance" src="assets/audio/ogalaughter_2.ogg" preload="auto"></audio>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
   
    <div class="level-progress-badge">
      <div id="progressBarFill" class="level-progress-fill"></div>
      <div id="levelBadge" class="level-progress-text">LVL 1</div>
    </div>

    <div id="scoreDisplay" class="score-display">0</div>
    <div id="heartsDisplay" class="hearts-display">
      <div id="heartsText">❤️❤️❤️</div>
      <div id="headsText" style="font-size: 14px; color: #f1c40f; margin-top: 2px;">👑 0</div>
    </div>

    <div id="bottomControlsBar" class="bottom-controls-bar">
      <button id="manualFireBtn" class="action-btn fire-btn">FIRE <span class="btn-symbol">🔥</span></button>
      <button id="toggleFireModeBtn" class="action-btn active">MODE <span class="btn-symbol-large">🔄</span></button>
      <button id="pauseBtn" class="action-btn">PAUSE <span class="btn-symbol">⏸</span></button>
      <button id="soundBtn" class="action-btn sound-toggle-btn">🔊</button>
    </div>

<div id="pauseModal" class="modal-overlay" style="display: none;">
  <div class="modal-box" style="max-width: 420px; padding: 24px;">
    <div class="modal-title" style="font-size: 24px; margin-bottom: 16px;">GAME PAUSED</div>
    
    <p style="font-size: 13px; color: #ccc; margin-bottom: 6px;">Your save code:</p>
    <div id="saveCodeDisplay" class="save-code-box" style="font-size: 20px; white-space: nowrap; padding: 14px; margin-bottom: 20px;">----&#8209;----&#8209;----</div>
    
    <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
      <button id="copyCodeBtn" class="action-btn modal-btn">COPY SAVE CODE 📋</button>
      <button id="closeSaveModalBtn" class="action-btn modal-btn" style="background: #2ecc71; border-color: #fff; box-shadow: 0 4px 0 #27ae60;">◀️ RETURN</button>
    </div>
  </div>
</div>

    <div id="shareModal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-title">SHARE VICTORY POST</div>
        <canvas id="shareCanvas" width="800" height="800"></canvas>
        <div style="display: flex; gap: 8px;">
          <button id="downloadShareBtn" class="action-btn" style="background: #2ecc71; border-color: #fff; box-shadow: 0 4px 0 #27ae60;">DOWNLOAD PHOTO</button>
          <button id="closeShareModalBtn" class="action-btn" style="background: #e74c3c; border-color: #fff; box-shadow: 0 4px 0 #c0392b;">CLOSE</button>
        </div>
      </div>
    </div>

    <div id="loadModal" class="modal-overlay" style="display: none;">
      <div class="modal-box">
        <div class="modal-title">LOAD GAME</div>
        <p style="font-size: 12px; color: #ccc;">Enter save code:</p>
        <input type="text" id="loadCodeInput" class="save-input-box" maxlength="16" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <div style="display: flex; gap: 8px;">
          <button id="cancelLoadBtn" class="action-btn" style="background: #e74c3c; border-color: #fff; box-shadow: 0 4px 0 #c0392b;">CANCEL</button>
          <button id="confirmLoadBtn" class="action-btn" style="background: #2ecc71; border-color: #fff; box-shadow: 0 4px 0 #27ae60;">LOAD</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Classic scripts (no ES modules) so index.html works from file:///. Order matters. -->
  <script src="src/js/config.js"></script>
  <script src="src/js/audio.js"></script>
  <script src="src/js/ui.js"></script>
  <script src="src/js/entities.js"></script>
  <script src="src/js/input.js"></script>
  <script src="src/js/render-sky.js"></script>
  <script src="src/js/render-world.js"></script>
  <script src="src/js/render-characters.js"></script>
  <script src="src/js/render-dragon.js"></script>
  <script src="src/js/render-enemies.js"></script>
  <script src="src/js/render-people.js"></script>
  <script src="src/js/render-masonry.js"></script>
  <script src="src/js/effects.js"></script>
  <script src="src/js/screens.js"></script>
  <script src="src/js/boss.js"></script>
  <script src="src/js/boss-update.js"></script>
  <script src="src/js/boss-render.js"></script>
  <script src="src/js/boss-intro.js"></script>
  <script src="src/js/knights.js"></script>
  <script src="src/js/treasure.js"></script>
  <script src="src/js/prologue.js"></script>
  <script src="src/js/render-prologue.js"></script>
  <script src="src/js/cathedral.js"></script>
  <script src="src/js/render-cathedral.js"></script>
  <script src="src/js/boss-fall.js"></script>
  <script src="src/js/cave.js"></script>
  <script src="src/js/render-cave.js"></script>
  <script src="src/js/main.js"></script>
</body>
</html>
