<script>
// cave.js — The two cave levels after Brown Jenkins' bargain (boss-fall.js), and the climb back to the surface.
// A long, winding tunnel with an irregular ceiling and floor, no towers, enemies, nobles, Sarai or treasure.
// It is dark: only Cyndraxx's own faint glow, his flames and the torches he lights show the walls.
// Touching rock costs a heart. After CAVE 2, the surfacing cutscene (state 'SURFACE') leads to level 4.
// caveLevel is 1 or 2 while in the caves (currentLevel stays 4, so level 4 follows). Drawing: render-cave.js.
// Classic script: shares global scope with the other src/js files.

const CAVE_DURATIONS = { 1: 80, 2: 90 };
const CAVE_TITLES = { 1: ['THE CAVERNS BELOW', 'Your flame lights the way. Light the torches.'], 2: ['DEEPER STILL', 'The tunnel narrows...'] };
const CAVE_CODES = { 1: 12, 2: 13 };   // save-code level characters "C" and "D"
const SURFACE_LEN = 560;

let caveLevel = 0;
let cave = null;
let surface = null;

// the cave is on screen (playing, paused or game over in it)
function caveView() {
  return caveLevel > 0 && !!cave && (state === 'PLAYING' || state === 'PAUSED' || state === 'GAMEOVER');
}

function resetCave() { caveLevel = 0; cave = null; surface = null; }

function startCaveLevel(n) {
  obstacles = []; battlements = []; archers = []; arrows = []; knights = []; khaleesis = [];
  trebuchets = []; trebuchetBoulders = []; collectableHearts = []; groundFlames = []; flames = [];
  particles = []; floatingTexts = []; blackDebris = [];
  clearLevelExtras();
  if (bossState) bossState.active = false;
  khaleesiMounted = false;
  khaleesiBannerTimer = 0;
  currentLevel = 4;
  levelTimerSeconds = 0;
  caveLevel = n;
  cave = { scroll: 0, t: 0, torches: [], nextTorch: 520, ending: 0, distAcc: 0, title: 260,
    spiders: [], nextSpider: 1100, webs: [], nextWeb: 1700 };
  dragon.x = dragon.baseX; dragon.targetX = dragon.baseX; dragon.vx = 0;
  dragon.y = height * 0.5; dragon.velocity = dragon.jump; dragon.wingState = 1;
  invulnerableTimer = 0;
  isHoldingAction = false;
  state = 'PLAYING';
  updateLevelBadgeUI();
  updateHeartsDisplay();
}

// ---- the tunnel: smooth noise for the middle line and the gap, a little jaggedness on each wall ----
function caveNoise(x, seed) {
  const i = Math.floor(x), f = x - i;
  const a = hash2(i, seed), b = hash2(i + 1, seed);
  const u = f * f * (3 - 2 * f);
  return a + (b - a) * u;
}
function caveGap(wx) {
  const base = caveLevel === 2 ? 250 : 292;
  const open = Math.max(0, 700 - wx) * 0.3;          // a roomy start
  return Math.min(height * 0.66, base + (caveNoise(wx / 650, 5) - 0.5) * 70 + open);
}
function caveMid(wx) {
  const H = height;
  const amp = H * (caveLevel === 2 ? 0.22 : 0.16) * Math.min(1, wx / 1100);
  return H * 0.5 + (caveNoise(wx / 430, 11) - 0.5) * 2 * amp + (caveNoise(wx / 160, 13) - 0.5) * amp * 0.45;
}
function caveCeilAt(wx) { return Math.max(16, caveMid(wx) - caveGap(wx) / 2 + (caveNoise(wx / 34, 17) - 0.5) * 16); }
function caveFloorAt(wx) { return Math.min(height - 16, caveMid(wx) + caveGap(wx) / 2 + (caveNoise(wx / 34, 19) - 0.5) * 16); }

// where a torch's flame burns: hanging from the ceiling, standing on the floor, or swinging on a long
// chain in the middle of the tunnel (tc.kind 'top', 'floor' or 'mid')
function caveTorchHead(tc) {
  const x = tc.wx - cave.scroll;
  if (tc.kind === 'mid') return { x: x + Math.sin(cave.t * 0.025 + tc.wx) * 6, y: caveMid(tc.wx) + (hash2(Math.floor(tc.wx), 11) - 0.5) * caveGap(tc.wx) * 0.3 };
  return tc.kind === 'top' ? { x: x, y: caveCeilAt(tc.wx) + 26 } : { x: x, y: caveFloorAt(tc.wx) - 28 };
}

function updateCave() {
  const C = cave;
  C.t++;
  if (C.title > 0) C.title--;
  const speed = getLevelScrollSpeed();
  C.scroll += speed;
  groundFlames = [];                                  // there is no ground strip down here
  if (!C.ending) {
    levelTimerSeconds += 1 / 60;
    updateLevelBadgeUI();
  }

  // flight (same as the main game)
  dragon.velocity += dragon.gravity;
  dragon.y += dragon.velocity;
  if (isHoldingAction) {
    holdTimer++;
    if (holdTimer > 4 && holdTimer < 45) {
      dragon.vx += 0.95;
      dragon.wingState = 0.8;
      sound.whoosh();
    }
  }
  dragon.x += dragon.vx;
  dragon.vx *= 0.90;
  const thirty = width * 0.30;
  if (dragon.x > dragon.baseX) {
    let back = 1.2;
    if (dragon.x > thirty) back = 3.5 + (dragon.x - thirty) / (width - thirty) * 9.0;
    dragon.x = Math.max(dragon.baseX, dragon.x - back);
  }

  // the rock: a knock costs a heart and puts him back in the middle of the tunnel
  const pad = 7, half = dragon.size / 2 - pad;
  let hit = false;
  [-half, 0, half].forEach(ox => {
    const wx = C.scroll + dragon.x + ox;
    if (dragon.y - half < caveCeilAt(wx) || dragon.y + half > caveFloorAt(wx)) hit = true;
  });
  const cwx = C.scroll + dragon.x;
  if (hit) {
    if (invulnerableTimer <= 0) {
      triggerHit();
      if (lives > 0) {
        dragon.y = (caveCeilAt(cwx) + caveFloorAt(cwx)) / 2;
        dragon.velocity = 0;
      }
    } else {
      // still blinking from the last knock: don't let him sink into the rock
      dragon.y = Math.max(caveCeilAt(cwx) + half + 1, Math.min(caveFloorAt(cwx) - half - 1, dragon.y));
      if (dragon.velocity > 0 && dragon.y >= caveFloorAt(cwx) - half - 1) dragon.velocity = 0;
    }
  }

  // flames die against the rock; a flame near an unlit torch lights it
  flames.forEach(f => {
    const wx = C.scroll + f.x;
    if (f.y < caveCeilAt(wx) || f.y > caveFloorAt(wx)) { f.life = Math.min(f.life, 5); f.vx *= 0.4; }
  });
  while (C.nextTorch < C.scroll + width + 120) {
    const kr = hash2(Math.floor(C.nextTorch), 7);
    C.torches.push({ wx: C.nextTorch, kind: kr < 0.36 ? 'top' : (kr < 0.72 ? 'floor' : 'mid'), lit: false, litT: 0 });
    C.nextTorch += (caveLevel === 2 ? 460 : 380) + hash2(Math.floor(C.nextTorch), 9) * 340;
  }
  C.torches.forEach(tc => {
    if (tc.lit) { tc.litT++; return; }
    const h = caveTorchHead(tc);
    if (flames.some(f => Math.abs(f.x - h.x) < 30 && Math.abs(f.y - h.y) < 30)) {
      tc.lit = true;
      sound.fireRoar();
      const r = addScore(10);
      floatingTexts.push({ x: h.x - 30, y: h.y - 20, text: 'TORCH LIT +' + r.totalPts, color: '#ffcf5a', alpha: 1.0, vy: -1.2 });
      for (let i = 0; i < 12; i++) {
        particles.push({ x: h.x, y: h.y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, size: 2 + Math.random() * 2, life: 20 + Math.random() * 15, color: Math.random() < 0.5 ? '#ffcf5a' : '#ff793f' });
      }
    }
  });
  C.torches = C.torches.filter(tc => tc.wx - C.scroll > -120);

  updateCaveSpiders(C, speed);
  updateCaveWebs(C);

  // a point for every stretch of tunnel survived
  C.distAcc += speed;
  if (C.distAcc >= 240) { C.distAcc -= 240; addScore(1); }

  // the end of the level: fade to black, then CAVE 2 or the way up
  if (!C.ending && levelTimerSeconds >= (CAVE_DURATIONS[caveLevel] || 80)) C.ending = 1;
  if (C.ending) {
    C.ending++;
    if (C.ending > 80) {
      if (caveLevel === 1) startCaveLevel(2);
      else startSurfaceScene();
    }
  }
}

// ---- cave spiders: they crawl along the ceiling and floor and leap at him when he comes close ----
// (wx is in world coordinates like the torches; y is on screen). A flame kills one; touching one costs a heart.
const SPIDER_GAP = { 1: [950, 700], 2: [620, 480] };   // world px between spiders: base + random
const SPIDER_PTS = 25;
const SPIDER_LEAP_RANGE = 220;
const SPIDER_LEAP_FRAMES = 26;
const SPIDER_GRAVITY = 0.3;
function caveSpiderRest(sp) {
  return sp.surf === 'top' ? caveCeilAt(sp.wx) + sp.r * 0.7 : caveFloorAt(sp.wx) - sp.r * 0.7;
}
function updateCaveSpiders(C, speed) {
  const gap = SPIDER_GAP[caveLevel] || SPIDER_GAP[1];
  while (C.nextSpider < C.scroll + width + 160) {
    const h = hash2(Math.floor(C.nextSpider), 21);
    const sp = { wx: C.nextSpider, surf: h < 0.5 ? 'top' : 'floor', state: 'crawl', r: 11 + hash2(Math.floor(C.nextSpider), 23) * (caveLevel === 2 ? 8 : 5),
      dir: hash2(Math.floor(C.nextSpider), 25) < 0.7 ? -1 : 1, crawl: 0.6 + hash2(Math.floor(C.nextSpider), 27) * 0.9,
      vx: 0, vy: 0, leapT: 0, cool: 40, legT: 0, rot: 0, seed: Math.floor(C.nextSpider) };
    sp.y = caveSpiderRest(sp);
    C.spiders.push(sp);
    C.nextSpider += gap[0] + hash2(Math.floor(C.nextSpider), 29) * gap[1];
  }
  C.spiders.forEach(sp => {
    const sx = sp.wx - C.scroll;
    sp.legT++;
    if (sp.cool > 0) sp.cool--;
    if (sp.state === 'crawl') {
      // skitter along the rock, now and then stopping and turning
      if (hash2(sp.seed, Math.floor(sp.legT / 50)) < 0.12) { sp.moving = false; }
      else { sp.moving = true; sp.wx += sp.dir * sp.crawl; }
      if (sp.legT % 140 === 0 && hash2(sp.seed, sp.legT) < 0.35) sp.dir = -sp.dir;
      sp.y = caveSpiderRest(sp);
      const dx = sx - dragon.x;
      if (sp.cool <= 0 && dx > -10 && dx < SPIDER_LEAP_RANGE && !C.ending) {
        // leap: aim at where he will be, allowing for the scroll
        const T = SPIDER_LEAP_FRAMES;
        const tx = dragon.x + 10, ty = dragon.y;
        sp.vx = (tx - sx) / T + speed;
        sp.vy = (ty - sp.y) / T - 0.5 * SPIDER_GRAVITY * T;
        sp.state = 'leap'; sp.leapT = 0;
        sound.spiderHiss();
      }
    } else if (sp.state === 'leap') {
      sp.leapT++;
      sp.wx += sp.vx;
      sp.vy += SPIDER_GRAVITY;
      sp.y += sp.vy;
      sp.rot += 0.12 * Math.sign(sp.vx - speed || 1);
      const ceil = caveCeilAt(sp.wx), floor = caveFloorAt(sp.wx);
      if (sp.leapT > 6 && (sp.y < ceil + sp.r * 0.7 || sp.y > floor - sp.r * 0.7)) {
        sp.surf = sp.y < (ceil + floor) / 2 ? 'top' : 'floor';
        sp.state = 'crawl'; sp.rot = 0; sp.cool = 130; sp.dir = -1;
        sp.y = caveSpiderRest(sp);
      }
    } else if (sp.state === 'dead') {
      sp.vy += 0.35; sp.y += sp.vy; sp.wx += sp.vx; sp.rot += 0.15;
    }
    if (sp.state === 'dead') return;
    const nsx = sp.wx - C.scroll;
    // burned by his flame
    if (flames.some(f => Math.hypot(f.x - nsx, f.y - sp.y) < sp.r + 12)) {
      sp.state = 'dead'; sp.vx = speed * 0.5; sp.vy = sp.surf === 'top' ? 0 : -3;
      sound.spiderSquish();
      const r = addScore(SPIDER_PTS);
      floatingTexts.push({ x: nsx - 30, y: sp.y - 20, text: 'SPIDER +' + r.totalPts, color: '#ff6b6b', alpha: 1.0, vy: -1.2 });
      for (let i = 0; i < 14; i++) particles.push({ x: nsx, y: sp.y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.7) * 4, size: 2 + Math.random() * 3, life: 20 + Math.random() * 20, color: i % 3 ? '#ff9f43' : '#6a8f2a' });
      return;
    }
    // it gets him
    if (Math.hypot(nsx - dragon.x, sp.y - dragon.y) < sp.r + dragon.size * 0.32) {
      if (invulnerableTimer <= 0) triggerHit();
      sp.state = 'leap'; sp.leapT = 0; sp.vx = speed + 3; sp.vy = sp.y < dragon.y ? -2 : 2; sp.cool = 200;   // it springs off him
    }
  });
  C.spiders = C.spiders.filter(sp => sp.wx - C.scroll > -80 && sp.y < height + 60 && sp.y > -60);
}

// ---- webs strung across the whole tunnel: burn through them, or fly into them and lose a heart ----
const WEB_GAP = { 1: [1800, 900], 2: [1300, 700] };
const WEB_HP = 100;
const WEB_BURN_PER_FLAME = 9;    // per flame, per frame it touches the web
const WEB_BURN_FRAMES = 45;
const WEB_PTS = 15;
function updateCaveWebs(C) {
  const gap = WEB_GAP[caveLevel] || WEB_GAP[1];
  while (C.nextWeb < C.scroll + width + 200) {
    // keep webs clear of torches so a torch is never trapped behind one
    let wx = C.nextWeb;
    if (C.torches.some(tc => Math.abs(tc.wx - wx) < 90)) wx += 120;
    C.webs.push({ wx: wx, hp: WEB_HP, state: 'whole', burnT: 0, spots: [], seed: Math.floor(wx) });
    C.nextWeb = wx + gap[0] + hash2(Math.floor(wx), 31) * gap[1];
  }
  C.webs.forEach(wb => {
    const sx = wb.wx - C.scroll;
    wb.spots.forEach(sp => sp.t++);
    wb.spots = wb.spots.filter(sp => sp.t < 70);
    if (wb.state === 'whole') {
      const ceil = caveCeilAt(wb.wx), floor = caveFloorAt(wb.wx);
      flames.forEach(f => {
        if (Math.abs(f.x - sx) < 16 && f.y > ceil && f.y < floor) {
          wb.hp -= WEB_BURN_PER_FLAME;
          if (wb.spots.length < 24 && Math.random() < 0.5) wb.spots.push({ y: f.y, t: 0 });
        }
      });
      if (wb.hp <= 0) {
        wb.state = 'burning'; wb.burnT = 0;
        sound.fireRoar();
        const r = addScore(WEB_PTS);
        floatingTexts.push({ x: sx - 40, y: (ceil + floor) / 2 - 30, text: 'WEB BURNED +' + r.totalPts, color: '#ffcf5a', alpha: 1.0, vy: -1.2 });
      }
      // flying into it
      if (wb.state === 'whole' && Math.abs(dragon.x + dragon.size * 0.25 - sx) < 12) {
        if (invulnerableTimer <= 0) triggerHit();
        wb.state = 'torn'; wb.burnT = 0;
        dragon.vx = -3;
        sound.spiderHiss();
        for (let i = 0; i < 16; i++) particles.push({ x: sx, y: dragon.y + (Math.random() - 0.5) * 60, vx: (Math.random() - 0.3) * 4, vy: (Math.random() - 0.5) * 3, size: 1.5 + Math.random() * 2, life: 25 + Math.random() * 20, color: '#dfe6ee' });
      }
    } else {
      wb.burnT++;
      if (wb.state === 'burning' && wb.burnT % 3 === 0) {
        const ceil = caveCeilAt(wb.wx), floor = caveFloorAt(wb.wx);
        particles.push({ x: sx + (Math.random() - 0.5) * 20, y: ceil + Math.random() * (floor - ceil), vx: (Math.random() - 0.5) * 1.5, vy: -1 - Math.random() * 2, size: 2 + Math.random() * 2, life: 18 + Math.random() * 14, color: Math.random() < 0.5 ? '#ffcf5a' : '#ff793f' });
      }
    }
  });
  C.webs = C.webs.filter(wb => wb.wx - C.scroll > -80 && !(wb.state !== 'whole' && wb.burnT > WEB_BURN_FRAMES + 40));
}

// ---- climbing back to the surface ----
function startSurfaceScene() {
  resetCave();
  flames = []; particles = []; floatingTexts = [];
  currentLevel = 4;
  levelTimerSeconds = 0;
  state = 'SURFACE';
  surface = { t: 0, typed: 0, clock: 0 };
  dragon.wingState = 1;
  invulnerableTimer = 0;
}

const SURFACE_LINE = { say: 'CYN', text: 'The surface at last. Hold on, Sarai. I\'m coming.' };

function updateSurface() {
  const S = surface;
  if (!S) return;
  S.t++; S.clock++;
  if (S.t > 330) S.typed = Math.min(SURFACE_LINE.text.length, S.typed + 1.15);
  if (S.t % 11 === 0) { dragon.wingState = 1; if (S.t < 300) sound.flap(); }
  if (S.t > 260) backgroundParallaxX += 1.2;
  if (S.t >= SURFACE_LEN) finishSurface();
}

function surfaceTap() {
  if (!surface || surface.t < 60) return;
  if (surface.t < 330) { surface.t = 330; return; }
  if (surface.typed < SURFACE_LINE.text.length) { surface.typed = SURFACE_LINE.text.length; return; }
  finishSurface();
}

function finishSurface() {
  surface = null;
  dragon.x = dragon.baseX;
  dragon.y = height * 0.4;
  dragon.velocity = 0;
  currentLevel = 4;
  levelTimerSeconds = 0;
  lives = maxLives;
  updateHeartsDisplay();
  updateLevelBadgeUI();
  levelDialogueType = 'CAVE_CLEAR';
  state = 'LEVEL_DIALOGUE';
}
</script>
<script>
// render-cave.js — Drawing for the cave levels and the surfacing cutscene (logic in cave.js).
// The cave is drawn normally, then covered by a darkness mask with holes cut where there is light:
// a faint glow around Cyndraxx, every flame he breathes, and every torch he has lit. The glowing cave
// creatures are drawn over the darkness (only inside the tunnel), so they are always visible.
// Classic script: shares global scope with the other src/js files.

let caveMask = null;
function caveMaskCanvas() {
  if (!caveMask) caveMask = document.createElement('canvas');
  if (caveMask.width !== width || caveMask.height !== height) { caveMask.width = width; caveMask.height = height; }
  return caveMask;
}

function caveTunnelPath(c, C) {
  c.beginPath();
  c.moveTo(-10, caveCeilAt(C.scroll - 10));
  for (let sx = 0; sx <= width + 10; sx += 8) c.lineTo(sx, caveCeilAt(C.scroll + sx));
  for (let sx = width + 10; sx >= -10; sx -= 8) c.lineTo(sx, caveFloorAt(C.scroll + sx));
  c.closePath();
}

// The far side of the cavern, seen through the tunnel: huge, dim rock spires lit only by the glowing life
// growing on them, getting fainter, smaller, bluer and slower the farther away they are (three layers).
const CAVE_DEPTH_LAYERS = [
  { par: 0.08, a: 0.45, sc: 0.45, hue: 205, step: 150 },   // farthest
  { par: 0.18, a: 0.7, sc: 0.65, hue: 190, step: 190 },
  { par: 0.32, a: 1, sc: 0.85, hue: 175, step: 240 }    // nearest of the background
];
// Everything in the background fades out before the tunnel's ceiling and floor, so its edges never show
// the shape of the cave in the dark. 0 at the rock, 1 once CAVE_EDGE_FADE px clear of it.
const CAVE_EDGE_FADE = 70;
function caveEdgeFade(C, x, y) {
  const d = Math.min(y - caveCeilAt(C.scroll + x), caveFloorAt(C.scroll + x) - y);
  return Math.max(0, Math.min(1, (d - 6) / CAVE_EDGE_FADE));
}
function drawCaveDepth(C) {
  const W = width, H = height, t = C.t;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // a faint haze of light hanging in the air of the great cavern: soft pools along the middle of the tunnel
  const hs = 170, ho = (C.scroll * 0.2) % hs;
  for (let i = -1; i <= Math.ceil(W / hs) + 1; i++) {
    const hx = i * hs - ho, wx = C.scroll + hx;
    const hy = (caveCeilAt(wx) + caveFloorAt(wx)) / 2;
    const hr = Math.max(20, (caveFloorAt(wx) - caveCeilAt(wx)) / 2 - CAVE_EDGE_FADE * 0.4);
    const hz = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
    hz.addColorStop(0, 'rgba(14,46,62,0.16)');
    hz.addColorStop(1, 'rgba(14,46,62,0)');
    ctx.fillStyle = hz;
    ctx.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);
  }
  CAVE_DEPTH_LAYERS.forEach((L, li) => {
    const off = C.scroll * L.par;
    const k0 = Math.floor(off / L.step) - 1, k1 = Math.floor((off + W) / L.step) + 1;
    for (let k = k0; k <= k1; k++) {
      const seed = k * 13 + li * 101;
      const x = k * L.step - off + (hash2(seed, 1) - 0.5) * L.step * 0.6;
      const top = hash2(seed, 2) < 0.5;
      const len = H * (0.42 + hash2(seed, 3) * 0.3);          // long enough to reach into the open tunnel
      const wide = (40 + hash2(seed, 4) * 60) * L.sc;
      const baseY = top ? 0 : H, tipY = top ? len : H - len;
      // the spire: a dark blue-grey silhouette with a faint rim of glow down one side, fading out before the rock
      const edge = top ? Math.max(caveCeilAt(C.scroll + x - wide), caveCeilAt(C.scroll + x), caveCeilAt(C.scroll + x + wide))
                       : Math.min(caveFloorAt(C.scroll + x - wide), caveFloorAt(C.scroll + x), caveFloorAt(C.scroll + x + wide));
      const e0 = top ? edge + 6 : edge - 6, e1 = top ? edge + 6 + CAVE_EDGE_FADE : edge - 6 - CAVE_EDGE_FADE;
      if (top ? tipY <= e0 : tipY >= e0) continue;     // the whole spire is hidden behind the rock
      const col = 'hsla(' + L.hue + ',40%,' + (10 + li * 4) + '%,';
      const fillG = ctx.createLinearGradient(0, e0, 0, e1);
      fillG.addColorStop(0, col + '0)');
      fillG.addColorStop(1, col + '1)');
      const rimG = ctx.createLinearGradient(0, e0, 0, e1);
      rimG.addColorStop(0, 'hsla(' + (L.hue - 20) + ',90%,60%,0)');
      rimG.addColorStop(1, 'hsla(' + (L.hue - 20) + ',90%,60%,0.6)');
      ctx.globalAlpha = L.a;
      ctx.fillStyle = fillG;   // added as light, so it never dims what's lit
      ctx.beginPath();
      ctx.moveTo(x - wide, baseY);
      ctx.quadraticCurveTo(x - wide * 0.35, (baseY + tipY) / 2, x, tipY);
      ctx.quadraticCurveTo(x + wide * 0.4, (baseY + tipY) / 2, x + wide, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = rimG;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + wide, baseY);
      ctx.quadraticCurveTo(x + wide * 0.4, (baseY + tipY) / 2, x, tipY);
      ctx.stroke();
      // colonies of glowing fungus and glow-worms clinging to it, twinkling
      ctx.globalCompositeOperation = 'lighter';
      const n = 6 + Math.floor(hash2(seed, 5) * 8);
      for (let j = 0; j < n; j++) {
        const u = hash2(seed, 10 + j);
        const py = baseY + (tipY - baseY) * (0.2 + u * 0.75);
        const half = wide * (1 - (py - baseY) / (tipY - baseY)) * 0.8;
        const px = x + (hash2(seed, 30 + j) - 0.5) * 2 * half;
        const hue = [175, 195, 280, 140, 320][Math.floor(hash2(seed, 50 + j) * 5)];
        const tw = 0.5 + 0.5 * Math.sin(t * (0.03 + hash2(seed, 70 + j) * 0.05) + j * 2.1);
        const r = (10 + hash2(seed, 90 + j) * 14) * L.sc;
        const ef = caveEdgeFade(C, px, py);
        if (ef <= 0) continue;
        ctx.globalAlpha = L.a * ef;
        const g = ctx.createRadialGradient(px, py, 0, px, py, r);
        g.addColorStop(0, 'hsla(' + hue + ',100%,65%,' + (0.35 + 0.5 * tw) + ')');
        g.addColorStop(1, 'hsla(' + hue + ',100%,50%,0)');
        ctx.fillStyle = g;
        ctx.fillRect(px - r, py - r, r * 2, r * 2);
        ctx.fillStyle = 'hsla(' + hue + ',100%,85%,' + (0.4 + 0.6 * tw) + ')';
        ctx.fillRect(px - 1, py - 1, 2 * L.sc + 1, 2 * L.sc + 1);
      }
      // glowing tendrils hanging from the ceiling spires, beaded with light
      if (top && hash2(seed, 6) < 0.6) {
        const tx = x + (hash2(seed, 7) - 0.5) * wide;
        const tl = (40 + hash2(seed, 8) * 80) * L.sc;
        const ty = Math.max(0, tipY - len * 0.3);
        ctx.globalAlpha = L.a * Math.min(caveEdgeFade(C, tx, ty), caveEdgeFade(C, tx, ty + tl));
        ctx.strokeStyle = 'hsla(165,100%,60%,' + (0.35 + 0.15 * Math.sin(t * 0.05 + k)) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        for (let s = 1; s <= 8; s++) ctx.lineTo(tx + Math.sin(t * 0.02 + s * 0.7 + k) * 2 * L.sc, ty + tl * s / 8);
        ctx.stroke();
        for (let s = 2; s <= 8; s += 2) {
          ctx.fillStyle = 'hsla(165,100%,80%,' + (0.3 + 0.4 * Math.sin(t * 0.08 + s + k)) + ')';
          ctx.fillRect(tx + Math.sin(t * 0.02 + s * 0.7 + k) * 2 * L.sc - 1, ty + tl * s / 8 - 1, 2, 2);
        }
      }
      ctx.globalCompositeOperation = 'lighter';
    }
    // distant glowing patches out in the dark between the spires
    for (let j = 0; j < 6; j++) {
      const sd = li * 31 + j;
      const span = W * 1.6;
      const px = ((hash2(sd, 81) * span - off) % span + span) % span - W * 0.3;
      const py = H * (0.3 + hash2(sd, 82) * 0.4);
      const r = (16 + hash2(sd, 83) * 22) * L.sc;
      const hue = [180, 200, 270, 150][j % 4];
      const tw = 0.6 + 0.4 * Math.sin(t * 0.02 + sd);
      const g = ctx.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, 'hsla(' + hue + ',100%,60%,' + 0.22 * tw * L.a + ')');
      g.addColorStop(1, 'hsla(' + hue + ',100%,50%,0)');
      ctx.globalAlpha = caveEdgeFade(C, px, py - r * 0.6) * caveEdgeFade(C, px, py + r * 0.6);
      ctx.fillStyle = g;
      ctx.fillRect(px - r, py - r, r * 2, r * 2);
    }
    // far-off shoals of tiny glowing creatures drifting slowly across this layer
    ctx.globalCompositeOperation = 'lighter';
    for (let s = 0; s < 2; s++) {
      const sd = li * 7 + s;
      const span = W * 2.5;
      const cx = ((hash2(sd, 61) * span - off * 0.5 + t * (0.15 + hash2(sd, 62) * 0.25) * L.sc) % span + span) % span - W * 0.4;
      const cy = H * (0.3 + hash2(sd, 63) * 0.4) + Math.sin(t * 0.01 + sd) * 20;
      const hue = hash2(sd, 64) < 0.5 ? 190 : 300;
      for (let f = 0; f < 7; f++) {
        const fx = cx + Math.sin(t * 0.03 + f * 1.7 + sd) * 18 * L.sc + f * 6 * L.sc;
        const fy = cy + Math.cos(t * 0.025 + f * 2.3) * 10 * L.sc;
        ctx.globalAlpha = L.a * (0.6 + 0.4 * Math.sin(t * 0.1 + f)) * caveEdgeFade(C, fx, fy);
        ctx.fillStyle = 'hsla(' + hue + ',100%,75%,1)';
        ctx.fillRect(fx, fy, 2 * L.sc + 0.5, 1.2 * L.sc + 0.4);
      }
    }
    ctx.globalCompositeOperation = 'lighter';
  });
  ctx.restore();
}

// jellyfish and glowing flyers drifting through the tunnel (parallax), flashing in neon patterns
function drawCaveLife(C) {
  const W = width, H = height, t = C.t;
  const period = W * 2.2;
  for (let i = 0; i < 4; i++) {
    const x = ((hash2(i, 121) * period - C.scroll * 0.35) % period + period) % period - W * 0.3;
    const y = H * (0.22 + hash2(i, 123) * 0.56) + Math.sin(t * 0.012 + i) * 18;
    const r = 8 + hash2(i, 125) * 14;
    const hue = (hash2(i, 127) * 360 + (Math.floor(t / BF_PATTERN_LEN) % 3 === 2 ? t * 1.5 : 0)) % 360;
    ctx.save();
    ctx.globalAlpha = Math.min(caveEdgeFade(C, x, y - r * 2.4), caveEdgeFade(C, x, y + r * 2.6));
    if (ctx.globalAlpha > 0) drawJelly(x, y, r, hue, bfNeon(i, y, t), t, i);
    ctx.restore();
  }
  for (let i = 0; i < 7; i++) {
    const x = ((hash2(i, 131) * period - C.scroll * 0.6 + t * (0.4 + hash2(i, 133))) % period + period) % period - W * 0.3;
    const y = H * (0.25 + hash2(i, 135) * 0.5) + Math.sin(t * 0.04 + i * 2) * 24;
    drawGlowFlyer(x, y, Math.floor(hash2(i, 137) * 360), t, i, 0.9 * caveEdgeFade(C, x, y));
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 36; i++) {
    const x = ((hash2(i, 141) * W - C.scroll * 0.8) % W + W) % W;
    const y = H * 0.15 + hash2(i, 143) * H * 0.7 + Math.sin(t * 0.02 + i) * 10;
    ctx.fillStyle = 'hsla(' + (150 + hash2(i, 145) * 160) + ',100%,75%,' + (0.25 + 0.35 * Math.sin(t * 0.09 + i)) * caveEdgeFade(C, x, y) + ')';
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.restore();
}

// ---- webs: an orb web stretched from the ceiling to the floor (logic in cave.js) ----
function caveWebGeom(wb, C) {
  const sx = wb.wx - C.scroll;
  const c = caveCeilAt(wb.wx), f = caveFloorAt(wb.wx);
  const hx = sx + (hash2(wb.seed, 1) - 0.5) * 10;
  const hy = (c + f) / 2 + (hash2(wb.seed, 2) - 0.5) * (f - c) * 0.25;
  const half = 30 + hash2(wb.seed, 3) * 10;
  const ends = [];
  const N = 13;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2 + (hash2(wb.seed, 10 + i) - 0.5) * 0.35;
    const dx = Math.cos(a), dy = Math.sin(a);
    const tx = dx > 0.001 ? (sx + half - hx) / dx : (dx < -0.001 ? (sx - half - hx) / dx : 1e9);
    const ty = dy > 0 ? (f + 5 - hy) / dy : (c - 5 - hy) / dy;
    const tm = Math.min(tx, ty);
    ends.push({ x: hx + dx * tm, y: hy + dy * tm });
  }
  return { sx, c, f, hx, hy, half, ends };
}
// pass 'strands' draws the silk (in the lit scene); pass 'glow' draws dew glints, embers and fire over the dark
function drawCaveWeb(wb, C, pass) {
  const G = caveWebGeom(wb, C);
  if (G.sx < -60 || G.sx > width + 60) return;
  const t = C.t;
  const burning = wb.state === 'burning', torn = wb.state === 'torn';
  const k = burning || torn ? Math.min(1, wb.burnT / WEB_BURN_FRAMES) : 0;
  if (k >= 1) return;
  const dmg = 1 - Math.max(0, wb.hp) / WEB_HP;
  ctx.save();
  if (torn) ctx.translate(Math.min(30, wb.burnT * 0.8), 0);
  const ring = (u) => {      // a point u of the way out along each spoke
    return G.ends.map((e, i) => ({ x: G.hx + (e.x - G.hx) * u, y: G.hy + (e.y - G.hy) * u + (torn ? wb.burnT * wb.burnT * 0.02 * (e.y > G.hy ? 1 : -0.3) : 0) }));
  };
  const rings = [];
  for (let u = 0.12; u < 0.97; u += 0.085) rings.push(ring(u));
  if (pass === 'strands') {
    ctx.globalAlpha = 1 - k;
    ctx.strokeStyle = burning ? 'rgba(255,150,60,0.9)' : 'rgba(215,222,232,' + (0.75 - dmg * 0.3) + ')';
    ctx.lineWidth = 1;
    // the frame threads anchoring it to the rock, and the spokes
    ctx.beginPath();
    [-1, 1].forEach(sd => {
      ctx.moveTo(G.sx + sd * G.half, G.c - 4);
      ctx.quadraticCurveTo(G.sx + sd * (G.half - 8), G.hy, G.sx + sd * G.half, G.f + 4);
    });
    G.ends.forEach(e => { ctx.moveTo(G.hx, G.hy); ctx.lineTo(e.x, e.y); });
    ctx.stroke();
    // the sticky spiral
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    rings.forEach((pts, ri) => {
      pts.forEach((p, i) => {
        const sag = 1.5 + ri * 0.15;
        if (i === 0) ctx.moveTo(p.x, p.y);
        else { const q = pts[i - 1]; ctx.quadraticCurveTo((p.x + q.x) / 2, (p.y + q.y) / 2 + sag, p.x, p.y); }
      });
      const q = pts[pts.length - 1], p = pts[0];
      ctx.quadraticCurveTo((p.x + q.x) / 2, (p.y + q.y) / 2 + 1.5, p.x, p.y);
    });
    ctx.stroke();
    // where the flames have caught it: blackened, smouldering holes
    wb.spots.forEach(sp => {
      ctx.fillStyle = 'rgba(20,10,6,' + Math.min(0.8, sp.t / 10) + ')';
      ctx.beginPath(); ctx.arc(G.sx, sp.y, 4 + Math.min(10, sp.t * 0.3), 0, Math.PI * 2); ctx.fill();
    });
  } else {
    ctx.globalCompositeOperation = 'lighter';
    // dew glinting faintly in the dark, so the web can be seen coming
    if (!burning) {
      rings.forEach((pts, ri) => pts.forEach((p, i) => {
        if (hash2(wb.seed + ri, i) > 0.45) return;
        const tw = 0.5 + 0.5 * Math.sin(t * 0.07 + ri * 1.3 + i * 2.1);
        ctx.fillStyle = 'rgba(190,220,255,' + (0.18 + 0.32 * tw) * (1 - k) * (1 - dmg * 0.5) + ')';
        ctx.fillRect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
      }));
    }
    // fire: glowing where it is catching, and racing through it once it goes up
    wb.spots.forEach(sp => {
      const a = Math.max(0, 1 - sp.t / 70);
      const g = ctx.createRadialGradient(G.sx, sp.y, 0, G.sx, sp.y, 26);
      g.addColorStop(0, 'rgba(255,150,50,' + 0.6 * a + ')');
      g.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = g;
      ctx.fillRect(G.sx - 26, sp.y - 26, 52, 52);
    });
    if (burning) {
      const a = 1 - k;
      for (let y = G.c; y < G.f; y += 22) {
        const fx = G.sx + Math.sin(y * 0.1 + t * 0.3) * 10;
        drawFlame(fx, y + 10, 10 * a + 4, 22 * a + 6, y * 0.05 + wb.seed, a);
      }
    }
  }
  ctx.restore();
}

// ---- cave spiders (logic in cave.js) ----
// pass 'body' draws the spider (lit only by the light); pass 'eyes' draws its glowing red eyes over the dark
function drawCaveSpider(sp, C, pass) {
  const sx = sp.wx - C.scroll;
  if (sx < -50 || sx > width + 50) return;
  const r = sp.r, t = sp.legT;
  ctx.save();
  ctx.translate(sx, sp.y);
  if (sp.surf === 'top' && sp.state !== 'dead') ctx.scale(1, -1);    // hanging upside down from the ceiling
  ctx.rotate(sp.rot);
  const faceX = sp.state === 'leap' ? -1 : (sp.dir < 0 ? -1 : 1);
  if (pass === 'body') {
    const leaping = sp.state === 'leap', dead = sp.state === 'dead';
    // eight jointed legs
    ctx.strokeStyle = '#1a120d';
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const side = i < 4 ? -1 : 1, j = i % 4;
      const hipX = (j - 1.5) * r * 0.22, hipY = side * r * 0.05;
      const step = sp.moving && !leaping && !dead ? Math.sin(t * 0.45 + j * 1.6 + (side > 0 ? Math.PI : 0)) * r * 0.25 : 0;
      let footX = (j - 1.5) * r * 0.75 + step + (j < 2 ? -1 : 1) * r * 0.35;
      let footY = r * 0.75 + (side > 0 ? 0 : -r * 0.1);
      let kneeX = hipX + (footX - hipX) * 0.55, kneeY = -r * 0.55;
      if (leaping) { footX *= 1.5; footY = r * 0.35 + (j % 2) * r * 0.2; kneeY = -r * 0.25; kneeX = hipX + (footX - hipX) * 0.5; }
      if (dead) { footX *= 0.25; footY = -r * 0.3; kneeX = hipX + (footX - hipX) * 0.5 + (j < 2 ? -1 : 1) * r * 0.25; kneeY = -r * 0.5; }
      ctx.lineWidth = Math.max(1.5, r * 0.14);
      ctx.beginPath();
      ctx.moveTo(hipX, hipY);
      ctx.lineTo(kneeX, kneeY);
      ctx.lineTo(footX, footY);
      ctx.stroke();
    }
    // abdomen behind, head in front
    ctx.fillStyle = '#20150f';
    ctx.beginPath(); ctx.ellipse(-faceX * r * 0.55, -r * 0.1, r * 0.75, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b1d14';          // a dull red marking
    ctx.beginPath(); ctx.ellipse(-faceX * r * 0.6, -r * 0.25, r * 0.22, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2a1c14';
    ctx.beginPath(); ctx.ellipse(faceX * r * 0.3, 0, r * 0.42, r * 0.36, 0, 0, Math.PI * 2); ctx.fill();
    // bristles
    ctx.fillStyle = '#4a3527';
    for (let k = 0; k < 6; k++) ctx.fillRect(-faceX * r * (0.2 + k * 0.17), -r * 0.62 + Math.abs(k - 2.5) * r * 0.06, 1.5, 2.5);
    // fangs
    ctx.fillStyle = '#c9c0a8';
    ctx.fillRect(faceX * r * 0.62, r * 0.12, 2, r * 0.25);
    ctx.fillRect(faceX * r * 0.52, r * 0.16, 2, r * 0.22);
  } else if (sp.state !== 'dead') {
    ctx.globalCompositeOperation = 'lighter';
    const ex = faceX * r * 0.48, ey = -r * 0.12;
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 1.1);
    g.addColorStop(0, 'rgba(255,40,30,0.35)');
    g.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(ex - r * 1.1, ey - r * 1.1, r * 2.2, r * 2.2);
    const blink = (Math.floor(t / 7) + sp.seed) % 37 === 0 ? 0.2 : 1;
    ctx.fillStyle = 'rgba(255,70,50,' + blink + ')';
    [[0, 0], [0.12, -0.12], [0.12, 0.12], [-0.1, -0.16], [-0.1, 0.16], [0.24, 0], [-0.2, -0.05], [-0.2, 0.08]].forEach(([ox, oy], i) => {
      const s = i < 3 ? 2.4 : 1.6;
      ctx.fillRect(ex + faceX * ox * r - s / 2, ey + oy * r - s / 2, s, s);
    });
  }
  ctx.restore();
}

// an unlit torch's pitch head smoulders: a pulsing orange ember and the odd spark jumping off it
function drawTorchEmber(h, tc, t) {
  if (h.x < -40 || h.x > width + 40) return;
  const pulse = 0.6 + 0.4 * Math.sin(t * 0.13 + tc.wx);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(h.x, h.y - 2, 0, h.x, h.y - 2, 14);
  g.addColorStop(0, 'rgba(255,170,70,' + 0.55 * pulse + ')');
  g.addColorStop(1, 'rgba(255,90,20,0)');
  ctx.fillStyle = g;
  ctx.fillRect(h.x - 14, h.y - 16, 28, 28);
  ctx.fillStyle = 'rgba(255,215,140,' + (0.6 + 0.4 * pulse) + ')';
  ctx.fillRect(h.x - 1.5, h.y - 3.5, 3, 3);
  // sparks: each one jumps up and fades over 24 frames, a few times a second
  for (let s = 0; s < 3; s++) {
    const cyc = 24, ph = (t + s * 17 + Math.floor(tc.wx)) % (cyc * 3);
    if (ph >= cyc) continue;
    const u = ph / cyc, n = Math.floor((t + s * 17 + Math.floor(tc.wx)) / (cyc * 3));
    const sx = h.x + (hash2(n, s + Math.floor(tc.wx)) - 0.5) * 10 * u;
    const sy = h.y - 3 - u * 16 + u * u * 6;
    ctx.fillStyle = 'rgba(255,' + (200 - u * 80) + ',90,' + (1 - u) + ')';
    ctx.fillRect(sx - 1, sy - 1, 2, 2);
  }
  ctx.restore();
}

function drawCaveTorch(tc) {
  const h = caveTorchHead(tc);
  if (h.x < -40 || h.x > width + 40) return;
  ctx.save();
  if (tc.kind === 'mid') {
    // a long chain down from the ceiling to an iron hoop that holds the torch
    drawChainLinks(tc.wx - cave.scroll, caveCeilAt(tc.wx), h.x, h.y - 18, 2);
    ctx.strokeStyle = '#3a3a40'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(h.x, h.y + 6, 6, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#3a3a40';
    ctx.fillRect(h.x - 1, h.y - 18, 2, 12);
  }
  // iron bracket and wooden handle
  ctx.fillStyle = '#3a3a40';
  if (tc.kind === 'top') ctx.fillRect(h.x - 1.5, h.y - 26, 3, 14); else if (tc.kind === 'floor') ctx.fillRect(h.x - 1.5, h.y + 12, 3, 16);
  ctx.fillStyle = '#5a3a1e';
  ctx.fillRect(h.x - 2.5, h.y - 2, 5, 16);
  ctx.fillStyle = '#2a2420';
  ctx.fillRect(h.x - 4, h.y - 4, 8, 5);              // the pitch-soaked head
  ctx.restore();
}

function drawCaveScene() {
  const C = cave;
  const W = width, H = height, t = C.t;

  // 1. the cave as it would look in full light
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);
  // rock above and below the tunnel
  const rock = (top) => {
    ctx.beginPath();
    ctx.moveTo(-10, top ? -10 : H + 10);
    for (let sx = -10; sx <= W + 10; sx += 8) ctx.lineTo(sx, top ? caveCeilAt(C.scroll + sx) : caveFloorAt(C.scroll + sx));
    ctx.lineTo(W + 10, top ? -10 : H + 10);
    ctx.closePath();
  };
  [true, false].forEach(top => {
    rock(top);
    const g = ctx.createLinearGradient(0, top ? 0 : H, 0, top ? H * 0.5 : H * 0.5);
    g.addColorStop(0, '#1c1714'); g.addColorStop(1, '#4a3c30');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.save();
    ctx.clip();
    // strata and knobs scrolling with the rock
    for (let k = Math.floor(C.scroll / 30) - 1; k < Math.floor(C.scroll / 30) + W / 30 + 2; k++) {
      const sx = k * 30 - C.scroll;
      const edge = top ? caveCeilAt(C.scroll + sx) : caveFloorAt(C.scroll + sx);
      const d = 8 + hash2(k, top ? 3 : 4) * 40;
      ctx.fillStyle = hash2(k, top ? 5 : 6) < 0.5 ? 'rgba(120,96,70,0.35)' : 'rgba(0,0,0,0.35)';
      ctx.fillRect(sx, top ? edge - d : edge + d - 6, 14 + hash2(k, 7) * 12, 5);
    }
    ctx.restore();
    // a lighter rim where the rock meets the tunnel
    ctx.strokeStyle = '#7a6450';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let sx = -10; sx <= W + 10; sx += 8) {
      const y = top ? caveCeilAt(C.scroll + sx) : caveFloorAt(C.scroll + sx);
      if (sx === -10) ctx.moveTo(sx, y); else ctx.lineTo(sx, y);
    }
    ctx.stroke();
  });
  C.torches.forEach(drawCaveTorch);
  (C.webs || []).forEach(wb => drawCaveWeb(wb, C, 'strands'));
  (C.spiders || []).forEach(sp => drawCaveSpider(sp, C, 'body'));

  // Cyndraxx, his flames and sparks (floating score texts are held back and drawn over the darkness)
  drawDragon(dragon.x, dragon.y);
  const texts = floatingTexts;
  floatingTexts = [];
  drawParticles();
  floatingTexts = texts;

  // 2. the darkness, with holes where there is light
  const m = caveMaskCanvas();
  const mc = m.getContext('2d');
  mc.globalCompositeOperation = 'source-over';
  mc.clearRect(0, 0, W, H);
  mc.fillStyle = 'rgba(0,0,0,0.975)';
  mc.fillRect(0, 0, W, H);
  mc.globalCompositeOperation = 'destination-out';
  const light = (x, y, r, a) => {
    const g = mc.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,' + a + ')');
    g.addColorStop(0.55, 'rgba(0,0,0,' + a * 0.6 + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    mc.fillStyle = g;
    mc.fillRect(x - r, y - r, r * 2, r * 2);
  };
  light(dragon.x + 6, dragon.y, 78, 0.9);                       // his own faint glow
  flames.forEach(f => light(f.x, f.y, 70 + f.size * 2.2, Math.min(1, f.life / 60)));
  (C.webs || []).forEach(wb => {        // a web lights up as it burns
    const sx = wb.wx - C.scroll;
    wb.spots.forEach(sp => light(sx, sp.y, 46, 0.7 * Math.max(0, 1 - sp.t / 70)));
    if (wb.state === 'burning') {
      const a = Math.max(0, 1 - wb.burnT / WEB_BURN_FRAMES);
      const c = caveCeilAt(wb.wx), f = caveFloorAt(wb.wx);
      for (let y = c + 20; y < f; y += 40) light(sx, y, 70, 0.85 * a);
    }
  });
  C.torches.forEach(tc => {
    const h = caveTorchHead(tc);
    if (!tc.lit) {   // the smouldering ember shows a hint of the torch in the dark
      light(h.x, h.y - 2, 30, 0.35 + 0.15 * Math.sin(t * 0.13 + tc.wx));
      return;
    }
    const grow = Math.min(1, tc.litT / 25);
    light(h.x, h.y, (180 + Math.sin(t * 0.25 + tc.wx) * 10) * grow, 1);
  });
  ctx.drawImage(m, 0, 0);

  // 3. what glows by itself: torch flames, the cave creatures (inside the tunnel), score texts
  C.torches.forEach((tc, i) => {
    const h = caveTorchHead(tc);
    if (!tc.lit) { drawTorchEmber(h, tc, t); return; }
    drawFlame(h.x, h.y + 2, 12, 24, tc.wx * 0.01);
  });
  ctx.save();
  caveTunnelPath(ctx, C);
  ctx.clip();
  drawCaveDepth(C);
  drawCaveLife(C);
  ctx.restore();
  (C.webs || []).forEach(wb => drawCaveWeb(wb, C, 'glow'));
  (C.spiders || []).forEach(sp => drawCaveSpider(sp, C, 'eyes'));
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.alpha);
    ctx.font = 'bold 24px "Proxima Nova", sans-serif';
    ctx.fillStyle = ft.color || '#2ecc71';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
    ft.y += ft.vy;
    ft.alpha -= 0.015;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  // the level's title as it begins
  if (C.title > 0) {
    const a = Math.min(1, C.title / 40, (260 - C.title) / 30);
    const T = CAVE_TITLES[caveLevel] || ['', ''];
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#9fe8ff';
    fitFont('CAVE ' + caveLevel + ': ' + T[0], 26, W - 30);
    ctx.fillText('CAVE ' + caveLevel + ': ' + T[0], W / 2, H * 0.3);
    ctx.font = 'bold 15px "Proxima Nova", sans-serif';
    ctx.fillStyle = '#e8dcc0';
    ctx.fillText(T[1], W / 2, H * 0.3 + 28);
    ctx.restore();
  }
  // fade in, and to black at the end
  const fade = Math.max(0, 1 - C.t / 50, C.ending / 70);
  if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, fade) + ')'; ctx.fillRect(0, 0, W, H); }
}

// ---- the surfacing cutscene: up a shaft toward the light, out of a cave mouth into the night ----
function drawSurfaceScene() {
  const S = surface;
  if (!S) return;
  const W = width, H = height, t = S.t;
  if (t < 270) {
    // climbing the shaft: the walls rush downward, a pale light grows above
    ctx.fillStyle = '#04050a';
    ctx.fillRect(0, 0, W, H);
    const up = Math.min(1, t / 230);
    const lg = ctx.createRadialGradient(W / 2, -H * 0.1, 10, W / 2, -H * 0.1, H * (0.4 + up * 0.9));
    lg.addColorStop(0, 'rgba(200,230,255,' + (0.2 + up * 0.7) + ')');
    lg.addColorStop(1, 'rgba(120,160,220,0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
    drawCavernWalls(t, -t * 8, 1 - up * 0.3);
    const dx = W / 2 + Math.sin(t * 0.05) * 16, dy = H * 0.62 - up * H * 0.15;
    drawDragon(dx, dy, -1.15);
    const flash = Math.max(0, (t - 230) / 40);
    if (flash > 0) { ctx.fillStyle = 'rgba(225,240,255,' + Math.min(1, flash) + ')'; ctx.fillRect(0, 0, W, H); }
    return;
  }
  // out into the open air (level 4's emerald night sky), bursting from a cave mouth in the hillside
  drawNightSky();
  drawMoon();
  drawGiantClouds();
  drawParallaxCastleBackground();
  const gY = height - groundHeight;
  ctx.fillStyle = '#141a14';
  ctx.beginPath();
  ctx.moveTo(-20, H);
  ctx.quadraticCurveTo(W * 0.15, gY - H * 0.28, W * 0.48, gY);
  ctx.lineTo(W + 20, gY); ctx.lineTo(W + 20, H);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#2ecc71';
  ctx.fillRect(W * 0.46, gY, W * 0.6, 6);
  // the cave mouth he came out of: a ragged black opening with a rocky rim
  const mx = W * 0.17, my = gY - H * 0.1, mw = W * 0.09, mh = H * 0.065;
  ctx.fillStyle = '#2a2a24';
  ctx.beginPath();
  for (let i = 0; i <= 16; i++) {
    const a = Math.PI * (i / 16) + Math.PI;
    const r = 1.18 + hash2(i, 77) * 0.12;
    const x = mx + Math.cos(a) * mw * r, y = my + Math.sin(a) * mh * r * 1.1;
    if (i === 0) ctx.moveTo(x, y + mh * 0.6); else ctx.lineTo(x, y);
  }
  ctx.lineTo(mx + mw * 1.2, my + mh * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#020203';
  ctx.beginPath();
  for (let i = 0; i <= 16; i++) {
    const a = Math.PI * (i / 16) + Math.PI;
    const r = 0.95 + hash2(i, 79) * 0.08;
    const x = mx + Math.cos(a) * mw * r, y = my + Math.sin(a) * mh * r;
    if (i === 0) ctx.moveTo(x, y + mh * 0.6); else ctx.lineTo(x, y);
  }
  ctx.lineTo(mx + mw, my + mh * 0.6);
  ctx.closePath();
  ctx.fill();
  const u = Math.min(1, (t - 270) / 160);
  const e = 1 - Math.pow(1 - u, 2);
  const dx = W * 0.17 + (W * 0.42 - W * 0.17) * e;
  const dy = gY - H * 0.12 - Math.sin(e * Math.PI * 0.6) * H * 0.3 - e * H * 0.05;
  drawDragon(dx, dy, -0.9 * (1 - e));
  const wf = Math.max(0, 1 - (t - 270) / 40);
  if (wf > 0) { ctx.fillStyle = 'rgba(225,240,255,' + wf + ')'; ctx.fillRect(0, 0, W, H); }
  if (t > 330) drawCathDialogue(SURFACE_LINE, surface);
  const out = Math.max(0, (t - (SURFACE_LEN - 40)) / 40);
  if (out > 0) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, out) + ')'; ctx.fillRect(0, 0, W, H); }
}

    function triggerHit() {

        battlements[i].x -= scrollSpeed * worldSpeedMult;

      if (cathedral) cathedral.x -= scrollSpeed * worldSpeedMult;

      for (let i = trebuchets.length - 1; i >= 0; i--) {

      }
      chestsFollowWorld(scrollSpeed * worldSpeedMult);

      celebrationAngle += 0.035;

      const centerX = width * 0.50;
      const centerY = height * 0.32;

      const loopRadiusY = 90;

      dragon.x = centerX + Math.cos(celebrationAngle) * loopRadiusX;
      dragon.y = centerY + Math.sin(celebrationAngle) * loopRadiusY;

      const nextX = centerX + Math.cos(celebrationAngle + 0.035) * loopRadiusX;
      const nextY = centerY + Math.sin(celebrationAngle + 0.035) * loopRadiusY;

      if (celebrationTimer % 20 === 0) {
        sound.fireworks();
        sound.fireRoar();
        const fireColors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#ffffff'];
        const burstX = dragon.x + (Math.random() - 0.5) * 50;

        for (let f = 0; f < 20; f++) {

          flames.push({
            x: burstX,
            y: burstY,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,

      sound.setRumble(currentRumbleLevel());
      updateFireButtonLock();
      updateSunnyAmbient();

      // the Khaleesi splash freezes all action until it finishes
      if (khaleesiSplash) return;

      if (state === 'PAUSED' || state === 'CUTSCENE' || state === 'LEVEL_DIALOGUE') return;

      if (state === 'CAPTURE') { updateCapture(); return; }
      if (state === 'BOSS_INTRO') { updateBossIntro(); return; }
      if (state === 'CATHEDRAL') { updateCathedralScene(); return; }
      if (state === 'BOSS_FALL') { updateBossFall(); return; }

            obstacles.forEach(obs => {
              const obsCenterX = obs.x + obs.width / 2;
              const obsCenterY = obs.bottomY;
              const dist = Math.hypot(dragon.x - obsCenterX, dragon.y - obsCenterY);
              
              if (obs.isFullyIgnited && dist <= shockwaveRadius + 100 && !obs.isCharred && obs.charProgress === 0) {
                obs.charProgress = 0.01;
                sound.towerDestroy();
                
                const scoreResult = addScore(Math.round((obs.width / 80) * 20));
                floatingTexts.push({ x: obs.x + obs.width / 2 - 30, y: obs.bottomY - 30, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.8 });
              }

              obs.surfaceFlames.forEach(sf => {
                const sfx = obs.x + sf.relX;
                const sfy = obs.bottomY;
                const sfDist = Math.hypot(dragon.x - sfx, dragon.y - sfy);

                if (sfDist <= shockwaveRadius) {
                  sf.maxWidth = Math.min(sf.maxWidth + 1.2, 70);
                  sf.maxHeight = Math.min(sf.maxHeight + 1.8, 85);
                  sf.height = Math.min(sf.height + 2.0, sf.maxHeight);
                  sf.width = Math.min(sf.width + 1.5, sf.maxWidth);
                }
              });
            });

            knights.forEach(k => {
              if (k.state === 'ALIVE' && !k.isRoyal) {
                const obs = k.obsRef;
                const kx = obs.x + k.relX;
                const ky = obs.bottomY - 12;
                const dist = Math.hypot(dragon.x - kx, dragon.y - ky);

                if (dist <= shockwaveRadius) {
                  const pushDir = kx >= dragon.x ? 1 : -1;
                  k.knockbackVelocity = pushDir * (12.0 + Math.random() * 6.0);
                  k.stunTimer = 22;
                  sound.bonk();
                }
              }
            });

            groundFlames.forEach(gf => {
              const dist = Math.hypot(dragon.x - gf.x, dragon.y - gY);
              if (dist <= shockwaveRadius) {
                gf.boostIntensity = Math.min((gf.boostIntensity || 1.0) + 0.15, 2.8);
                gf.life += 2;
              }
            });

            if (Math.random() < 0.6) {
              particles.push({
                x: dragon.x - 14,
                y: dragon.y + (Math.random() - 0.5) * 16,
                vx: -3 - Math.random() * 3,
                vy: (Math.random() - 0.5) * 2,
                size: 4 + Math.random() * 4,
                life: 20,
                color: '#f39c12'
              });
            }
          }
        }

        dragon.x += dragon.vx;
        dragon.vx *= 0.90;

        const thirtyPercentWidth = width * 0.30;
        if (dragon.x > dragon.baseX) {
          let returnSpeed = 1.2;
          if (dragon.x > thirtyPercentWidth) {
            const extraRatio = (dragon.x - thirtyPercentWidth) / (width - thirtyPercentWidth);
            returnSpeed = 3.5 + extraRatio * 9.0;
          }
          dragon.x -= returnSpeed;
          if (dragon.x < dragon.baseX) dragon.x = dragon.baseX;
        }

        if (dragon.y + dragon.size / 2 >= gY || dragon.y - dragon.size / 2 <= 0) {
          if (!khaleesiMounted) {
            triggerHit();
            if (lives > 0) {
              dragon.y = height * 0.4;
              dragon.velocity = 0;
            }
          } else {
            dragon.y = Math.max(dragon.size / 2, Math.min(gY - dragon.size / 2, dragon.y));
          }
        }

        if (obstacles.length === 0 || (width - obstacles[obstacles.length - 1].x) > 200) {
          spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= scrollSpeed * worldSpeedMult;

          if (!obs.passed && obs.x + obs.width < dragon.x) {
            obs.passed = true;
            addScore(1);
            sound.score();
          }

          const padding = 6;
          const dLeft = dragon.x - dragon.size / 2 + padding;
          const dRight = dragon.x + dragon.size / 2 - padding;
          const dTop = dragon.y - dragon.size / 2 + padding;
          const dBottom = dragon.y + dragon.size / 2 - padding;

          if (dRight > obs.x && dLeft < obs.x + obs.width) {
            if (dTop < obs.topHeight) {
              if (khaleesiMounted) {
                if (!obs.topIsCharred) {
                  obs.topIsCharred = true;
                  sound.towerDestroy();
                  const scoreResult = addScore(15);
                  floatingTexts.push({ x: obs.x + obs.width / 2 - 20, y: obs.topHeight + 10, text: 'CRUSH! +' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x)', color: '#f1c40f', alpha: 1.0, vy: 1.5 });

                  for (let f = 0; f < 12; f++) {
                    flames.push({
                      x: dragon.x + (Math.random() - 0.5) * 30,
                      y: obs.topHeight + (Math.random() - 0.5) * 20,
                      vx: (Math.random() - 0.5) * 12,
                      vy: (Math.random() - 0.2) * 8,
                      dragX: 0.96,
                      gravity: 0.15,
                      size: 16 + Math.random() * 12,
                      life: 90,
                      maxLife: 90,
                      color: Math.random() < 0.5 ? '#ff793f' : '#f1c40f'
                    });
                  }
                }
              } else {
                obstacleHit();
                if (lives > 0) obs.passed = true;
              }
            }

            if (dBottom > obs.bottomY) {
              if (khaleesiMounted) {
                if (!obs.isCharred && obs.charProgress === 0) {
                  obs.charProgress = 0.01;
                  sound.towerDestroy();
                  const scoreResult = addScore(15);
                  floatingTexts.push({ x: obs.x + obs.width / 2 - 20, y: obs.bottomY - 20, text: 'CRUSH! +' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x)', color: '#f1c40f', alpha: 1.0, vy: -1.8 });

                  for (let f = 0; f < 12; f++) {
                    flames.push({
                      x: dragon.x + (Math.random() - 0.5) * 30,
                      y: obs.bottomY + (Math.random() - 0.5) * 20,
                      vx: (Math.random() - 0.5) * 12,
                      vy: -(Math.random() * 8 + 2),
                      dragX: 0.96,
                      gravity: 0.15,
                      size: 16 + Math.random() * 12,
                      life: 90,
                      maxLife: 90,
                      color: Math.random() < 0.5 ? '#ff793f' : '#ee5253'
                    });
                  }
                }
              } else {
                obstacleHit();
                if (lives > 0) obs.passed = true;
              }
            }
          }

          if (obs.x + obs.width < -100) {
            obstacles.splice(i, 1);
          }
        }

        updateLevelExtras(scrollSpeed * worldSpeedMult);
      }
    }


    function render() {
      if (khaleesiSplash && khaleesiSplash.frozen) {
        ctx.drawImage(khaleesiSplash.frozen, 0, 0);
        drawKhaleesiSplash();
        ctx.textAlign = 'left';
        return;
      }
      ctx.clearRect(0, 0, width, height);
      flameDrawCount = 0;
      const shake = sceneShake();
      ctx.save();
      if (shake) ctx.translate(shake.x, shake.y);

      if (cathCinematic()) {      // inside the cathedral (cathedral.js / render-cathedral.js)
        drawCathedralScene();
        ctx.restore();
        ctx.textAlign = 'left';
        return;
      }
      if (bossFallStory()) {      // the storybook picture of the arrow striking him (boss-fall.js)
        drawBossFallStory();
        ctx.restore();
        ctx.textAlign = 'left';
        return;
      }
      if (bossFallCinematic() && (bossFall.phase === 'cavern' || bossFall.phase === 'floor')) {   // the cavern (boss-fall.js)
        drawBossFallCavern();
        ctx.restore();
        ctx.textAlign = 'left';
        return;
      }
      if (state === 'SURFACE') {  // climbing back to the surface (render-cave.js)
        drawSurfaceScene();
        ctx.restore();
        ctx.textAlign = 'left';
        return;
      }
      if (caveView()) {           // the dark cave levels (render-cave.js)
        drawCaveScene();
        if (state === 'PAUSED') renderPauseScreen();
        else if (state === 'GAMEOVER') renderGameOverScreen();
        ctx.restore();
        ctx.textAlign = 'left';
        return;
      }
      if (state === 'GAMEOVER' && jenkinsRejected) {   // refused Brown Jenkins: game over in the dark
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        renderGameOverScreen();
        ctx.restore();
        ctx.textAlign = 'left';
        return;
      }

      if (sunnyScene()) {
        // prologue, opening screen and start menu: sunny valley
        drawSunnyBackdrop();
        drawSunnyGround();
        drawProEnts();
      } else {
        drawNightSky();
        drawMoon();
        drawGiantClouds();
        drawParallaxCastleBackground();
        if (state === 'BOSS_INTRO') drawBossIntroScene();
        obstacles.forEach(drawCastleWalls);
        drawCathedralTower();
        drawBattlements();
        drawLevelChests();      // behind archers, peasants and knights
        drawArchersAndArrows();
        drawKhaleesis();
        drawCollectableHearts();
        drawTrebuchetsAndBoulders();
        drawKnights();
        drawLevelExtras();
        drawGround();
      }
      drawParticles();
      if (state === 'BOSS') renderBoss();
      else if (state === 'BOSS_FALL') drawBossFallScene();   // tower sinking into the pit, the chain arrow, Cyndraxx

      if (state === 'SPLASH') {
        drawStoryMessage(PRO_INVITE_TEXT, 'TAP TO START GAME', 'DRAGON QUEEN SARAI');
      } else if (state === 'CAPTURED_MSG') {
        drawCapturedMessage();
      } else if (state === 'CAPTURE') {
        drawCaptureOverlay();
      } else if (state === 'LEVEL_CELEBRATE') {
        drawDragon(dragon.x, dragon.y);
        drawDragonCarried();

        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 28px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("LEVEL CLEARED!", width / 2, Math.max(height * 0.18, 125));   // stays below the score and hearts

        if (celebrationFadeAlpha > 0) {
          ctx.fillStyle = `rgba(10, 10, 20, ${celebrationFadeAlpha})`;
          ctx.fillRect(0, 0, width, height);
        }

      } else if (state === 'LEVEL_DIALOGUE') {
        renderLevelDialogue();
      } else if (state === 'CUTSCENE') {
        renderCutscene();
      } else if (state === 'PAUSED') {
        renderPauseScreen();
      } else if (state === 'GAMEOVER') {
        renderGameOverScreen();
      } else if (state === 'BOSS_FALL') {
        // all drawn by drawBossFallScene()
      } else if (state === 'CATHEDRAL') {
        drawCathedralScene();     // the window shatters (the dragon has gone through it)
      } else if (state === 'BOSS_INTRO') {
        drawBossIntroOverlay();
      } else if (state === 'BOSS') {
        drawDragon(dragon.x, dragon.y);
        renderMountedKhaleesiHUD();
      } else {
        drawDragon(dragon.x, dragon.y);
        renderMountedKhaleesiHUD();
        drawDragonCarried();
        drawCathedralHUD();
        drawExtrasHUD();
        if (inPrologue()) drawProOverlay();
      }

      if (state === 'START') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 6;
        ctx.fillText('TAP TO FLAP', width / 2, height / 2 - 80);
        ctx.font = 'bold 14px "Proxima Nova", sans-serif';
        ctx.fillText('Hold: Boost Forward', width / 2, height / 2 - 50);
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        const btnW = 200;
        const btnH = 44;
        const btnX = (width - btnW) / 2;
        const startBtnY = height / 2 - 10;
        const loadBtnY = startBtnY + 58;

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(btnX, startBtnY, btnW, btnH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(btnX, startBtnY, btnW, btnH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Proxima Nova", sans-serif';
        ctx.fillText('START GAME', width / 2, startBtnY + 27);

        ctx.fillStyle = '#2980b9';
        ctx.fillRect(btnX, loadBtnY, btnW, btnH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(btnX, loadBtnY, btnW, btnH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Proxima Nova", sans-serif';
        ctx.fillText('LOAD GAME', width / 2, loadBtnY + 27);

      }

      ctx.restore();
      drawTreasureFX();
      freezeFrameForSplash();
      drawKhaleesiSplash();

      ctx.textAlign = 'left';
    }


    // ---- Real-time game clock ----
    // The game was written as "one step per screen refresh", so it ran in slow motion on phones that
    // only manage 30 fps (iPhone Low Power Mode, warm or older phones) and too fast on 90/120 Hz screens.
    // Now the game always advances 60 steps per real second. Much of the older code moves things while
    // drawing them (peasants, arrows, flames, particles, pickups), so catch-up steps also run render()
    // with the actual drawing calls switched off ("logic-only"), which costs almost nothing.
    // save/restore stay real so alpha, blend mode and other settings never leak into the next drawn frame.
    const GAME_STEP_MS = 1000 / 60;
    const MAX_STEPS_PER_FRAME = 4;          // a long hiccup (or coming back from the background) never fast-forwards
    const NO_DRAW = ['fillRect', 'strokeRect', 'clearRect', 'fillText', 'strokeText', 'drawImage', 'putImageData',
      'fill', 'stroke', 'clip', 'beginPath', 'closePath', 'moveTo', 'lineTo', 'arc', 'arcTo', 'ellipse', 'rect',
      'roundRect', 'quadraticCurveTo', 'bezierCurveTo', 'translate', 'rotate', 'scale',
      'setTransform', 'transform', 'resetTransform', 'setLineDash'];
    const noDraw = () => {};
    let logicOnlyPass = false;              // true while render() runs without drawing (see freezeFrameForSplash)
    let clockLast = null, clockAcc = 0;

    function renderLogicOnly() {
      logicOnlyPass = true;
      NO_DRAW.forEach(m => { ctx[m] = noDraw; });
      try { render(); } finally {
        NO_DRAW.forEach(m => { delete ctx[m]; });
        logicOnlyPass = false;
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      if (typeof now !== 'number') now = performance.now();
      if (clockLast === null) clockLast = now - GAME_STEP_MS;
      let dt = now - clockLast;
      clockLast = now;
      if (dt > 250) dt = GAME_STEP_MS;      // back from a pause, the background or a stall: just carry on
      clockAcc += dt;
      // a little slack so a 60 Hz screen with jittery timestamps still gets exactly one step per frame
      let steps = Math.floor((clockAcc + 2) / GAME_STEP_MS);
      if (steps < 1) return;                // faster screen (90/120 Hz): nothing due yet, skip this refresh
      if (steps > MAX_STEPS_PER_FRAME) { steps = MAX_STEPS_PER_FRAME; clockAcc = 0; }
      else clockAcc -= steps * GAME_STEP_MS;
      for (let i = 1; i < steps; i++) { update(); renderLogicOnly(); }
      update();
      render();
    }

    loop();
</script>
</body>
