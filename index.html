<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Flame Arcade</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b1a">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background: #0b0b1a;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0b0b1a;
        }
        .ui-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ff4500;
            color: #fff;
            padding: 8px 16px;
            font-family: inherit;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
        }
        #soundBtn {
            top: 10px;
            right: 10px;
        }
        #fireBtn {
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ff4500, #ff8c00);
            border: 2px solid #fff;
            font-size: 18px;
            padding: 12px 24px;
            box-shadow: 0 4px 10px rgba(255, 69, 0, 0.5);
        }
        #fireBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="soundBtn" class="ui-btn">🔊</button>
    <button id="fireBtn" class="ui-btn">🔥 FIRE</button>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    // --- SERVICE WORKER REGISTRATION ---
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const soundBtn = document.getElementById('soundBtn');
    const fireBtn = document.getElementById('fireBtn');

    function resizeCanvas() {
        const container = document.getElementById('game-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // --- AUDIO SYSTEM ---
    const sound = {
        muted: false,
        ctx: null,
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        },
        playTone(freq, duration, type = 'sine') {
            if (this.muted || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch (e) {}
        },
        flap() { this.playTone(300, 0.1, 'triangle'); },
        fire() { this.playTone(150, 0.15, 'sawtooth'); },
        score() { this.playTone(600, 0.2, 'sine'); },
        hit() { this.playTone(100, 0.3, 'square'); },
        startChiptune() {}
    };

    soundBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.muted = !sound.muted;
        soundBtn.textContent = sound.muted ? '🔇' : '🔊';
    });

    // --- GAME VARIABLES ---
    let state = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let lives = 3;
    let frame = 0;

    const dragon = {
        x: 60,
        y: 200,
        width: 34,
        height: 26,
        velocity: 0,
        gravity: 0.35,
        jump: -6.5,
        wingState: 0
    };

    let pipes = [];
    let fireballs = [];

    function shootFire() {
        if (state !== 'PLAYING') return;
        fireballs.push({
            x: dragon.x + dragon.width,
            y: dragon.y + dragon.height / 2,
            radius: 6,
            speed: 7
        });
        sound.fire();
    }

    function resetGame() {
        dragon.y = canvas.height / 2;
        dragon.velocity = 0;
        pipes = [];
        fireballs = [];
        score = 0;
        lives = 3;
        frame = 0;
    }

    // --- MULTI-TOUCH INPUT HANDLERS ---
    fireBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        shootFire();
    }, { passive: false });

    fireBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!('ontouchstart' in window)) {
            shootFire();
        }
    });

    function handlePressStart(e) {
        if (e) {
            if (e.target && (e.target.id === 'soundBtn' || e.target.id === 'fireBtn')) return;
            if (e.cancelable) e.preventDefault();
        }
        sound.init();

        if (state === 'START' || state === 'GAMEOVER') {
            resetGame();
            state = 'PLAYING';
            dragon.velocity = dragon.jump;
            sound.flap();
        } else if (state === 'PLAYING') {
            dragon.velocity = dragon.jump;
            dragon.wingState = 1.0;
            sound.flap();
        }
    }

    window.addEventListener('touchstart', handlePressStart, { passive: false });
    window.addEventListener('mousedown', handlePressStart);
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') handlePressStart(e);
        if (e.code === 'KeyF') shootFire();
    });

    // --- GAME LOOP ---
    function update() {
        frame++;

        if (state === 'PLAYING') {
            dragon.velocity += dragon.gravity;
            dragon.y += dragon.velocity;

            if (dragon.wingState > 0) dragon.wingState -= 0.1;

            // Spawn Pipes
            if (frame % 100 === 0) {
                const gap = 140;
                const minPipe = 50;
                const maxPipe = canvas.height - gap - minPipe - 60;
                const topHeight = Math.floor(Math.random() * (maxPipe - minPipe)) + minPipe;
                pipes.push({
                    x: canvas.width,
                    top: topHeight,
                    bottom: canvas.height - topHeight - gap,
                    passed: false
                });
            }

            // Update Pipes
            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= 2.5;

                // Score
                if (!p.passed && p.x + 40 < dragon.x) {
                    p.passed = true;
                    score++;
                    sound.score();
                }

                // Collision with Dragon
                if (dragon.x + dragon.width > p.x && dragon.x < p.x + 40) {
                    if (dragon.y < p.top || dragon.y + dragon.height > canvas.height - p.bottom) {
                        lives--;
                        sound.hit();
                        pipes.splice(i, 1);
                        if (lives <= 0) state = 'GAMEOVER';
                        continue;
                    }
                }

                if (p.x < -40) pipes.splice(i, 1);
            }

            // Update Fireballs
            for (let i = fireballs.length - 1; i >= 0; i--) {
                const f = fireballs[i];
                f.x += f.speed;

                // Fireball hits Pipe
                for (let j = pipes.length - 1; j >= 0; j--) {
                    const p = pipes[j];
                    if (f.x > p.x && f.x < p.x + 40) {
                        if (f.y < p.top || f.y > canvas.height - p.bottom) {
                            fireballs.splice(i, 1);
                            break;
                        }
                    }
                }

                if (f.x > canvas.width) fireballs.splice(i, 1);
            }

            // Floor & Ceiling Collision
            if (dragon.y + dragon.height >= canvas.height - 30 || dragon.y <= 0) {
                state = 'GAMEOVER';
                sound.hit();
            }
        }
    }

    function render() {
        ctx.fillStyle = '#0b0b1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Ground
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(0, canvas.height - 30, canvas.width, 30);

        // Pipes
        ctx.fillStyle = '#ff4500';
        pipes.forEach(p => {
            ctx.fillRect(p.x, 0, 40, p.top);
            ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);
        });

        // Fireballs
        ctx.fillStyle = '#ffcc00';
        fireballs.forEach(f => {
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
            ctx.fill();
        });

        // Dragon
        ctx.fillStyle = '#ff8c00';
        ctx.fillRect(dragon.x, dragon.y, dragon.width, dragon.height);

        // UI Score & Lives
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 18px Courier New';
        ctx.fillText(`Score: ${score}`, 15, 30);
        ctx.fillText(`Lives: ${'❤️'.repeat(lives)}`, 15, 55);

        // State Screens
        if (state === 'START') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff8c00';
            ctx.font = 'bold 24px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('FLAPPY FLAME ARCADE', canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Courier New';
            ctx.fillText('Tap Screen to Flap', canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillText('Tap FIRE to Shoot', canvas.width / 2, canvas.height / 2 + 45);
            ctx.textAlign = 'left';
        } else if (state === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff4500';
            ctx.font = 'bold 28px Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = '#fff';
            ctx.font = '16px Courier New';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, canvas.height / 2 + 15);
            ctx.fillText('Tap Screen to Restart', canvas.width / 2, canvas.height / 2 + 45);
            ctx.textAlign = 'left';
        }

        requestAnimationFrame(render);
    }

    function loop() {
        update();
        setTimeout(loop, 1000 / 60);
    }

    loop();
    render();
</script>
</body>
</html>
