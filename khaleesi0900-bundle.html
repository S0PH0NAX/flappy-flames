<script>
// boss-render.js — Siege engine boss drawing
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

// ------------------------------------------------------------------
// DRAWING HELPERS
// ------------------------------------------------------------------
function bossStoneWall(x, y, w, h, charred) {
  const rowH = 14, brickW = 28;
  const pal = charred ? ['#2a2d31', '#202327', '#34373c'] : ['#7d838b', '#6c727a', '#8e949c'];
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = charred ? '#121416' : '#3b3f45';
  ctx.fillRect(x, y, w, h);
  for (let r = 0, yy = y; yy < y + h; r++, yy += rowH) {
    const off = (r % 2) * (brickW / 2);
    for (let i = 0, xx = x - off; xx < x + w; i++, xx += brickW) {
      ctx.fillStyle = pal[(r * 5 + i * 7 + r * i) % 3];
      ctx.fillRect(xx + 1, yy + 1, brickW - 2, rowH - 2);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(xx + 1, yy + 1, brickW - 2, 2);
    }
  }
  ctx.restore();
}

function bossWood(x, y, w, h, vertical, charred) {
  ctx.fillStyle = charred ? '#3a2616' : '#8b5a2b';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = charred ? '#241608' : '#6b4320';
  if (vertical) { for (let i = 5; i < w; i += 6) ctx.fillRect(x + i, y, 1, h); }
  else { for (let j = 6; j < h; j += 7) ctx.fillRect(x, y + j, w, 1); }
  ctx.fillStyle = charred ? 'rgba(255,200,140,0.06)' : 'rgba(255,220,160,0.18)';
  if (vertical) ctx.fillRect(x, y, 2, h); else ctx.fillRect(x, y, w, 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  if (vertical) ctx.fillRect(x + w - 2, y, 2, h); else ctx.fillRect(x, y + h - 2, w, 2);
}

function bossIron(x, y, w, h) {
  ctx.fillStyle = '#2b3138';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(x, y, w, 1);
  ctx.fillStyle = '#9aa7b0';
  if (w >= 8) {
    ctx.fillRect(x + 2, y + Math.floor(h / 2) - 1, 2, 2);
    ctx.fillRect(x + w - 4, y + Math.floor(h / 2) - 1, 2, 2);
  }
}

function bossBrace(x1, y1, x2, y2, th, charred) {
  ctx.save();
  ctx.lineCap = 'butt';
  ctx.strokeStyle = charred ? '#1d1209' : '#3a2410';
  ctx.lineWidth = th + 3;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = charred ? '#3a2616' : '#8b5a2b';
  ctx.lineWidth = th;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
}

// Timber-and-steel scaffolding bolted onto the back (right side) of the tower, so the tower
// has depth instead of ending in a flat wall. Drawn behind the tower body.
function bossRearScaffold(bx, g, woodDead, topDead) {
  const right = bx + g.bw;
  const sw = Math.max(46, g.bw * 0.24);
  const xIn = right - 6, xMid = right + sw * 0.5, xOut = right + sw;
  const topIn = g.turretH * 0.18, topOut = g.turretH * 0.62;
  const bot = g.baseTop + 6;
  const now = bossState.frame;

  // steel back-frame: thin riveted girders behind the timbers
  ctx.save();
  ctx.strokeStyle = '#1e2329';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(xIn, topIn + 10); ctx.lineTo(xOut - 4, topOut + 6);
  ctx.moveTo(xIn, bot - 4); ctx.lineTo(xOut - 4, topOut + 6);
  ctx.stroke();
  ctx.restore();

  // vertical posts (outer one shorter: the frame steps down)
  bossWood(xMid - 4, topIn + 20, 8, bot - topIn - 20, true, woodDead);
  bossWood(xOut - 8, topOut, 8, bot - topOut, true, woodDead);
  // cap beams
  bossWood(xIn - 4, topIn + 16, xMid - xIn + 10, 6, false, woodDead);
  bossWood(xMid - 4, topOut - 4, xOut - xMid + 6, 6, false, woodDead);

  // ledgers with X bracing in each bay
  const step = 46;
  for (let y = topIn + 16 + step; y < bot - 10; y += step) {
    const outer = y >= topOut;
    const x1 = outer ? xOut : xMid + 4;
    bossWood(xIn - 2, y, x1 - xIn, 5, false, woodDead);
    const yPrev = y - step;
    // left bay
    if (yPrev >= topIn + 16) {
      bossBrace(xIn + 2, yPrev + 5, xMid - 4, y, 3, woodDead);
      bossBrace(xMid - 4, yPrev + 5, xIn + 2, y, 3, woodDead);
    }
    // right bay
    if (outer && yPrev >= topOut - 4) {
      bossBrace(xMid + 4, yPrev + 5, xOut - 8, y, 3, woodDead);
      bossBrace(xOut - 8, yPrev + 5, xMid + 4, y, 3, woodDead);
    }
    bossIron(xMid - 6, y - 1, 12, 7);
    if (outer) bossIron(xOut - 10, y - 1, 12, 7);
  }

  // steel walkway with a railing partway up
  const wy = Math.round((topOut + bot) / 2);
  ctx.fillStyle = '#3a414a';
  ctx.fillRect(xIn, wy - 4, xOut - xIn + 8, 5);
  ctx.fillStyle = '#6d7883';
  ctx.fillRect(xIn, wy - 4, xOut - xIn + 8, 1);
  ctx.fillStyle = '#2b3138';
  for (let rx = xIn + 6; rx <= xOut + 6; rx += 10) ctx.fillRect(rx, wy - 18, 2, 14);
  ctx.fillRect(xIn, wy - 19, xOut - xIn + 8, 2);

  // kicker struts down to the axle: the frame rides on the wagon
  bossBrace(xOut - 4, bot - 2, right + g.over * 0.7, g.deckTop, 6, woodDead);
  bossBrace(xMid, bot - 2, right - 2, g.baseTop + 34, 4, woodDead);
  bossIron(xOut - 10, bot - 6, 12, 8);

  // crane arm off the top with a swinging hook and rope
  const armY = topIn + 4;
  bossWood(xMid - 4, armY - 2, 8, 22, true, woodDead);
  bossBrace(xIn, armY + 10, xOut + 18, armY, 5, woodDead);
  ctx.fillStyle = '#2b3138';
  ctx.beginPath(); ctx.arc(xOut + 16, armY + 1, 4, 0, Math.PI * 2); ctx.fill();
  const sway = Math.sin(now * 0.06) * 0.18 + bossState.bump * 0.03;
  const ropeL = 44;
  const hx = xOut + 16 + Math.sin(sway) * ropeL, hy = armY + 1 + Math.cos(sway) * ropeL;
  ctx.strokeStyle = '#c9b28a';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xOut + 16, armY + 1); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.strokeStyle = '#5f6973';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(hx, hy + 5, 4, -Math.PI * 0.1, Math.PI * 1.1); ctx.stroke();

  // shade it back so the tower face reads in front
  ctx.fillStyle = 'rgba(8,10,16,0.28)';
  ctx.fillRect(right - 6, 0, sw + 40, g.gY);
}

// Crouching stone gargoyle on a corbel. dir = -1 faces left (toward the dragon), 1 faces right.
function bossGargoyle(x, y, dir, s, dead) {
  const stone = dead ? '#24272b' : '#8a9099';
  const dark = dead ? '#16181b' : '#5b616a';
  const light = dead ? '#30343a' : '#b4bac2';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(-dir * s, s);
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowOffsetX = 2 * dir;
  ctx.shadowOffsetY = 2;
  // corbel
  ctx.fillStyle = dark;
  ctx.fillRect(-4, 0, 14, 5);
  ctx.fillRect(-1, 5, 9, 4);
  // folded wing
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(4, -6); ctx.lineTo(13, -20); ctx.lineTo(12, -12); ctx.lineTo(16, -14); ctx.lineTo(10, -2);
  ctx.closePath(); ctx.fill();
  // haunches and body
  ctx.fillStyle = stone;
  ctx.fillRect(-2, -8, 12, 8);
  ctx.fillRect(-8, -12, 10, 8);
  // front legs and claws gripping the edge
  ctx.fillRect(-9, -4, 3, 4);
  ctx.fillRect(-4, -4, 3, 4);
  ctx.fillStyle = light;
  ctx.fillRect(-10, -1, 2, 1); ctx.fillRect(-5, -1, 2, 1);
  // head jutting out, open jaws
  ctx.fillStyle = stone;
  ctx.fillRect(-16, -17, 10, 8);
  ctx.fillStyle = dark;
  ctx.fillRect(-18, -12, 6, 3);       // lower jaw
  ctx.fillStyle = '#0b0b0d';
  ctx.fillRect(-17, -14, 5, 2);       // mouth
  ctx.fillStyle = light;
  ctx.fillRect(-16, -14, 1, 1); ctx.fillRect(-14, -14, 1, 1);   // fangs
  // horns and brow
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(-9, -17); ctx.lineTo(-5, -23); ctx.lineTo(-7, -16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-13, -17); ctx.lineTo(-12, -22); ctx.lineTo(-11, -17); ctx.closePath(); ctx.fill();
  ctx.fillStyle = light;
  ctx.fillRect(-16, -17, 10, 1);
  // glowing eye
  if (!dead) {
    const glow = 0.6 + 0.4 * Math.sin(bossState.frame * 0.08 + x);
    ctx.fillStyle = 'rgba(255,60,30,' + glow + ')';
    ctx.fillRect(-14, -16, 2, 2);
    ctx.fillStyle = 'rgba(255,80,40,' + (glow * 0.25) + ')';
    ctx.fillRect(-16, -18, 6, 6);
  }
  ctx.restore();
}

// The wheeled platform the tower rides on: an axle frame, a heavy timber deck wider than the
// tower, iron straps and corner plates, and a spiked iron-shod front beam. Wheels are drawn after.
function bossChassis(bx, g, dead) {
  const x0 = bx - g.over, x1 = bx + g.bw + g.over, w = x1 - x0;
  const top = g.deckTop, axY = g.gY - g.wheelR;
  // axle beam between the wheel hubs (behind the wheels)
  ctx.fillStyle = dead ? '#140c06' : '#2a1b10';
  ctx.fillRect(bx + g.wheelXs[0], axY - 4, g.wheelXs[1] - g.wheelXs[0], 8);
  // iron hangers from the deck down to each hub, and bracing between the axles
  const midX = bx + g.bw / 2;
  g.wheelXs.forEach(wx => {
    bossBrace(bx + wx - g.wheelR * 0.55, top + g.deckH - 2, bx + wx, axY, 6, dead);
    bossBrace(bx + wx + g.wheelR * 0.55, top + g.deckH - 2, bx + wx, axY, 6, dead);
  });
  bossBrace(bx + g.wheelXs[0], axY, midX, top + g.deckH, 5, dead);
  bossBrace(bx + g.wheelXs[1], axY, midX, top + g.deckH, 5, dead);

  // wheels: each judders on its own over the rough ground
  const wheelDy = -bossState.rumbleY * 0.7;
  const wr = Math.max(0, bossState.roll);
  g.wheelXs.forEach((wx, i) => {
    const jig = -Math.abs(Math.sin(bossState.frame * 1.45 + i * 2.1)) * 1.8 * wr;
    bossWheel(bx + wx + Math.sin(bossState.frame * 2.3 + i) * 0.6 * wr, g.gY - g.wheelR + wheelDy + jig, g.wheelR, bossState.wheelAngle, dead);
  });

  // deck: thick top plank + darker lower beam
  bossWood(x0, top, w, 11, false, dead);
  bossWood(x0 + 4, top + 11, w - 8, g.deckH - 11, false, true);
  // plank ends visible on the deck face
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  for (let px = x0 + 18; px < x1 - 6; px += 22) ctx.fillRect(px, top + 1, 1, 9);
  // iron straps and end plates
  ctx.fillStyle = '#2b3138';
  for (let sx = x0 + 30; sx < x1 - 20; sx += Math.max(48, w / 6)) ctx.fillRect(sx, top, 5, g.deckH);
  bossIron(x0 - 2, top - 2, 14, g.deckH + 2);
  bossIron(x1 - 12, top - 2, 14, g.deckH + 2);
  ctx.fillStyle = '#9aa7b0';
  for (let sx = x0 + 32; sx < x1 - 20; sx += Math.max(48, w / 6)) {
    ctx.fillRect(sx + 1, top + 3, 2, 2);
    ctx.fillRect(sx + 1, top + g.deckH - 5, 2, 2);
  }
  // spiked ram beam on the front
  ctx.fillStyle = '#2b3138';
  ctx.fillRect(x0 - 10, top + 3, 10, g.deckH - 6);
  ctx.fillStyle = '#7d8890';
  for (let i = 0; i < 3; i++) {
    const sy = top + 4 + i * ((g.deckH - 8) / 2);
    ctx.beginPath(); ctx.moveTo(x0 - 10, sy - 3); ctx.lineTo(x0 - 20, sy); ctx.lineTo(x0 - 10, sy + 3); ctx.closePath(); ctx.fill();
  }
  // gussets tying the stone base down to the deck
  bossBrace(bx - g.over * 0.55, top, bx + 2, top - 26, 5, dead);
  bossBrace(bx + g.bw + g.over * 0.55, top, bx + g.bw - 2, top - 26, 5, dead);
  bossIron(bx - 4, top - 8, 10, 8);
  bossIron(bx + g.bw - 6, top - 8, 10, 8);
}

// Open-spoked siege wheel: the gaps between spokes make the rotation easy to see.
function bossWheel(cx, cy, R, angle, charred) {
  const wood = charred ? '#2e1d10' : '#7a4a22';
  const woodLight = charred ? '#4a3220' : '#b07a3e';
  const woodDark = charred ? '#1a0f08' : '#4a2a10';
  ctx.save();
  ctx.translate(cx, cy);

  // shadow on the ground behind the wheel
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, R - 2, R * 0.9, 5, 0, 0, Math.PI * 2); ctx.fill();

  ctx.rotate(angle);

  // spokes (8 thick wooden spokes with a lit edge and a dark edge)
  const spokeW = Math.max(5, R * 0.14);
  for (let i = 0; i < 8; i++) {
    ctx.save();
    ctx.rotate((i / 8) * Math.PI * 2);
    ctx.fillStyle = woodDark;
    ctx.fillRect(R * 0.18, -spokeW / 2 - 1, R * 0.66, spokeW + 2);
    ctx.fillStyle = wood;
    ctx.fillRect(R * 0.18, -spokeW / 2, R * 0.66, spokeW);
    ctx.fillStyle = woodLight;
    ctx.fillRect(R * 0.18, -spokeW / 2, R * 0.66, 2);
    // wood grain notch
    ctx.fillStyle = woodDark;
    ctx.fillRect(R * 0.45, -1, R * 0.12, 1);
    ctx.restore();
  }

  // felloe (wooden rim) made of 8 curved segments with visible joints
  const rimIn = R - 13, rimOut = R - 4;
  ctx.fillStyle = wood;
  ctx.beginPath();
  ctx.arc(0, 0, rimOut, 0, Math.PI * 2);
  ctx.arc(0, 0, rimIn, 0, Math.PI * 2, true);
  ctx.fill();
  ctx.strokeStyle = woodLight;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, rimIn + 1, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = woodDark;
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a = ((i + 0.5) / 8) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * rimIn, Math.sin(a) * rimIn);
    ctx.lineTo(Math.cos(a) * rimOut, Math.sin(a) * rimOut);
    ctx.stroke();
  }

  // iron tyre with rivets
  ctx.strokeStyle = '#262c33';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(0, 0, R - 3, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#7d8a96';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, R - 1, -2.6, -0.6); ctx.stroke();
  ctx.fillStyle = '#b8c2c9';
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    ctx.fillRect(Math.cos(a) * (R - 3) - 1.5, Math.sin(a) * (R - 3) - 1.5, 3, 3);
  }

  // hub with iron cap and bolts (bolts rotate, so they show the turning too)
  ctx.fillStyle = woodDark;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2b3138';
  ctx.beginPath(); ctx.arc(0, 0, R * 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8795a0';
  ctx.beginPath(); ctx.arc(0, 0, R * 0.11, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c9d2d8';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.18, Math.sin(a) * R * 0.18, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // fixed lighting: top-left highlight / bottom-right shade on the tyre (doesn't rotate)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = 'rgba(255,230,190,0.18)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, R - 8, Math.PI * 1.05, Math.PI * 1.55); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.arc(0, 0, R - 8, Math.PI * 0.05, Math.PI * 0.55); ctx.stroke();
  ctx.restore();
}

// Heavy iron ball: rotating riveted straps under fixed lighting so it reads as polished metal.
function bossMetalBall(cx, cy, r, rot) {
  if (r < 1) return;
  for (let i = 1; i <= 3; i++) {
    ctx.fillStyle = 'rgba(200,210,220,' + (0.10 - i * 0.025) + ')';
    ctx.beginPath(); ctx.arc(cx + r * 0.45 * i, cy, r * (1 - i * 0.06), 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();

  const base = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.05, 0, 0, r);
  base.addColorStop(0, '#ffffff');
  base.addColorStop(0.2, '#cfd8dc');
  base.addColorStop(0.55, '#78909c');
  base.addColorStop(1, '#263238');
  ctx.fillStyle = base;
  ctx.fillRect(-r, -r, r * 2, r * 2);

  ctx.save();
  ctx.rotate(rot);
  ctx.fillStyle = 'rgba(28,36,42,0.78)';
  ctx.fillRect(-r, -r * 0.1, r * 2, r * 0.2);
  ctx.fillRect(-r * 0.1, -r, r * 0.2, r * 2);
  ctx.strokeStyle = 'rgba(28,36,42,0.7)';
  ctx.lineWidth = Math.max(2, r * 0.07);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, Math.PI * 2); ctx.stroke();
  const rv = Math.max(1.5, r * 0.04);
  [-0.82, -0.5, 0.5, 0.82].forEach(k => {
    [[k * r, 0], [0, k * r]].forEach(p => {
      ctx.fillStyle = '#0f1417';
      ctx.beginPath(); ctx.arc(p[0], p[1], rv + 1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#cfd8dc';
      ctx.beginPath(); ctx.arc(p[0], p[1], rv, 0, Math.PI * 2); ctx.fill();
    });
  });
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.arc(r * 0.35, r * 0.35, r * 0.09, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-r * 0.3, r * 0.5, r * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const spec = ctx.createRadialGradient(-r * 0.4, -r * 0.45, 0, -r * 0.4, -r * 0.45, r * 0.6);
  spec.addColorStop(0, 'rgba(255,255,255,0.75)');
  spec.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = spec;
  ctx.fillRect(-r, -r, r * 2, r * 2);
  const edge = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r);
  edge.addColorStop(0, 'rgba(0,0,0,0)');
  edge.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = edge;
  ctx.fillRect(-r, -r, r * 2, r * 2);
  ctx.restore();

  ctx.strokeStyle = '#11181c';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
}

function bossCannon(bx, cy, g, alive, warn, blast) {
  const x0 = bx - g.barrelLen;      // muzzle
  const x1 = bx + 70;               // breech
  const th = 30;
  ctx.fillStyle = '#2b2f35';
  ctx.beginPath(); ctx.arc(bx + 2, cy, th / 2 + 9, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#8e949c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(bx + 2, cy, th / 2 + 9, 0, Math.PI * 2); ctx.stroke();

  if (!alive) {
    ctx.fillStyle = '#15181b';
    ctx.fillRect(bx - 6, cy - 9, 30, 18);
    return;
  }
  bossWood(bx + 6, cy + th / 2 - 2, 60, 9, false, false);
  bossIron(bx + 12, cy + th / 2 - 2, 6, 9);
  bossIron(bx + 52, cy + th / 2 - 2, 6, 9);
  const grad = ctx.createLinearGradient(0, cy - th / 2, 0, cy + th / 2);
  grad.addColorStop(0, '#90a4ae');
  grad.addColorStop(0.35, '#546e7a');
  grad.addColorStop(1, '#1c262b');
  ctx.fillStyle = grad;
  ctx.fillRect(x0, cy - th / 2, x1 - x0, th);
  ctx.fillStyle = '#37474f';
  ctx.fillRect(x0 - 5, cy - th / 2 - 4, 10, th + 8);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(x0 - 5, cy - th / 2 - 4, 10, 2);
  ctx.fillStyle = '#05080a';
  ctx.beginPath(); ctx.ellipse(x0 - 4, cy, 4, th / 2 - 3, 0, 0, Math.PI * 2); ctx.fill();
  [x0 + 26, x0 + 58, x0 + 88].forEach(rx => {
    ctx.fillStyle = '#263238';
    ctx.fillRect(rx, cy - th / 2 - 2, 7, th + 4);
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(rx, cy - th / 2 - 2, 7, 2);
  });
  ctx.fillStyle = '#263238';
  ctx.beginPath(); ctx.arc(x1, cy, th / 2, -Math.PI / 2, Math.PI / 2); ctx.fill();

  if (warn > 0) {
    const rg = ctx.createRadialGradient(x0 - 4, cy, 2, x0 - 4, cy, 34);
    rg.addColorStop(0, 'rgba(255,190,60,' + (0.25 + 0.55 * warn) + ')');
    rg.addColorStop(1, 'rgba(255,120,0,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x0 - 4, cy, 34, 0, Math.PI * 2); ctx.fill();
  }
  if (blast > 0) {
    drawFlame(x0 - 8, cy + 14, 34 * blast + 8, 52 * blast + 10, 3.1, blast);
    ctx.fillStyle = 'rgba(255,243,196,' + (0.9 * blast) + ')';
    ctx.beginPath(); ctx.arc(x0 - 6, cy, 18 * blast, 0, Math.PI * 2); ctx.fill();
  }
}

function bossHpBar(x, y, w, hp, label, shielded, open) {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(x, y, w, 11);
  ctx.fillStyle = '#3a0f0f';
  ctx.fillRect(x + 1, y + 1, w - 2, 9);
  const pct = Math.max(0, hp) / 100;
  if (shielded) {
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(x + 1, y + 1, (w - 2) * pct, 9);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let sx = x + 1; sx < x + 1 + (w - 2) * pct; sx += 8) ctx.fillRect(sx, y + 1, 3, 9);
  } else {
    ctx.fillStyle = pct > 0.5 ? '#2ecc71' : (pct > 0.25 ? '#f1c40f' : '#e74c3c');
    ctx.fillRect(x + 1, y + 1, (w - 2) * pct, 9);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x + 1, y + 1, (w - 2) * pct, 2);
  }
  if (open) {
    ctx.strokeStyle = 'rgba(241,196,15,' + (0.5 + 0.5 * Math.sin(Date.now() / 120)) + ')';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 1, y - 1, w + 2, 13);
  }
  ctx.fillStyle = '#ecf0f1';
  ctx.font = 'bold 8px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(label, x + 2, y - 2);
}

function bossArcherSprite(x, feetY, pose, anim, scale, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, feetY - 11 * scale);
  ctx.scale(scale, scale);
  drawArcherDetail(pose, anim, true);
  ctx.restore();
}

function renderBoss() {
  const g = bossGeom();
  const bw = g.bw;
  const bx = Math.round(bossState.x);
  const gY = g.gY;
  const tH = g.turretH;
  const bT = g.baseTop;
  const pY = Math.round(g.platY);
  const pY2Back = Math.round(g.platY2);
  const now = Date.now();
  const B = bossState.burn;
  const topDead = B.top.charred;
  const midDead = B.mid.charred;
  const botDead = B.bot.charred;

  // ground shadow (stays on the ground)
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(bx - g.over - 10, gY - 3, bw + 2 * g.over + 20, 7);

  // the whole tower rumbles over the ground
  const shakeX = Math.sin(bossState.frame * 1.7) * 0.6 * bossState.swayAmp;
  ctx.save();
  ctx.translate(shakeX, bossState.rumbleY);

  // ============ REAR SCAFFOLDING (behind the tower) ============
  bossRearScaffold(bx, g, midDead, topDead);

  // ============ STONE BASE ============
  bossStoneWall(bx, bT + 8, bw, g.deckTop - bT - 8, botDead);
  ctx.fillStyle = botDead ? '#15181b' : '#2b2f35';                // plinth course where it sits on the deck
  ctx.fillRect(bx - 3, g.deckTop - 7, bw + 6, 7);
  bossWood(bx - 2, bT, bw + 4, 8, false, botDead);
  bossIron(bx - 2, bT, 12, 8);
  bossIron(bx + bw - 10, bT, 12, 8);

  // ============ TOP STONE TURRET ============
  bossStoneWall(bx, 0, bw, tH - 12, topDead);
  ctx.fillStyle = topDead ? '#15181b' : '#2b2f35';
  ctx.fillRect(bx, 0, bw, 8);
  ctx.fillStyle = topDead ? '#2a2d31' : '#9aa0a8';
  ctx.fillRect(bx, 8, bw, 2);
  ctx.fillStyle = '#0a0c0e';
  ctx.fillRect(bx + bw * 0.55, 34, 5, 26);
  ctx.fillRect(bx + bw * 0.80, 34, 5, 26);
  bossIron(bx, tH - 40, bw, 8);
  bossWood(bx - 2, tH - 12, bw + 4, 16, false, midDead);
  bossIron(bx - 2, tH - 12, 14, 16);
  bossIron(bx + bw - 12, tH - 12, 14, 16);

  // gargoyles on the turret corners
  bossGargoyle(bx + 2, tH - 40, -1, 1.9, topDead);
  bossGargoyle(bx + bw - 2, tH - 40, 1, 1.9, topDead);

  // ============ OPEN TIMBER MIDDLE ============
  const midTop = tH + 4;
  ctx.fillStyle = midDead ? 'rgba(10,6,4,0.9)' : 'rgba(22,13,8,0.82)';
  ctx.fillRect(bx + 14, midTop, bw - 28, bT - midTop);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  for (let px = bx + 20; px < bx + bw - 16; px += 14) ctx.fillRect(px, midTop, 1, bT - midTop);
  // timber and steel framing at the back of the open middle, so it isn't a flat wall
  ctx.save();
  ctx.globalAlpha = 0.55;
  const bayW = (bw - 28) / 3;
  for (let b = 0; b < 3; b++) {
    const x0 = bx + 14 + b * bayW, x1 = x0 + bayW;
    bossBrace(x0 + 3, midTop + 6, x1 - 3, pY - 44, 3, midDead);
    bossBrace(x1 - 3, midTop + 6, x0 + 3, pY - 44, 3, midDead);
    bossBrace(x0 + 3, pY + 20, x1 - 3, pY2Back - 38, 3, midDead);
    bossBrace(x1 - 3, pY + 20, x0 + 3, pY2Back - 38, 3, midDead);
    if (b > 0) bossWood(x0 - 3, midTop, 6, bT - midTop, true, midDead);
  }
  ctx.strokeStyle = '#2b3138';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx + 14, midTop + 4); ctx.lineTo(bx + bw - 14, midTop + 4);
  ctx.moveTo(bx + 14, (midTop + pY) / 2 - 10); ctx.lineTo(bx + bw - 14, (midTop + pY) / 2 - 10);
  ctx.stroke();
  ctx.restore();

  bossWood(bx + 2, midTop, 14, bT - midTop, true, midDead);
  bossWood(bx + bw - 16, midTop, 14, bT - midTop, true, midDead);
  bossIron(bx + 1, (midTop + pY) / 2, 16, 6);
  bossIron(bx + bw - 17, (midTop + pY) / 2, 16, 6);
  bossIron(bx + 1, bT - 30, 16, 6);
  bossIron(bx + bw - 17, bT - 30, 16, 6);

  bossBrace(bx + 16, midTop + 38, bx + 44, midTop + 4, 6, midDead);
  bossBrace(bx + bw - 16, midTop + 38, bx + bw - 44, midTop + 4, 6, midDead);
  bossBrace(bx + 16, bT - 4, bx + 60, pY + 14, 7, midDead);
  bossBrace(bx + bw - 16, bT - 4, bx + bw - 56, pY + 14, 7, midDead);
  bossBrace(bx + 16, pY + 14, bx + 60, bT - 4, 5, midDead);

  // back railing (behind the archers)
  bossWood(bx + 14, pY - 40, bw - 28, 4, false, midDead);
  for (let rx = bx + 20; rx < bx + bw - 18; rx += 26) bossWood(rx, pY - 40, 4, 40, true, midDead);

  // platform: top surface (three rows of archers stand on it) + front face + joists
  ctx.fillStyle = midDead ? '#2e1d10' : '#a8743a';
  ctx.fillRect(bx + 4, pY - 14, bw - 8, 14);
  ctx.fillStyle = midDead ? '#1d1209' : '#7a4c22';
  ctx.fillRect(bx + 4, pY - 9, bw - 8, 1);
  ctx.fillRect(bx + 4, pY - 4, bw - 8, 1);
  bossWood(bx + 4, pY, bw - 8, 9, false, midDead);
  bossWood(bx + 4, pY + 9, bw - 8, 7, false, true);
  for (let jx = bx + 12; jx < bx + bw - 12; jx += 22) bossWood(jx, pY + 16, 6, 8, true, true);
  bossIron(bx + 2, pY - 2, 10, 18);
  bossIron(bx + bw - 12, pY - 2, 10, 18);
  ctx.fillStyle = '#080503';
  ctx.fillRect(bx + g.ladderX - 9, pY - 14, 18, 4);

  // lower platform: second firing line of archers below the first
  const pY2 = Math.round(g.platY2);
  bossWood(bx + 14, pY2 - 34, bw - 28, 4, false, midDead);
  for (let rx = bx + 20; rx < bx + bw - 18; rx += 26) bossWood(rx, pY2 - 34, 4, 34, true, midDead);
  ctx.fillStyle = midDead ? '#2e1d10' : '#a8743a';
  ctx.fillRect(bx + 4, pY2 - 10, bw - 8, 10);
  ctx.fillStyle = midDead ? '#1d1209' : '#7a4c22';
  ctx.fillRect(bx + 4, pY2 - 5, bw - 8, 1);
  bossWood(bx + 4, pY2, bw - 8, 8, false, midDead);
  for (let jx = bx + 12; jx < bx + bw - 12; jx += 22) bossWood(jx, pY2 + 8, 6, Math.max(2, bT - pY2 - 8), true, true);
  bossIron(bx + 2, pY2 - 2, 10, 12);
  bossIron(bx + bw - 12, pY2 - 2, 10, 12);
  ctx.fillStyle = '#080503';
  ctx.fillRect(bx + g.ladderX - 9, pY2 - 10, 18, 4);

  // ladder: from the door's stoop up to the platform
  const lx = bx + g.ladderX;
  const ladderTop = pY - 40;
  ctx.fillStyle = midDead ? '#3a2616' : '#7a4c22';
  ctx.fillRect(lx - 9, ladderTop, 4, g.sillY - ladderTop);
  ctx.fillRect(lx + 5, ladderTop, 4, g.sillY - ladderTop);
  ctx.fillStyle = 'rgba(255,220,160,0.2)';
  ctx.fillRect(lx - 9, ladderTop, 1, g.sillY - ladderTop);
  ctx.fillRect(lx + 5, ladderTop, 1, g.sillY - ladderTop);
  ctx.fillStyle = midDead ? '#4a3220' : '#a8743a';
  for (let ry = g.sillY - 8; ry > ladderTop; ry -= 10) ctx.fillRect(lx - 5, ry, 10, 3);

  // ============ DOOR + STOOP the archers come out of ============
  const dX = bx + g.doorCx - g.doorW / 2;
  const dTop = g.sillY - g.doorH;
  ctx.fillStyle = botDead ? '#2a2d31' : '#8e949c';
  ctx.fillRect(dX - 4, dTop - 4, g.doorW + 8, g.doorH + 4);
  ctx.fillStyle = '#0a0705';
  ctx.beginPath();
  ctx.moveTo(dX, g.sillY);
  ctx.lineTo(dX, dTop + g.doorW / 2);
  ctx.arc(dX + g.doorW / 2, dTop + g.doorW / 2, g.doorW / 2, Math.PI, 0);
  ctx.lineTo(dX + g.doorW, g.sillY);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#6b4320';
  ctx.beginPath();
  ctx.moveTo(dX - 1, dTop + 6); ctx.lineTo(dX - 9, dTop + 12);
  ctx.lineTo(dX - 9, g.sillY - 2); ctx.lineTo(dX - 1, g.sillY);
  ctx.closePath(); ctx.fill();
  bossIron(dX - 9, dTop + 14, 8, 3);
  const stoopX = bx + g.ladderX - 14;
  bossWood(stoopX, g.sillY, (dX + g.doorW + 4) - stoopX, 5, false, botDead);
  bossBrace(stoopX + 6, g.sillY + 5, stoopX + 22, g.sillY + 22, 4, botDead);

  // gargoyles on the base corners
  bossGargoyle(bx + 2, bT, -1, 1.6, botDead);
  bossGargoyle(bx + bw - 2, bT, 1, 1.6, botDead);

  // ============ WHEELED PLATFORM (big rolling wheels under a wide deck) ============
  bossChassis(bx, g, botDead);

  // ============ CANNONS ============
  const topWarn = (bossState.topHp > 0 && bossState.topState === 'IDLE' && bossState.topTimer > 0 && bossState.topTimer < 45) ? 1 - bossState.topTimer / 45 : 0;
  const botWarn = (bossState.botHp > 0 && bossState.botState === 'IDLE' && bossState.botTimer > 0 && bossState.botTimer < 45) ? 1 - bossState.botTimer / 45 : 0;
  const topBlast = (bossState.topState === 'LAUNCHING' && bossState.topChainProgress < 0.12) ? 1 - bossState.topChainProgress / 0.12 : 0;
  const botBlast = (bossState.botState === 'LAUNCHING' && bossState.botChainProgress < 0.12) ? 1 - bossState.botChainProgress / 0.12 : 0;
  bossCannon(bx, g.cyTop, g, !topDead, topWarn, topBlast);
  bossCannon(bx, g.cyBot, g, !botDead, botWarn, botBlast);

  // ============ ARCHERS (back rows first) ============
  const drawOrder = bossState.archers.slice().sort((a, b) => a.y - b.y);
  drawOrder.forEach(a => {
    if (a.phase === 'DYING') {
      const k = Math.min(1, a.dieT / 24);
      bossArcherSprite(bx + a.x, a.y, 'ready', a.anim, 1.25, 1 - k * 0.85);
      drawFlame(bx + a.x, a.y, 16 + 6 * (1 - k), 30 + 14 * (1 - k), a.x * 0.7, 1 - k * 0.5);
      return;
    }
    let pose = 'ready';
    if (a.phase === 'EMERGE' || a.phase === 'TO_LADDER' || a.phase === 'TO_SLOT') pose = 'walk';
    else if (a.phase === 'CLIMB') pose = 'climb';
    else if (a.phase === 'READY' && a.aim) pose = 'draw';
    const recoilX = a.recoil > 0 ? a.recoil * 0.5 : 0;
    bossArcherSprite(bx + a.x + recoilX, a.y, pose, a.anim, 1.25, a.fade);
  });

  // ============ DAMAGE FLASH + FIRE ============
  const flashRect = (y0, y1, f) => {
    if (f > 0) { ctx.fillStyle = 'rgba(255,220,160,' + (0.4 * f / 6) + ')'; ctx.fillRect(bx, y0, bw, y1 - y0); }
  };
  flashRect(0, tH, bossState.topFlash);
  flashRect(tH, bT, bossState.midFlash);
  flashRect(bT, gY, bossState.botFlash);

  ['top', 'mid', 'bot'].forEach(sec => {
    const b = B[sec];
    const range = bossSectionRange(sec, g);
    // dark char wave sweeping down, with flames along its front (same look as the castle towers)
    if (b.charProgress > 0 && !b.charred) {
      const waveY = range[0] + (range[1] - range[0]) * b.charProgress;
      ctx.fillStyle = 'rgba(5, 7, 10, 0.75)';
      ctx.fillRect(bx - 6, range[0], bw + 12, waveY - range[0]);
      const n = Math.floor(bw / 34);
      for (let i = 0; i <= n; i++) {
        drawFlame(bx + 6 + i * 34 + Math.sin(i * 7) * 6, waveY, 32, 48, i * 1.7 + range[0]);
      }
    }
    // flames burning where the dragon hit
    b.flames.forEach(f => drawFlame(bx + f.x, f.y, f.w, f.h, f.x * 0.37 + f.y * 0.11));
  });

  // ============ HEALTH BARS ============
  if (!bossCinematic) {
  if (!topDead) bossHpBar(bx + 12, g.cyTop + 40, bw - 24, bossState.topHp, 'TOP CANNON', false, false);
  if (!midDead) {
    const aliveN = bossAliveArchers();
    const open = bossMidOpen();
    const midLabel = open ? 'CENTER — OPEN! BURN IT!'
      : (bossState.waveState === 'SPAWNING' ? 'WAVE ' + bossState.wave + ' — ARCHERS: ' + aliveN
      : 'CENTER — ARCHERS LEFT: ' + aliveN);
    bossHpBar(bx + 20, tH + 20, bw - 40, bossState.midHp, midLabel, !open, open);
  }
  if (!botDead) bossHpBar(bx + 12, bT + 14, bw - 24, bossState.botHp, 'LOWER CANNON', false, false);
  }

  // ============ METAL SPHERES ============
  if (bossState.topState === 'LAUNCHING') {
    const b = bossBall(bossState.topChainProgress, g.cyTop);
    bossMetalBall(b.x, b.y, b.r, b.rot);
  }
  if (bossState.botState === 'LAUNCHING') {
    const b = bossBall(bossState.botChainProgress, g.cyBot);
    bossMetalBall(b.x, b.y, b.r, b.rot);
  }

  ctx.restore();

  // ============ "LOOSE!" BUBBLE ============
  if (bossCinematic) return;

  // ============ DIRT AND STONES FROM THE WHEELS ============
  bossRocks.forEach(r => {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.globalAlpha = Math.min(1, r.life / 20);
    ctx.fillStyle = r.color;
    ctx.fillRect(-r.size / 2, -r.size / 2, r.size, r.size * 0.8);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-r.size / 2, r.size * 0.1, r.size, r.size * 0.2);
    ctx.restore();
  });

  if (bossState.speechBubbleTimer > 0 && !midDead) {
    const bwid = 62, bh = 26;
    const bubX = bx - bwid - 10, bubY = pY - 74;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.rect(bubX, bubY, bwid, bh);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bubX + bwid - 12, bubY + bh);
    ctx.lineTo(bubX + bwid + 6, bubY + bh + 12);
    ctx.lineTo(bubX + bwid - 28, bubY + bh);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('LOOSE!', bubX + bwid / 2, bubY + 18);
    ctx.textAlign = 'left';
  }

  // Draw fired arrows on top of the tower so they are visible during the boss fight
  drawArchersAndArrows();
}

<script>
// boss-intro.js — Cinematic between the level 3 fireworks and the siege-tower boss:
// the tower rumbles up behind a distant castle wall, smashes through it, and the dragon
// and Khaleesi react in alarm. Then triggerBossBattle() starts the fight. Tap to skip.
// Classic script: shares global scope with the other src/js/*.js files. Load order matters (see index.html).

const BI_FADE_IN = 30;     // fade in from the fireworks' black
const BI_SHAKE = 105;      // the wall starts shaking and cracking
const BI_BREAK = 160;      // the tower smashes through
const BI_ALARM = 215;      // "!" over the dragon, roar
const BI_TALK = 245;       // Khaleesi speaks
const BI_FADE_OUT = 420;   // fade to black...
const BI_END = 450;        // ...and the fight begins
const BI_LINE = '"By the gods... it smashed right through the wall! FLY, SYRAXX!"';

let bossIntro = null;

function startBossIntro() {
  bossClearWorld();
  bossResetState();
  bossState.active = false;
  particles = [];
  blackDebris = [];
  floatingTexts = [];
  khaleesiBannerTimer = 0;
  state = 'BOSS_INTRO';
  bossIntro = { t: 0, stones: [], shake: 0, homeX: width * 0.24, homeY: height * 0.42 };
  dragon.x = bossIntro.homeX;
  dragon.y = bossIntro.homeY;
  dragon.velocity = 0;
  dragon.vx = 0;
}

function skipBossIntro() {
  if (!bossIntro || bossIntro.t < 20) return;
  triggerBossBattle();
}

function bossIntroMusicOn() {
  return !!bossIntro && bossIntro.t >= BI_BREAK;
}

// How loud the wheel rumble should be right now (0..1). Called every frame from update().
function currentRumbleLevel() {
  if (khaleesiSplash) return 0;
  if (state === 'BOSS' && bossState.active) return 0.5 * Math.max(0, bossState.roll);
  if (state === 'BOSS_INTRO' && bossIntro) {
    const t = bossIntro.t;
    if (t < BI_FADE_IN) return 0;
    if (t < BI_BREAK) return 0.08 + 0.4 * (t - BI_FADE_IN) / (BI_BREAK - BI_FADE_IN);
    return Math.max(0.3, 0.7 - (t - BI_BREAK) * 0.004);
  }
  return 0;
}

// Camera shake for the whole scene, in px.
function sceneShake() {
  if (state === 'BOSS_INTRO' && bossIntro && bossIntro.shake > 0.3) {
    const s = bossIntro.shake;
    return { x: (Math.random() - 0.5) * s, y: (Math.random() - 0.5) * s };
  }
  if (state === 'BOSS' && bossState.active && bossState.bump > 1) {
    const s = bossState.bump * 0.4;
    return { x: (Math.random() - 0.5) * s, y: (Math.random() - 0.5) * s };
  }
  return null;
}

// ---- layout of the distant scene ----
function biLayout() {
  const gY = height - groundHeight;
  const g = bossGeom();
  const t = bossIntro.t;
  let s, cx;
  if (t < BI_BREAK) {
    // rolls in from the right behind the wall
    const p = Math.min(1, Math.max(0, (t - 20) / (BI_BREAK - 40)));
    const e = 1 - Math.pow(1 - p, 2);
    s = 0.28;
    cx = width * (1.12 - 0.42 * e);
  } else {
    // bursts through and keeps coming
    const p = Math.min(1, (t - BI_BREAK) / 160);
    const e = 1 - Math.pow(1 - p, 3);
    s = 0.28 + 0.12 * e;
    cx = width * (0.70 - 0.06 * e);
  }
  const wallH = height * 0.105;
  return {
    gY, g, s, cx,
    towerW: g.bw * s,
    wallX0: width * 0.40, wallX1: width + 10,
    wallTop: gY - wallH, wallH,
    gapX: width * 0.70
  };
}

function updateBossIntro() {
  const B = bossIntro;
  if (!B) return;
  B.t++;
  const t = B.t;
  const L = biLayout();

  backgroundParallaxX += 0.25;
  bossState.frame++;
  bossState.wheelAngle += (t < BI_BREAK ? 0.05 : 0.08);
  bossState.rumbleY = -Math.abs(Math.sin(t * 1.1)) * 1.4;
  B.shake *= 0.9;

  // the wall shakes as the tower hits it
  if (t >= BI_SHAKE && t < BI_BREAK) {
    B.shake = Math.max(B.shake, 1 + 4 * (t - BI_SHAKE) / (BI_BREAK - BI_SHAKE));
    if (t % 18 === 0) sound.hit();
    if (Math.random() < 0.35) {
      particles.push({
        x: L.gapX + (Math.random() - 0.5) * L.towerW * 1.2, y: L.wallTop + Math.random() * L.wallH,
        vx: (Math.random() - 0.5) * 0.8, vy: -0.3 - Math.random() * 0.6,
        size: 4 + Math.random() * 5, life: 30, color: 'rgba(150,140,120,0.5)', isSmoke: true
      });
    }
  }

  // CRASH
  if (t === BI_BREAK) {
    B.shake = 16;
    sound.towerDestroy();
    sound.boulderLaunch();
    cutsceneMusicAudio.currentTime = 0;
    for (let i = 0; i < 46; i++) {
      B.stones.push({
        x: L.gapX + (Math.random() - 0.5) * L.towerW * 1.1,
        y: L.wallTop + Math.random() * L.wallH,
        vx: -1 - Math.random() * 6 + (Math.random() < 0.25 ? 6 : 0),
        vy: -2 - Math.random() * 6,
        size: 3 + Math.random() * 7, grow: 1.004 + Math.random() * 0.01,
        rot: Math.random() * 6, spin: (Math.random() - 0.5) * 0.3,
        color: ['#5d6270', '#6e7380', '#4d525e', '#7d8290'][i % 4], landed: false, life: 200
      });
    }
    for (let i = 0; i < 26; i++) {
      particles.push({
        x: L.gapX + (Math.random() - 0.5) * L.towerW * 1.4, y: L.wallTop + Math.random() * L.wallH,
        vx: (Math.random() - 0.6) * 3, vy: -0.5 - Math.random() * 1.5,
        size: 10 + Math.random() * 16, life: 50 + Math.random() * 30,
        color: 'rgba(140,130,115,0.6)', isSmoke: true
      });
    }
  }

  // dust from the wheels once it's through
  if (t > BI_BREAK && Math.random() < 0.5) {
    particles.push({
      x: L.cx + (Math.random() - 0.5) * L.towerW, y: L.gY - 3,
      vx: -1 - Math.random() * 2, vy: -0.3 - Math.random() * 0.6,
      size: 4 + Math.random() * 6, life: 24, color: 'rgba(150,130,100,0.5)', isSmoke: true
    });
  }

  for (let i = B.stones.length - 1; i >= 0; i--) {
    const st = B.stones[i];
    st.life--;
    if (!st.landed) {
      st.vy += 0.3;
      st.x += st.vx;
      st.y += st.vy;
      st.rot += st.spin;
      st.size *= st.grow;
      if (st.y >= L.gY - st.size / 2 && st.vy > 0) { st.y = L.gY - st.size / 2; st.landed = true; }
    }
    if (st.life <= 0) B.stones.splice(i, 1);
  }

  // the dragon hovers; at the alarm it jolts back and flaps hard
  const alarmed = t >= BI_ALARM;
  if (t === BI_ALARM) {
    sound.fireRoar();
    dragon.wingState = 1;
  }
  const flapEvery = alarmed ? 12 : 26;
  if (t % flapEvery === 0) dragon.wingState = 1;
  const jolt = alarmed ? Math.max(0, 1 - (t - BI_ALARM) / 20) : 0;
  const backX = alarmed ? -width * 0.05 * Math.min(1, (t - BI_ALARM) / 25) : 0;
  dragon.x = B.homeX + backX;
  dragon.y = B.homeY + Math.sin(t * (alarmed ? 0.22 : 0.07)) * (alarmed ? 4 : 7) - jolt * 22;

  if (t >= BI_END) triggerBossBattle();
}

// A distant curtain wall, stone by stone. broken = gap where the tower came through.
function biDrawWall(L, broken) {
  const t = bossIntro.t;
  const wob = (t >= BI_SHAKE && t < BI_BREAK) ? (Math.random() - 0.5) * 2.5 : 0;
  const top = L.wallTop, h = L.wallH;
  const gapHalf = L.towerW * 0.62;
  const merlonW = Math.max(8, h * 0.18), merlonH = h * 0.2;

  const drawSpan = (x0, x1, jagLeft, jagRight) => {
    if (x1 <= x0) return;
    ctx.save();
    ctx.beginPath();
    // body with crenellations; jagged broken edges toward the gap
    ctx.moveTo(x0, L.gY);
    if (jagLeft) {
      for (let i = 0; i <= 6; i++) ctx.lineTo(x0 + hash2(i, 7) * 10 - 5 + (i % 2) * 6, L.gY - (h + merlonH) * i / 6);
    } else ctx.lineTo(x0, top);
    for (let x = x0; x < x1; x += merlonW * 2) {
      ctx.lineTo(x, top - merlonH);
      ctx.lineTo(Math.min(x1, x + merlonW), top - merlonH);
      ctx.lineTo(Math.min(x1, x + merlonW), top);
      ctx.lineTo(Math.min(x1, x + merlonW * 2), top);
    }
    if (jagRight) {
      for (let i = 6; i >= 0; i--) ctx.lineTo(x1 + hash2(i, 13) * 10 - 5 - (i % 2) * 6, L.gY - (h + merlonH) * i / 6);
    } else ctx.lineTo(x1, L.gY);
    ctx.closePath();
    ctx.fillStyle = '#4a4e5a';
    ctx.fill();
    ctx.clip();
    // stone courses
    const rowH = Math.max(5, h / 9);
    ctx.strokeStyle = 'rgba(20,22,30,0.55)';
    ctx.lineWidth = 1;
    for (let r = 0, y = L.gY; y > top - merlonH; r++, y -= rowH) {
      ctx.beginPath(); ctx.moveTo(x0 - 10, y); ctx.lineTo(x1 + 10, y); ctx.stroke();
      const sw = rowH * 2.2;
      for (let x = x0 - 10 + (r % 2) * sw / 2; x < x1 + 10; x += sw) {
        ctx.fillStyle = hash2(Math.round(x), r) > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.07)';
        ctx.fillRect(x, y - rowH, sw, rowH);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - rowH); ctx.stroke();
      }
    }
    // a lit top edge and a few torch-lit windows
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x0 - 10, top, x1 - x0 + 20, 2);
    ctx.restore();
  };

  ctx.save();
  ctx.translate(wob, 0);
  if (!broken) {
    drawSpan(L.wallX0, L.wallX1, false, false);
    // cracks spread from where the tower is hitting
    if (t >= BI_SHAKE) {
      const p = (t - BI_SHAKE) / (BI_BREAK - BI_SHAKE);
      ctx.strokeStyle = 'rgba(10,10,15,0.85)';
      ctx.lineWidth = 1.5;
      for (let c = 0; c < 7; c++) {
        let x = L.gapX + (hash2(c, 3) - 0.5) * gapHalf, y = top + h * (0.3 + hash2(c, 5) * 0.5);
        ctx.beginPath(); ctx.moveTo(x, y);
        const segs = Math.ceil(5 * p);
        for (let sgi = 0; sgi < segs; sgi++) {
          x += (hash2(c, sgi + 9) - 0.5) * 18;
          y += (hash2(c, sgi + 21) - 0.5) * 16;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }
  } else {
    drawSpan(L.wallX0, L.gapX - gapHalf, false, true);
    drawSpan(L.gapX + gapHalf, L.wallX1, true, false);
    // rubble heap in the breach
    ctx.fillStyle = '#3e424d';
    for (let i = 0; i < 14; i++) {
      const rx = L.gapX - gapHalf - 6 + hash2(i, 31) * (gapHalf * 2 + 12);
      const rs = 4 + hash2(i, 37) * 8;
      ctx.fillRect(rx, L.gY - rs * (0.5 + hash2(i, 41) * 0.6), rs * 1.3, rs);
    }
  }
  ctx.restore();
}

function biDrawTower(L) {
  const oldX = bossState.x;
  bossState.x = 0;
  bossCinematic = true;
  ctx.save();
  ctx.translate(L.cx - L.towerW / 2, L.gY * (1 - L.s));
  ctx.scale(L.s, L.s);
  renderBoss();
  ctx.restore();
  bossCinematic = false;
  bossState.x = oldX;
}

// Background part: drawn after the parallax castles, before the ground.
function drawBossIntroScene() {
  if (!bossIntro) return;
  const L = biLayout();
  const broken = bossIntro.t >= BI_BREAK;
  if (!broken) { biDrawTower(L); biDrawWall(L, false); }
  else { biDrawWall(L, true); biDrawTower(L); }
  // distance haze
  ctx.fillStyle = 'rgba(30,34,50,0.22)';
  ctx.fillRect(L.wallX0 - 20, 0, width - L.wallX0 + 40, L.gY);
}

function biWrap(text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines;
}

// Foreground part: flying stones, the dragon, alarm, Khaleesi, letterbox, fades.
function drawBossIntroOverlay() {
  const B = bossIntro;
  if (!B) return;
  const t = B.t;

  // stones flying out of the breach
  B.stones.forEach(st => {
    ctx.save();
    ctx.globalAlpha = Math.min(1, st.life / 30);
    ctx.translate(st.x, st.y);
    ctx.rotate(st.rot);
    ctx.fillStyle = st.color;
    ctx.fillRect(-st.size / 2, -st.size / 2, st.size, st.size * 0.75);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(-st.size / 2, st.size * 0.1, st.size, st.size * 0.15);
    ctx.restore();
  });

  drawDragon(dragon.x, dragon.y);

  // "!" over the dragon
  if (t >= BI_ALARM) {
    const a = t - BI_ALARM;
    const pop = a < 8 ? 0.4 + a * 0.12 : 1 + Math.max(0, 0.15 - (a - 8) * 0.02);
    const ex = dragon.x + 6, ey = dragon.y - dragon.size * 0.9 - 14;
    ctx.save();
    ctx.translate(ex, ey);
    ctx.scale(pop, pop);
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e74c3c';
    ctx.font = 'bold 30px "Proxima Nova", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('!', 0, 2);
    ctx.restore();
    ctx.textBaseline = 'alphabetic';
    // shock lines
    if (a < 30) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - a / 30) + ')';
      ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const ang = -Math.PI / 2 + (i - 2.5) * 0.45;
        const r0 = 28 + a * 0.6, r1 = r0 + 10;
        ctx.beginPath();
        ctx.moveTo(ex + Math.cos(ang) * r0, ey + Math.sin(ang) * r0);
        ctx.lineTo(ex + Math.cos(ang) * r1, ey + Math.sin(ang) * r1);
        ctx.stroke();
      }
    }
  }

  const barH = height * 0.075 * Math.min(1, t / 25);

  // Khaleesi's alarmed portrait and line
  if (t >= BI_TALK) {
    const a = t - BI_TALK;
    const ps = 64;
    const shakeP = a < 30 ? (Math.random() - 0.5) * 3 : 0;
    const px = 14 + shakeP, py = height - barH - ps - 14;
    const slide = Math.min(1, a / 10);
    ctx.save();
    ctx.globalAlpha = slide;
    ctx.fillStyle = '#11161d';
    ctx.fillRect(px, py, ps, ps);
    if (khaleesiFrame1.complete && khaleesiFrame1.naturalWidth !== 0) ctx.drawImage(khaleesiFrame1, px, py, ps, ps);
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#e74c3c';
    ctx.strokeRect(px, py, ps, ps);

    ctx.font = 'bold 13px "Proxima Nova", sans-serif';
    const bx = px + ps + 12, bwid = Math.min(width - bx - 14, 320);
    const shown = BI_LINE.slice(0, Math.floor(a * 1.4));
    const lines = biWrap(BI_LINE, bwid - 20);
    const bh = lines.length * 17 + 16;
    const by = py + ps / 2 - bh / 2;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(bx, by, bwid, bh, 10); else ctx.rect(bx, by, bwid, bh);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bx + 1, by + bh / 2 - 7);
    ctx.lineTo(bx - 10, by + bh / 2);
    ctx.lineTo(bx + 1, by + bh / 2 + 7);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.textAlign = 'left';
    let left = shown.length;
    lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left));
      left -= ln.length + 1;
      ctx.fillText(part, bx + 10, by + 22 + i * 17);
    });
    ctx.restore();
  }

  // letterbox bars
  ctx.fillStyle = '#000';
  ctx.fillRect(-20, -20, width + 40, barH + 20);
  ctx.fillRect(-20, height - barH, width + 40, barH + 20);
  if (t > 40 && t < BI_FADE_OUT) {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = '11px "Proxima Nova", sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText('TAP TO SKIP', width - 12, height - barH / 2 + 4);
    ctx.textAlign = 'left';
  }

  // white flash on impact
  if (t >= BI_BREAK && t < BI_BREAK + 8) {
    ctx.fillStyle = 'rgba(255,255,255,' + (0.5 * (1 - (t - BI_BREAK) / 8)) + ')';
    ctx.fillRect(-20, -20, width + 40, height + 40);
  }

  // fades
  let fade = 0;
  if (t < BI_FADE_IN) fade = 1 - t / BI_FADE_IN;
  if (t >= BI_FADE_OUT) fade = Math.min(1, (t - BI_FADE_OUT) / (BI_END - BI_FADE_OUT));
  if (fade > 0) {
    ctx.fillStyle = 'rgba(10,10,20,' + fade + ')';
    ctx.fillRect(-20, -20, width + 40, height + 40);
  }
}
</script>
<script>
// knights.js — Small armored knights (level 4+), gold knights (level 5+) and the gold shield the dragon can win
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

let smallKnights = [];
let goldKnights = [];
const goldShield = { held: false, drop: null };   // drop: falling shield animation after a collision

// ---- small knight tuning ----
const SK_BURN_FRAMES = 120;       // continuous fire contact needed to kill one (resets when contact breaks)
const SK_THRUST_RANGE = 120;      // starts a spear thrust when the dragon is this close
const SK_THRUST_FRAMES = 24;
const SK_THRUST_COOLDOWN = 100;
const SK_POINTS = 25;

// ---- gold knight tuning ----
const GK_TRIGGER_RANGE = 300;     // acts while the dragon is still far away
const GK_PREP_FRAMES = 45;        // glowing wind-up before each action
const GK_PROTECT_FRAMES = 80;
const GK_ATTACK_FRAMES = 34;
const GK_COOLDOWN = 170;          // frames before it can act again
const GK_CARRY_FRAMES = 70;       // how long the dragon carries a grabbed knight
const GK_POINTS = 100;
const GK_SWORD_LEN = 42;
const GK_ACTION_ORDER = ['ATTACK', 'PROTECT', 'CHARGE'];   // always swing first, shield second (easier to grab)
const GK_CHARGE_PREP_FRAMES = 32;
const GK_CHARGE_FRAMES = 60;
const GK_CHARGE_SPEED = 3.4;

// Is fire touching this spot on a tower top? (burning/charred tower, surface flames, or breath flames)
function fireTouching(obs, x, y) {
  if (!obs) return false;
  if (obs.isCharred || obs.charProgress > 0) return true;
  for (let i = 0; i < obs.surfaceFlames.length; i++) {
    const sf = obs.surfaceFlames[i];
    if (Math.abs(obs.x + sf.relX - x) < 12 + sf.width * 0.35) return true;
  }
  for (let i = 0; i < flames.length; i++) {
    const f = flames[i];
    if (Math.abs(f.x - x) < 16 && Math.abs(f.y - y) < 22) return true;
  }
  return false;
}

function heatSmoke(x, y, amount) {
  if (Math.random() < amount) {
    particles.push({
      x: x + (Math.random() - 0.5) * 14, y: y,
      vx: (Math.random() - 0.5) * 0.8, vy: -0.8 - Math.random() * 1.2,
      size: 3 + Math.random() * 4, life: 40,
      color: 'rgba(60,60,66,0.75)', isSmoke: true
    });
  }
}

function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = Math.round(((pa >> 16) & 255) + ((((pb >> 16) & 255) - ((pa >> 16) & 255)) * t));
  const g = Math.round(((pa >> 8) & 255) + ((((pb >> 8) & 255) - ((pa >> 8) & 255)) * t));
  const bl = Math.round((pa & 255) + (((pb & 255) - (pa & 255)) * t));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// =====================================================================
// SMALL KNIGHTS
// =====================================================================
function spawnSmallKnights(obs) {
  // small and medium towers hold one; the longest towers hold 1-3
  const count = obs.type === 'mega' ? 1 + Math.floor(Math.random() * 3) : 1;
  for (let i = 0; i < count; i++) {
    smallKnights.push({
      obsRef: obs,
      relX: count === 1 ? 8 + Math.random() * Math.max(4, obs.width - 34) : 20 + (i + Math.random() * 0.6) * ((obs.width - 60) / count),
      direction: Math.random() < 0.5 ? 1 : -1,
      state: 'ALIVE',
      heat: 0,
      thrustT: 0,
      cooldown: 30 + Math.random() * 60,
      aim: -Math.PI / 2,
      deathT: 0
    });
  }
}

function killSmallKnight(k, how) {
  if (k.state !== 'ALIVE') return;
  k.state = how === 'crush' ? 'CRUSHED' : 'DYING';
  k.deathT = 0;
  gameStats.villagersKilled++;
  sound.knightHit();
  const kx = k.obsRef.x + k.relX + 11;
  const r = addScore(SK_POINTS);
  floatingTexts.push({ x: kx - 20, y: k.obsRef.bottomY - 40, text: 'KNIGHT! +' + r.totalPts, color: '#ff9f43', alpha: 1.0, vy: -1.4 });
}

function updateSmallKnights() {
  for (let i = smallKnights.length - 1; i >= 0; i--) {
    const k = smallKnights[i];
    const obs = k.obsRef;
    if (!obs || obs.x + obs.width < -80) { smallKnights.splice(i, 1); continue; }
    if (k.state !== 'ALIVE') { k.deathT++; continue; }

    const kx = obs.x + k.relX + 11;
    const ky = obs.bottomY - 14;
    const dx = dragon.x - kx, dy = dragon.y - (ky - 6);
    const dist = Math.hypot(dx, dy);

    // invincible (Khaleesi riding): crushed on touch
    if (khaleesiMounted && state === 'PLAYING' && Math.hypot(dragon.x - kx, dragon.y - (ky - 4)) < dragon.size / 2 + 14) {
      killSmallKnight(k, 'crush');
      continue;
    }

    // armor heats while fire touches it; cools instantly when it doesn't
    if (fireTouching(obs, kx, ky)) {
      k.heat++;
      heatSmoke(kx, ky - 14, 0.15 + 0.6 * (k.heat / SK_BURN_FRAMES));
      if (k.heat >= SK_BURN_FRAMES) { killSmallKnight(k, 'fire'); continue; }
    } else {
      k.heat = 0;
    }

    if (k.cooldown > 0) k.cooldown--;
    if (k.deflectT > 0) k.deflectT--;
    if (dist < SK_THRUST_RANGE * 1.6) k.direction = dx >= 0 ? 1 : -1;

    if (k.thrustT > 0) {
      // track the dragon while thrusting (only upward / sideways)
      const target = Math.atan2(dy, dx);
      k.aim = Math.max(-Math.PI + 0.1, Math.min(-0.1, target > Math.PI / 2 ? -Math.PI + 0.1 : (target > 0 ? -0.1 : target)));
      k.thrustT--;
      const tip = smallKnightSpearTip(k, kx, ky);
      if (!khaleesiMounted && Math.hypot(dragon.x - tip.x, dragon.y - tip.y) < dragon.size / 2 - 4) {
        if (dragonShielded()) {
          // the spear glances off the shield and is knocked away
          shieldDeflect(tip.x, tip.y);
          k.deflectT = 18;
          k.thrustT = 0;
        } else triggerHit();
      }
      if (k.thrustT === 0) k.cooldown = SK_THRUST_COOLDOWN;
    } else {
      if (dist < SK_THRUST_RANGE && k.cooldown <= 0) {
        k.thrustT = SK_THRUST_FRAMES;
        k.blocked = false;
        sound.whoosh();
      } else {
        k.relX += k.direction * 0.25;
        if (k.relX < 4) { k.relX = 4; k.direction = 1; }
        if (k.relX > obs.width - 26) { k.relX = obs.width - 26; k.direction = -1; }
      }
      const target = Math.atan2(dy, dx);
      k.aim = Math.max(-Math.PI + 0.3, Math.min(-0.3, target > Math.PI / 2 ? -Math.PI + 0.3 : (target > 0 ? -0.3 : target)));
    }
  }
}

function smallKnightSpearTip(k, kx, ky) {
  const ext = k.thrustT > 0 ? Math.sin((1 - k.thrustT / SK_THRUST_FRAMES) * Math.PI) * 26 : 0;
  const sx = kx + k.direction * 3, sy = ky - 8;
  const len = 22 + ext;
  return { x: sx + Math.cos(k.aim) * len, y: sy + Math.sin(k.aim) * len, sx: sx, sy: sy, ext: ext };
}

function drawSmallKnight(k) {
  const obs = k.obsRef;
  const kx0 = obs.x + k.relX;                 // left of the 22px box
  const ky0 = obs.bottomY - 26;               // feet at ky0 + 26
  const gY = height - groundHeight;

  if (k.state === 'DYING' || k.state === 'CRUSHED') {
    // glowing slag that cools into a dark heap
    const t = Math.min(1, k.deathT / 40);
    ctx.fillStyle = lerpColor('#ff5a1f', '#3a3f45', t);
    ctx.beginPath(); ctx.ellipse(kx0 + 11, ky0 + 24, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lerpColor('#ffb347', '#59616a', t);
    ctx.fillRect(kx0 + 5, ky0 + 18, 6, 5);
    ctx.beginPath(); ctx.arc(kx0 + 16, ky0 + 20, 4, 0, Math.PI * 2); ctx.fill();
    if (k.state === 'DYING' && k.deathT < 30) heatSmoke(kx0 + 11, ky0 + 16, 0.4);
    return;
  }

  const heatT = Math.min(1, k.heat / SK_BURN_FRAMES);
  const steel = lerpColor('#a7b1ba', '#ff3b1f', heatT);
  const steelDark = lerpColor('#5d6770', '#a01a0a', heatT);
  const steelLight = lerpColor('#e3e9ee', '#ffd27a', heatT);
  const out = '#15181c';
  const walk = Math.sin(Date.now() / 160 + k.relX) * (k.thrustT > 0 ? 0 : 1.4);

  if (heatT > 0) {
    const glow = ctx.createRadialGradient(kx0 + 11, ky0 + 10, 2, kx0 + 11, ky0 + 10, 24);
    glow.addColorStop(0, 'rgba(255,90,30,' + (0.45 * heatT) + ')');
    glow.addColorStop(1, 'rgba(255,90,30,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(kx0 - 14, ky0 - 14, 50, 50);
  }

  withFacing(kx0, ky0, k.direction, () => {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(11, 26, 9, 2.2, 0, 0, Math.PI * 2); ctx.fill();
    // legs (greaves + sabatons)
    ctx.fillStyle = out;
    ctx.fillRect(6 - walk, 16, 5, 10); ctx.fillRect(11 + walk, 16, 5, 10);
    ctx.fillStyle = steelDark; ctx.fillRect(7 - walk, 17, 3, 8);
    ctx.fillStyle = steel; ctx.fillRect(12 + walk, 17, 3, 8);
    ctx.fillStyle = steelLight; ctx.fillRect(12 + walk, 17, 1, 6);
    // breastplate + tabard stripe + fauld
    ctx.fillStyle = out; ctx.fillRect(5, 4, 13, 14);
    ctx.fillStyle = steel; ctx.fillRect(6, 5, 11, 12);
    ctx.fillStyle = steelDark; ctx.fillRect(6, 5, 3, 12); ctx.fillRect(6, 14, 11, 1);
    ctx.fillStyle = steelLight; ctx.fillRect(13, 6, 2, 6);
    ctx.fillStyle = '#8e1b1b'; ctx.fillRect(10, 5, 3, 12);
    // pauldrons
    ctx.fillStyle = steelLight; ctx.fillRect(4, 4, 4, 3); ctx.fillRect(15, 4, 4, 3);
    // great helm with visor slit and plume
    ctx.fillStyle = out; ctx.fillRect(6, -6, 11, 11);
    ctx.fillStyle = steel; ctx.fillRect(7, -5, 9, 9);
    ctx.fillStyle = steelDark; ctx.fillRect(7, -5, 2, 9);
    ctx.fillStyle = steelLight; ctx.fillRect(13, -5, 2, 4);
    ctx.fillStyle = '#0b0d10'; ctx.fillRect(10, -2, 7, 2);
    ctx.fillStyle = heatT > 0.4 ? '#ffdd66' : '#0b0d10'; ctx.fillRect(14, 1, 1, 2);
    ctx.fillStyle = '#c0392b'; ctx.fillRect(9, -9, 4, 3); ctx.fillRect(7, -8, 3, 2);
    // round shield on the near arm: boss, rim and a cross
    const sx = 6, sy = 11;
    ctx.fillStyle = out; ctx.beginPath(); ctx.arc(sx, sy, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lerpColor('#2c5aa0', '#c0392b', heatT); ctx.beginPath(); ctx.arc(sx, sy, 6.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = steelLight; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(sx - 0.5, sy - 5, 1, 10); ctx.fillRect(sx - 5, sy - 0.5, 10, 1);
    ctx.fillStyle = steelLight; ctx.beginPath(); ctx.arc(sx, sy, 1.8, 0, Math.PI * 2); ctx.fill();
  });

  // spear in world space so it can track the dragon; after a shield block it is knocked back and wobbles
  const realAim = k.aim;
  if (k.deflectT > 0) {
    const d = k.deflectT / 18;
    k.aim = realAim - k.direction * 0.9 * d + Math.sin(k.deflectT * 1.7) * 0.25 * d;
  }
  const tip = smallKnightSpearTip(k, kx0 + 11, ky0 + 14);
  k.aim = realAim;
  const drawAim = Math.atan2(tip.y - tip.sy, tip.x - tip.sx);
  const back = { x: tip.sx - Math.cos(drawAim) * 12, y: tip.sy - Math.sin(drawAim) * 12 };
  ctx.strokeStyle = '#5a3a1e';
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(back.x, back.y); ctx.lineTo(tip.x, tip.y); ctx.stroke();
  ctx.save();
  ctx.translate(tip.x, tip.y);
  ctx.rotate(drawAim);
  ctx.fillStyle = steelLight;
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(-2, -2.6); ctx.lineTo(-2, 2.6); ctx.closePath(); ctx.fill();
  ctx.restore();
  // gauntlet on the shaft
  ctx.fillStyle = steelDark;
  ctx.fillRect(tip.sx - 2, tip.sy - 2, 4, 4);
  if (k.thrustT > 0 && tip.ext > 12) {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tip.x - Math.cos(k.aim) * 10, tip.y - Math.sin(k.aim) * 10 - 3); ctx.lineTo(tip.x, tip.y - 3); ctx.stroke();
  }
}

// =====================================================================
// GOLD KNIGHTS
// =====================================================================
// Khaleesi explains gold knights and the shield on the first encounter, then only now and then.
const GK_TALK_REPEAT_CHANCE = 0.15;
let gkTalkSeen = { spot: false, shield: false };
function goldKnightTalk(key, text, dur) {
  if (gkTalkSeen[key] && Math.random() > GK_TALK_REPEAT_CHANCE) return;
  gkTalkSeen[key] = true;
  showKhaleesiBanner(text, dur);
}

function maybeSpawnGoldKnight(obs) {
  if (goldKnights.some(g => g.state === 'ON_TOWER' || g.state === 'CARRIED' || g.state === 'FALLING')) return;
  if (Math.random() > 0.4) return;
  goldKnights.push({
    obsRef: obs,
    relX: obs.width * (0.35 + Math.random() * 0.3),
    direction: Math.random() < 0.5 ? 1 : -1,
    state: 'ON_TOWER',
    mode: 'WALK',            // WALK | PREP_PROTECT | PROTECT | PREP_ATTACK | ATTACK
    t: 0,
    cooldown: 60,
    heat: 0,
    x: 0, y: 0, vy: 0, rot: 0, deathT: 0, landObs: null, landRel: 0
  });
  goldKnightTalk('spot', '"A golden knight! Grab it when its guard is down!"', 200);
}

function goldKnightBusy(g) { return g.mode !== 'WALK'; }

function goldKnightSwordAngle(g) {
  // ATTACK: swing from behind the back, over the head, down in front
  const p = Math.min(1, g.t / GK_ATTACK_FRAMES);
  return -Math.PI * 0.95 + p * Math.PI * 1.05;
}

function updateGoldKnights(worldShift) {
  const gY = height - groundHeight;
  for (let i = goldKnights.length - 1; i >= 0; i--) {
    const g = goldKnights[i];

    if (g.state === 'ON_TOWER') {
      const obs = g.obsRef;
      if (!obs || obs.x + obs.width < -80) { goldKnights.splice(i, 1); continue; }
      const kx = obs.x + g.relX + 11, ky = obs.bottomY - 18;
      const dx = dragon.x - kx;

      if (fireTouching(obs, kx, ky)) { g.heat = Math.min(1, g.heat + 0.04); heatSmoke(kx, ky - 22, 0.35); }
      else g.heat = Math.max(0, g.heat - 0.08);

      // invincible (Khaleesi riding): even a gold knight is knocked off its tower on touch
      if (khaleesiMounted && state === 'PLAYING' && Math.hypot(dragon.x - kx, dragon.y - (ky - 6)) < dragon.size / 2 + 18) {
        g.state = 'FALLING'; g.x = kx; g.y = ky; g.vy = -5; g.rot = 0;
        sound.knightHit();
        continue;
      }

      if (g.cooldown > 0) g.cooldown--;
      g.t++;
      switch (g.mode) {
        case 'WALK':
          g.relX += g.direction * 0.3;
          if (g.relX < 6) { g.relX = 6; g.direction = 1; }
          if (g.relX > obs.width - 30) { g.relX = obs.width - 30; g.direction = -1; }
          if (g.cooldown <= 0 && Math.abs(dx) < GK_TRIGGER_RANGE && dragon.x < kx + 60) {
            // fixed order: sword swing first, shield second, then a charge, and repeat
            g.direction = dx >= 0 ? 1 : -1;
            g.mode = 'PREP_' + GK_ACTION_ORDER[(g.actionIdx || 0) % GK_ACTION_ORDER.length];
            g.actionIdx = (g.actionIdx || 0) + 1;
            g.t = 0;
          }
          break;
        case 'PREP_PROTECT':
          if (g.t >= GK_PREP_FRAMES) { g.mode = 'PROTECT'; g.t = 0; }
          break;
        case 'PREP_ATTACK':
          g.direction = dx >= 0 ? 1 : -1;
          if (g.t >= GK_PREP_FRAMES) { g.mode = 'ATTACK'; g.t = 0; g.blocked = false; sound.whoosh(); }
          break;
        case 'PREP_CHARGE':
          g.direction = dx >= 0 ? 1 : -1;
          if (g.t % 6 === 0) particles.push({ x: kx - g.direction * 10, y: obs.bottomY - 2, vx: -g.direction * (1 + Math.random()), vy: -0.6, size: 3 + Math.random() * 3, life: 20, color: 'rgba(150,140,120,0.7)', isSmoke: true });
          if (g.t >= GK_CHARGE_PREP_FRAMES) { g.mode = 'CHARGE'; g.t = 0; g.blocked = false; sound.whoosh(); }
          break;
        case 'PROTECT':
          if (g.t >= GK_PROTECT_FRAMES) { g.mode = 'WALK'; g.t = 0; g.cooldown = GK_COOLDOWN; }
          break;
        case 'ATTACK': {
          // the blade hurts the dragon anywhere along its arc
          const a = goldKnightSwordAngle(g);
          const hx = kx + g.direction * 2, hy = ky - 14;
          const dirX = Math.cos(a) * g.direction, dirY = Math.sin(a);
          for (let s = 10; s <= GK_SWORD_LEN; s += 8) {
            if (!khaleesiMounted && Math.hypot(dragon.x - (hx + dirX * s), dragon.y - (hy + dirY * s)) < dragon.size / 2 - 2) {
              if (dragonShielded()) { if (!g.blocked) { g.blocked = true; shieldDeflect(hx + dirX * s, hy + dirY * s); } }
              else triggerHit();
              break;
            }
          }
          if (g.t >= GK_ATTACK_FRAMES) { g.mode = 'WALK'; g.t = 0; g.cooldown = GK_COOLDOWN; }
          break;
        }
        case 'CHARGE': {
          // sprint along the tower top with the sword thrust forward
          g.relX += g.direction * GK_CHARGE_SPEED;
          let stop = g.t >= GK_CHARGE_FRAMES;
          if (g.relX < 6) { g.relX = 6; stop = true; }
          if (g.relX > obs.width - 30) { g.relX = obs.width - 30; stop = true; }
          if (g.t % 3 === 0) particles.push({ x: kx - g.direction * 8, y: obs.bottomY - 2, vx: -g.direction * 1.5, vy: -0.5, size: 3 + Math.random() * 3, life: 18, color: 'rgba(150,140,120,0.7)', isSmoke: true });
          const hx = kx + g.direction * 4, hy = ky - 10;
          for (let s = 8; s <= GK_SWORD_LEN; s += 8) {
            const px = hx + g.direction * s, py = hy - s * 0.1;
            if (!khaleesiMounted && Math.hypot(dragon.x - px, dragon.y - py) < dragon.size / 2) {
              if (dragonShielded()) {
                if (!g.blocked) { g.blocked = true; shieldDeflect(px, py); g.relX -= g.direction * 14; stop = true; }
              } else triggerHit();
              break;
            }
          }
          if (stop) { g.mode = 'WALK'; g.t = 0; g.cooldown = GK_COOLDOWN; }
          break;
        }
      }

      // grab: only while it is not winding up or performing an action
      if (!goldKnightBusy(g) && state === 'PLAYING' && Math.hypot(dragon.x - kx, dragon.y - (ky - 6)) < dragon.size / 2 + 16) {
        g.state = 'CARRIED';
        g.t = 0;
        goldShield.held = true;
        goldShield.drop = null;
        sound.powerup();
        floatingTexts.push({ x: dragon.x - 30, y: dragon.y - 40, text: 'GOLD SHIELD!', color: '#f1c40f', alpha: 1.0, vy: -1.2 });
        goldKnightTalk('shield', '"That golden shield protects you, Syraxx! Arrows and spears can\'t hurt you now!"', 260);
      }
    } else if (g.state === 'CARRIED') {
      g.t++;
      g.x = dragon.x;
      g.y = dragon.y + 34;
      if (g.t >= GK_CARRY_FRAMES) { g.state = 'FALLING'; g.vy = 1; g.rot = 0; }
    } else if (g.state === 'FALLING') {
      const prevY = g.y;
      g.x -= worldShift;
      g.vy += 0.42;
      g.y += g.vy;
      g.rot += 0.08;
      let landed = g.y >= gY - 4;
      let landY = gY - 4;
      for (let o = 0; o < obstacles.length && !landed; o++) {
        const obs = obstacles[o];
        if (g.x > obs.x && g.x < obs.x + obs.width && prevY <= obs.bottomY && g.y >= obs.bottomY) { landed = true; landY = obs.bottomY; g.landObs = obs; g.landRel = g.x - obs.x; }
      }
      if (landed) {
        g.y = landY;
        g.state = 'DEAD';
        g.deathT = 0;
        sound.towerDestroy();
        const r = addScore(GK_POINTS);
        floatingTexts.push({ x: g.x - 30, y: landY - 30, text: 'GOLD KNIGHT! +' + r.totalPts, color: '#f1c40f', alpha: 1.0, vy: -1.4 });
        for (let p = 0; p < 18; p++) {
          particles.push({ x: g.x, y: landY - 6, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6, size: 2 + Math.random() * 3, life: 30, color: Math.random() < 0.6 ? '#f1c40f' : '#ffffff' });
        }
      }
    } else if (g.state === 'DEAD') {
      g.deathT++;
      if (g.landObs) g.x = g.landObs.x + g.landRel; else g.x -= worldShift;
      if (g.x < -80) goldKnights.splice(i, 1);
    }
  }
}

// The gold knight drawn in a 22 x 44 box (feet at y = 26), facing right, shield optional.
function drawGoldKnightFigure(g, withShield) {
  const heat = g.heat || 0;
  const gold = lerpColor('#f4c430', '#ff6a2a', heat);
  const goldDark = lerpColor('#a87a10', '#9e2a0e', heat);
  const goldLight = lerpColor('#fff1a8', '#ffd2a0', heat);
  const out = '#2a1c05';
  const crouch = g.mode === 'PROTECT' ? 6 : 0;
  const charging = g.mode === 'CHARGE' && g.state === 'ON_TOWER';
  const walk = g.state !== 'ON_TOWER' ? 0 : (charging ? Math.sin(Date.now() / 55) * 3 : (g.mode === 'WALK' ? Math.sin(Date.now() / 180 + g.relX) * 1.4 : 0));

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(11, 26, 12, 2.6, 0, 0, Math.PI * 2); ctx.fill();

  ctx.save();
  ctx.translate(0, crouch);
  // legs
  ctx.fillStyle = out; ctx.fillRect(5 - walk, 12, 6, 14 - crouch); ctx.fillRect(12 + walk, 12, 6, 14 - crouch);
  ctx.fillStyle = goldDark; ctx.fillRect(6 - walk, 13, 4, 12 - crouch);
  ctx.fillStyle = gold; ctx.fillRect(13 + walk, 13, 4, 12 - crouch);
  // body: cuirass with engraved chevron
  ctx.fillStyle = out; ctx.fillRect(3, -4, 17, 18);
  ctx.fillStyle = gold; ctx.fillRect(4, -3, 15, 16);
  ctx.fillStyle = goldDark; ctx.fillRect(4, -3, 4, 16); ctx.fillRect(4, 10, 15, 2);
  ctx.fillStyle = goldLight; ctx.fillRect(13, -2, 3, 8);
  ctx.strokeStyle = goldDark; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(7, 1); ctx.lineTo(11.5, 5); ctx.lineTo(16, 1); ctx.stroke();
  // big pauldrons
  ctx.fillStyle = out; ctx.fillRect(1, -6, 7, 6); ctx.fillRect(15, -6, 7, 6);
  ctx.fillStyle = goldLight; ctx.fillRect(2, -5, 5, 4); ctx.fillRect(16, -5, 5, 4);
  // helm with crest
  ctx.fillStyle = out; ctx.fillRect(5, -18, 13, 13);
  ctx.fillStyle = gold; ctx.fillRect(6, -17, 11, 11);
  ctx.fillStyle = goldDark; ctx.fillRect(6, -17, 3, 11);
  ctx.fillStyle = goldLight; ctx.fillRect(13, -16, 2, 5);
  ctx.fillStyle = '#120c02'; ctx.fillRect(10, -13, 7, 2); ctx.fillRect(13, -11, 2, 3);
  ctx.fillStyle = '#e8e8e8'; ctx.fillRect(9, -23, 5, 6); ctx.fillRect(6, -22, 4, 3);
  ctx.restore();

  if (withShield) drawGoldShieldShape(g, gold, goldDark, goldLight, out, crouch);
}

function drawGoldShieldShape(g, gold, goldDark, goldLight, out, crouch) {
  // shield position depends on the action
  let sx = 15, sy = 4, rot = 0, glow = 0;
  if (g.mode === 'PREP_PROTECT') { sx = 17; sy = -6; glow = 0.5 + 0.5 * Math.sin(Date.now() / 60); }
  else if (g.mode === 'PROTECT') { sx = 11; sy = -16 + crouch; rot = -Math.PI / 2; }
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(rot);
  if (glow > 0) {
    const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 30);
    gl.addColorStop(0, 'rgba(255,240,150,' + (0.7 * glow) + ')');
    gl.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(-30, -30, 60, 60);
  }
  // large kite shield
  const shape = () => {
    ctx.beginPath();
    ctx.moveTo(-9, -13); ctx.lineTo(9, -13); ctx.lineTo(9, 2);
    ctx.quadraticCurveTo(8, 12, 0, 18); ctx.quadraticCurveTo(-8, 12, -9, 2); ctx.closePath();
  };
  shape(); ctx.fillStyle = out; ctx.lineWidth = 3; ctx.strokeStyle = out; ctx.stroke();
  shape(); ctx.fillStyle = gold; ctx.fill();
  ctx.fillStyle = goldDark; ctx.fillRect(-9, -13, 4, 15);
  ctx.fillStyle = goldLight; ctx.fillRect(2, -11, 3, 10);
  ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = goldLight; ctx.fillRect(-0.6, -11, 1.2, 26); ctx.fillRect(-7, -0.6, 14, 1.2);
  ctx.restore();
}

function drawGoldKnightSword(g, kx0, ky0) {
  // two-handed greatsword, drawn in world space
  const crouch = g.mode === 'PROTECT' ? 6 : 0;
  const hx = kx0 + 11 + g.direction * 4, hy = ky0 + 8 + crouch;
  let a, glow = 0;
  if (g.mode === 'ATTACK') a = goldKnightSwordAngle(g);
  else if (g.mode === 'PREP_ATTACK') { a = -0.15; glow = 0.5 + 0.5 * Math.sin(Date.now() / 60); }
  else if (g.mode === 'PREP_CHARGE') { a = 0.12; glow = 0.5 + 0.5 * Math.sin(Date.now() / 45); }
  else if (g.mode === 'CHARGE') a = -0.1;
  else if (g.mode === 'PROTECT' || g.mode === 'PREP_PROTECT') a = 0.44;   // sword lowered, tip resting at its feet
  else a = -Math.PI * 0.62;                                                         // resting on the shoulder
  const dirX = Math.cos(a) * g.direction, dirY = Math.sin(a);
  const tipX = hx + dirX * GK_SWORD_LEN, tipY = hy + dirY * GK_SWORD_LEN;
  if (glow > 0) {
    ctx.strokeStyle = 'rgba(255,240,150,' + (0.5 * glow) + ')';
    ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(hx + dirX * 8, hy + dirY * 8); ctx.lineTo(tipX, tipY); ctx.stroke();
  }
  if (g.mode === 'ATTACK') {
    // motion trail along the arc
    ctx.strokeStyle = 'rgba(255,230,140,0.35)';
    ctx.lineWidth = 6;
    ctx.beginPath();
    const a0 = -Math.PI * 0.95, steps = 8;
    for (let s = 0; s <= steps; s++) {
      const aa = a0 + (a - a0) * (s / steps);
      const px = hx + Math.cos(aa) * g.direction * (GK_SWORD_LEN - 4), py = hy + Math.sin(aa) * (GK_SWORD_LEN - 4);
      if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.strokeStyle = '#2a1c05'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(hx + dirX * 6, hy + dirY * 6); ctx.lineTo(tipX, tipY); ctx.stroke();
  ctx.strokeStyle = '#f7d65a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx + dirX * 6, hy + dirY * 6); ctx.lineTo(tipX, tipY); ctx.stroke();
  ctx.strokeStyle = '#fff6c8'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(hx + dirX * 8, hy + dirY * 8 - 1); ctx.lineTo(tipX, tipY - 1); ctx.stroke();
  // crossguard + grip
  const px = -dirY, py = dirX;
  ctx.strokeStyle = '#a87a10'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx + dirX * 6 + px * 6, hy + dirY * 6 + py * 6); ctx.lineTo(hx + dirX * 6 - px * 6, hy + dirY * 6 - py * 6); ctx.stroke();
  ctx.strokeStyle = '#5a3a1e'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(hx - dirX * 4, hy - dirY * 4); ctx.lineTo(hx + dirX * 5, hy + dirY * 5); ctx.stroke();
}

function drawGoldKnight(g) {
  if (g.state === 'ON_TOWER') {
    const obs = g.obsRef;
    const kx0 = obs.x + g.relX, ky0 = obs.bottomY - 26;
    if (g.heat > 0) {
      const gl = ctx.createRadialGradient(kx0 + 11, ky0, 2, kx0 + 11, ky0, 30);
      gl.addColorStop(0, 'rgba(255,110,40,' + (0.45 * g.heat) + ')');
      gl.addColorStop(1, 'rgba(255,110,40,0)');
      ctx.fillStyle = gl;
      ctx.fillRect(kx0 - 20, ky0 - 30, 62, 62);
    }
    if (g.mode === 'CHARGE') {
      ctx.strokeStyle = 'rgba(255,240,180,0.45)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        const ly = ky0 - 14 + i * 9, lx = kx0 + 11 - g.direction * (16 + (i % 2) * 8);
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - g.direction * (14 + i * 3), ly); ctx.stroke();
      }
    }
    withFacing(kx0, ky0, g.direction, () => {
      if (g.mode === 'CHARGE') { ctx.translate(11, 26); ctx.rotate(0.18); ctx.translate(-11, -26); }
      else if (g.mode === 'PREP_CHARGE') { ctx.translate(0, 3); }
      drawGoldKnightFigure(g, true);
    });
    drawGoldKnightSword(g, kx0, ky0);
  } else if (g.state === 'CARRIED' || g.state === 'FALLING') {
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.rotate(g.state === 'FALLING' ? g.rot : Math.sin(Date.now() / 90) * 0.2);
    ctx.translate(-11, -8);
    drawGoldKnightFigure(g, false);
    ctx.restore();
  } else if (g.state === 'DEAD') {
    ctx.save();
    ctx.translate(g.x, g.y - 6);
    ctx.rotate(Math.PI / 2);
    ctx.scale(0.8, 0.8);
    ctx.translate(-11, -10);
    ctx.globalAlpha = 0.9;
    drawGoldKnightFigure(g, false);
    ctx.restore();
  }
}

// =====================================================================
// GOLD SHIELD carried by the dragon: blocks arrows, boulders, spears and swords until the next obstacle hit
// =====================================================================
function dragonShielded() { return goldShield.held; }

// Use instead of triggerHit() for tower/battlement collisions: the shield takes the blow.
function obstacleHit() {
  if (goldShield.held && !khaleesiMounted) {
    if (invulnerableTimer > 0) return;
    goldShield.held = false;
    goldShield.drop = { x: dragon.x + 30, y: dragon.y + 6, vx: -2, vy: -3, rot: 0 };
    invulnerableTimer = 50;
    sound.knightHit();
    floatingTexts.push({ x: dragon.x - 30, y: dragon.y - 36, text: 'SHIELD LOST', color: '#f1c40f', alpha: 1.0, vy: -1.2 });
    return;
  }
  triggerHit();
}

function shieldBlockSpark(x, y) {
  for (let p = 0; p < 8; p++) {
    particles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, size: 2 + Math.random() * 2, life: 16, color: Math.random() < 0.5 ? '#fff6c8' : '#f1c40f' });
  }
}

function drawGoldShieldOnDragon() {
  drawClangFX();
  // the held shield is drawn by drawDragon(); this only animates a dropped one
  const out = '#2a1c05';
  const d = goldShield.drop;
  if (d) {
    d.vy += 0.35; d.x += d.vx; d.y += d.vy; d.rot += 0.15;
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.translate(-15, -4);
    drawGoldShieldShape({ mode: 'WALK' }, '#f4c430', '#a87a10', '#fff1a8', out, 0);
    ctx.restore();
    if (d.y > height + 40) goldShield.drop = null;
  }
}

// ---------------------------------------------------------------------
// Shield deflections: clang sound + starburst flash + sparks
// ---------------------------------------------------------------------
const clangFX = [];

function playShieldClang() {
  if (sound.muted) return;
  try {
    sound.init();
    const ac = sound.ctx, t = ac.currentTime;
    // bright metallic ring: a few inharmonic partials with a fast decay
    [[1250, 'triangle', 0.18], [1890, 'sine', 0.10], [2730, 'sine', 0.06], [420, 'square', 0.05]].forEach((p, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = p[1];
      o.frequency.setValueAtTime(p[0], t);
      o.frequency.exponentialRampToValueAtTime(p[0] * 0.94, t + 0.4);
      g.gain.setValueAtTime(p[2], t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (i === 3 ? 0.06 : 0.38 + i * 0.05));
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.5);
    });
  } catch (e) {}
}

function shieldDeflect(x, y) {
  playShieldClang();
  shieldBlockSpark(x, y);
  clangFX.push({ x: x, y: y, t: 0 });
}

function drawClangFX() {
  for (let i = clangFX.length - 1; i >= 0; i--) {
    const f = clangFX[i];
    f.t++;
    const p = f.t / 16;
    if (p >= 1) { clangFX.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = '#fff6c8';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, 4 + p * 18, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    const len = 6 + p * 14;
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + Math.PI / 4;
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(a); ctx.fillRect(0, -1, len, 2); ctx.restore();
    }
    ctx.restore();
  }
}
</script>
<script>
// treasure.js — Treasure chests (open / locked / smashed treasure), the treasure score multiplier,
// and the per-frame hooks that run all the newer level extras (knights, chests, gold shield).
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

let chests = [];
let carriedChest = null;
let treasureMult = 1;
let treasureMultTimer = 0;        // frames left on the treasure multiplier

const CHEST_SPAWN_CHANCE = 0.07;  // per tower
const CHEST_LOCKED_CHANCE = 0.45;
const CHEST_BREAK_HEIGHT = 0;     // minimum drop height to smash a locked chest (0 = any height)
const CHEST_AUTO_DROP = 150;      // one-tap control mode: frames before a carried chest falls on its own
const CHEST_FLASH_FRAMES = 60;    // ...and it flashes for this long before it goes
const OPEN_CHEST_BONUS = 1000, OPEN_CHEST_MULT = 5, OPEN_CHEST_SECS = 10;
const TREASURE_BONUS = 3000, TREASURE_MULT = 10, TREASURE_SECS = 12;
const CHEST_SCALE = 2.2;            // chests are drawn this much bigger than the base art
const CHEST_BASE_W = 24, CHEST_BASE_H = 18;
const CHEST_W = CHEST_BASE_W * CHEST_SCALE, CHEST_H = CHEST_BASE_H * CHEST_SCALE;

const FIRE_BTN_HTML = manualFireBtn.innerHTML;
let fireBtnShowsDrop = false;

function maybeSpawnChest(obs) {
  if (Math.random() > CHEST_SPAWN_CHANCE) return;
  chests.push({
    kind: Math.random() < CHEST_LOCKED_CHANCE ? 'LOCKED' : 'OPEN',
    place: 'TOWER',
    obsRef: obs, battRef: null,
    relX: obs.width * (0.2 + Math.random() * 0.6),
    x: 0, y: 0, vy: 0, dropY: 0, carryT: 0, gone: false
  });
}

function clearLevelExtras() {
  smallKnights = [];
  goldKnights = [];
  chests = [];
  carriedChest = null;
  goldShield.held = false;
  goldShield.drop = null;
  treasureMultTimer = 0;
  treasureMult = 1;
  setFireButtonDrop(false);
}

function setFireButtonDrop(on) {
  if (on === fireBtnShowsDrop) return;
  fireBtnShowsDrop = on;
  manualFireBtn.innerHTML = on ? 'DROP <span class="btn-symbol">📦</span>' : FIRE_BTN_HTML;
}

// multiplier applied on top of the Khaleesi combo inside addScore()
function treasureMultiplier() { return treasureMultTimer > 0 ? treasureMult : 1; }

function grantTreasure(bonus, mult, secs, x, y, label) {
  score += bonus;
  scoreDisplay.innerText = score;
  if (mult >= treasureMult || treasureMultTimer <= 0) treasureMult = mult;
  treasureMultTimer = Math.max(treasureMultTimer, secs * 60);
  sound.powerup();
  floatingTexts.push({ x: x - 40, y: y - 30, text: label + ' +' + bonus + '  ' + mult + 'x!', color: '#f1c40f', alpha: 1.0, vy: -1.3 });
  showTreasureFX(label + '!', '+' + bonus + '   ' + mult + 'x POINTS');
  for (let p = 0; p < 26; p++) {
    particles.push({ x: x, y: y - 8, vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 7, size: 2 + Math.random() * 3, life: 35, color: Math.random() < 0.7 ? '#f1c40f' : '#ffffff' });
  }
}

// Fire button / tap while holding a chest. Returns true when the press was used up by the chest.
function chestHandlesFire() {
  if (!carriedChest) return false;
  if (isFlapLockActive) dropCarriedChest();   // separate fire button: FIRE becomes DROP
  return true;                                // one-tap mode: no fire while carrying; it drops on a timer
}

function chestBreakBurst(c) {
  sound.towerDestroy();
