<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Dragon Conqueror</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b1a">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b1a;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #0f0f2d;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .score-display {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      text-shadow: 3px 3px 0px #000, -2px -2px 0px #000;
      pointer-events: none;
      z-index: 10;
    }
    .hearts-display {
      position: absolute;
      top: 55px;
      right: 15px;
      font-size: 18px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 2px 2px 0 #000;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .level-progress-badge {
      position: absolute;
      top: 12px;
      right: 15px;
      width: 150px;
      height: 28px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #f1c40f;
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .level-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
      transition: width 0.1s linear;
      z-index: 1;
    }
    .level-progress-text {
      position: absolute;
      top: 0;
      right: 10px;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
      z-index: 2;
      letter-spacing: 1px;
    }
    .bottom-controls-bar {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
      z-index: 50;
    }
    .bottom-controls-bar.flipped {
      flex-direction: row-reverse;
    }
    .action-btn {
      background: rgba(16, 20, 30, 0.85);
      border: 2px solid #f1c40f;
      color: #fff;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      min-height: 52px;
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #8e44ad;
      touch-action: manipulation;
      white-space: nowrap;
      flex: 1;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .btn-symbol {
      font-size: 18px;
      line-height: 1;
    }
    .btn-symbol-large {
      font-family: 'Segoe UI Symbol', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }
    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8e44ad;
    }
    .action-btn.active {
      background: rgba(16, 20, 30, 0.85);
      border-color: #f1c40f;
      box-shadow: 0 4px 0 #8e44ad;
    }
.modal-btn {
      min-height: 60px !important;
      width: 100% !important;
      font-size: 16px !important;
      font-weight: 800 !important;
      padding: 0 16px !important;
      border-radius: 10px !important;
      touch-action: manipulation;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 60px;
      pointer-events: auto !important; /* Button ITSELF receives taps */
    }

    /* Target child elements (text/emojis inside the button) */
    .modal-btn * {
      pointer-events: none !important; /* Text inside won't block taps */
    }
    .fire-btn {
      background: #ff0000 !important;
      border-color: #ffffff !important;
      box-shadow: 0 4px 0 #990000 !important;
      color: #ffffff !important;
      text-shadow: 1px 1px 2px #000;
      flex: 0 0 28% !important;
      max-width: 28% !important;
      width: 28% !important;
    }
    .fire-btn:active {
      box-shadow: 0 2px 0 #990000 !important;
    }
    .sound-toggle-btn {
      max-width: 48px;
      min-width: 44px;
      height: 52px;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      flex: 0 0 auto;
    }
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: #11161d;
      border: 3px solid #f1c40f;
      border-radius: 12px;
      padding: 20px;
      width: 95%;
      max-width: 380px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #f1c40f;
      margin-bottom: 12px;
    }
    .save-code-box {
      background: #000;
      color: #2ecc71;
      font-size: 24px;
      letter-spacing: 4px;
      font-weight: bold;
      padding: 12px;
      border: 1px dashed #2ecc71;
      border-radius: 6px;
      margin: 14px 0;
      word-break: break-all;
      user-select: all;
      -webkit-user-select: all;
    }
    .save-input-box {
      width: 100%;
      background: #000;
      color: #f1c40f;
      font-size: 18px;
      letter-spacing: 3px;
      font-family: inherit;
      padding: 10px;
      border: 1px solid #f1c40f;
      border-radius: 6px;
      margin: 14px 0;
      text-align: center;
      text-transform: uppercase;
      user-select: text;
      -webkit-user-select: text;
    }
    #shareCanvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #f1c40f;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<!-- Level & Cutscene Audio Tracks -->
  <audio id="bgMusic" src="battleground_remastered.mp3" loop preload="auto"></audio>
  <audio id="uiMusic" src="EpicOrchestralFantasy.mp3" loop preload="auto"></audio>
  <audio id="cutsceneMusic" src="Dark Descent.mp3" loop preload="auto"></audio>

  <!-- Sound Effects Preload (Only existing files) -->
  <audio id="sfxBoost" src="wings_flap_large.flac" preload="auto"></audio>
  <audio id="sfxRockBreak" src="rock_breaking.flac" preload="auto"></audio>
  <audio id="sfxArrow" src="swish_3.wav" preload="auto"></audio>
  <audio id="sfxBoulder" src="cannon_01.ogg" preload="auto"></audio>

  <!-- Celebration Audio Elements -->
  <audio id="sfxFireworks" src="fw_loop.ogg" preload="auto"></audio>

  <!-- Royal Entrance Audio Elements -->
  <audio id="sfxQueenEntrance" src="lets_go_i_cant_stand_another_minute_here.ogg" preload="auto"></audio>
  <audio id="sfxKingEntrance" src="ogalaughter_2.ogg" preload="auto"></audio>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
   
    <div class="level-progress-badge">
      <div id="progressBarFill" class="level-progress-fill"></div>
      <div id="levelBadge" class="level-progress-text">LVL 1</div>
    </div>

    <div id="scoreDisplay" class="score-display">0</div>
    <div id="heartsDisplay" class="hearts-display">
      <div id="heartsText">❤️❤️❤️</div>
      <div id="headsText" style="font-size: 14px; color: #f1c40f; margin-top: 2px;">👑 0</div>
    </div>

    <div id="bottomControlsBar" class="bottom-controls-bar">
      <button id="manualFireBtn" class="action-btn fire-btn">FIRE <span class="btn-symbol">🔥</span></button>
      <button id="toggleFireModeBtn" class="action-btn active">MODE <span class="btn-symbol-large">🔄</span></button>
      <button id="pauseBtn" class="action-btn">PAUSE <span class="btn-symbol">⏸</span></button>
      <button id="soundBtn" class="action-btn sound-toggle-btn">🔊</button>
    </div>

<div id="pauseModal" class="modal-overlay" style="display: none;">
      <div class="modal-box" style="max-width: 420px; padding: 24px;">
        <div class="modal-title" style="font-size: 24px; margin-bottom: 16px;">GAME PAUSED</div>
        
        <!-- MAIN PAUSE MENU VIEW -->
        <div id="pauseMainView" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
          <button id="resumeBtn" class="action-btn modal-btn" style="background: #2ecc71; border-color: #fff; box-shadow: 0 4px 0 #27ae60;">RESUME ▶️</button>
          <button id="saveGameBtn" class="action-btn modal-btn" style="background: #3498db; border-color: #fff; box-shadow: 0 4px 0 #2980b9;">SAVE GAME 💾</button>
        </div>

        <!-- SAVE CODE SUB-VIEW -->
        <div id="pauseSaveView" style="display: none; flex-direction: column; gap: 12px; width: 100%;">
          <p style="font-size: 13px; color: #ccc; margin-bottom: 2px;">Your save code:</p>
          <div id="saveCodeDisplay" class="save-code-box" style="font-size: 22px; padding: 12px; margin-bottom: 8px;">-------</div>
          <button id="copyCodeBtn" class="action-btn modal-btn">COPY SAVE CODE 📋</button>
          <button id="closeSaveModalBtn" class="action-btn modal-btn" style="background: #e74c3c; border-color: #fff; box-shadow: 0 4px 0 #c0392b;">RETURN ↩️</button>
        </div>
      </div>
    </div>

   <div id="shareModal" class="modal-overlay" style="display: none;">
  <div class="modal-box" style="max-width: 420px; padding: 24px;">
    <div class="modal-title" style="font-size: 24px; margin-bottom: 16px;">SHARE VICTORY POST</div>
    
    <canvas id="shareCanvas" width="800" height="800" style="width: 100%; height: auto; border-radius: 8px; margin-bottom: 16px; border: 2px solid #f1c40f;"></canvas>
    
    <!-- Stacked full-width touch buttons -->
    <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
    <button id="downloadShareBtn" class="action-btn modal-btn" style="background: #005496; border-color: #fff; box-shadow: 0 4px 0 #27ae60;"><span style="pointer-events: none;">DOWNLOAD PHOTO 📸</span></button>
<button id="closeShareModalBtn" class="action-btn modal-btn" style="background: #2ecc71; border-color: #fff; box-shadow: 0 4px 0 #27ae60;"><span style="pointer-events: none;">RETURN</span></button>
    </div>
  </div>
</div>

   <!-- LOAD MODAL (Matching Pause Modal styling) -->
<div id="loadModal" class="modal-overlay" style="display: none;">
  <div class="modal-box" style="max-width: 420px; padding: 24px;">
    <div class="modal-title" style="font-size: 24px; margin-bottom: 16px;">LOAD GAME</div>
    
    <p style="font-size: 13px; color: #ccc; margin-bottom: 8px;">Enter your 7-character save code:</p>
    <input type="text" id="loadCodeInput" maxlength="7" placeholder="e.g. 0300011" style="width: 100%; padding: 12px; font-size: 18px; text-align: center; font-family: monospace; font-weight: bold; border-radius: 8px; border: 2px solid #f1c40f; background: rgba(0,0,0,0.5); color: #fff; text-transform: uppercase; margin-bottom: 20px; box-sizing: border-box;">
    
    <!-- Stacked modal buttons -->
    <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
      <button id="confirmLoadBtn" class="action-btn modal-btn" style="background: #005496; border-color: #fff; box-shadow: 0 4px 0 #27ae60;"><span style="pointer-events: none;">LOAD SAVE </span></button>
<button id="closeLoadModalBtn" class="action-btn modal-btn" style="background: #2ecc71; border-color: #fff; box-shadow: 0 4px 0 #27ae60;"><span style="pointer-events: none;">RETURN</span></button>
    </div>
  </div>
</div>
  </div>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function createFallbackCanvas(width, height, color, label) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const x = c.getContext('2d');
      x.fillStyle = color;
      x.fillRect(0, 0, width, height);
      x.fillStyle = '#ffffff';
      x.font = 'bold 12px sans-serif';
      x.textAlign = 'center';
      x.fillText(label, width / 2, height / 2);
      const img = new Image();
      img.src = c.toDataURL();
      return img;
    }

    const bgMusicAudio = document.getElementById('bgMusic');
    const uiMusicAudio = document.getElementById('uiMusic');
    const cutsceneMusicAudio = document.getElementById('cutsceneMusic');

    const sfxBoost = document.getElementById('sfxBoost');
    const sfxRockBreak = document.getElementById('sfxRockBreak');
    const sfxArrow = document.getElementById('sfxArrow');
    const sfxBoulder = document.getElementById('sfxBoulder');
    const sfxQueenEntrance = document.getElementById('sfxQueenEntrance');
    const sfxKingEntrance = document.getElementById('sfxKingEntrance');
    const sfxFireworks = document.getElementById('sfxFireworks');

    bgMusicAudio.volume = 0.25;
    uiMusicAudio.volume = 0.25;
    cutsceneMusicAudio.volume = 0.25;

    const khaleesiFrame1 = new Image(); khaleesiFrame1.src = './khaleesi1.png';
    const khaleesiFrame2 = new Image(); khaleesiFrame2.src = './khaleesi2.png';
    const kingFrame1 = new Image(); kingFrame1.src = './king1.png';
    const kingFrame2 = new Image(); kingFrame2.src = './king2.png';
    const queenFrame1 = new Image(); queenFrame1.src = './queen1.png';
    const queenFrame2 = new Image(); queenFrame2.src = './queen2.png';
    const kheadImg = new Image(); kheadImg.src = './khead.png';
    const qheadImg = new Image(); qheadImg.src = './qhead.png';

    const kingFallback1 = createFallbackCanvas(160, 160, '#2c3e50', 'KING 1');
    const kingFallback2 = createFallbackCanvas(160, 160, '#34495e', 'KING 2');
    const queenFallback1 = createFallbackCanvas(160, 160, '#8e44ad', 'QUEEN 1');
    const queenFallback2 = createFallbackCanvas(160, 160, '#9b59b6', 'QUEEN 2');
    const kheadFallback = createFallbackCanvas(160, 160, '#d35400', 'KING HEAD');
    const qheadFallback = createFallbackCanvas(160, 160, '#c0392b', 'QUEEN HEAD');

    const fullStoryText = [
      '"My beloved Syraxx, I have been',
      'captured by the slavers. Burn',
      'their castle to the ground and',
      'find me. You are my heart',
      'and soul. BREAK THE WHEEL!"'
    ];
    let totalCharCount = fullStoryText.join('\n').length;
    let typedCharIndex = 0;
    let textTypingComplete = false;

    let khaleesiBannerTimer = 0;
    let khaleesiBannerText = "";

    let currentLevel = 1;
    let levelTimerSeconds = 0;
    const LEVEL_DURATIONS = {
      1: 90,
      2: 180,
      3: 300
    };

    let level2KhaleesiSpawned = false;
    let level2RoyalSpawned = false;

    let celebrationTimer = 0;
    let celebrationAngle = 0;
    let celebrationFadeAlpha = 0;

    const gameStats = {
      burnedTowers: 0,
      villagersKilled: 0,
      archersKilled: 0,
      trebuchetsDestroyed: 0,
      kingsBeheaded: 0,
      queensBeheaded: 0,
      khaleesiRescues: 0
    };

    function showKhaleesiBanner(text, duration = 200) {
      khaleesiBannerText = text;
      khaleesiBannerTimer = duration;
    }

    function updateLevelBadgeUI() {
      const progressBarFill = document.getElementById('progressBarFill');
      if (currentLevel > 3) {
        levelBadge.innerText = 'VICTORY!';
        if (progressBarFill) progressBarFill.style.width = '100%';
        return;
      }
      levelBadge.innerText = `LVL ${currentLevel}`;
      const maxSecs = LEVEL_DURATIONS[currentLevel] || 90;
      const progressPercent = Math.min(100, Math.max(0, (levelTimerSeconds / maxSecs) * 100));
      if (progressBarFill) {
        progressBarFill.style.width = `${progressPercent}%`;
      }
    }

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isBoostPlaying = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

playSoundEffect(audioElem, volume = 0.8) {
    if (this.muted) return;
    if (audioElem && audioElem.src) {
      try {
        audioElem.currentTime = 0;
        audioElem.volume = volume;
        audioElem.play().catch(() => {});
      } catch(e) {}
    }
  }
      stopRoyalSounds() {
        if (sfxQueenEntrance) {
          sfxQueenEntrance.pause();
          sfxQueenEntrance.currentTime = 0;
        }
        if (sfxKingEntrance) {
          sfxKingEntrance.pause();
          sfxKingEntrance.currentTime = 0;
        }
      }

      playFlapSound() {
        if (this.muted || this.isBoostPlaying) return;
        
        if (sfxBoost && sfxBoost.src) {
          this.isBoostPlaying = true;
          sfxBoost.currentTime = 0;
          sfxBoost.volume = 0.4;
          
          const handleEnded = () => {
            this.isBoostPlaying = false;
            sfxBoost.removeEventListener('ended', handleEnded);
          };
          
          sfxBoost.addEventListener('ended', handleEnded);
          
          sfxBoost.play().catch(() => {
            this.isBoostPlaying = false;
          });
        }
      }

      whoosh() {
        this.playFlapSound();
      }

      flap() {
        this.playFlapSound();
      }

      fireRoar() {
    if (this.muted) return;
    this.init();
    
    // Create a low frequency pitch sweep for the fire roar core
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'sawtooth';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // Pitch drop simulation (fire release crackle into low rumble)
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.35);
    
    // Volume envelope (quick attack, smooth decay)
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);
    
    osc.start();
    osc.stop(this.ctx.currentTime + 0.35);
}

      towerDestroy() {
        this.playSoundEffect(sfxRockBreak, 0.15);
      }

      boulderLaunch() {
        this.playSoundEffect(sfxBoulder, 0.8);
      }

      arrowLaunch() {
        this.playSoundEffect(sfxArrow, 0.8);
      }

      fireworks() {
        this.playSoundEffect(sfxFireworks, 0.8);
      }

score() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // High two-note chime (D5 -> A5)
    osc.frequency.setValueAtTime(587.33, this.ctx.currentTime);
    osc.frequency.setValueAtTime(880.00, this.ctx.currentTime + 0.08);
    
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    
    osc.start();
    osc.stop(this.ctx.currentTime + 0.2);
}

heartPickup() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // Ascending arpeggio chime (C5 -> E5 -> G5)
    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.06);
    osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.12);
    
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
    
    osc.start();
    osc.stop(this.ctx.currentTime + 0.28);
}

powerup() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // Rising pitch sweep
    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(950, this.ctx.currentTime + 0.22);
    
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
    
    osc.start();
    osc.stop(this.ctx.currentTime + 0.22);
}

hit() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // Low pitch impact drop
    osc.frequency.setValueAtTime(180, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.16);
    
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);
    
    osc.start();
    osc.stop(this.ctx.currentTime + 0.16);
}

knightHit() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // High metallic crunch
    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
    
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
    
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
}

    const CODE_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    
    function generateSaveCode() {
      const p = Math.min(score, 1295);
      const k = Math.min(gameStats.kingsBeheaded, 35);
      const q = Math.min(gameStats.queensBeheaded, 35);
      const v = Math.min(gameStats.villagersKilled, 1295);
      const lvl = Math.min(currentLevel, 3);

      const c1 = CODE_CHARS[Math.floor(p / 36)];
      const c2 = CODE_CHARS[p % 36];
      const c3 = CODE_CHARS[(k % 36)];
      const c4 = CODE_CHARS[(q % 36)];
      const c5 = CODE_CHARS[Math.floor(v / 36)];
      const c6 = CODE_CHARS[v % 36];
      const c7 = CODE_CHARS[lvl % 36];

      return `${c1}${c2}${c3}${c4}${c5}${c6}${c7}`;
    }

    function loadSaveCode(codeStr) {
      if (!codeStr || (codeStr.length !== 6 && codeStr.length !== 7)) return false;
      const clean = codeStr.toUpperCase();
      
      const val = (ch) => CODE_CHARS.indexOf(ch);

      const v1 = val(clean[0]), v2 = val(clean[1]);
      const v3 = val(clean[2]), v4 = val(clean[3]);
      const v5 = val(clean[4]), v6 = val(clean[5]);
      const v7 = clean.length === 7 ? val(clean[6]) : Math.min(3, Math.max(1, Math.floor((v1 * 36 + v2) / 1000) + 1));

      if (v1 === -1 || v2 === -1 || v3 === -1 || v4 === -1 || v5 === -1 || v6 === -1 || v7 === -1) return false;

      const savedScore = v1 * 36 + v2;
      const savedKings = v3;
      const savedQueens = v4;
      const savedVillagers = v5 * 36 + v6;
      const savedLvl = Math.max(1, Math.min(3, v7));

      resetGame();
      score = savedScore;
      currentLevel = savedLvl;
      levelTimerSeconds = 0;
      gameStats.kingsBeheaded = savedKings;
      gameStats.queensBeheaded = savedQueens;
      gameStats.villagersKilled = savedVillagers;
      gameStats.burnedTowers = Math.floor(savedScore / 25);

      royalHeads = savedKings + savedQueens;
      royalHeadTypes = [
        ...Array(savedKings).fill('KING'),
        ...Array(savedQueens).fill('QUEEN')
      ];

      updateLevelBadgeUI();
      scoreDisplay.innerText = score;
      updateHeartsDisplay();
      return true;
    }

    function spawnObstacle() {
      if (state === 'LEVEL_CELEBRATE') return;

      const prevObs = obstacles[obstacles.length - 1];
      
      let minGapDistance = 260;
      if (currentLevel === 1) minGapDistance = 380;
      else if (currentLevel === 2) minGapDistance = 320;

      if (prevObs && (width - prevObs.x) < (prevObs.baseWidth + minGapDistance)) {
        return;
      }

      const gY = height - groundHeight;
      const minGap = 250;
      const maxGap = 310;
      const gapHeight = Math.floor(Math.random() * (maxGap - minGap + 1)) + minGap;

      const minVisualTowerHeight = Math.max(30, lastSpawnedBattlementHeight);

      const minTop = 40;
      const maxTopFromGaps = Math.max(40, height - groundHeight - gapHeight - 40);
      const maxTopFromTowerHeight = Math.max(40, gY - gapHeight - minVisualTowerHeight);
      const finalMaxTop = Math.min(maxTopFromGaps, maxTopFromTowerHeight);
      
      const topHeight = Math.floor(Math.random() * (finalMaxTop - minTop + 1)) + minTop;

      let type = Math.random() < 0.2 ? 'mega' : (Math.random() < 0.5 ? 'wide' : 'normal');
      let obsWidth = type === 'wide' ? 140 : (type === 'mega' ? 560 : 80);

      const isLarge = obsWidth >= 120;
      const hasLargeArch = isLarge && Math.random() < 0.8;
      const hasRubble = Math.random() < 0.6;

      const newObs = {
        x: width,
        width: obsWidth,
        baseWidth: type === 'mega' ? 580 : (type === 'wide' ? 150 : 96),
        topHeight: topHeight,
        bottomY: topHeight + gapHeight,
        passed: false,
        type: type,
        surfaceFlames: [],
        hasLargeArch: hasLargeArch,
        hasRubble: hasRubble,

        burnFullTimer: 0,
        charProgress: 0,
        isCharred: false,
        topIsCharred: false,
        charredAwarded: false
      };

      obstacles.push(newObs);

      lastSpawnedBattlementHeight = 0;

      let hasBattlement = false;
      if (Math.random() < 0.50) {
        const towerVisualHeight = gY - newObs.bottomY;
        if (towerVisualHeight > 35) {
          hasBattlement = true;
          const heightMultiplier = 0.35 + Math.random() * 0.40;
          const battlementHeight = Math.max(35, Math.min(65, towerVisualHeight * heightMultiplier));
          lastSpawnedBattlementHeight = battlementHeight;
          const battlementWidth = minGapDistance + 40;

          const newBattlement = {
            x: width + obsWidth,
            width: battlementWidth,
            height: battlementHeight,
            topY: gY - battlementHeight,
            surfaceFlames: [],
            isCharred: false,
            isCrushed: false,
            charProgress: 0
          };

          battlements.push(newBattlement);

          if (currentLevel >= 3 && Math.random() < 0.85) {
            archers.push({
              battlementRef: newBattlement,
              relX: battlementWidth * (0.3 + Math.random() * 0.4),
              state: 'HIDDEN',
              timer: 0,
              cycleTimer: Math.floor(Math.random() * 120),
              isExposed: false,
              isFiring: false,
              hp: 1,
              destroyed: false,
              archerAwarded: false
            });
          }
        }
      }

      let hasKhaleesiOnTower = false;

      let allowKhaleesi = false;
      if (currentLevel === 2 && !level2KhaleesiSpawned && Math.random() < 0.15) {
        allowKhaleesi = true;
        level2KhaleesiSpawned = true;
      } else if (currentLevel >= 3 && Math.random() < 0.05) {
        allowKhaleesi = true;
      }

      if (allowKhaleesi && (height - groundHeight - newObs.bottomY) > 30) {
        hasKhaleesiOnTower = true;
        khaleesis.push({
          obsRef: newObs,
          relX: 10 + Math.random() * Math.max(10, obsWidth - 26),
          direction: Math.random() < 0.5 ? 1 : -1,
          rescued: false
        });
        showKhaleesiBanner('"I\'M HERE SYRAXX! COME TO ME!"', 200);
      }

      const heartChance = 0.10;
      if (Math.random() < heartChance) {
        const skyY = topHeight + (gapHeight / 2) + (Math.random() - 0.5) * (gapHeight * 0.4);
        collectableHearts.push({
          x: width + (obsWidth / 2),
          y: Math.max(50, Math.min(height - groundHeight - 50, skyY)),
          baseY: skyY,
          bobPhase: Math.random() * Math.PI * 2,
          radius: 18,
          collected: false
        });
      }

      if (currentLevel >= 2 && !hasBattlement && Math.random() < 0.35) {
        trebuchets.push({
          x: width + obsWidth + 40 + Math.random() * 80,
          shootCooldown: 80 + Math.random() * 60,
          armAngle: -0.4,
          isFiringAnim: false
        });
      }

      if (!hasKhaleesiOnTower && (height - groundHeight - newObs.bottomY) > 30) {
        let allowRoyal = false;
        if (currentLevel === 2 && !level2RoyalSpawned && Math.random() < 0.12) {
          allowRoyal = true;
          level2RoyalSpawned = true;
        } else if (currentLevel >= 3 && Math.random() < 0.04) {
          allowRoyal = true;
        }

        if (allowRoyal && !khaleesiMounted) {
          const isKing = Math.random() < 0.5;
          const royalType = isKing ? 'KING' : 'QUEEN';

          knights.push({
            obsRef: newObs,
            relX: 10 + Math.random() * Math.max(10, obsWidth - 36),
            direction: Math.random() < 0.5 ? 1 : -1,
            state: 'ALIVE',
            isRoyal: true,
            royalType: royalType,
            burnTimer: 0,
            knockbackVelocity: 0,
            stunTimer: 0,
            fallYOffset: 0,
            fallVelocityY: 0,
            rotation: 0,
            pointAwarded: false
          });

          if (isKing) {
            sound.kingEntrance();
          } else {

    function checkLevelDialogueClick(clientX, clientY) {
      if (state !== 'LEVEL_DIALOGUE') return false;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const pSize = 140;
      const pY = 120;
      const isIntroStyle = (levelDialogueType === 'INTRO' || levelDialogueType === 'LEVEL1_CLEAR');
      const statsBoxY = isIntroStyle ? (pY + pSize + 20) : (pY + pSize + 40);
      const statsBoxH = isIntroStyle ? 90 : 175;

      const btnW = 220;
      const btnH = 46;
      const btnX = (width - btnW) / 2;
      const btnY = statsBoxY + statsBoxH + 20;

      if (canvasX >= btnX && canvasX <= btnX + btnW && canvasY >= btnY && canvasY <= btnY + btnH) {
        if (levelDialogueType === 'VICTORY') {
          resetGame();
          state = 'PLAYING';
        } else {
          state = 'PLAYING';
          dragon.velocity = dragon.jump;
          dragon.wingState = 1.0;
          sound.flap();
        }
        return true;
      }
      return false;
    }

    function checkCutsceneReturnClick(clientX, clientY) {
      if (state !== 'CUTSCENE') return false;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const boxSize = 240;
      const bY = height / 2 - 80;
      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;
      const btnY = bY + boxSize + 45;

      if (canvasX >= btnX && canvasX <= btnX + btnW && canvasY >= btnY && canvasY <= btnY + btnH) {
        state = 'PLAYING';
        dragon.velocity = dragon.jump;
        dragon.wingState = 1.0;
        sound.flap();
        return true;
      }
      return false;
    }

    function checkPauseScreenClick(clickX, clickY) {
      if (state !== 'PAUSED') return false;

      const btnW = 200;
      const btnH = 40;
      const btnX = (width - btnW) / 2;

      const resumeBtnY = height / 2 - 90;
      const saveBtnY = resumeBtnY + 48;
      const loadBtnY = saveBtnY + 48;
      const flipBtnY = loadBtnY + 48;
      const shareBtnY = flipBtnY + 48;

      if (clickX >= btnX && clickX <= btnX + btnW) {
        if (clickY >= resumeBtnY && clickY <= resumeBtnY + btnH) {
          state = 'PLAYING';
          return true;
        }

        if (clickY >= saveBtnY && clickY <= saveBtnY + btnH) {
          saveGame();
          pauseModal.style.display = 'flex';
          return true;
        }

        if (clickY >= loadBtnY && clickY <= loadBtnY + btnH) {
          openLoadGameModal();
          return true;
        }

        if (clickY >= flipBtnY && clickY <= flipBtnY + btnH) {
          isControlFlipped = !isControlFlipped;
          bottomControlsBar.classList.toggle('flipped', isControlFlipped);
          return true;
        }

        if (clickY >= shareBtnY && clickY <= shareBtnY + btnH) {
          generateSharePostGraphic();
          return true;
        }
      }
      return false;
    }

    function checkGameOverClick(clickX, clickY) {
      if (state !== 'GAMEOVER') return false;

      if (noHeadContinuePopupTimer > 0) {
        noHeadContinuePopupTimer = 0;
        return true;
      }

      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;

      const continueBtnY = height / 2 - 40;
      const restartBtnY = continueBtnY + 54;
      const loadBtnY = restartBtnY + 54;

      if (clickX >= btnX && clickX <= btnX + btnW) {
        if (clickY >= continueBtnY && clickY <= continueBtnY + btnH) {
          if (royalHeads > 0 && headFadingIndex < 0) {
            headFadingIndex = royalHeads - 1;
            headFadeTimer = 35;
          } else if (royalHeads === 0) {
            noHeadContinuePopupTimer = 240;
          }
          return true;
        }

        if (clickY >= restartBtnY && clickY <= restartBtnY + btnH) {
          resetGame();
          state = 'PLAYING';
          return true;
        }

        if (clickY >= loadBtnY && clickY <= loadBtnY + btnH) {
          openLoadGameModal();
          return true;
        }
      }
      return false;
    }

    function handleActionPress(clientX, clientY) {
      sound.init();

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (clientX !== undefined) ? (clientX - rect.left) * scaleX : undefined;
      const clickY = (clientY !== undefined) ? (clientY - rect.top) * scaleY : undefined;

      if (state === 'LEVEL_DIALOGUE') {
        if (clientX !== undefined && clientY !== undefined) {
          checkLevelDialogueClick(clientX, clientY);
        }
        return;
      }

      if (state === 'CUTSCENE') {
        if (clientX !== undefined && clientY !== undefined) {
          checkCutsceneReturnClick(clientX, clientY);
        }
        return;
      }

      if (state === 'PAUSED') {
        if (clickX !== undefined && clickY !== undefined) {
          checkPauseScreenClick(clickX, clickY);
        }
        return;
      }

      if (state === 'SPLASH') {
        if (!textTypingComplete) {
          typedCharIndex = totalCharCount;
          textTypingComplete = true;
        } else {
          state = 'START';
        }
        return;
      }

      const btnW = 200;
      const btnX = (width - btnW) / 2;

      if (state === 'START') {
        const startBtnY = height / 2 - 10;
        const loadBtnY = startBtnY + 58;

        if (clickX !== undefined && clickY !== undefined && clickX >= btnX && clickX <= btnX + btnW) {
          if (clickY >= loadBtnY && clickY <= loadBtnY + 44) {
            openLoadGameModal();
            return;
          }
          if (clickY >= startBtnY && clickY <= startBtnY + 44) {
            resetGame();
            levelDialogueType = 'INTRO';
            state = 'LEVEL_DIALOGUE';
            return;
          }
        }
        resetGame();
        levelDialogueType = 'INTRO';
        state = 'LEVEL_DIALOGUE';
        return;
      }

      if (state === 'GAMEOVER') {
        if (clickX !== undefined && clickY !== undefined) {
          checkGameOverClick(clickX, clickY);
        }
        return;
      }

      if (state === 'PLAYING') {
        dragon.velocity = dragon.jump;
        dragon.wingState = 1.0;
        sound.flap();
        if (!isFlapLockActive) {
          shootFire();
        }
        isHoldingAction = true;
        holdTimer = 0;
      }
    }

    function handleActionRelease() {
      isHoldingAction = false;
      holdTimer = 0;
    }

    container.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      handleActionPress(touch.clientX, touch.clientY);
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
        handleActionRelease();
      }
    });

    container.addEventListener('touchcancel', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
        handleActionRelease();
      }
    });

    container.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
      handleActionPress(e.clientX, e.clientY);
    });

    container.addEventListener('mouseup', (e) => {

    });

  function isolateBtnTouch(btn, callback) {
      if (!btn) return; // Safeguard against null elements

      btn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
      }, { passive: true });
      
      btn.addEventListener('touchend', (e) => {
        e.stopPropagation();
      }, { passive: true });

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (typeof callback === 'function') callback(e);
      });
    }
// Modal & Control Button Registrations

    isolateBtnTouch(document.getElementById('closeSaveModalBtn'), () => {

      if (pauseMainView && pauseSaveView) {

    // COPY SAVE CODE button
    isolateBtnTouch(document.getElementById('copyCodeBtn'), () => {
      const saveCodeDisplay = document.getElementById('saveCodeDisplay');
      const copyCodeBtn = document.getElementById('copyCodeBtn');
      if (!saveCodeDisplay || !copyCodeBtn) return;

      const textToCopy = saveCodeDisplay.innerText.trim();
      if (!textToCopy || textToCopy === '-------') return;

      const setCopySuccessVisual = () => {
        const origText = copyCodeBtn.innerText;
        copyCodeBtn.innerText = 'COPIED!';
        copyCodeBtn.style.background = '#2ecc71';
        setTimeout(() => {
          copyCodeBtn.innerText = origText;
          copyCodeBtn.style.background = '';
        }, 1500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(setCopySuccessVisual).catch(() => {
          fallbackCopyText(textToCopy, setCopySuccessVisual);
        });
      } else {
        fallbackCopyText(textToCopy, setCopySuccessVisual);
      }
    });

    function fallbackCopyText(text, successCallback) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        if (successCallback) successCallback();
      } catch (err) {
        alert("Copy failed. Please manually select and copy: " + text);
      }
      document.body.removeChild(textArea);
    }

    isolateBtnTouch(downloadShareBtn, () => {
      if (!shareCanvas) return;

      shareCanvas.toBlob((blob) => {
        if (!blob) return;

        const blobUrl = URL.createObjectURL(blob);

        if (navigator.canShare && navigator.share) {
          const file = new File([blob], 'conqueror.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({
              files: [file],
              title: 'Flappy Dragon Conqueror',
              text: `I scored ${score} pts in Flappy Dragon Conqueror!`
            }).catch(() => {});
          }
        }

        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = blobUrl;
        downloadAnchor.download = 'conqueror.png';
        downloadAnchor.target = '_blank';
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

        setTimeout(() => {
          window.open(blobUrl, '_blank');
        }, 100);

        setTimeout(() => {
          URL.revokeObjectURL(blobUrl);
        }, 10000);
      }, 'image/png');
    });

    function drawNightSky() {
      const skyGradient = ctx.createLinearGradient(0, 0, 0, height);
      
      if (currentLevel === 1) {
        skyGradient.addColorStop(0, '#0a192f');
        skyGradient.addColorStop(0.7, '#1b3a4b');
        skyGradient.addColorStop(1, '#274c5e');
      } else if (currentLevel === 2) {
        skyGradient.addColorStop(0, '#0d0d26');
        skyGradient.addColorStop(0.7, '#241738');
        skyGradient.addColorStop(1, '#3a1c40');
      } else {
        skyGradient.addColorStop(0, '#2b0910');
        skyGradient.addColorStop(0.7, '#4a121a');
        skyGradient.addColorStop(1, '#66221c');
      }

      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
        if (state === 'PLAYING' || state === 'LEVEL_CELEBRATE') {
          s.x -= s.speed * (khaleesiMounted ? 2.2 : 1.0);
          if (s.x < 0) s.x = width;
        }
      });
      ctx.globalAlpha = 1.0;

    function drawMoon() {
      const moonX = width * 0.72;
      const moonY = height * 0.22;
      const baseMoonRadius = 54;

      const glow = ctx.createRadialGradient(moonX, moonY, baseMoonRadius * 0.6, moonX, moonY, baseMoonRadius * 2.8);
      glow.addColorStop(0, 'rgba(255, 243, 191, 0.55)');
      glow.addColorStop(0.5, 'rgba(255, 243, 191, 0.15)');
      glow.addColorStop(1, 'rgba(255, 243, 191, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, baseMoonRadius * 2.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fffae6';
      ctx.beginPath();
      ctx.arc(moonX, moonY, baseMoonRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#dcd4b8';
      const pixelCraterGrid = [
        { x: -26, y: -20, w: 8, h: 6 },
        { x: -18, y: -20, w: 4, h: 4 },
        { x: -22, y: -14, w: 6, h: 3 },
        { x: 14, y: -6, w: 10, h: 8 },
        { x: 24, y: -4, w: 4, h: 4 },
        { x: 18, y: 2, w: 6, h: 4 },
        { x: -16, y: 16, w: 12, h: 9 },
        { x: -19, y: 19, w: 3, h: 4 },
        { x: 20, y: 24, w: 6, h: 5 }
      ];

      pixelCraterGrid.forEach(p => {
        ctx.fillRect(moonX + p.x, moonY + p.y, p.w, p.h);
      });
    }

    function drawGiantClouds() {
      const cloudParallax = backgroundParallaxX * 0.15;
      const patternWidth = 1200;
      const startX = -(cloudParallax % patternWidth);

      ctx.fillStyle = 'rgba(200, 210, 240, 0.14)';

      for (let offset = startX - patternWidth; offset < width + patternWidth; offset += patternWidth) {
        ctx.save();
        ctx.translate(offset, 0);

        const cx1 = 120, cy1 = height * 0.16;
        ctx.beginPath();
        ctx.arc(cx1, cy1, 75, 0, Math.PI * 2);
        ctx.arc(cx1 + 75, cy1 - 20, 100, 0, Math.PI * 2);
        ctx.arc(cx1 + 175, cy1, 65, 0, Math.PI * 2);
        ctx.rect(cx1 - 40, cy1, 275, 50);
        ctx.fill();

        const cx2 = 550, cy2 = height * 0.28;
        ctx.beginPath();
        ctx.arc(cx2, cy2, 60, 0, Math.PI * 2);
        ctx.arc(cx2 + 75, cy2 - 15, 80, 0, Math.PI * 2);
        ctx.arc(cx2 + 160, cy2, 60, 0, Math.PI * 2);
        ctx.rect(cx2 - 20, cy2, 225, 45);
        ctx.fill();

        const cx3 = 900, cy3 = height * 0.09;
        ctx.beginPath();
        ctx.arc(cx3, cy3, 90, 0, Math.PI * 2);
        ctx.arc(cx3 + 100, cy3 - 30, 120, 0, Math.PI * 2);
        ctx.arc(cx3 + 225, cy3, 80, 0, Math.PI * 2);
        ctx.rect(cx3 - 50, cy3, 325, 60);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawParallaxCastleBackground() {
      const gY = height - groundHeight;
      const maxCastleH = height * 0.40;
      const baseY = gY;
      const darkGray = '#151b22';
      const highlightGray = '#1e2630';

      ctx.fillStyle = darkGray;

      const patternWidth = 600;
      const startX = -(backgroundParallaxX % patternWidth);

      for (let offset = startX - patternWidth; offset < width + patternWidth; offset += patternWidth) {
        ctx.save();
        ctx.translate(offset, 0);

        const t1X = 20, t1W = 50, t1H = maxCastleH;
        ctx.fillRect(t1X, baseY - t1H, t1W, t1H);
        ctx.beginPath();
        ctx.moveTo(t1X - 5, baseY - t1H);
        ctx.lineTo(t1X + t1W / 2, baseY - t1H - 35);
        ctx.lineTo(t1X + t1W + 5, baseY - t1H);
        ctx.closePath();
        ctx.fill();

        const w1X = 70, w1W = 120, w1H = maxCastleH * 0.65;
        ctx.fillRect(w1X, baseY - w1H, w1W, w1H);

        for (let bx = w1X; bx < w1X + w1W; bx += 16) {
          ctx.fillRect(bx, baseY - w1H - 8, 8, 8);
        }

        const t2X = 190, t2W = 110, t2H = maxCastleH * 0.88;
        ctx.fillRect(t2X, baseY - t2H, t2W, t2H);
        for (let bx = t2X; bx < t2X + t2W; bx += 18) {
          ctx.fillRect(bx, baseY - t2H - 10, 10, 10);
        }
        ctx.fillStyle = '#0a0d12';
        ctx.beginPath();
        ctx.arc(t2X + t2W / 2, baseY - 40, 24, Math.PI, 0);
        ctx.rect(t2X + t2W / 2 - 24, baseY - 40, 48, 40);
        ctx.fill();

        ctx.fillStyle = darkGray;

        const w2X = 300, w2W = 100, w2H = maxCastleH * 0.58;
        ctx.fillRect(w2X, baseY - w2H, w2W, w2H);
        for (let bx = w2X; bx < w2X + w2W; bx += 14) {
          ctx.fillRect(bx, baseY - w2H - 6, 7, 6);
        }

        const t3X = 400, t3W = 60, t3H = maxCastleH * 0.95;
        ctx.fillRect(t3X, baseY - t3H, t3W, t3H);
        ctx.beginPath();
        ctx.moveTo(t3X - 6, baseY - t3H);
        ctx.lineTo(t3X + t3W / 2, baseY - t3H - 40);
        ctx.lineTo(t3X + t3W + 6, baseY - t3H);
        ctx.closePath();
        ctx.fill();

        ctx.fillRect(460, baseY - maxCastleH * 0.45, 140, maxCastleH * 0.45);

        ctx.fillStyle = highlightGray;
        ctx.fillRect(t1X + 18, baseY - t1H + 30, 14, 24);
        ctx.fillRect(t2X + 25, baseY - t2H + 25, 16, 28);
        ctx.fillRect(t2X + 68, baseY - t2H + 25, 16, 28);
        ctx.fillRect(t3X + 22, baseY - t3H + 35, 16, 26);

        const drawPrettyYellowLight = (lx, ly) => {
          const glowRadius = 8 + Math.sin(Date.now() / 250 + lx) * 2;
          const radial = ctx.createRadialGradient(lx, ly, 1, lx, ly, glowRadius);
          radial.addColorStop(0, 'rgba(255, 234, 167, 0.9)');
          radial.addColorStop(0.5, 'rgba(253, 203, 110, 0.4)');
          radial.addColorStop(1, 'rgba(253, 203, 110, 0)');
          ctx.fillStyle = radial;
          ctx.beginPath();
          ctx.arc(lx, ly, glowRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffeaa7';
          ctx.fillRect(lx - 1.5, ly - 1.5, 3, 3);
        };

        drawPrettyYellowLight(t1X + 25, baseY - t1H + 15);
        drawPrettyYellowLight(w1X + 35, baseY - w1H + 20);
        drawPrettyYellowLight(w1X + 85, baseY - w1H + 20);
        drawPrettyYellowLight(t2X + 55, baseY - t2H + 12);
        drawPrettyYellowLight(w2X + 50, baseY - w2H + 18);
        drawPrettyYellowLight(t3X + 30, baseY - t3H + 18);
        drawPrettyYellowLight(530, baseY - maxCastleH * 0.45 + 16);

        ctx.restore();
      }
    }

    function drawGround() {
      const gY = height - groundHeight;
      const scrollSpeed = getLevelScrollSpeed();

      ctx.fillStyle = '#181e28';
      ctx.fillRect(0, gY, width, groundHeight);
      
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(0, gY, width, 8);
      ctx.fillStyle = '#2ecc71';
      for (let x = 0; x < width; x += 12) {
        ctx.fillRect(x, gY - 2, 6, 4);
      }

      const t = Date.now() / 150;
      groundFlames.forEach((gf) => {
        gf.x -= scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);
        gf.life--;

        const boostMult = gf.boostIntensity || 1.0;
        const flick = Math.sin(t * 2 + gf.x) * (4 * boostMult);

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(gf.x - 8 * boostMult, gY - (14 * boostMult) + flick, 16 * boostMult, 14 * boostMult);
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(gf.x - 5 * boostMult, gY - (10 * boostMult) + flick, 10 * boostMult, 10 * boostMult);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(gf.x - 2 * boostMult, gY - (6 * boostMult) + flick, 4 * boostMult, 6 * boostMult);

        if (gf.boostIntensity > 1.0) gf.boostIntensity *= 0.98;
      });

      groundFlames = groundFlames.filter(gf => gf.life > 0 && gf.x > -20);
    }

    function drawBattlements() {
      const gY = height - groundHeight;

      battlements.forEach(b => {
        const bX = b.x;
        const bY = gY - b.height;
        const bW = b.width;

        if (bW <= 0 || bX + bW < -40 || bX > width + 40) return;

        const useP = (b.isCrushed || b.isCharred) ? charPalette : stonePalette;

        ctx.fillStyle = useP.main;
        ctx.fillRect(bX, bY, bW, b.height);

        ctx.fillStyle = useP.dark;
        const bH = 12;
        const brickW = 20;
        for (let y = bY; y < gY; y += bH) {
          ctx.fillRect(bX, y, bW, 2);
          const offset = Math.floor(y / bH) % 2 * (brickW / 2);
          for (let x = bX + offset; x < bX + bW; x += brickW) {
            ctx.fillRect(x, y, 2, bH);
          }
        }

        ctx.fillStyle = useP.light;
        ctx.fillRect(bX, bY, bW, 3);

        const crenelW = 28;
        const crenelH = 20;
        const crenelGap = 16;
        const step = crenelW + crenelGap;

        for (let relX = 4; relX <= bW - crenelW - 4; relX += step) {
          const x = bX + relX;
          ctx.fillStyle = useP.main;
          ctx.fillRect(x, bY - crenelH, crenelW, crenelH);

          ctx.fillStyle = useP.light;
          ctx.fillRect(x, bY - crenelH, crenelW, 3);
          ctx.fillRect(x, bY - crenelH, 3, crenelH);

          ctx.fillStyle = useP.dark;
          ctx.fillRect(x + crenelW - 3, bY - crenelH, 3, crenelH);
        }
      });
    }

    function drawArchersAndArrows() {
      const gY = height - groundHeight;

      archers.forEach(a => {
        const b = a.battlementRef;
        if (!b || a.destroyed) return;

        const bX = b.x;
        const bY = gY - b.height;
        const archerX = bX + a.relX;

        if (archerX < -40 || (bX + b.width) < -40) {
          a.destroyed = true;
          return;
        }

        if (state === 'PLAYING') {
          a.timer++;
          a.cycleTimer++;

          switch (a.state) {
            case 'HIDDEN':
              a.isExposed = false;
              if (a.cycleTimer >= 220) {
                a.state = 'REVEALED';
                a.timer = 0;
                a.isExposed = true;
              }
              break;
            case 'REVEALED':
              a.isExposed = true;
              if (a.timer >= 50) {
                a.state = 'GLOWING';
                a.timer = 0;
              }
              break;
            case 'GLOWING':
              a.isExposed = true;
              if (a.timer >= 60) {
                a.state = 'HOLDING';
                a.timer = 0;
              }
              break;
            case 'HOLDING':
              a.isExposed = true;
              if (a.timer >= 25 && !a.isFiring) {
                a.isFiring = true;
                sound.arrowLaunch();

                const archerY = bY - 14;
                const dx = dragon.x - archerX;
                const dy = dragon.y - archerY;
                const dist = Math.hypot(dx, dy) || 1;
                const speed = 4.2;

                arrows.push({
                  x: archerX,
                  y: archerY,
                  vx: (dx / dist) * speed,
                  vy: (dy / dist) * speed,
                  angle: Math.atan2(dy, dx),
                  life: 180
                });
              }
              if (a.timer >= 35) {
                a.state = 'HIDDEN';
                a.timer = 0;
                a.cycleTimer = 0;
                a.isExposed = false;
                a.isFiring = false;
              }
              break;
          }
        }

        if (a.isExposed && !a.archerAwarded) {
          const archerY = bY - 14;

          flames.forEach(f => {
            if (Math.hypot(f.x - archerX, f.y - archerY) < 24) {
              a.destroyed = true;
              a.archerAwarded = true;
              gameStats.villagersKilled++;
              gameStats.archersKilled++;
              sound.knightHit();
              const scoreResult = addScore(20);
              floatingTexts.push({ x: archerX - 15, y: archerY - 20, text: 'ARCHER! +' + scoreResult.totalPts, color: '#f1c40f', alpha: 1.0, vy: -1.5 });
              
              for (let p = 0; p < 12; p++) {
                particles.push({
                  x: archerX,
                  y: archerY,
                  vx: (Math.random() - 0.5) * 8,
                  vy: (Math.random() - 0.5) * 8,
                  size: 3 + Math.random() * 3,
                  life: 25,
                  color: '#e74c3c'
                });
              }
            }
          });
        }

        if (a.destroyed) return;

        ctx.save();
        ctx.translate(archerX, bY - 14);

        if (a.isExposed) {
          if (a.state === 'REVEALED') {
            ctx.fillStyle = '#f8c291';
            ctx.fillRect(-4, -7, 8, 5);
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(-5, -2, 10, 10);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(-5, -12, 10, 5);

            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(-8, -2, 6, -Math.PI * 0.4, Math.PI * 0.4);
            ctx.stroke();
          } else if (a.state === 'GLOWING') {
            const glowFactor = Math.sin(Date.now() / 30) * 0.5 + 0.5;
            const radialGlow = ctx.createRadialGradient(0, -6, 2, 0, -6, 26);
            radialGlow.addColorStop(0, `rgba(241, 196, 15, ${0.4 + glowFactor * 0.4})`);
            radialGlow.addColorStop(1, 'rgba(241, 196, 15, 0)');
            ctx.fillStyle = radialGlow;
            ctx.beginPath();
            ctx.arc(0, -6, 26, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#f8c291';
            ctx.fillRect(-4, -7, 8, 5);
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(-5, -2, 10, 10);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(-5, -12, 10, 5);

            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(-6, -2, 9, -Math.PI * 0.4, Math.PI * 0.4);
            ctx.stroke();
            ctx.strokeStyle = '#ecf0f1';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-6, -9);
            ctx.lineTo(-6, 5);
            ctx.stroke();
          } else if (a.state === 'HOLDING') {
            ctx.fillStyle = '#f8c291';
            ctx.fillRect(-4, -7, 8, 5);
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(-5, -2, 10, 10);
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(-5, -12, 10, 5);

            ctx.strokeStyle = '#784e24';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(-6, -2, 8, -Math.PI * 0.4, Math.PI * 0.4);
            ctx.stroke();

            ctx.strokeStyle = '#ecf0f1';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(-6, -9);
            ctx.lineTo(-6, 5);
            ctx.stroke();
          }
        } else {
          ctx.translate(0, -10);
          ctx.fillStyle = '#27ae60';
          ctx.fillRect(-5, 0, 10, 5);
          ctx.fillRect(-3, -3, 6, 3);
        }

        ctx.restore();
      });

      archers = archers.filter(a => !a.destroyed);

      arrows.forEach(arr => {
        if (state === 'PLAYING') {
          arr.x += arr.vx;
          arr.y += arr.vy;
          arr.life--;

          const distToDragon = Math.hypot(dragon.x - arr.x, dragon.y - arr.y);
          if (distToDragon < dragon.size / 2 + 4) {
            if (!khaleesiMounted) {
              triggerHit();
            }
            arr.life = 0;
          }
        }

        ctx.save();
        ctx.translate(arr.x, arr.y);
        ctx.rotate(arr.angle);

        ctx.strokeStyle = '#784e24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(6, 0);
        ctx.stroke();

        ctx.fillStyle = '#bdc3c7';
        ctx.beginPath();
        ctx.moveTo(6, -3);
        ctx.lineTo(12, 0);
        ctx.lineTo(6, 3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-10, -2, 3, 4);

        ctx.restore();
      });

      arrows = arrows.filter(arr => arr.life > 0 && arr.x > -40 && arr.x < width + 40 && arr.y > -40 && arr.y < height + 40);
    }

    function drawKhaleesiSprite(kx, ky, scale = 1.0) {
      ctx.save();
      ctx.translate(kx, ky);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#f5f6fa';
      ctx.fillRect(-6, -16, 12, 10);
      ctx.fillRect(-8, -12, 16, 6);
      ctx.fillRect(-4, -6, 8, 12);

      ctx.fillStyle = '#f8c291';
      ctx.fillRect(-4, -12, 8, 8);

      ctx.fillStyle = '#0a3d62';
      ctx.fillRect(1, -10, 2, 2);

      ctx.fillStyle = '#4a69bd';
      ctx.fillRect(-5, -4, 10, 14);
      ctx.fillStyle = '#1e3799';
      ctx.fillRect(-6, 2, 12, 8);

      ctx.fillStyle = '#f6b93b';
      ctx.fillRect(-5, -1, 10, 2);

      ctx.restore();
    }

    function drawKhaleesis() {
      khaleesis.forEach(k => {
        if (k.rescued) return;
        const obs = k.obsRef;
        if (!obs || obs.x + obs.baseWidth < -50) return;

        if (state === 'PLAYING') {
          k.relX += k.direction * 0.15;
          if (k.relX < 4) { k.relX = 4; k.direction = 1; }
          if (k.relX > obs.width - 20) { k.relX = obs.width - 20; k.direction = -1; }

          const kx = obs.x + k.relX;
          const ky = obs.bottomY - 14;
          const dist = Math.hypot(dragon.x - kx, dragon.y - ky);

          if (dist < dragon.size / 2 + 18) {
            k.rescued = true;
            khaleesiMounted = true;
            khaleesiTimer = KHALEESI_MAX_TIME;
            gameStats.khaleesiRescues++;
            
            lives = 3;
            updateHeartsDisplay();
            const scoreResult = addScore(500);

            sound.powerup();

            floatingTexts.push({
              x: dragon.x - 30,
              y: dragon.y - 35,
              text: 'KHALEESI! +' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x Combo!)',
              color: '#f6b93b',
              alpha: 1.0,
              vy: -1.8
            });
          }
        }

        const kx = obs.x + k.relX;
        const ky = obs.bottomY - 14;

        const glowRadius = 18 + Math.sin(Date.now() / 120) * 4;
        const radial = ctx.createRadialGradient(kx, ky - 6, 2, kx, ky - 6, glowRadius);
        radial.addColorStop(0, 'rgba(246, 185, 59, 0.7)');
        radial.addColorStop(1, 'rgba(246, 185, 59, 0)');
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(kx, ky - 6, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        drawKhaleesiSprite(kx, ky);
      });

      khaleesis = khaleesis.filter(k => !k.rescued && k.obsRef && k.obsRef.x + k.obsRef.width > -50);
    }

    function renderMountedKhaleesiHUD() {
      const pSize = 64;
      const pX = 15;
      const pY = 15;

      const renderBubbleBelow = (textString, isMountedSubtitle = false) => {
        ctx.save();
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        
        const rawWords = textString.replace(/"/g, '').split(' ');
        const lines = [];
        let currentLine = '';
        const maxTextWidth = width * 0.76;

        for (let i = 0; i < rawWords.length; i++) {
          let testLine = currentLine ? (currentLine + ' ' + rawWords[i]) : rawWords[i];
          if (ctx.measureText(testLine).width > maxTextWidth && currentLine) {
            lines.push(currentLine);
            currentLine = rawWords[i];
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);

        let longestLineW = 0;
        lines.forEach(l => {
          const w = ctx.measureText(l).width;
          if (w > longestLineW) longestLineW = w;
        });

        const bPaddingX = 14;
        const bPaddingY = 10;
        const lineH = 20;
        const bW = Math.max(160, longestLineW + (bPaddingX * 2));
        const bH = (lines.length * lineH) + (bPaddingY * 2);

        const bX = Math.min(width - bW - 15, pX);
        const bY = pY + pSize + 14;

        ctx.fillStyle = '#ffffff';

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(bX, bY, bW, bH, 10);
        } else {
          ctx.fillRect(bX, bY, bW, bH);
        }
        ctx.fill();

        ctx.fillStyle = isMountedSubtitle ? '#d63031' : '#000000';
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        lines.forEach((l, idx) => {
          ctx.fillText(l, bX + (bW / 2), bY + bPaddingY + 14 + (idx * lineH));
        });

        ctx.restore();
      };

      if (khaleesiMounted) {
        const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, pSize, pSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, pSize, pSize);

        renderBubbleBelow('BREAK THE WHEEL!', true);
      } else if (khaleesiBannerTimer > 0) {
        khaleesiBannerTimer--;
        const activeFrame = (Math.floor(Date.now() / 300) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, pSize, pSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, pSize, pSize);

        renderBubbleBelow(khaleesiBannerText, false);
      }
    }

    function drawDragon(x, y, customPitch = null) {
      if (invulnerableTimer % 6 > 3) return;

      ctx.save();
      ctx.translate(x, y);
      const pitch = customPitch !== null ? customPitch : Math.min(Math.max(dragon.velocity * 0.05, -0.4), 0.6);
      ctx.rotate(pitch);
      const p = 2.6;

      const rainbowColors = ['#00d2d3', '#ff7675', '#f1c40f', '#2ecc71', '#a29bfe', '#ffffff'];
      const strobeColor = rainbowColors[Math.floor(Date.now() / 50) % rainbowColors.length];

      if (khaleesiMounted) {
        const auraRadius = 42 + Math.sin(Date.now() / 60) * 8;
        const aura = ctx.createRadialGradient(0, 0, 10, 0, 0, auraRadius);
        aura.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
        aura.addColorStop(0.5, strobeColor);
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, auraRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      const mainOrange = khaleesiMounted ? strobeColor : '#ff793f';
      const darkOrange = khaleesiMounted ? '#ffffff' : '#d63031';
      const bellyYellow = '#f1c40f';
      const spikeRed = '#c0392b';
      const hornCream = '#f5e6d3';

      const cyanWing = khaleesiMounted ? strobeColor : '#00d2d3';
      const navyBone = '#222f3e';

      ctx.fillStyle = darkOrange;
      ctx.fillRect(-12 * p, 1 * p, 4 * p, 3 * p);
      ctx.fillRect(-15 * p, -1 * p, 4 * p, 3 * p);
      ctx.fillStyle = spikeRed;
      ctx.fillRect(-10 * p, -3 * p, 2 * p, 3 * p);
      ctx.fillRect(-5 * p, -6 * p, 2 * p, 3 * p);

      ctx.fillStyle = darkOrange;
      ctx.fillRect(-7 * p, 5 * p, 4 * p, 4 * p);

      ctx.fillStyle = mainOrange;
      ctx.fillRect(-9 * p, -3 * p, 13 * p, 10 * p);

      ctx.fillStyle = bellyYellow;
      ctx.fillRect(-3 * p, 1 * p, 7 * p, 6 * p);
      ctx.fillStyle = '#f39c12';
      ctx.fillRect(-1 * p, 2 * p, 4 * p, 1 * p);
      ctx.fillRect(0 * p, 4 * p, 3 * p, 1 * p);

      ctx.fillStyle = mainOrange;
      ctx.fillRect(0 * p, -7 * p, 12 * p, 8 * p);
      ctx.fillRect(7 * p, -4 * p, 7 * p, 6 * p);
      ctx.fillStyle = darkOrange;
      ctx.fillRect(12 * p, -3 * p, 1 * p, 1 * p);

      ctx.fillStyle = '#ff7675';
      ctx.fillRect(5 * p, 0 * p, 3 * p, 2 * p);

      ctx.fillStyle = hornCream;
      ctx.fillRect(-1 * p, -10 * p, 3 * p, 4 * p);
      ctx.fillRect(3 * p, -9 * p, 2 * p, 3 * p);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(4 * p, -6 * p, 5 * p, 5 * p);
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(6 * p, -5 * p, 3 * p, 4 * p);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(6 * p, -5 * p, 1 * p, 1 * p);

      dragon.wingState *= 0.84;
      const flapY = Math.round(dragon.wingState * 10) * p;

      ctx.save();
      ctx.translate(0, flapY);

      ctx.fillStyle = cyanWing;
      ctx.fillRect(-12 * p, -13 * p, 10 * p, 10 * p);
      ctx.fillRect(-8 * p, -8 * p, 8 * p, 7 * p);
      ctx.fillRect(-4 * p, -4 * p, 6 * p, 5 * p);

      ctx.fillStyle = navyBone;
      ctx.fillRect(-14 * p, -15 * p, 4 * p, 4 * p);
      ctx.fillRect(-10 * p, -13 * p, 4 * p, 2 * p);
      ctx.fillRect(-6 * p, -11 * p, 4 * p, 2 * p);
      ctx.fillRect(-2 * p, -9 * p, 4 * p, 2 * p);

      ctx.fillRect(-14 * p, -11 * p, 2 * p, 6 * p);
      ctx.fillRect(-10 * p, -5 * p, 2 * p, 4 * p);
      ctx.fillRect(-5 * p, -1 * p, 2 * p, 3 * p);

      ctx.restore();

      if (khaleesiMounted) {
        drawKhaleesiSprite(2 * p, -18 * p, 0.85);
      }

      ctx.restore();
    }

    function drawCastleWalls(obs) {
      const gY = height - groundHeight;
      
      let pBottom;
      if (obs.isCharred || obs.charProgress > 0) { pBottom = charPalette; }
      else { pBottom = stonePalette; }

      let pTop;
      if (obs.topIsCharred) { pTop = charPalette; }
      else { pTop = stonePalette; }

      const drawStoneRect = (rx, ry, rw, rh, useP) => {
        ctx.fillStyle = useP.main;
        ctx.fillRect(rx, ry, rw, rh);

        ctx.fillStyle = useP.dark;
        const bH = 14;
        const bW = 24;
        for (let y = ry; y < ry + rh; y += bH) {
          ctx.fillRect(rx, y, rw, 2);
          const offset = Math.floor(y / bH) % 2 * (bW / 2);
          for (let x = rx + offset; x < rx + rw; x += bW) {
            ctx.fillRect(x, y, 2, bH);
          }
        }

        ctx.fillStyle = useP.light;
        ctx.fillRect(rx, ry, rw, 3);
        ctx.fillRect(rx, ry, 3, rh);

        ctx.fillStyle = useP.dark;
        ctx.fillRect(rx + rw - 3, ry, 3, rh);
      };

      const drawLevelTorch = (tx, ty) => {
        ctx.fillStyle = '#111';
        ctx.fillRect(tx - 3, ty + 6, 6, 8);
        ctx.fillRect(tx - 1, ty + 14, 2, 6);

        let glowColor = 'rgba(46, 204, 113, 0.45)';
        let flameMain = '#2ecc71';
        let flameCore = '#abebc6';

        if (currentLevel === 1) {
          glowColor = 'rgba(52, 152, 219, 0.45)';
          flameMain = '#3498db';
          flameCore = '#a9cce3';
        } else if (currentLevel >= 3) {
          glowColor = 'rgba(231, 76, 60, 0.45)';
          flameMain = '#e74c3c';
          flameCore = '#f9e79f';
        }

        const glow = ctx.createRadialGradient(tx, ty, 2, tx, ty, 26);
        glow.addColorStop(0, glowColor);
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(tx, ty, 26, 0, Math.PI * 2);
        ctx.fill();

        const flick = Math.sin(Date.now() / 40 + tx) * 3;
        ctx.fillStyle = flameMain;
        ctx.fillRect(tx - 3, ty - 2 + flick, 6, 8);
        ctx.fillStyle = flameCore;
        ctx.fillRect(tx - 1, ty - 5 + flick, 2, 5);
      };

      const drawArchedWindow = (wx, wy) => {
        const ww = 32;
        const wh = 54;

        ctx.fillStyle = '#e67e22';
        ctx.fillRect(wx, wy + 14, ww, wh - 14);
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy + 14, ww / 2, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(wx + 3, wy + 16, ww - 6, wh - 18);

        ctx.strokeStyle = '#141d26';
        ctx.lineWidth = 3;
        ctx.strokeRect(wx, wy + 14, ww, wh - 14);
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy + 14, ww / 2, Math.PI, 0);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1e2b37';
        
        ctx.beginPath();
        ctx.arc(wx + 8, wy + 26, 8, Math.PI, 0);
        ctx.arc(wx + 24, wy + 26, 8, Math.PI, 0);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(wx + ww / 2, wy + 6);
        ctx.lineTo(wx + ww / 2, wy + wh);
        ctx.moveTo(wx + 3, wy + 34);
        ctx.lineTo(wx + ww - 3, wy + 34);
        ctx.stroke();

        ctx.fillStyle = '#1e2b37';
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy + 14, 3, 0, Math.PI * 2);
        ctx.fill();
      };

      drawStoneRect(obs.x, 0, obs.width, obs.topHeight - 12, pTop);
      drawStoneRect(obs.x - 6, obs.topHeight - 12, obs.width + 12, 12, pTop);
      if (obs.topHeight > 90) {
        drawArchedWindow(obs.x + obs.width / 2 - 16, obs.topHeight / 2 - 28);
        if (obs.width > 80) {
          drawLevelTorch(obs.x + 10, obs.topHeight / 2);
          drawLevelTorch(obs.x + obs.width - 10, obs.topHeight / 2);
        }
      }

      const bHeight = gY - obs.bottomY;
      if (bHeight > 0) {
        drawStoneRect(obs.x - 6, obs.bottomY, obs.width + 12, 12, pBottom);
        drawStoneRect(obs.x, obs.bottomY + 12, obs.width, bHeight - 12, pBottom);
        
        if (obs.charProgress > 0 && !obs.isCharred) {
          ctx.save();
          const charredH = bHeight * obs.charProgress;
          
          ctx.beginPath();
          ctx.rect(obs.x - 6, obs.bottomY, obs.width + 12, bHeight);
          ctx.clip();
          
          ctx.fillStyle = 'rgba(5, 7, 10, 0.75)';
          ctx.fillRect(obs.x - 6, obs.bottomY, obs.width + 12, charredH);
          ctx.restore();
        }

        let archTopY = 9999;
        if (obs.hasLargeArch && bHeight > 60) {
          const maxArchWidth = obs.width * 0.5;
          const archWidth = Math.min(maxArchWidth, 110);
          const archRadius = archWidth / 2;
          const archX = obs.x + obs.width / 2 - archRadius;

          const maxAllowedHeight = bHeight * 0.75;
          const desiredArchHeight = 120;
          const archHeight = Math.min(desiredArchHeight, maxAllowedHeight - archRadius, bHeight - 20);

          if (archHeight > 10) {
            const archCenterY = obs.bottomY + bHeight - archHeight;
            archTopY = archCenterY - archRadius;

            const skyGradient = ctx.createLinearGradient(0, archTopY, 0, archCenterY + archHeight);
            skyGradient.addColorStop(0, '#241738');
            skyGradient.addColorStop(1, '#3a1c40');
            ctx.fillStyle = skyGradient;

            ctx.beginPath();
            ctx.arc(archX + archRadius, archCenterY, archRadius, Math.PI, 0);
            ctx.rect(archX, archCenterY, archWidth, archHeight);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
              if (s.x >= archX && s.x <= archX + archWidth && s.y >= archTopY && s.y <= archCenterY + archHeight) {
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
              }
            });
            ctx.globalAlpha = 1.0;

            ctx.strokeStyle = pBottom.dark;
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(archX + archRadius, archCenterY, archRadius, Math.PI, 0);
            ctx.lineTo(archX + archWidth, archCenterY + archHeight);
            ctx.moveTo(archX, archCenterY);
            ctx.lineTo(archX, archCenterY + archHeight);
            ctx.stroke();
          }
        }

        if (bHeight > 90) {
          const winY = obs.bottomY + 28;
          if (winY + 54 < archTopY - 10) {
            drawArchedWindow(obs.x + obs.width / 2 - 16, winY);
            if (obs.width > 80) {
              drawLevelTorch(obs.x + 10, obs.bottomY + bHeight / 2);
              drawLevelTorch(obs.x + obs.width - 10, obs.bottomY + bHeight / 2);
            }
          }
        }

        if (obs.hasRubble) {
          ctx.fillStyle = pBottom.dark;

          ctx.beginPath();
          ctx.moveTo(obs.x - 45, gY);
          ctx.lineTo(obs.x - 8, gY - 42);
          ctx.lineTo(obs.x + 32, gY);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(obs.x + obs.width - 28, gY);
          ctx.lineTo(obs.x + obs.width + 12, gY - 48);
          ctx.lineTo(obs.x + obs.width + 50, gY);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = pBottom.main;
          ctx.fillRect(obs.x - 36, gY - 20, 22, 16);
          ctx.fillRect(obs.x - 18, gY - 12, 18, 12);
          ctx.fillRect(obs.x + obs.width + 14, gY - 24, 24, 18);
          ctx.fillRect(obs.x + obs.width + 30, gY - 12, 16, 12);

          ctx.fillStyle = '#0f171e';
          ctx.fillRect(obs.x - 30, gY - 18, 10, 2);
          ctx.fillRect(obs.x + obs.width + 20, gY - 20, 12, 2);
        }

        const t = Date.now() / 180;
        
        obs.surfaceFlames.forEach(sf => {
          if (sf.width < sf.maxWidth) sf.width += 0.45;
          if (sf.height < sf.maxHeight) sf.height += 0.55;
          sf.relX += sf.spreadSpeed;

          if (sf.relX < 0) sf.relX = 0;
          if (sf.relX > obs.width) sf.relX = obs.width;

          const baseFx = obs.x + sf.relX;
          const currentFlameY = obs.bottomY + (bHeight * obs.charProgress);

          ctx.save();
          const layers = [
            { color: '#e74c3c', scaleW: 1.0, scaleH: 1.0 },
            { color: '#f39c12', scaleW: 0.65, scaleH: 0.7 },
            { color: '#f1c40f', scaleW: 0.35, scaleH: 0.45 }
          ];

          layers.forEach((l, idx) => {
            const flick = Math.sin(t * 1.5 + idx + baseFx) * 3;
            const w = sf.width * l.scaleW;
            const h = sf.height * l.scaleH;

            const flameTipX = baseFx + flick * 0.5;
            const flameTipY = currentFlameY - h;

            ctx.beginPath();
            ctx.moveTo(baseFx, currentFlameY);
            ctx.bezierCurveTo(
              baseFx + w * 0.5, currentFlameY - h * 0.2,
              baseFx + w * 0.45 + flick * 0.3, currentFlameY - h * 0.65,
              flameTipX, flameTipY
            );
            ctx.bezierCurveTo(
              baseFx - w * 0.45 + flick * 0.65, currentFlameY - h * 0.65,
              baseFx - w * 0.5, currentFlameY - h * 0.2,
              baseFx, currentFlameY
            );

            ctx.fillStyle = l.color;
            ctx.fill();
          });
          ctx.restore();
        });
      }
    }

    function drawCollectableHearts() {
      const now = Date.now();
      const scrollSpeed = getLevelScrollSpeed();

      collectableHearts.forEach((h) => {
        if (h.collected) return;

        h.x -= scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);
        h.bobPhase += 0.05;
        h.y = h.baseY + Math.sin(h.bobPhase) * 8;

        ctx.save();
        ctx.translate(h.x, h.y);

        const glowRadius = 24 + Math.sin(now / 150) * 4;
        const radial = ctx.createRadialGradient(0, 0, 4, 0, 0, glowRadius);
        radial.addColorStop(0, 'rgba(235, 77, 75, 0.85)');
        radial.addColorStop(0.5, 'rgba(235, 77, 75, 0.35)');
        radial.addColorStop(1, 'rgba(235, 77, 75, 0)');
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        const hSize = 1.3;
        ctx.beginPath();
        ctx.moveTo(0, -5 * hSize);
        ctx.bezierCurveTo(-6 * hSize, -15 * hSize, -16 * hSize, -6 * hSize, -14 * hSize, 2 * hSize);
        ctx.bezierCurveTo(-12 * hSize, 10 * hSize, -4 * hSize, 16 * hSize, 0, 20 * hSize);
        ctx.bezierCurveTo(4 * hSize, 16 * hSize, 12 * hSize, 10 * hSize, 14 * hSize, 2 * hSize);
        ctx.bezierCurveTo(16 * hSize, -6 * hSize, 6 * hSize, -15 * hSize, 0, -5 * hSize);
        ctx.closePath();

        ctx.fillStyle = '#ff2052';
        ctx.fill();

        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#a40021';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-7 * hSize, -5 * hSize, 3 * hSize, 4 * hSize);
        ctx.fillRect(-4 * hSize, -8 * hSize, 3 * hSize, 3 * hSize);

        ctx.restore();
      });

      collectableHearts = collectableHearts.filter(h => !h.collected && h.x > -40);
    }

    function drawTrebuchetsAndBoulders() {
      const gY = height - groundHeight;
      const scrollSpeed = getLevelScrollSpeed();

      trebuchets.forEach(t => {
        if (state === 'PLAYING') {
          t.x -= scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);

          t.shootCooldown--;
          if (t.shootCooldown <= 0 && t.x > 50 && t.x < width - 10) {
            t.shootCooldown = 80 + Math.random() * 50;
            t.isFiringAnim = true;
            sound.boulderLaunch();

            const launchX = t.x - 20;
            const launchY = gY - 45;
            const targetY = dragon.y;
            const dy = targetY - launchY;
            const dx = dragon.x - launchX;

            const vx = Math.min(-4.0, Math.max(-7.5, dx * 0.025));
            const vy = Math.min(-4.5, Math.max(-9.0, dy * 0.025 - 4.0));

            trebuchetBoulders.push({
              x: launchX,
              y: launchY,
              vx: vx,
              vy: vy,
              gravity: 0.16,
              radius: 9,
              life: 160
            });
          }

          if (t.isFiringAnim) {
            t.armAngle += 0.25;
            if (t.armAngle >= 1.2) {
              t.armAngle = -0.4;
              t.isFiringAnim = false;
