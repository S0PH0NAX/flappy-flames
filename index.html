            }
          }

          obstacles.forEach(obs => {
            if (obs.isCharred || obs.charProgress > 0) {
              const obsRight = obs.x + obs.width;
              const obsLeft = obs.x;
              if (Math.abs(t.x - obsRight) < 120 || Math.abs(t.x - obsLeft) < 120) {
                t.destroyed = true;
                gameStats.trebuchetsDestroyed++;
                sound.knightHit();
                const scoreResult = addScore(10);
                floatingTexts.push({ x: t.x - 10, y: gY - 50, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), color: '#ff9f43', alpha: 1.0, vy: -1.5 });

                for (let p = 0; p < 16; p++) {
                  particles.push({
                    x: t.x,
                    y: gY - 20,
                    vx: (Math.random() - 0.5) * 10,
                    vy: -Math.random() * 8,
                    size: 4 + Math.random() * 5,
                    life: 35,
                    color: Math.random() < 0.5 ? '#5c3d1e' : '#ff7675'
                  });
                }
              }
            }
          });

          flames.forEach(f => {
            const dist = Math.hypot(f.x - t.x, f.y - (gY - 25));
            if (dist < 34) {
              sound.knightHit();
              t.destroyed = true;
              gameStats.trebuchetsDestroyed++;
              const scoreResult = addScore(10);
              floatingTexts.push({ x: t.x - 10, y: gY - 50, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), color: '#ff9f43', alpha: 1.0, vy: -1.5 });

              for (let p = 0; p < 16; p++) {
                particles.push({
                  x: t.x,
                  y: gY - 20,
                  vx: (Math.random() - 0.5) * 10,
                  vy: -Math.random() * 8,
                  size: 4 + Math.random() * 5,
                  life: 35,
                  color: Math.random() < 0.5 ? '#5c3d1e' : '#ff7675'
                });
              }
            }
          });
        }

        if (t.destroyed) return;

        ctx.save();
        ctx.translate(t.x, gY);

        const wheelRot = -t.x * 0.08;
        const drawWheel = (wx) => {
          ctx.save();
          ctx.translate(wx, -10);
          ctx.rotate(wheelRot);

          ctx.fillStyle = '#2c3e50';
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#7f8c8d';
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#7f8c8d';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-9, 0); ctx.lineTo(9, 0);
          ctx.moveTo(0, -9); ctx.lineTo(0, 9);
          ctx.stroke();

          ctx.restore();
        };

        drawWheel(-22);
        drawWheel(22);

        ctx.fillStyle = '#5c3d1e';
        ctx.fillRect(-28, -20, 56, 10);
        ctx.fillStyle = '#3d2612';
        ctx.fillRect(-24, -18, 48, 6);

        ctx.fillStyle = '#784e24';
        ctx.beginPath();
        ctx.moveTo(-22, -20);
        ctx.lineTo(-4, -48);
        ctx.lineTo(4, -48);
        ctx.lineTo(22, -20);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#4a2f13';
        ctx.fillRect(-4, -48, 8, 28);

        ctx.fillStyle = '#95a5a6';
        ctx.beginPath();
        ctx.arc(0, -46, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(0, -46);
        ctx.rotate(t.armAngle);

        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-8, -4, 46, 8);
        ctx.fillRect(-24, -6, 18, 12);

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(-32, 2, 18, 18);

        if (!t.isFiringAnim) {
          ctx.strokeStyle = '#bdc3c7';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(38, 0);
          ctx.lineTo(48, 10);
          ctx.stroke();

          ctx.fillStyle = '#7f8c8d';
          ctx.beginPath();
          ctx.arc(48, 10, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
        ctx.restore();
      });

      trebuchets = trebuchets.filter(t => !t.destroyed && t.x > -60);

      trebuchetBoulders.forEach(b => {
        if (state === 'PLAYING') {
          b.x += b.vx;
          b.y += b.vy;
          b.vy += b.gravity;
          b.life--;

          if (Math.random() < 0.4) {
            particles.push({
              x: b.x,
              y: b.y,
              vx: (Math.random() - 0.5) * 1.5,
              vy: (Math.random() - 0.5) * 1.5,
              size: 3 + Math.random() * 3,
              life: 15,
              color: '#e74c3c'
            });
          }
        }

        ctx.save();
        ctx.translate(b.x, b.y);

        const glowRadius = b.radius + 6;
        const radial = ctx.createRadialGradient(0, 0, 2, 0, 0, glowRadius);
        radial.addColorStop(0, 'rgba(241, 196, 15, 0.8)');
        radial.addColorStop(0.6, 'rgba(231, 76, 60, 0.4)');
        radial.addColorStop(1, 'rgba(231, 76, 60, 0)');
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#34495e';
        ctx.beginPath();
        ctx.arc(-2, -2, b.radius * 0.4, 0, Math.PI * 2);
        ctx.arc(3, 2, b.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      trebuchetBoulders = trebuchetBoulders.filter(b => b.life > 0 && b.y < gY + 10 && b.x > -50);
    }

    function drawKnights() {
      const time = Date.now() / 900;
      const gY = height - groundHeight;

      knights.forEach((k) => {
        const obs = k.obsRef;
        if (!obs || obs.x + obs.baseWidth < -50) return;

        if (k.state === 'FALLING') {
          k.fallVelocityY += 0.48;
          k.fallYOffset += k.fallVelocityY;
          k.relX += k.knockbackVelocity;
          k.rotation += 0.12 * Math.sign(k.knockbackVelocity || 1);

          const currentY = obs.bottomY - 26 + k.fallYOffset;
          if (currentY >= gY - 26) {
            if (!k.pointAwarded) {
              k.pointAwarded = true;
              gameStats.villagersKilled++;
              const scoreResult = addScore(2);
              sound.knightHit();
              floatingTexts.push({ x: obs.x + k.relX, y: gY - 10, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.2 });
            }
            k.state = 'DEAD_ON_GROUND';
          }
        } else {
          if (Math.abs(k.knockbackVelocity) > 0.05) {
            k.relX += k.knockbackVelocity;
            k.knockbackVelocity *= 0.88;

            if (k.relX < -12 || k.relX > obs.width + 12) {
              k.state = 'FALLING';
              k.fallVelocityY = -2.5;
            }
          } else if (k.stunTimer > 0) {
            k.stunTimer--;
          } else if (k.state === 'ALIVE') {
            k.relX += k.direction * 0.2;
            if (k.relX < 6) { k.relX = 6; k.direction = 1; }
            if (k.relX > obs.width - 26) { k.relX = obs.width - 26; k.direction = -1; }
          }
        }

        const kx = obs.x + k.relX;
        const ky = obs.bottomY - 26 + k.fallYOffset;

        if (k.state === 'ALIVE' && k.isRoyal && state === 'PLAYING') {
          const dist = Math.hypot(dragon.x - kx, dragon.y - ky);
          if (dist < dragon.size / 2 + 18) {
            k.state = 'BEHEADED';
            triggerBeheadingCutscene(k.royalType);
            return;
          }
        }

        const hasFireOnKnight = k.state === 'ALIVE' && (obs.isCharred || obs.charProgress > 0 || obs.surfaceFlames.some(sf => Math.abs((obs.x + sf.relX) - kx) < 24));

        if (hasFireOnKnight) {
          k.state = 'BURNING';
          if (k.isRoyal) {
            sound.stopRoyalSounds();
            resetScoreToZero();
          } else if (!k.pointAwarded) {
            k.pointAwarded = true;
            gameStats.villagersKilled++;
            const scoreResult = addScore(2);
            sound.knightHit();
            floatingTexts.push({ x: kx + 4, y: ky - 8, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.2 });
          }
        }

        if (k.state === 'FALLING') {
          ctx.save();
          ctx.translate(kx + 10, ky + 14);
          ctx.rotate(k.rotation);

          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(8, -4, 4, 5);
          ctx.fillStyle = '#bdc3c7';
          ctx.fillRect(5, 0, 10, 8);
          ctx.fillStyle = '#95a5a6';
          ctx.fillRect(3, 8, 14, 12);
          ctx.fillStyle = '#2980b9';
          ctx.fillRect(-1, 6, 9, 14);

          ctx.restore();
          return;
        }

        if (k.state === 'DEAD_ON_GROUND') {
          ctx.fillStyle = '#34495e';
          ctx.fillRect(kx - 4, gY - 6, 28, 6);
          ctx.fillStyle = '#7f8c8d';
          ctx.fillRect(kx, gY - 10, 16, 4);
          return;
        }

        if (k.state === 'ALIVE') {
          ctx.save();
          ctx.translate(kx, ky);

          const isStunned = k.stunTimer > 0;
          const isRoyal = k.isRoyal;

          if (isRoyal) {
            const isKing = k.royalType === 'KING';
            
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(4, -14, 14, 6);
            ctx.fillRect(2, -16, 4, 4);
            ctx.fillRect(9, -16, 4, 4);
            ctx.fillRect(16, -16, 4, 4);

            ctx.fillStyle = isKing ? '#8e44ad' : '#c0392b';
            ctx.fillRect(2, -8, 18, 28);
            ctx.fillStyle = '#f39c12';
            ctx.fillRect(8, -8, 6, 28);

            ctx.fillStyle = '#f8c291';
            ctx.fillRect(5, -8, 12, 8);

            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(20, -10, 3, 20);
            ctx.fillRect(19, -12, 5, 4);
          } else {
            const costume = k.costume || peasantCostumes[0];

            ctx.fillStyle = costume.hair;
            ctx.fillRect(5, -6, 12, 5);

            ctx.fillStyle = '#f8c291';
            ctx.fillRect(6, -2, 10, 7);

            ctx.fillStyle = costume.tunic;
            ctx.fillRect(4, 5, 14, 10);
            ctx.fillStyle = costume.pants;
            ctx.fillRect(5, 15, 12, 7);

            if (k.hasPitchfork) {
              ctx.fillStyle = '#7f8c8d';
              ctx.fillRect(18, -4, 2, 22);
              ctx.fillRect(16, -6, 6, 2);
              ctx.fillRect(16, -10, 2, 4);
              ctx.fillRect(20, -10, 2, 4);
            } else {
              ctx.fillStyle = '#784e24';
              ctx.fillRect(18, 2, 3, 14);
              ctx.fillStyle = '#e74c3c';
              ctx.fillRect(17, -3, 5, 5);
              ctx.fillStyle = '#f1c40f';
              ctx.fillRect(18, -5, 3, 3);
            }

            const legMove = isStunned ? 0 : Math.sin(time * 2 + kx) * 1.5;
            ctx.fillStyle = '#34495e';
            ctx.fillRect(5 + legMove, 22, 4, 4);
            ctx.fillRect(11 - legMove, 22, 4, 4);
          }

          ctx.restore();
        } else if (k.state === 'BURNING') {
          k.burnTimer++;
          ctx.fillStyle = k.burnTimer % 4 < 2 ? '#2ecc71' : '#f39c12';
          ctx.fillRect(kx - 2, ky - 6, 26, 32);
          if (k.burnTimer > 35) k.state = 'ASH';
        } else if (k.state === 'ASH') {
          ctx.fillStyle = '#34495e';
          ctx.fillRect(kx, ky + 20, 22, 5);
        }
      });
    }

    function drawParticles() {
      const gY = height - groundHeight;
      
      for (let i = blackDebris.length - 1; i >= 0; i--) {
        const d = blackDebris[i];
        d.x += d.vx;
        d.y += d.vy;
        d.vy += d.gravity;
        d.rotation += d.rotSpeed;

        ctx.save();
        ctx.translate(d.x, d.y);
        ctx.rotate(d.rotation);
        
        ctx.fillStyle = '#11161d';
        const halfSize = d.size / 2;
        ctx.beginPath();
        ctx.moveTo(0, -halfSize);
        ctx.lineTo(halfSize, -halfSize * 0.6);
        ctx.lineTo(halfSize * 0.8, halfSize);
        ctx.lineTo(-halfSize * 0.8, halfSize);
        ctx.lineTo(-halfSize, -halfSize * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();

        if (d.y >= gY) {
          for (let s = 0; s < 5; s++) {
             particles.push({
                x: d.x,
                y: gY,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.7) * 4,
                size: 2 + Math.random() * 2,
                life: 15 + Math.random() * 10,
                color: '#e74c3c'
              });
          }
          blackDebris.splice(i, 1);
        }
      }

      for (let i = flames.length - 1; i >= 0; i--) {
        const f = flames[i];
        f.vx *= f.dragX;
        f.vy += f.gravity;
        f.x += f.vx;
        f.y += f.vy;
        f.life--;

        const lifeRatio = f.life / f.maxLife;
        const curSize = f.size * lifeRatio;

        if (Math.random() < 0.25) {
          particles.push({
            x: f.x + (Math.random() - 0.5) * 6,
            y: f.y + (Math.random() - 0.5) * 6,
            vx: (Math.random() - 0.5) * 1.2,
            vy: (Math.random() - 0.5) * 1.2,
            size: 2 + Math.random() * 2,
            life: 15,
            color: f.color
          });
        }

        ctx.fillStyle = lifeRatio > 0.6 ? '#ffffff' : f.color;
        ctx.fillRect(f.x, f.y, curSize, curSize);

        if (f.y >= gY - 4) {
          if (Math.random() < 0.35) {
            groundFlames.push({
              x: f.x,
              life: 80 + Math.random() * 60,
              boostIntensity: 1.0
            });
          }
          flames.splice(i, 1);
          continue;
        }

        obstacles.forEach(obs => {
          if (f.x >= obs.x - 10 && f.x <= obs.x + obs.width + 10 && f.y >= obs.bottomY - 14 && f.y <= obs.bottomY + 20) {
            if (Math.random() < 0.45) {
              obs.surfaceFlames.push({
                relX: f.x - obs.x,
                width: 12,
                maxWidth: 32 + Math.random() * 22,
                height: 14,
                maxHeight: 38 + Math.random() * 24,
                spreadSpeed: (Math.random() - 0.5) * 1.4
              });
            }
          }
        });

        if (f.life <= 0) flames.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        
        ctx.fillStyle = p.color;
        
        if (p.isSmoke) {
          ctx.globalAlpha = p.life / 60.0;
          ctx.beginPath();
          const halfSize = p.size / 2;
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.arc(p.x - halfSize, p.y + halfSize * 0.7, p.size * 0.8, 0, Math.PI * 2);
          ctx.arc(p.x + halfSize, p.y - halfSize * 0.3, p.size * 0.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1.0;
        } else {
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }

        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ctx.save();
        ctx.globalAlpha = ft.alpha;
        ctx.font = 'bold 24px "Proxima Nova", sans-serif';
        ctx.fillStyle = ft.color || '#2ecc71';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();

        ft.y += ft.vy;
        ft.alpha -= 0.015;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
      }
    }

    function triggerHit() {
      if (invulnerableTimer > 0 || khaleesiMounted || state === 'LEVEL_CELEBRATE') return;
      lives--;
      updateHeartsDisplay();
      sound.hit();
      invulnerableTimer = 50;

      if (lives <= 0) {
        state = 'GAMEOVER';
        showKhaleesiBanner('"DO NOT FAIL ME, SYRAXX! TRY AGAIN!"', 300);
      }
    }

    function updateLevelCelebration() {
      celebrationTimer++;
      const worldSpeedMult = 1.2;
      const scrollSpeed = getLevelScrollSpeed();
      backgroundParallaxX += 0.4 * worldSpeedMult;

      for (let i = battlements.length - 1; i >= 0; i--) {
        battlements[i].x -= scrollSpeed * worldSpeedMult;
        if (battlements[i].x + battlements[i].width < -100) battlements.splice(i, 1);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= scrollSpeed * worldSpeedMult;
        if (obstacles[i].x + obstacles[i].width < -100) obstacles.splice(i, 1);
      }

      for (let i = trebuchets.length - 1; i >= 0; i--) {
        trebuchets[i].x -= scrollSpeed * worldSpeedMult;
        if (trebuchets[i].x < -60) trebuchets.splice(i, 1);
      }

      celebrationAngle += 0.035;

      const centerX = width * 0.50;
      const centerY = height * 0.32;
      const loopRadiusX = 140;
      const loopRadiusY = 90;

      dragon.x = centerX + Math.cos(celebrationAngle) * loopRadiusX;
      dragon.y = centerY + Math.sin(celebrationAngle) * loopRadiusY;
      dragon.wingState = 0.9;

      const nextX = centerX + Math.cos(celebrationAngle + 0.035) * loopRadiusX;
      const nextY = centerY + Math.sin(celebrationAngle + 0.035) * loopRadiusY;

      if (celebrationTimer % 20 === 0) {
        sound.fireworks();
        sound.fireRoar();
        const fireColors = ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db', '#9b59b6', '#ffffff'];
        const burstX = dragon.x + (Math.random() - 0.5) * 50;
        const burstY = dragon.y + (Math.random() - 0.5) * 50;

        for (let f = 0; f < 20; f++) {
          const color = fireColors[Math.floor(Math.random() * fireColors.length)];
          const angle = Math.random() * Math.PI * 2;
          const spd = 3.5 + Math.random() * 8.5;
          flames.push({
            x: burstX,
            y: burstY,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            dragX: 0.965,
            gravity: 0.07,
            size: 11 + Math.random() * 11,
            life: 90,
            maxLife: 90,
            color: color
          });
        }
      }

      if (celebrationTimer > 270) {
        celebrationFadeAlpha = Math.min(1.0, (celebrationTimer - 270) / 50.0);
      }

      if (celebrationTimer >= 330) {
        state = 'LEVEL_DIALOGUE';
        celebrationFadeAlpha = 0;
      }
    }

    function update() {
      sound.updateMusicState(state);

      if (state === 'PAUSED' || state === 'CUTSCENE' || state === 'LEVEL_DIALOGUE') return;

      if (state === 'LEVEL_CELEBRATE') {
        updateLevelCelebration();
        return;
      }

      if (invulnerableTimer > 0) invulnerableTimer--;

      if (khaleesiMounted) {
        khaleesiTimer--;
        if (khaleesiTimer <= 0) {
          khaleesiMounted = false;
          khaleesiCombo = 0;
          showKhaleesiBanner('"I LOVE YOU ALWAYS, SYRAXX!"', 240);
        }
      }

      if (state === 'GAMEOVER') {
        if (headFadingIndex >= 0) {
          headFadeTimer--;
          if (headFadeTimer <= 0) {
            royalHeads = Math.max(0, royalHeads - 1);
            if (royalHeadTypes.length > 0) royalHeadTypes.pop();
            headFadingIndex = -1;
            lives = 3;
            updateHeartsDisplay();

            dragon.velocity = dragon.jump;
            dragon.wingState = 1.0;
            sound.flap();

            invulnerableTimer = 120;

            state = 'PLAYING';
            sound.powerup();
          }
        }
      }

      if (state === 'SPLASH' && !textTypingComplete) {
        typedCharIndex += 0.45;
        if (typedCharIndex >= totalCharCount) {
          typedCharIndex = totalCharCount;
          textTypingComplete = true;
        }
      }

      if (state === 'PLAYING') {
        levelTimerSeconds += (1 / 60);
        updateLevelBadgeUI();
        checkLevelProgression();

        const worldSpeedMult = khaleesiMounted ? 2.2 : 1.0;
        const scrollSpeed = getLevelScrollSpeed();
        backgroundParallaxX += 0.4 * worldSpeedMult;

        dragon.velocity += dragon.gravity;
        dragon.y += dragon.velocity;

        const gY = height - groundHeight;

        for (let i = battlements.length - 1; i >= 0; i--) {
          const b = battlements[i];
          b.x -= scrollSpeed * worldSpeedMult;
          if (b.x + b.width < -100) {
            battlements.splice(i, 1);
          }
        }

        battlements.forEach(b => {
          const bX = b.x;
          const bY = gY - b.height;
          const bW = b.width;

          const padding = 6;
          const dLeft = dragon.x - dragon.size / 2 + padding;
          const dRight = dragon.x + dragon.size / 2 - padding;
          const dBottom = dragon.y + dragon.size / 2 - padding;

          if (dRight > bX && dLeft < bX + bW && dBottom > bY) {
            if (khaleesiMounted) {
              if (!b.isCrushed) {
                b.isCrushed = true;
                sound.towerDestroy();
                const scoreResult = addScore(15);
                floatingTexts.push({ x: bX + bW / 2 - 20, y: bY - 15, text: 'CRUSH! +' + scoreResult.totalPts, color: '#f1c40f', alpha: 1.0, vy: -1.5 });
              }
            } else {
              triggerHit();
            }
          }
        });

        trebuchetBoulders.forEach((boulder, idx) => {
          const dist = Math.hypot(dragon.x - boulder.x, dragon.y - boulder.y);
          if (dist < dragon.size / 2 + boulder.radius) {
            if (!khaleesiMounted) {
              triggerHit();
            }
            for (let p = 0; p < 12; p++) {
              particles.push({
                x: boulder.x,
                y: boulder.y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                size: 3 + Math.random() * 4,
                life: 20,
                color: Math.random() < 0.5 ? '#7f8c8d' : '#f1c40f'
              });
            }
            trebuchetBoulders.splice(idx, 1);
          }
        });

        collectableHearts.forEach(h => {
          if (!h.collected) {
            const dist = Math.hypot(dragon.x - h.x, dragon.y - h.y);
            if (dist < dragon.size / 2 + h.radius) {
              h.collected = true;
              sound.heartPickup();

              if (lives < 3) {
                lives++;
                updateHeartsDisplay();
              }

              const scoreResult = addScore(20);

              for (let p = 0; p < 12; p++) {
                particles.push({
                  x: h.x,
                  y: h.y,
                  vx: (Math.random() - 0.5) * 6,
                  vy: (Math.random() - 0.5) * 6,
                  size: 3 + Math.random() * 3,
                  life: 25,
                  color: '#ff3838'
                });
              }

              floatingTexts.push({
                x: h.x - 20,
                y: h.y - 15,
                text: '+1 ❤️ (+' + scoreResult.totalPts + ')',
                color: '#ff4d4d',
                alpha: 1.0,
                vy: -1.6
              });
            }
          }
        });

        obstacles.forEach(obs => {
          if (!obs.isCharred && obs.surfaceFlames.length > 0) {
            let intervals = obs.surfaceFlames.map(sf => [
              Math.max(0, sf.relX - sf.width / 2),
              Math.min(obs.width, sf.relX + sf.width / 2)
            ]).sort((a, b) => a[0] - b[0]);

            let merged = [];
            intervals.forEach(curr => {
              if (!merged.length || merged[merged.length - 1][1] < curr[0]) {
                merged.push(curr);
              } else {
                merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], curr[1]);
              }
            });

            let coveredLength = merged.reduce((acc, curr) => acc + (curr[1] - curr[0]), 0);
            let isFull = coveredLength >= obs.width * 0.85;

            if (isFull) {
              obs.burnFullTimer++;
              if (obs.burnFullTimer >= 60 && !obs.isFullyIgnited) {
                obs.isFullyIgnited = true;
                sound.score();
              }
            } else {
              obs.burnFullTimer = Math.max(0, obs.burnFullTimer - 1);
            }
          }

          if (obs.charProgress > 0 && !obs.isCharred) {
              obs.charProgress += 0.006 * worldSpeedMult; 
              
              const bHeight = gY - obs.bottomY;
              const waveY = obs.bottomY + (bHeight * obs.charProgress);

              if (Math.random() < 0.6) {
                blackDebris.push({
                    x: obs.x + Math.random() * obs.width,
                    y: waveY,
                    vx: (Math.random() - 0.5) * 3,
                    vy: -Math.random() * 2,
                    gravity: 0.25,
                    size: 8 + Math.random() * 8,
                    life: 60,
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() - 0.5) * 0.15
                });
              }

              if (Math.random() < 0.4) {
                particles.push({
                  x: obs.x + Math.random() * obs.width,
                  y: waveY - 5,
                  vx: (Math.random() - 0.5) * 2.0,
                  vy: -Math.random() * 1.5,
                  size: 6 + Math.random() * 6,
                  life: 60,
                  color: 'rgba(10, 10, 15, 0.9)',
                  isSmoke: true
                });
              }

              if (obs.charProgress >= 1.0) {
                  obs.charProgress = 1.0;
                  obs.isCharred = true;
                  gameStats.burnedTowers++;
                  sound.towerDestroy();
              }
          }
        });

        if (isHoldingAction) {
          holdTimer++;
          if (holdTimer > 4 && holdTimer < 45) {
            dragon.vx += 0.95;
            dragon.wingState = 0.8;
            sound.whoosh();

            const shockwaveRadius = 150;

            obstacles.forEach(obs => {
              const obsCenterX = obs.x + obs.width / 2;
              const obsCenterY = obs.bottomY;
              const dist = Math.hypot(dragon.x - obsCenterX, dragon.y - obsCenterY);
              
              if (obs.isFullyIgnited && dist <= shockwaveRadius + 100 && !obs.isCharred && obs.charProgress === 0) {
                obs.charProgress = 0.01;
                sound.towerDestroy();
                
                const scoreResult = addScore(Math.round((obs.width / 80) * 20));
                floatingTexts.push({ x: obs.x + obs.width / 2 - 30, y: obs.bottomY - 30, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.8 });
              }

              obs.surfaceFlames.forEach(sf => {
                const sfx = obs.x + sf.relX;
                const sfy = obs.bottomY;
                const sfDist = Math.hypot(dragon.x - sfx, dragon.y - sfy);

                if (sfDist <= shockwaveRadius) {
                  sf.maxWidth = Math.min(sf.maxWidth + 1.2, 70);
                  sf.maxHeight = Math.min(sf.maxHeight + 1.8, 85);
                  sf.height = Math.min(sf.height + 2.0, sf.maxHeight);
                  sf.width = Math.min(sf.width + 1.5, sf.maxWidth);
                }
              });
            });

            knights.forEach(k => {
              if (k.state === 'ALIVE' && !k.isRoyal) {
                const obs = k.obsRef;
                const kx = obs.x + k.relX;
                const ky = obs.bottomY - 12;
                const dist = Math.hypot(dragon.x - kx, dragon.y - ky);

                if (dist <= shockwaveRadius) {
                  const pushDir = kx >= dragon.x ? 1 : -1;
                  k.knockbackVelocity = pushDir * (12.0 + Math.random() * 6.0);
                  k.stunTimer = 22;
                  sound.knightHit();
                }
              }
            });

            groundFlames.forEach(gf => {
              const dist = Math.hypot(dragon.x - gf.x, dragon.y - gY);
              if (dist <= shockwaveRadius) {
                gf.boostIntensity = Math.min((gf.boostIntensity || 1.0) + 0.15, 2.8);
                gf.life += 2;
              }
            });

            if (Math.random() < 0.6) {
              particles.push({
                x: dragon.x - 14,
                y: dragon.y + (Math.random() - 0.5) * 16,
                vx: -3 - Math.random() * 3,
                vy: (Math.random() - 0.5) * 2,
                size: 4 + Math.random() * 4,
                life: 20,
                color: '#f39c12'
              });
            }
          }
        }

        dragon.x += dragon.vx;
        dragon.vx *= 0.90;

        const thirtyPercentWidth = width * 0.30;
        if (dragon.x > dragon.baseX) {
          let returnSpeed = 1.2;
          if (dragon.x > thirtyPercentWidth) {
            const extraRatio = (dragon.x - thirtyPercentWidth) / (width - thirtyPercentWidth);
            returnSpeed = 3.5 + extraRatio * 9.0;
          }
          dragon.x -= returnSpeed;
          if (dragon.x < dragon.baseX) dragon.x = dragon.baseX;
        }

        if (dragon.y + dragon.size / 2 >= gY || dragon.y - dragon.size / 2 <= 0) {
          if (!khaleesiMounted) {
            triggerHit();
            if (lives > 0) {
              dragon.y = height * 0.4;
              dragon.velocity = 0;
            }
          } else {
            dragon.y = Math.max(dragon.size / 2, Math.min(gY - dragon.size / 2, dragon.y));
          }
        }

        if (obstacles.length === 0 || (width - obstacles[obstacles.length - 1].x) > 200) {
          spawnObstacle();
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.x -= scrollSpeed * worldSpeedMult;

          if (!obs.passed && obs.x + obs.width < dragon.x) {
            obs.passed = true;
            addScore(1);
            sound.score();
          }

          const padding = 6;
          const dLeft = dragon.x - dragon.size / 2 + padding;
          const dRight = dragon.x + dragon.size / 2 - padding;
          const dTop = dragon.y - dragon.size / 2 + padding;
          const dBottom = dragon.y + dragon.size / 2 - padding;

          if (dRight > obs.x && dLeft < obs.x + obs.width) {
            if (dTop < obs.topHeight) {
              if (khaleesiMounted) {
                if (!obs.topIsCharred) {
                  obs.topIsCharred = true;
                  sound.towerDestroy();
                  const scoreResult = addScore(15);
                  floatingTexts.push({ x: obs.x + obs.width / 2 - 20, y: obs.topHeight + 10, text: 'CRUSH! +' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x)', color: '#f1c40f', alpha: 1.0, vy: 1.5 });

                  for (let f = 0; f < 12; f++) {
                    flames.push({
                      x: dragon.x + (Math.random() - 0.5) * 30,
                      y: obs.topHeight + (Math.random() - 0.5) * 20,
                      vx: (Math.random() - 0.5) * 12,
                      vy: (Math.random() - 0.2) * 8,
                      dragX: 0.96,
                      gravity: 0.15,
                      size: 16 + Math.random() * 12,
                      life: 90,
                      maxLife: 90,
                      color: Math.random() < 0.5 ? '#ff793f' : '#f1c40f'
                    });
                  }
                }
              } else {
                triggerHit();
                if (lives > 0) obs.passed = true;
              }
            }

            if (dBottom > obs.bottomY) {
              if (khaleesiMounted) {
                if (!obs.isCharred && obs.charProgress === 0) {
                  obs.charProgress = 0.01;
                  sound.towerDestroy();
                  const scoreResult = addScore(15);
                  floatingTexts.push({ x: obs.x + obs.width / 2 - 20, y: obs.bottomY - 20, text: 'CRUSH! +' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x)', color: '#f1c40f', alpha: 1.0, vy: -1.8 });

                  for (let f = 0; f < 12; f++) {
                    flames.push({
                      x: dragon.x + (Math.random() - 0.5) * 30,
                      y: obs.bottomY + (Math.random() - 0.5) * 20,
                      vx: (Math.random() - 0.5) * 12,
                      vy: -(Math.random() * 8 + 2),
                      dragX: 0.96,
                      gravity: 0.15,
                      size: 16 + Math.random() * 12,
                      life: 90,
                      maxLife: 90,
                      color: Math.random() < 0.5 ? '#ff793f' : '#ee5253'
                    });
                  }
                }
              } else {
                triggerHit();
                if (lives > 0) obs.passed = true;
              }
            }
          }

          if (obs.x + obs.width < -100) {
            obstacles.splice(i, 1);
          }
        }
      }
    }

    function renderLevelDialogue() {
      ctx.fillStyle = 'rgba(10, 10, 20, 0.92)';
      ctx.fillRect(0, 0, width, height);

      const pSize = 140;
      const pX = (width - pSize) / 2;
      const pY = 120;
      const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

      ctx.fillStyle = '#11161d';
      ctx.fillRect(pX, pY, pSize, pSize);
      if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
        ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
      }
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#f1c40f';
      ctx.strokeRect(pX, pY, pSize, pSize);

      ctx.fillStyle = '#f1c40f';
      ctx.font = 'bold 22px "Proxima Nova", sans-serif';
      ctx.textAlign = 'center';

      let title = "LEVEL 1: THE SIEGE BEGINS!";
      let buttonText = "BEGIN CONQUEST";

      if (levelDialogueType === 'LEVEL1_CLEAR') {
        title = "LEVEL 1 CONQUERED!";
        buttonText = "START LEVEL 2";
      } else if (levelDialogueType === 'LEVEL2_CLEAR') {
        title = "LEVEL 2 CONQUERED!";
        buttonText = "START LEVEL 3";
      } else if (levelDialogueType === 'VICTORY') {
        title = "SLAVERS DEFEATED! VICTORY!";
        buttonText = "PLAY AGAIN";
      }

      ctx.fillText(title, width / 2, pY - 25);

      let statsBoxY, statsBoxH;

      if (levelDialogueType === 'INTRO') {
        const speechLines = [
          '"My brave Syraxx, burn their',
          'towers, slay the slavers, and bring',
          'me to victory. I love you!"'
        ];

        const bW = width - 60;
        bH = 90;
        const bX = 30;
        bY = pY + pSize + 20;
        statsBoxY = bY;
        statsBoxH = bH;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bX, bY, bW, bH, 12);
        else ctx.fillRect(bX, bY, bW, bH);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        speechLines.forEach((l, idx) => {
          ctx.fillText(l, width / 2, bY + 26 + (idx * 22));
        });

      } else if (levelDialogueType === 'LEVEL1_CLEAR') {
        const speechLines = [
          '"My beloved Syraxx, you will now',
          'encounter the royals. DO NOT BURN',
          'THE ROYALS! Bring me their heads to',
          'mount on the city walls!"'
        ];

        const bW = width - 60;
        bH = 110;
        const bX = 30;
        bY = pY + pSize + 20;
        statsBoxY = bY;
        statsBoxH = bH;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bX, bY, bW, bH, 12);
        else ctx.fillRect(bX, bY, bW, bH);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 14px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        speechLines.forEach((l, idx) => {
          ctx.fillText(l, width / 2, bY + 24 + (idx * 21));
        });

      } else {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        ctx.fillText('"I LOVE YOU SO MUCH SYRAXX!"', width / 2, pY + pSize + 25);

        statsBoxY = pY + pSize + 40;
        const statsBoxW = width - 60;
        statsBoxH = 175;
        const statsBoxX = 30;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(statsBoxX, statsBoxY, statsBoxW, statsBoxH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(statsBoxX, statsBoxY, statsBoxW, statsBoxH);

        const lMargin = statsBoxX + 18;
        const rMargin = statsBoxX + statsBoxW - 18;

        const lines = [
          { label: "🏰 Towers Burned:", val: `${gameStats.burnedTowers}` },
          { label: "⚔️ Peasants Slain:", val: `${gameStats.villagersKilled}` },
          { label: "🏹 Archers Defeated:", val: `${gameStats.archersKilled}` },
          { label: "💥 Trebuchets Wrecked:", val: `${gameStats.trebuchetsDestroyed}` },
          { label: "👑 Royals Beheaded:", val: `${gameStats.kingsBeheaded + gameStats.queensBeheaded}` },
          { label: "👸 Khaleesi Rescues:", val: `${gameStats.khaleesiRescues}` }
        ];

        lines.forEach((item, idx) => {
          const curY = statsBoxY + 24 + (idx * 24);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 14px "Proxima Nova", sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(item.label, lMargin, curY);

          ctx.fillStyle = '#f1c40f';
          ctx.textAlign = 'right';
          ctx.fillText(item.val, rMargin, curY);
        });
      }

      const btnW = 220;
      const btnH = 46;
      const btnX = (width - btnW) / 2;
      const btnY = statsBoxY + statsBoxH + 20;

      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, btnY, btnW, btnH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px "Proxima Nova", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(buttonText, width / 2, btnY + 28);
    }

    function renderCutscene() {
      cutsceneTimer++;
      
      ctx.fillStyle = 'rgba(10, 10, 20, 0.92)';
      ctx.fillRect(0, 0, width, height);

      const pSize = 54;
      const pX = 15;
      const pY = 65;
      const khaleesiImg = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

      ctx.fillStyle = '#11161d';
      ctx.fillRect(pX, pY, pSize, pSize);
      if (khaleesiImg.complete && khaleesiImg.naturalWidth !== 0) {
        ctx.drawImage(khaleesiImg, pX, pY, pSize, pSize);
      }
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#f1c40f';
      ctx.strokeRect(pX, pY, pSize, pSize);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px "Proxima Nova", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('"Death to tyrants, gods and masters!"', pX, pY + pSize + 18);

      const boxSize = 240;
      const bX = (width - boxSize) / 2;
      const bY = height / 2 - 80;

      const isKing = cutsceneTarget === 'KING';
      let activeAsset, fallbackAsset, headAsset, headFallbackAsset;

      const animFrameIndex = Math.min(Math.floor(cutsceneTimer / 100), 1);

      if (isKing) {
        activeAsset = (animFrameIndex === 0) ? kingFrame1 : kingFrame2;
        fallbackAsset = (animFrameIndex === 0) ? kingFallback1 : kingFallback2;
        headAsset = kheadImg;
        headFallbackAsset = kheadFallback;
      } else {
        activeAsset = (animFrameIndex === 0) ? queenFrame1 : queenFrame2;
        fallbackAsset = (animFrameIndex === 0) ? queenFallback1 : queenFallback2;
        headAsset = qheadImg;
        headFallbackAsset = qheadFallback;
      }

      ctx.fillStyle = '#11161d';
      ctx.fillRect(bX, bY, boxSize, boxSize);

      if (cutsceneTimer > 200) {
        if (headAsset.complete && headAsset.naturalWidth !== 0) {
          ctx.drawImage(headAsset, bX, bY, boxSize, boxSize);
        } else {
          ctx.drawImage(headFallbackAsset, bX, bY, boxSize, boxSize);
        }
      } else {
        if (activeAsset.complete && activeAsset.naturalWidth !== 0) {
          ctx.drawImage(activeAsset, bX, bY, boxSize, boxSize);
        } else {
          ctx.drawImage(fallbackAsset, bX, bY, boxSize, boxSize);
        }
      }

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#e74c3c';
      ctx.strokeRect(bX, bY, boxSize, boxSize);

      ctx.fillStyle = '#f1c40f';
      ctx.font = 'bold 20px "Proxima Nova", sans-serif';
      ctx.textAlign = 'center';

      if (isKing) {
        ctx.fillText("YOU TOOK THE KING'S HEAD!", width / 2, bY - 20);
      } else {
        ctx.fillText("YOU TOOK THE QUEEN'S HEAD!", width / 2, bY - 20);
      }

      ctx.fillStyle = '#2ecc71';
      ctx.font = 'bold 16px "Proxima Nova", sans-serif';
      ctx.fillText('+5,000 POINTS!', width / 2, bY + boxSize + 25);

      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;
      const btnY = bY + boxSize + 45;

      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(btnX, btnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, btnY, btnW, btnH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('RETURN TO GAME', width / 2, btnY + 27);
    }

    function renderPauseScreen() {
      ctx.fillStyle = 'rgba(10, 10, 20, 0.88)';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#f1c40f';
      ctx.font = 'bold 34px "Proxima Nova", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME PAUSED', width / 2, height / 2 - 180);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('COLLECTED HEADS: ' + royalHeads, width / 2, height / 2 - 145);

      const headIconSize = 48;
      const headGap = 10;
      const totalHeadsWidth = (royalHeads * headIconSize) + (Math.max(0, royalHeads - 1) * headGap);
      const startHeadX = (width - Math.min(totalHeadsWidth, width - 40)) / 2;
      const headsY = height / 2 - 130;

      for (let h = 0; h < royalHeads; h++) {
        const hx = startHeadX + (h * (headIconSize + headGap));
        if (hx + headIconSize > width - 10) break;

        ctx.save();
        const type = royalHeadTypes[h] || 'KING';
        const headImg = (type === 'KING') ? kheadImg : qheadImg;
        const fallbackImg = (type === 'KING') ? kheadFallback : qheadFallback;

        if (headImg.complete && headImg.naturalWidth !== 0) {
          ctx.drawImage(headImg, hx, headsY, headIconSize, headIconSize);
        } else {
          ctx.drawImage(fallbackImg, hx, headsY, headIconSize, headIconSize);
        }
        ctx.restore();
      }

      const btnW = 200;
      const btnH = 40;
      const btnX = (width - btnW) / 2;

      const resumeBtnY = height / 2 - 70;
      const saveBtnY = resumeBtnY + 48;
      const loadBtnY = saveBtnY + 48;
      const flipBtnY = loadBtnY + 48;
      const shareBtnY = flipBtnY + 48;

      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(btnX, resumeBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, resumeBtnY, btnW, btnH);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('RESUME GAME', width / 2, resumeBtnY + 25);

      ctx.fillStyle = '#f39c12';
      ctx.fillRect(btnX, saveBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, saveBtnY, btnW, btnH);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('SAVE CODE', width / 2, saveBtnY + 25);

      ctx.fillStyle = '#2980b9';
      ctx.fillRect(btnX, loadBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, loadBtnY, btnW, btnH);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('LOAD GAME', width / 2, loadBtnY + 25);

      ctx.fillStyle = '#8e44ad';
      ctx.fillRect(btnX, flipBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, flipBtnY, btnW, btnH);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('CONTROL FLIP', width / 2, flipBtnY + 25);

      ctx.fillStyle = '#e67e22';
      ctx.fillRect(btnX, shareBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, shareBtnY, btnW, btnH);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('SHARE POST 📸', width / 2, shareBtnY + 25);
    }

    function renderGameOverScreen() {
      ctx.fillStyle = 'rgba(10, 10, 20, 0.88)';
      ctx.fillRect(0, 0, width, height);

      if (noHeadContinuePopupTimer > 0) {
        noHeadContinuePopupTimer--;
        const portraitSize = 160;
        const pX = (width - portraitSize) / 2;
        const pY = height / 2 - 140;

        const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, portraitSize, portraitSize);
        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, portraitSize, portraitSize);
        }
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, portraitSize, portraitSize);

        const bMargin = 20;
        const bX = bMargin;
        const bY = pY + portraitSize + 20;
        const bW = width - (bMargin * 2);
        const bH = 110;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bX, bY, bW, bH, 12);
        else ctx.fillRect(bX, bY, bW, bH);
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 13px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        const lines = [
          '"I\'m sorry beloved, you can\'t',
          'continue without the severed',
          'head of a royal."'
        ];
        lines.forEach((l, idx) => {
          ctx.fillText(l, width / 2, bY + 32 + (idx * 24));
        });

        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 12px "Proxima Nova", sans-serif';
        ctx.fillText('(Tap anywhere to close)', width / 2, bY + bH + 25);
        return;
      }

      ctx.fillStyle = '#e74c3c';
      ctx.font = 'bold 34px "Proxima Nova", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', width / 2, height / 2 - 170);

      ctx.fillStyle = '#f1c40f';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('ROYAL HEADS CONTINUES: ' + royalHeads, width / 2, height / 2 - 135);

      const headIconSize = 56;
      const headGap = 12;
      const totalHeadsWidth = (royalHeads * headIconSize) + (Math.max(0, royalHeads - 1) * headGap);
      const startHeadX = (width - Math.min(totalHeadsWidth, width - 40)) / 2;
      const headsY = height / 2 - 110;

      for (let h = 0; h < royalHeads; h++) {
        const hx = startHeadX + (h * (headIconSize + headGap));
        if (hx + headIconSize > width - 10) break;

        ctx.save();
        if (h === headFadingIndex) {
          const glow = Math.sin(Date.now() / 40) * 0.5 + 0.5;
          ctx.globalAlpha = headFadeTimer / 35.0;
          ctx.shadowColor = '#f1c40f';
          ctx.shadowBlur = 20 * glow;
        }

        const type = royalHeadTypes[h] || 'KING';
        const headImg = (type === 'KING') ? kheadImg : qheadImg;
        const fallbackImg = (type === 'KING') ? kheadFallback : qheadFallback;

        if (headImg.complete && headImg.naturalWidth !== 0) {
          ctx.drawImage(headImg, hx, headsY, headIconSize, headIconSize);
        } else {
          ctx.drawImage(fallbackImg, hx, headsY, headIconSize, headIconSize);
        }
        ctx.restore();
      }

      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;

      const continueBtnY = height / 2 - 35;
      const restartBtnY = continueBtnY + 54;
      const loadBtnY = restartBtnY + 54;

      ctx.fillStyle = royalHeads > 0 ? '#2ecc71' : '#7f8c8d';
      ctx.fillRect(btnX, continueBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, continueBtnY, btnW, btnH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('CONTINUE (1 👑)', width / 2, continueBtnY + 27);

      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(btnX, restartBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, restartBtnY, btnW, btnH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillText('RESTART GAME', width / 2, restartBtnY + 27);

      ctx.fillStyle = '#2980b9';
      ctx.fillRect(btnX, loadBtnY, btnW, btnH);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.strokeRect(btnX, loadBtnY, btnW, btnH);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px "Proxima Nova", sans-serif';
      ctx.fillText('LOAD GAME', width / 2, loadBtnY + 27);
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      drawNightSky();
      drawMoon();
      drawGiantClouds();
      drawParallaxCastleBackground();
      obstacles.forEach(drawCastleWalls);
      drawBattlements();
      drawArchersAndArrows();
      drawKhaleesis();
      drawCollectableHearts();
      drawTrebuchetsAndBoulders();
      drawKnights();
      drawGround();
      drawParticles();

      if (state === 'SPLASH') {
        const portraitSize = 180;
        const pX = (width - portraitSize) / 2;
        const pY = height / 2 - 10;

        const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        const bMargin = 25;
        const bX = bMargin;
        const bY = pY - 145;
        const bWidth = width - (bMargin * 2);
        const bHeight = 125;
        const cornerRadius = 14;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(bX, bY, bWidth, bHeight, cornerRadius);
        } else {
          ctx.fillRect(bX, bY, bWidth, bHeight);
        }
        ctx.fill();

        let curCharCount = Math.floor(typedCharIndex);
        let charCounter = 0;

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 13px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        const lineHeights = [18, 36, 54, 72, 90];
        fullStoryText.forEach((line, idx) => {
          let visibleLine = '';
          for (let c = 0; c < line.length; c++) {
            if (charCounter < curCharCount) {
              visibleLine += line[c];
              charCounter++;
            }
          }
          ctx.fillText(visibleLine, width / 2, bY + lineHeights[idx]);
          charCounter++;
        });

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, portraitSize, portraitSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, portraitSize, portraitSize);
        }

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, portraitSize, portraitSize);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Proxima Nova", sans-serif';
        if (textTypingComplete) {
          ctx.fillText('TAP TO START GAME', width / 2, pY + portraitSize + 35);
        } else {
          ctx.fillText('TAP TO SHOW FULL MESSAGE', width / 2, pY + portraitSize + 35);
        }

      } else if (state === 'LEVEL_CELEBRATE') {
        drawDragon(dragon.x, dragon.y);

        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 28px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText("LEVEL CLEARED!", width / 2, height * 0.18);

        if (celebrationFadeAlpha > 0) {
          ctx.fillStyle = `rgba(10, 10, 20, ${celebrationFadeAlpha})`;
          ctx.fillRect(0, 0, width, height);
        }

      } else if (state === 'LEVEL_DIALOGUE') {
        renderLevelDialogue();
      } else if (state === 'CUTSCENE') {
        renderCutscene();
      } else if (state === 'PAUSED') {
        renderPauseScreen();
      } else if (state === 'GAMEOVER') {
        renderGameOverScreen();
      } else {
        drawDragon(dragon.x, dragon.y);
        renderMountedKhaleesiHUD();
      }

      if (state === 'START') {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('TAP TO FLAP & FIRE', width / 2, height / 2 - 80);
        
        ctx.font = '14px "Proxima Nova", sans-serif';
        ctx.fillText('Hold: Boost Forward', width / 2, height / 2 - 50);

        const btnW = 200;
        const btnH = 44;
        const btnX = (width - btnW) / 2;
        const startBtnY = height / 2 - 10;
        const loadBtnY = startBtnY + 58;

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(btnX, startBtnY, btnW, btnH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(btnX, startBtnY, btnW, btnH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Proxima Nova", sans-serif';
        ctx.fillText('START GAME', width / 2, startBtnY + 27);

        ctx.fillStyle = '#2980b9';
        ctx.fillRect(btnX, loadBtnY, btnW, btnH);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeRect(btnX, loadBtnY, btnW, btnH);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px "Proxima Nova", sans-serif';
        ctx.fillText('LOAD GAME', width / 2, loadBtnY + 27);

      }

      ctx.textAlign = 'left';
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
