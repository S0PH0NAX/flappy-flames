  for (let p = 0; p < 20; p++) particles.push({ x: c.x, y: c.y - 8, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6, size: 3 + Math.random() * 3, life: 30, color: Math.random() < 0.5 ? '#6b4423' : '#f1c40f' });
}

function dropCarriedChest() {
  const c = carriedChest;
  if (!c) return;
  carriedChest = null;
  c.place = 'FALLING';
  c.vy = Math.max(0, dragon.velocity * 0.4);
  c.dropY = c.y;
  setFireButtonDrop(false);
  sound.whoosh();
}

function chestKillsBelow(c) {
  const left = c.x - CHEST_W / 2, right = c.x + CHEST_W / 2, top = c.y - CHEST_H, bottom = c.y;
  const gY = height - groundHeight;
  const hit = (x, y, w, h) => right > x && left < x + w && bottom > y && top < y + h;

  knights.forEach(k => {
    if (k.state !== 'ALIVE' || k.isRoyal || !k.obsRef) return;
    const kx = k.obsRef.x + k.relX, ky = k.obsRef.bottomY - 32;
    if (hit(kx, ky, 22, 32)) {
      k.state = 'FALLING'; k.fallVelocityY = 1; k.knockbackVelocity = (Math.random() - 0.5) * 6;
    }
  });
  smallKnights.forEach(k => {
    if (k.state !== 'ALIVE') return;
    const kx = k.obsRef.x + k.relX, ky = k.obsRef.bottomY - 32;
    if (hit(kx, ky, 22, 32)) killSmallKnight(k, 'crush');
  });
  archers.forEach(a => {
    const b = a.battlementRef;
    if (!b || a.destroyed) return;
    const ax = b.x + a.relX, ay = gY - b.height;
    if (hit(ax - 10, ay - 30, 20, 32)) {
      a.destroyed = true; a.archerAwarded = true;
      gameStats.archersKilled++;
      sound.knightHit();
      const r = addScore(20);
      floatingTexts.push({ x: ax - 15, y: ay - 30, text: 'SQUASH! +' + r.totalPts, color: '#f1c40f', alpha: 1.0, vy: -1.5 });
    }
  });
  trebuchets.forEach(t => {
    if (t.destroyed) return;
    if (hit(t.x - 30, gY - 60, 60, 60)) {
      t.destroyed = true;
      gameStats.trebuchetsDestroyed++;
      sound.knightHit();
      const r = addScore(10);
      floatingTexts.push({ x: t.x - 10, y: gY - 60, text: 'SMASH! +' + r.totalPts, color: '#ff9f43', alpha: 1.0, vy: -1.5 });
    }
  });
}

function updateChests(worldShift) {
  const gY = height - groundHeight;
  for (let i = chests.length - 1; i >= 0; i--) {
    const c = chests[i];
    if (c.gone) { chests.splice(i, 1); continue; }

    if (c.place === 'TOWER') {
      if (!c.obsRef) { chests.splice(i, 1); continue; }
      c.x = c.obsRef.x + c.relX; c.y = c.obsRef.bottomY;
    } else if (c.place === 'BATTLEMENT') {
      c.x = c.battRef.x + c.relX; c.y = gY - c.battRef.height;
    } else if (c.place === 'GROUND') {
      c.x -= worldShift; c.y = gY;
    } else if (c.place === 'CARRIED') {
      c.x = dragon.x + 2; c.y = dragon.y + 64;
      c.carryT++;
      if (!isFlapLockActive && c.carryT >= CHEST_AUTO_DROP) dropCarriedChest();
      continue;
    } else if (c.place === 'FALLING') {
      const prevY = c.y;
      c.x -= worldShift;
      c.vy += 0.38;
      c.y += c.vy;
      chestKillsBelow(c);
      // tower tops
      for (let o = 0; o < obstacles.length; o++) {
        const obs = obstacles[o];
        if (c.x > obs.x && c.x < obs.x + obs.width && prevY <= obs.bottomY && c.y >= obs.bottomY) {
          c.y = obs.bottomY; c.place = 'TOWER'; c.obsRef = obs; c.relX = c.x - obs.x;
          if (c.kind === 'LOCKED' && obs.bottomY - c.dropY >= CHEST_BREAK_HEIGHT) {
            c.kind = 'TREASURE';
            sound.towerDestroy();
            for (let p = 0; p < 20; p++) particles.push({ x: c.x, y: c.y - 8, vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6, size: 3 + Math.random() * 3, life: 30, color: Math.random() < 0.5 ? '#6b4423' : '#f1c40f' });
            floatingTexts.push({ x: c.x - 40, y: c.y - 40, text: 'CHEST SMASHED!', color: '#f1c40f', alpha: 1.0, vy: -1.2 });
            showTreasureFX('CHEST SMASHED!', 'GRAB THE TREASURE!');
          } else {
            sound.knightHit();
            if (c.kind === 'LOCKED') floatingTexts.push({ x: c.x - 40, y: c.y - 36, text: 'TOO LOW!', color: '#bdc3c7', alpha: 1.0, vy: -1.0 });
          }
          break;
        }
      }
      if (c.place === 'FALLING') {
        for (let b = 0; b < battlements.length; b++) {
          const bt = battlements[b];
          const top = gY - bt.height;
          if (c.x > bt.x && c.x < bt.x + bt.width && prevY <= top && c.y >= top) {
            c.y = top;
            if (c.kind === 'LOCKED') {
              // a locked chest bursts open on a battlement and pays out right away
              chestBreakBurst(c);
              grantTreasure(TREASURE_BONUS, TREASURE_MULT, TREASURE_SECS, c.x, c.y, 'CHEST BROKEN');
              c.gone = true;
            } else {
              c.place = 'BATTLEMENT'; c.battRef = bt; c.relX = c.x - bt.x;
              sound.knightHit();
            }
            break;
          }
        }
      }
      if (c.place === 'FALLING' && c.y >= gY) {
        c.y = gY;
        if (c.kind === 'LOCKED') {
          // a locked chest that hits the ground bursts open and pays out right away
          chestBreakBurst(c);
          grantTreasure(TREASURE_BONUS, TREASURE_MULT, TREASURE_SECS, c.x, c.y, 'CHEST BROKEN');
          chests.splice(i, 1);
          continue;
        }
        c.place = 'GROUND';
        sound.knightHit();
      }
    }

    if (c.x < -60) { chests.splice(i, 1); continue; }

    // the dragon touches a chest that is resting somewhere
    if (state === 'PLAYING' && c.place !== 'FALLING' && Math.hypot(dragon.x - c.x, dragon.y - (c.y - CHEST_H / 2)) < dragon.size / 2 + CHEST_W * 0.4) {
      if (c.kind === 'OPEN') {
        grantTreasure(OPEN_CHEST_BONUS, OPEN_CHEST_MULT, OPEN_CHEST_SECS, c.x, c.y, 'TREASURE');
        chests.splice(i, 1);
      } else if (c.kind === 'TREASURE') {
        grantTreasure(TREASURE_BONUS, TREASURE_MULT, TREASURE_SECS, c.x, c.y, 'JACKPOT');
        chests.splice(i, 1);
      } else if (c.kind === 'LOCKED' && !carriedChest) {
        c.place = 'CARRIED'; c.carryT = 0; c.obsRef = null; c.battRef = null;
        carriedChest = c;
        setFireButtonDrop(true);
        sound.flap();
        floatingTexts.push({ x: dragon.x - 40, y: dragon.y - 40, text: isFlapLockActive ? 'PRESS DROP!' : 'DROP IT HIGH!', color: '#f1c40f', alpha: 1.0, vy: -1.2 });
      }
    }
  }
}

function drawChest(c) {
  if (c.place === 'CARRIED' && !isFlapLockActive && c.carryT > CHEST_AUTO_DROP - CHEST_FLASH_FRAMES) {
    if (Math.floor(c.carryT / 4) % 2 === 0) return;   // flash before it falls
  }
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(CHEST_SCALE, CHEST_SCALE);
  const cx = 0, cy = 0;
  const x = -CHEST_BASE_W / 2, y = -CHEST_BASE_H;
  if (c.kind === 'TREASURE') {
    // smashed planks and a heap of gold
    ctx.fillStyle = '#6b4423';
    ctx.save(); ctx.translate(x + 3, cy - 3); ctx.rotate(-0.4); ctx.fillRect(0, 0, 12, 3); ctx.restore();
    ctx.save(); ctx.translate(x + 15, cy - 2); ctx.rotate(0.5); ctx.fillRect(0, 0, 12, 3); ctx.restore();
    const shine = 0.5 + 0.5 * Math.sin(Date.now() / 150);
    const gl = ctx.createRadialGradient(cx, cy - 8, 2, cx, cy - 8, 30);
    gl.addColorStop(0, 'rgba(255,220,90,' + (0.5 + 0.3 * shine) + ')');
    gl.addColorStop(1, 'rgba(255,220,90,0)');
    ctx.fillStyle = gl; ctx.fillRect(cx - 30, cy - 38, 60, 40);
    ctx.fillStyle = '#d4a017';
    ctx.beginPath(); ctx.moveTo(cx - 14, cy); ctx.quadraticCurveTo(cx, cy - 22, cx + 14, cy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f7d65a';
    for (let i = 0; i < 9; i++) { const a = i * 2.4; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (3 + i), cy - 4 - (i % 3) * 3, 2.2, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(cx - 3, cy - 12, 3, 3);
    ctx.fillStyle = '#3498db'; ctx.fillRect(cx + 4, cy - 8, 3, 3);
    ctx.fillStyle = '#ffffff'; if (shine > 0.8) { ctx.fillRect(cx + 1, cy - 16, 1, 4); ctx.fillRect(cx - 1, cy - 14, 5, 1); }
    ctx.restore();
    return;
  }

  // chest body
  ctx.fillStyle = '#2a1608'; ctx.fillRect(x - 1, y + 5, CHEST_BASE_W + 2, CHEST_BASE_H - 4);
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(x, y + 6, CHEST_BASE_W, CHEST_BASE_H - 6);
  ctx.fillStyle = '#5a3416'; ctx.fillRect(x, y + 11, CHEST_BASE_W, 1); ctx.fillRect(x, y + 15, CHEST_BASE_W, 1);
  ctx.fillStyle = '#b8b8b8'; ctx.fillRect(x + 3, y + 6, 2, CHEST_BASE_H - 6); ctx.fillRect(x + CHEST_BASE_W - 5, y + 6, 2, CHEST_BASE_H - 6);

  if (c.kind === 'OPEN') {
    // lid flipped open, gold spilling over the front
    ctx.fillStyle = '#2a1608'; ctx.fillRect(x - 1, y - 6, CHEST_BASE_W + 2, 8);
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(x, y - 5, CHEST_BASE_W, 6);
    const shine = 0.5 + 0.5 * Math.sin(Date.now() / 160);
    const gl = ctx.createRadialGradient(cx, y + 6, 2, cx, y + 6, 22);
    gl.addColorStop(0, 'rgba(255,220,90,' + (0.45 + 0.3 * shine) + ')');
    gl.addColorStop(1, 'rgba(255,220,90,0)');
    ctx.fillStyle = gl; ctx.fillRect(cx - 22, y - 16, 44, 36);
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.ellipse(cx, y + 6, 11, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7d65a';
    [[-6, 5], [-1, 3], [5, 5], [9, 8], [11, 12], [12, 16], [-9, 8]].forEach(p => { ctx.beginPath(); ctx.arc(cx + p[0], y + p[1], 1.8, 0, Math.PI * 2); ctx.fill(); });
  } else {
    // closed, banded lid with a padlock
    ctx.fillStyle = '#2a1608'; ctx.fillRect(x - 1, y - 1, CHEST_BASE_W + 2, 8);
    ctx.fillStyle = '#8b5a2b'; ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.quadraticCurveTo(cx, y - 3, x + CHEST_BASE_W, y + 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b8b8b8'; ctx.fillRect(x + 3, y + 1, 2, 5); ctx.fillRect(x + CHEST_BASE_W - 5, y + 1, 2, 5);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(cx - 3, y + 7, 6, 6);
    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(cx, y + 7, 2.2, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#2a1608'; ctx.fillRect(cx - 0.5, y + 9, 1, 2);
  }
  ctx.restore();
}

// ---------------------------------------------------------------------
// hooks called from main.js
// ---------------------------------------------------------------------
function updateLevelExtras(worldShift) {
  if (treasureMultTimer > 0) treasureMultTimer--;
  updateSmallKnights();
  updateGoldKnights(worldShift);
  updateChests(worldShift);
}

function drawLevelExtras() {
  smallKnights.forEach(drawSmallKnight);
  goldKnights.forEach(g => { if (g.state === 'ON_TOWER' || g.state === 'DEAD' || g.state === 'FALLING') drawGoldKnight(g); });
  chests.forEach(c => { if (c.place !== 'CARRIED') drawChest(c); });
}

// things hanging from / held by the dragon, drawn after it
function drawDragonCarried() {
  goldKnights.forEach(g => { if (g.state === 'CARRIED') drawGoldKnight(g); });
  if (carriedChest) drawChest(carriedChest);
  drawGoldShieldOnDragon();
}

function drawExtrasHUD() {
  if (treasureMultTimer <= 0) return;
  const secs = Math.ceil(treasureMultTimer / 60);
  const pulse = treasureMultTimer < 180 && Math.floor(treasureMultTimer / 10) % 2 === 0;
  ctx.save();
  ctx.font = 'bold 18px "Proxima Nova", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(width / 2 - 70, 64, 140, 26);
  ctx.fillStyle = pulse ? '#ffffff' : '#f1c40f';
  ctx.fillText('💰 ' + treasureMult + 'x  ' + secs + 's', width / 2, 83);
  ctx.restore();
}

// ---------------------------------------------------------------------
// Full-screen treasure celebration (about one second)
// ---------------------------------------------------------------------
const TREASURE_FX_FRAMES = 66;
let treasureFX = null;

function showTreasureFX(title, sub) {
  const coins = [];
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
    coins.push({ x: width / 2, y: height * 0.42, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, spin: Math.random() * 6, r: 4 + Math.random() * 4, gem: Math.random() < 0.15 ? (Math.random() < 0.5 ? '#e74c3c' : '#3498db') : null });
  }
  treasureFX = { t: 0, title: title, sub: sub, coins: coins };
}

function drawTreasureFX() {
  const fx = treasureFX;
  if (!fx) return;
  fx.t++;
  const p = fx.t / TREASURE_FX_FRAMES;
  if (p >= 1) { treasureFX = null; return; }
  const fade = p < 0.75 ? 1 : 1 - (p - 0.75) / 0.25;
  ctx.save();

  // golden flash + rays from the center
  const cx = width / 2, cy = height * 0.42;
  ctx.globalAlpha = 0.35 * fade * (1 - p * 0.6);
  const gl = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(width, height) * 0.7);
  gl.addColorStop(0, 'rgba(255,230,120,0.9)');
  gl.addColorStop(1, 'rgba(255,190,40,0)');
  ctx.fillStyle = gl;
  ctx.fillRect(0, 0, width, height);
  ctx.globalAlpha = 0.25 * fade;
  ctx.fillStyle = '#fff3b0';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6 + fx.t * 0.02;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a - 0.07) * width, cy + Math.sin(a - 0.07) * width);
    ctx.lineTo(cx + Math.cos(a + 0.07) * width, cy + Math.sin(a + 0.07) * width);
    ctx.closePath();
    ctx.fill();
  }

  // spinning coins and gems bursting out and falling
  ctx.globalAlpha = fade;
  fx.coins.forEach(c => {
    c.x += c.vx; c.y += c.vy; c.vy += 0.35; c.vx *= 0.99; c.spin += 0.3;
    const sx = Math.abs(Math.cos(c.spin));
    if (c.gem) {
      ctx.fillStyle = c.gem;
      ctx.beginPath(); ctx.moveTo(c.x, c.y - c.r); ctx.lineTo(c.x + c.r * 0.8, c.y); ctx.lineTo(c.x, c.y + c.r); ctx.lineTo(c.x - c.r * 0.8, c.y); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(c.x - 1, c.y - c.r * 0.6, 2, 2);
    } else {
      ctx.fillStyle = '#b8860b';
      ctx.beginPath(); ctx.ellipse(c.x, c.y, c.r * sx + 0.8, c.r, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f7d65a';
      ctx.beginPath(); ctx.ellipse(c.x, c.y, Math.max(0.3, c.r * sx - 0.6), c.r - 1, 0, 0, Math.PI * 2); ctx.fill();
      if (sx > 0.6) { ctx.fillStyle = '#fff6c8'; ctx.fillRect(c.x - c.r * 0.3, c.y - c.r * 0.5, 1.5, c.r * 0.6); }
    }
  });

  // title pops in, then settles
  const pop = p < 0.18 ? 0.4 + (p / 0.18) * 0.8 : (p < 0.3 ? 1.2 - ((p - 0.18) / 0.12) * 0.2 : 1);
  ctx.translate(cx, cy);
  ctx.scale(pop, pop);
  ctx.textAlign = 'center';
  ctx.font = 'bold 40px "Proxima Nova", sans-serif';
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#5a3a00';
  ctx.strokeText(fx.title, 0, 0);
  const tg = ctx.createLinearGradient(0, -30, 0, 6);
  tg.addColorStop(0, '#fff6c8');
  tg.addColorStop(0.5, '#f7d65a');
  tg.addColorStop(1, '#d48a10');
  ctx.fillStyle = tg;
  ctx.fillText(fx.title, 0, 0);
  ctx.font = 'bold 20px "Proxima Nova", sans-serif';
  ctx.lineWidth = 4;
  ctx.strokeText(fx.sub, 0, 32);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(fx.sub, 0, 32);
  ctx.restore();
}
</script>
<script>
// prologue.js — The two peaceful levels before level 1, and the ballista capture that ends them.
//   Meadow (currentLevel PRO_MEADOW = -1): sunny rolling hills, wildflowers, sheep and shepherds, birds,
//     maypole dancers. Khaleesi talks about peace; later she asks Syraxx to snatch a sheep and pays the shepherd.
//   Village (currentLevel PRO_VILLAGE = 0): thatched huts and crowds of peasants. At the end a castle wall
//     rolls in and its ballista nets Syraxx and Khaleesi (state CAPTURE, no player control). Khaleesi is
//     dragged inside, then the old "captured by the slavers" message plays (state CAPTURED_MSG) and level 1 starts.
// Khaleesi rides the whole time (no invincibility), fire is disabled, ground hits still cost hearts.
// Art lives in render-prologue.js.
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

const PRO_MEADOW = -1, PRO_VILLAGE = 0;
const PRO_CODE_MEADOW = 22, PRO_CODE_VILLAGE = 31;   // save-code level characters "M" and "V"
LEVEL_DURATIONS[PRO_MEADOW] = 100;
LEVEL_DURATIONS[PRO_VILLAGE] = 95;
const PRO_SPEED = 2.5;                // world scroll, px per frame
const PRO_SNATCH_DX = 30;             // how close (horizontally) the dragon must be to grab a sheep
const PRO_SNATCH_DY = 44;             // ...and how far above the ground its feet may be
const PRO_CARRY_FRAMES = 80;          // the sheep dangles this long before Syraxx eats it
const PRO_POUCH_FRAMES = 55;          // flight time of Khaleesi's gold pouch
const PRO_END_FADE = 50;              // fade out at the end of the meadow
const PRO_TITLE_FRAMES = 200;

const PRO_INVITE_TEXT = [
  '"Good morning, my sweet Syraxx!',
  'The sun is shining and the whole',
  'valley is in bloom. Come, my love,',
  'let us take to the skies together',
  'and see our beautiful home!"'
];
totalCharCount = PRO_INVITE_TEXT.join('\n').length;   // the opening screen types this message

const PRO_SCRIPT = {};
PRO_SCRIPT[PRO_MEADOW] = [
  { at: 2,  dur: 240, text: '"Feel the sun on your wings, Syraxx! Isn\'t our valley beautiful?"' },
  { at: 13, dur: 260, text: '"Wildflowers as far as the eye can see... I never tire of this view."' },
  { at: 25, dur: 300, text: '"This valley was meant to live in peace, my love. Every shepherd, every lamb, every child."' },
  { at: 38, dur: 340, text: '"The only reason ever to go to war is to protect the innocent and the vulnerable. Never forget that, Syraxx."' },
  { at: 50, fn: () => { pro.forceNext = 'maypole'; } },
  { at: 54, dur: 260, text: '"Listen! They\'re singing! Look at them dance around the maypole!"' },
  { at: 66, dur: 320, text: '"You must be getting hungry, my love. Go on, swoop down and snatch up a sheep!"',
    fn: () => { pro.hungry = true; pro.forceNext = 'flock'; pro.hungryAt = pro.t; } }
];
PRO_SCRIPT[PRO_VILLAGE] = [
  { at: 2,  dur: 260, text: '"Look down there, Syraxx... the village! Fly gently, let\'s not frighten anyone."' },
  { at: 14, dur: 320, text: '"See how everything fits together? The farmer grows the wheat, the miller grinds it, the baker feeds them all."' },
  { at: 28, dur: 280, text: '"The smith, the weaver, the shepherd... each one needs the others. Like you and me."' },
  { at: 42, dur: 260, text: '"Hear that? Their songs, their laughter... the music of their lives."' },
  { at: 56, dur: 300, text: '"Children chasing hens, grandmothers telling stories by the door. I could watch them forever."' },
  { at: 70, dur: 260, text: '"This is why we fly, Syraxx. Not for glory. For them."' },
  { at: 85, dur: 300, text: '"What\'s that up ahead? A castle... I don\'t like the look of those walls."' }
];

let pro = null;          // state of the current prologue level (null outside the prologue)
let sunnyScroll = 0;     // foreground scroll of the sunny scenes, in px
let sunnyBirds = [];
let fireBtnDisabledShown = false;

function inPrologue() { return currentLevel <= 0; }

function isPrologueCode(v) { return v === PRO_CODE_MEADOW || v === PRO_CODE_VILLAGE; }

// Screens that use the sunny daytime backdrop instead of the night sky.
function sunnyScene() {
  if (state === 'SPLASH' || state === 'START' || state === 'CAPTURE') return true;
  return inPrologue() && (state === 'PLAYING' || state === 'PAUSED' || state === 'GAMEOVER');
}

function fireDisabled() {
  return state === 'SPLASH' || state === 'START' || state === 'CAPTURE' || state === 'CAPTURED_MSG' || inPrologue();
}

// Khaleesi sits on Syraxx's back (drawn by drawDragon) without the invincible rainbow mode.
function khaleesiRidingNow() {
  if (khaleesiMounted) return false;
  if (state === 'START') return true;
  if (state === 'CAPTURE') return !(pro && pro.cap && pro.cap.kOff);
  return inPrologue() && (state === 'PLAYING' || state === 'PAUSED' || state === 'GAMEOVER');
}

function updateFireButtonLock() {
  const off = fireDisabled();
  if (off !== fireBtnDisabledShown) {
    fireBtnDisabledShown = off;
    manualFireBtn.classList.toggle('disabled', off);
  }
}

function proLevelName(lvl) { return lvl === PRO_MEADOW ? 'MEADOW' : 'VILLAGE'; }

function startPrologueLevel(lvl) {
  currentLevel = lvl;
  levelTimerSeconds = 0;
  obstacles = []; battlements = []; archers = []; arrows = []; knights = []; khaleesis = [];
  trebuchets = []; trebuchetBoulders = []; collectableHearts = []; groundFlames = []; flames = [];
  clearLevelExtras();
  if (bossState) bossState.active = false;
  khaleesiMounted = false;
  floatingTexts = []; particles = [];
  khaleesiBannerTimer = 0;
  pro = {
    t: 0, line: 0, ents: [], notes: [], coins: [],
    spawnGap: 120, forceNext: lvl === PRO_MEADOW ? 'flock' : 'hut',
    hungry: false, hungryAt: 0, sheepEaten: false, eatenAt: 0, lastNag: 0,
    carried: null, pouch: null,
    fadeIn: 40, ending: 0, wall: null, cap: null,
    title: PRO_TITLE_FRAMES
  };
  // a few things already on screen so the level doesn't start empty
  if (lvl === PRO_MEADOW) {
    proSpawn('flock', width * 0.55);
  } else {
    proSpawn('hut', width * 0.35);
    proSpawn('crowd', width * 0.62);
    proSpawn('hut', width * 0.85);
  }
  dragon.x = dragon.baseX; dragon.targetX = dragon.baseX; dragon.vx = 0;
  dragon.y = height * 0.4; dragon.velocity = dragon.jump; dragon.wingState = 1;
  state = 'PLAYING';
  updateLevelBadgeUI();
}

// ---------- spawning ----------
function proRand(a, b) { return a + Math.random() * (b - a); }
function proPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function proPerson(opts) {
  const female = Math.random() < 0.5;
  const p = {
    costume: proPick(peasantCostumes),
    look: {
      hat: proPick(female ? [0, 2, 3] : [0, 1, 1, 2, 3]),
      beard: !female && Math.random() < 0.4,
      skin: proPick(SKIN_TONES),
      apron: Math.random() < 0.35
    },
    dress: female,
    tool: 'none',
    phase: Math.random() * Math.PI * 2,
    dir: Math.random() < 0.5 ? -1 : 1,
    scale: 1
  };
  return Object.assign(p, opts || {});
}

function proSpawn(kind, x) {
  const ents = pro.ents;
  if (kind === 'flock') {
    const n = 3 + Math.floor(Math.random() * 4);
    let w = 0;
    for (let i = 0; i < n; i++) {
      ents.push({ type: 'sheep', x: x + w, dir: Math.random() < 0.7 ? -1 : 1, phase: Math.random() * 100,
                  walk: Math.random() < 0.3, lamb: Math.random() < 0.25 });
      w += proRand(26, 46);
    }
    // after Khaleesi asks for a sheep, every flock has a shepherd to pay
    if (pro.hungry || Math.random() < 0.7) {
      const sitting = Math.random() < 0.65;
      ents.push({ type: 'shepherd', x: x + w + proRand(10, 30), sitting: sitting,
                  person: proPerson({ dress: false, tool: sitting ? 'lute' : 'crook' }), joy: 0 });
      w += 50;
    }
    return w;
  }
  if (kind === 'maypole') {
    const n = 5 + Math.floor(Math.random() * 3);
    const dancers = [];
    for (let i = 0; i < n; i++) dancers.push(proPerson({ phase: (i / n) * Math.PI * 2 }));
    ents.push({ type: 'maypole', x: x + 50, dancers: dancers, ribbon: ['#e74c3c', '#f1c40f', '#3498db', '#9b59b6', '#2ecc71', '#ff7fbf', '#ffffff'] });
    return 120;
  }
  if (kind === 'hut') {
    const w = proRand(70, 104);
    ents.push({ type: 'hut', x: x, w: w, wallH: proRand(26, 34), roofH: proRand(30, 40), seed: Math.floor(Math.random() * 1000),
                doorLeft: Math.random() < 0.5, smoke: Math.random() < 0.6 });
    return w;
  }
  if (kind === 'crowd') {
    const n = 4 + Math.floor(Math.random() * 5);
    const people = [];
    let dx = 0;
    for (let i = 0; i < n; i++) {
      const child = Math.random() < 0.25;
      const act = proPick(child ? ['run', 'run', 'wave'] : ['wave', 'wave', 'talk', 'walk', 'dance', 'basket']);
      people.push(proPerson({ dx: dx, act: act, scale: child ? 0.7 : 1, tool: act === 'basket' ? 'basket' : 'none',
                              speed: act === 'walk' ? proRand(0.2, 0.5) : (act === 'run' ? proRand(0.6, 1.1) : 0) }));
      dx += proRand(14, 26);
    }
    if (Math.random() < 0.5) people.push(proPerson({ dx: dx + 8, act: 'lute', tool: 'lute', dress: false }));
    const hens = [];
    if (Math.random() < 0.6) for (let i = 0; i < 2 + Math.floor(Math.random() * 3); i++) hens.push({ dx: proRand(0, dx), phase: Math.random() * 10, dir: Math.random() < 0.5 ? -1 : 1 });
    ents.push({ type: 'crowd', x: x, people: people, hens: hens, w: dx + 30 });
    return dx + 30;
  }
  if (kind === 'well') {
    ents.push({ type: 'well', x: x });
    return 40;
  }
  return 0;
}

function proNextKind() {
  if (pro.forceNext) { const k = pro.forceNext; pro.forceNext = null; return k; }
  if (currentLevel === PRO_MEADOW) {
    if (pro.hungry) return 'flock';
    const r = Math.random();
    if (pro.t > 50 * 60 && r < 0.25) return 'maypole';
    return 'flock';
  }
  const r = Math.random();
  if (r < 0.5) return 'hut';
  if (r < 0.9) return 'crowd';
  return 'well';
}

// ---------- update ----------
// Ambient motion on every sunny screen: birds, foreground scroll, the dragon bobbing on the start screen.
function updateSunnyAmbient() {
  if (!sunnyScene()) return;
  const moving = state === 'SPLASH' || state === 'START' || (state === 'PLAYING' && inPrologue() && !(pro && pro.wall && pro.wall.stopped));
  if (moving) {
    const s = (state === 'PLAYING') ? PRO_SPEED : 1.2;
    sunnyScroll += s;
    if (state !== 'PLAYING') backgroundParallaxX += 0.25;
  }
  if (sunnyBirds.length < 7 && Math.random() < 0.012) {
    const flock = 1 + Math.floor(Math.random() * 4);
    const by = proRand(height * 0.08, height * 0.42);
    const bs = proRand(0.6, 1.2);
    for (let i = 0; i < flock; i++) {
      sunnyBirds.push({ x: width + 20 + i * 18, y: by + (i % 2) * 10 + i * 4, vx: -proRand(0.8, 1.6) * bs, size: 5 * bs,
                        phase: Math.random() * 6, depth: bs });
    }
  }
  sunnyBirds.forEach(b => {
    b.x += b.vx - (moving ? 0.6 * b.depth : 0);
    b.y += Math.sin(b.phase * 0.5) * 0.15;
    b.phase += 0.22;
  });
  sunnyBirds = sunnyBirds.filter(b => b.x > -40);
  if (state === 'START') {
    dragon.x = width * 0.5;
    dragon.y = height / 2 - 150 + Math.sin(Date.now() / 400) * 8;
    dragon.velocity = Math.cos(Date.now() / 400) * -2;
    if (Math.floor(Date.now() / 700) % 2 === 0 && dragon.wingState < 0.2) dragon.wingState = 1;
  }
}

function updatePrologue() {
  const P = pro;
  if (!P) return;
  P.t++;
  if (P.fadeIn > 0) P.fadeIn--;
  if (P.title > 0) P.title--;
  levelTimerSeconds += 1 / 60;
  updateLevelBadgeUI();

  const gY = height - groundHeight;
  const stopped = P.wall && P.wall.stopped;
  const shift = stopped ? 0 : PRO_SPEED;
  if (!stopped) backgroundParallaxX += 0.4;

  // flight physics (same as the main game)
  dragon.velocity += dragon.gravity;
  dragon.y += dragon.velocity;
  if (isHoldingAction) {
    holdTimer++;
    if (holdTimer > 4 && holdTimer < 45) {
      dragon.vx += 0.95;
      dragon.wingState = 0.8;
      sound.whoosh();
    }
  }
  dragon.x += dragon.vx;
  dragon.vx *= 0.90;
  const thirty = width * 0.30;
  if (dragon.x > dragon.baseX) {
    let back = 1.2;
    if (dragon.x > thirty) back = 3.5 + (dragon.x - thirty) / (width - thirty) * 9.0;
    dragon.x = Math.max(dragon.baseX, dragon.x - back);
  }
  // no overhead obstacles: the top of the screen just stops you
  if (dragon.y - dragon.size / 2 < 4) { dragon.y = dragon.size / 2 + 4; dragon.velocity = Math.max(0, dragon.velocity); }
  // the ground still hurts
  if (dragon.y + dragon.size / 2 >= gY && P.ending === 0) {
    triggerHit();
    if (lives > 0) { dragon.y = height * 0.4; dragon.velocity = 0; }
    if (state !== 'PLAYING') return;
  }

  // scroll and spawn the ground scenery
  P.ents.forEach(e => { e.x -= shift; });
  P.ents = P.ents.filter(e => e.x > -260 && !e.gone);
  if (!P.wall) {
    P.spawnGap -= shift;
    if (P.spawnGap <= 0) {
      const w = proSpawn(proNextKind(), width + 30);
      P.spawnGap = w + (currentLevel === PRO_MEADOW ? proRand(160, 340) : proRand(20, 90));
    }
  }

  // huts are solid
  if (currentLevel === PRO_VILLAGE) {
    P.ents.forEach(e => {
      if (e.type !== 'hut') return;
      const top = gY - e.wallH - e.roofH * 0.55;
      if (dragon.x + dragon.size / 2 - 8 > e.x + 6 && dragon.x - dragon.size / 2 + 8 < e.x + e.w - 6 && dragon.y + dragon.size / 2 - 6 > top) triggerHit();
    });
  }

  proUpdateScript();
  proUpdateSheep(gY);
  proUpdateNotes(shift);

  // end of the meadow: fade out into the village
  if (currentLevel === PRO_MEADOW) {
    const done = levelTimerSeconds >= LEVEL_DURATIONS[PRO_MEADOW] && P.sheepEaten && P.t - P.eatenAt > 360 && !P.pouch && !P.carried;
    if (done && P.ending === 0) P.ending = 1;
    if (P.ending > 0) {
      P.ending++;
      dragon.y += (height * 0.35 - dragon.y) * 0.03;
      dragon.velocity *= 0.9;
      if (P.ending >= PRO_END_FADE) {
        startPrologueLevel(PRO_VILLAGE);
        return;
      }
    }
  }

  // end of the village: the castle wall rolls in and the capture starts
  if (currentLevel === PRO_VILLAGE) {
    if (!P.wall && levelTimerSeconds >= LEVEL_DURATIONS[PRO_VILLAGE]) {
      const lastX = P.ents.reduce((m, e) => Math.max(m, e.x + (e.w || 40)), 0);
      P.wall = { x: Math.max(width + 40, lastX + 80), stopped: false };
      P.ents.push({ type: 'castle', x: P.wall.x, ref: P.wall });
    }
    if (P.wall && !P.wall.stopped) {
      P.wall.x -= shift;
      if (P.wall.x <= width * 0.6) { P.wall.x = width * 0.6; P.wall.stopped = true; startCapture(); }
    }
  }
}

function proUpdateScript() {
  const P = pro;
  const script = PRO_SCRIPT[currentLevel] || [];
  while (P.line < script.length && levelTimerSeconds >= script[P.line].at) {
    const L = script[P.line++];
    if (L.text) showKhaleesiBanner(L.text, L.dur || 260);
    if (L.fn) L.fn();
  }
  if (currentLevel === PRO_MEADOW) {
    if (P.sheepEaten && !P.saidLove && P.t - P.eatenAt > 420) {
      P.saidLove = true;
      showKhaleesiBanner('"I love these days with you, Syraxx. I wish they would never end."', 280);
    }
    // gentle reminder if Syraxx still hasn't eaten
    if (P.hungry && !P.carried && P.t - P.hungryAt > 900 && P.t - P.lastNag > 900 && khaleesiBannerTimer <= 0) {
      P.lastNag = P.t;
      showKhaleesiBanner('"Don\'t be shy, Syraxx! Fly down low and grab a sheep!"', 220);
    }
  }
}

function proUpdateSheep(gY) {
  const P = pro;
  P.ents.forEach(e => {
    if (e.type === 'sheep') {
      e.phase += 1;
      if (e.walk) e.x += e.dir * 0.18;
      if (e.scared > 0) { e.scared--; e.x += e.dir * 1.2; }
    }
    if (e.type === 'shepherd' && e.joy > 0) e.joy--;
  });

  // snatch a sheep once Khaleesi has asked
  if (P.hungry && !P.carried) {
    const feet = dragon.y + dragon.size / 2;
    for (const e of P.ents) {
      if (e.type !== 'sheep' || e.gone) continue;
      if (Math.abs(dragon.x + 6 - e.x) < PRO_SNATCH_DX && feet > gY - PRO_SNATCH_DY) {
        e.gone = true;
        P.hungry = false;
        P.carried = { t: 0, lamb: e.lamb };
        dragon.velocity = Math.min(dragon.velocity, dragon.jump * 0.8);
        dragon.wingState = 1;
        proBaa();
        sound.powerup();
        // the rest of the flock scatters
        P.ents.forEach(o => { if (o.type === 'sheep' && Math.abs(o.x - e.x) < 160) { o.scared = 50; o.dir = o.x < e.x ? -1 : 1; } });
        proDropGold(e.x);
        showKhaleesiBanner('"Good boy! And a few gold coins for the shepherd. We never take without paying."', 300);
        break;
      }
    }
  }

  if (P.carried) {
    P.carried.t++;
    if (P.carried.t === 30) proBaa();
    if (P.carried.t >= PRO_CARRY_FRAMES) {
      // CHOMP
      for (let i = 0; i < 18; i++) {
        particles.push({ x: dragon.x + 30, y: dragon.y + 4, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.8) * 4,
                         size: 3 + Math.random() * 4, life: 30 + Math.random() * 20, color: Math.random() < 0.8 ? '#ffffff' : '#e8e2d0' });
      }
      floatingTexts.push({ x: dragon.x + 10, y: dragon.y - 30, text: 'CHOMP!', color: '#ffffff', alpha: 1.0, vy: -1.4 });
      sound.knightHit();
      P.carried = null;
      P.sheepEaten = true;
      P.eatenAt = P.t;
    }
  }

  // Khaleesi's gold pouch flies to the shepherd
  const pch = P.pouch;
  if (pch) {
    pch.t++;
    const tgt = pch.shepherd && !pch.shepherd.gone ? pch.shepherd.x + 10 : pch.tx;
    if (!pch.shepherd) pch.tx -= PRO_SPEED;
    const u = Math.min(1, pch.t / PRO_POUCH_FRAMES);
    const ty = gY - 18;
    pch.x = pch.sx + (tgt - pch.sx) * u;
    pch.y = pch.sy + (ty - pch.sy) * u - Math.sin(u * Math.PI) * 70;
    if (pch.t % 3 === 0) P.coins.push({ x: pch.x, y: pch.y, life: 20 });
    if (u >= 1) {
      for (let i = 0; i < 16; i++) {
        particles.push({ x: pch.x, y: pch.y, vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 4,
                         size: 2 + Math.random() * 3, life: 30, color: Math.random() < 0.6 ? '#f1c40f' : '#fff3a0' });
      }
      sound.heartPickup();
      if (pch.shepherd) {
        pch.shepherd.joy = 150;
        floatingTexts.push({ x: pch.x - 50, y: pch.y - 46, text: 'Bless you, m\'lady!', color: '#fff3a0', alpha: 1.0, vy: -0.8 });
      }
      else floatingTexts.push({ x: pch.x - 50, y: pch.y - 46, text: 'For the shepherd!', color: '#fff3a0', alpha: 1.0, vy: -0.8 });
      floatingTexts.push({ x: pch.x - 12, y: pch.y - 24, text: '+GOLD', color: '#f1c40f', alpha: 1.0, vy: -1.0 });
      P.pouch = null;
    }
  }
  P.coins.forEach(c => { c.life--; c.x -= PRO_SPEED * 0.5; });
  P.coins = P.coins.filter(c => c.life > 0);
}

function proDropGold(sheepX) {
  // the nearest shepherd still on screen gets paid
  let best = null, bd = 1e9;
  pro.ents.forEach(e => {
    if (e.type !== 'shepherd') return;
    const d = Math.abs(e.x - sheepX);
    if (e.x > -30 && e.x < width + 160 && d < bd) { bd = d; best = e; }
  });
  pro.pouch = { t: 0, sx: dragon.x + 6, sy: dragon.y - 34, x: dragon.x, y: dragon.y - 34, shepherd: best, tx: sheepX + 40 };
}

// music notes from lutes and singing dancers
function proUpdateNotes(shift) {
  const P = pro;
  const gY = height - groundHeight;
  P.ents.forEach(e => {
    let sx = null, sy = null, chance = 0;
    if (e.type === 'shepherd' && e.sitting) { sx = e.x + 14; sy = gY - 26; chance = 0.04; }
    if (e.type === 'maypole') { sx = e.x + proRand(-30, 30); sy = gY - 40; chance = 0.08; }
    if (e.type === 'crowd') {
      const lute = e.people.find(p => p.act === 'lute');
      if (lute) { sx = e.x + lute.dx + 12; sy = gY - 30; chance = 0.04; }
      else if (Math.random() < 0.3) { sx = e.x + proRand(0, e.w); sy = gY - 36; chance = 0.04; }
    }
    if (sx !== null && sx > -10 && sx < width + 10 && Math.random() < chance) {
      P.notes.push({ x: sx, y: sy, vx: proRand(-0.3, 0.3), vy: -proRand(0.4, 0.8), life: 90, glyph: proPick(['♪', '♫', '♩']),
                     color: proPick(['#ffffff', '#fff3a0', '#ffd1e8', '#d6f5ff']) });
    }
  });
  P.notes.forEach(n => { n.x += n.vx - shift * 0.8; n.y += n.vy; n.life--; });
  P.notes = P.notes.filter(n => n.life > 0);
}

// a short synthesized "baa"
function proBaa() {
  if (sound.muted) return;
  sound.init();
  const c = sound.ctx;
  if (!c) return;
  const now = c.currentTime;
  const osc = c.createOscillator();
  const vib = c.createOscillator();
  const vibGain = c.createGain();
  const filt = c.createBiquadFilter();
  const g = c.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(520, now);
  osc.frequency.linearRampToValueAtTime(430, now + 0.45);
  vib.frequency.value = 28;
  vibGain.gain.value = 30;
  vib.connect(vibGain); vibGain.connect(osc.frequency);
  filt.type = 'bandpass'; filt.frequency.value = 1100; filt.Q.value = 2;
  osc.connect(filt); filt.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(0.18, now + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
  osc.start(now); vib.start(now);
  osc.stop(now + 0.52); vib.stop(now + 0.52);
}

// ---------- the ballista capture (state CAPTURE) ----------
const CAP_FIRE = 70, CAP_HIT = 98, CAP_PULL = 140, CAP_ARRIVE = 250, CAP_INSIDE = 285, CAP_ROAR = 300, CAP_FADE = 360, CAP_END = 410;

function proBallista() {
  // muzzle of the ballista on top of the wall (matches drawProCastle)
  const gY = height - groundHeight;
  const wallTop = gY - proWallHeight();
  return { x: pro.wall.x + 46, y: wallTop - 22, wallTop: wallTop };
}
function proWallHeight() { return Math.min(height * 0.42, 300); }

function startCapture() {
  state = 'CAPTURE';
  isHoldingAction = false;
  invulnerableTimer = 0;
  pro.cap = { t: 0, kOff: false, net: null, kx: 0, ky: 0, hoverY: Math.min(Math.max(dragon.y, height * 0.3), height * 0.5), tumble: 0 };
  showKhaleesiBanner('"Syraxx... the knights are aiming something at us! Pull up!"', 120);
}

function updateCapture() {
  const C = pro.cap;
  const t = ++C.t;
  pro.t++;
  const B = proBallista();
  const hoverX = width * 0.3;

  // Syraxx is no longer under the player's control
  if (t < CAP_HIT) {
    dragon.x += (hoverX - dragon.x) * 0.05;
    dragon.y += (C.hoverY + Math.sin(t / 12) * 6 - dragon.y) * 0.06;
    dragon.velocity = Math.sin(t / 12) * -1.5;
    if (t % 22 === 0) { dragon.wingState = 1; sound.flap(); }
  } else if (t < CAP_PULL + 40) {
    // tangled: thrashing and sinking
    dragon.y += 0.35;
    dragon.x += Math.sin(t * 0.9) * 1.6;
    dragon.velocity = Math.sin(t * 0.7) * 6;
    if (t % 5 === 0) dragon.wingState = 0.6;
  } else {
    // free again, climbing back up, frantic
    C.tumble *= 0.9;
    dragon.x += (hoverX - dragon.x) * 0.04;
    dragon.y += (height * 0.36 - dragon.y) * 0.04;
    dragon.velocity = -2 + Math.sin(t / 6);
    if (t % 10 === 0) { dragon.wingState = 1; sound.flap(); }
  }

  if (t === CAP_FIRE) {
    sound.arrowLaunch();
    sound.boulderLaunch();
    C.net = { x: B.x, y: B.y, open: 0 };
  }
  if (C.net && t < CAP_HIT) {
    const u = (t - CAP_FIRE) / (CAP_HIT - CAP_FIRE);
    C.net.x = B.x + (dragon.x - B.x) * u;
    C.net.y = B.y + (dragon.y - 6 - B.y) * u - Math.sin(u * Math.PI) * 40;
    C.net.open = u;
  }
  if (t === CAP_HIT) {
    sound.hit();
    showKhaleesiBanner('"A net! Syraxx, we\'re caught!"', 120);
  }
  if (t >= CAP_HIT && t < CAP_PULL) {
    C.net.x = dragon.x; C.net.y = dragon.y - 6; C.net.open = 1;
    C.kx = dragon.x + 5; C.ky = dragon.y - 47;
  }
  if (t === CAP_PULL) {
    C.kOff = true;
    C.tumble = 1;
    sound.knightHit();
    showKhaleesiBanner('"SYRAXX! SYRAXX, HELP ME!"', 150);
  }
  if (t >= CAP_PULL && t <= CAP_ARRIVE) {
    // Khaleesi, wrapped in the net, is reeled along the rope to the wall
    const u = Math.min(1, (t - CAP_PULL) / (CAP_ARRIVE - CAP_PULL));
    const e = u * u * (3 - 2 * u);
    const fromX = dragon.x + 5, fromY = dragon.y - 40;
    C.kx = fromX + (B.x - 6 - fromX) * e;
    C.ky = fromY + (B.y + 6 - fromY) * e + Math.sin(e * Math.PI) * 30;
    C.net.x = C.kx; C.net.y = C.ky + 8;
  }
  if (t === CAP_ARRIVE - 40) showKhaleesiBanner('"Find me, Syraxx! I love you! SYRAXX!"', 170);
  if (t > CAP_ARRIVE && t <= CAP_INSIDE) {
    // dragged over the battlement and down inside the castle
    const u = (t - CAP_ARRIVE) / (CAP_INSIDE - CAP_ARRIVE);
    C.kx = B.x - 6 + u * 40;
    C.ky = B.y + 6 + u * 60;
    C.net.x = C.kx; C.net.y = C.ky + 8;
  }
  if (t === CAP_INSIDE) sound.towerDestroy();
  if (t === CAP_ROAR) { sound.fireRoar(); dragon.wingState = 1; }
  if (t >= CAP_END) startCapturedMessage();
}

function startCapturedMessage() {
  pro = null;
  currentLevel = 1;
  levelTimerSeconds = 0;
  lives = 3;
  updateHeartsDisplay();
  typedCharIndex = 0;
  textTypingComplete = false;
  totalCharCount = fullStoryText.join('\n').length;
  dragon.x = dragon.baseX; dragon.y = height * 0.4; dragon.velocity = 0; dragon.vx = 0;
  state = 'CAPTURED_MSG';
  updateLevelBadgeUI();
}

// debug key 9: jump to the end of the village and watch the capture
function debugStartCapture() {
  resetGame();
  startPrologueLevel(PRO_VILLAGE);
  pro.ents = [];
  pro.line = PRO_SCRIPT[PRO_VILLAGE].length;
  levelTimerSeconds = LEVEL_DURATIONS[PRO_VILLAGE];
  pro.wall = { x: width * 0.6, stopped: true };
  pro.ents.push({ type: 'castle', x: pro.wall.x, ref: pro.wall });
  pro.title = 0; pro.fadeIn = 0;
  startCapture();
}
</script>
<script>
// render-prologue.js — Art for the sunny prologue (see prologue.js): sky, sun, clouds, rolling hills,
// wildflower meadow, birds, sheep, shepherds with lutes, maypole dancers, thatched huts, village crowds,
// the castle wall with its ballista, the capture cutscene overlay and the story-message screens.
// Static layers are cached with bgLayer() (render-sky.js).
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

const SUNNY_CLOUD_THEME = { cloudLit: '255,255,255', cloudBody: '222,234,248' };
const FLOWER_COLORS = ['#ff5d8f', '#ffd93b', '#ffffff', '#b07cff', '#ff6b3d', '#7ec8ff', '#ff9ad5'];

// ---------- backdrop ----------
function drawSunnyBackdrop() {
  const sky = bgLayer('sunsky|' + width + 'x' + height, width, height, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#3d93e0');
    g.addColorStop(0.45, '#7cc4f2');
    g.addColorStop(0.75, '#c4e8fb');
    g.addColorStop(1, '#f2fbff');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
  });
  ctx.drawImage(sky, 0, 0);
  drawSunnySun();
  drawSunnyClouds();
  drawSunnyHills();
  drawSunnyBirds();
}

function drawSunnySun() {
  const sx = width * 0.8, sy = height * 0.13, R = 30;
  const t = Date.now() / 6000;
  ctx.save();
  const glow = ctx.createRadialGradient(sx, sy, R * 0.6, sx, sy, R * 5);
  glow.addColorStop(0, 'rgba(255,250,210,0.85)');
  glow.addColorStop(0.3, 'rgba(255,240,170,0.35)');
  glow.addColorStop(1, 'rgba(255,240,170,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sx - R * 5, sy - R * 5, R * 10, R * 10);
  // slow, soft rays
  ctx.translate(sx, sy);
  ctx.rotate(t);
  ctx.fillStyle = 'rgba(255,248,200,0.16)';
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath();
    ctx.moveTo(R * 1.1, -5);
    ctx.lineTo(R * 3.4, -13);
    ctx.lineTo(R * 3.4, 13);
    ctx.lineTo(R * 1.1, 5);
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#fff7c2';
  ctx.beginPath(); ctx.arc(sx, sy, R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fffdf0';
  ctx.beginPath(); ctx.arc(sx - 4, sy - 4, R * 0.7, 0, Math.PI * 2); ctx.fill();
}

function drawSunnyClouds() {
  const layers = [
    { speed: 0.10, tile: 1400, alpha: 0.75, key: 'far', clouds: [[160, 0.05, 0.6], [640, 0.13, 0.5], [1100, 0.02, 0.75]] },
    { speed: 0.22, tile: 1200, alpha: 0.95, key: 'near', clouds: [[120, 0.10, 0.85], [560, 0.20, 0.7], [930, 0.05, 1.0]] }
  ];
  layers.forEach(L => {
    const tileH = Math.ceil(height * 0.45);
    const tile = bgLayer('sunclouds|' + L.key + '|' + height, L.tile, tileH, (c, w) => {
      L.clouds.forEach(cl => {
        const cx = cl[0], cy = height * cl[1] + 50, s = cl[2];
        paintCloud(c, cx, cy, s, SUNNY_CLOUD_THEME, 1);
        if (cx + 130 * s > w) paintCloud(c, cx - w, cy, s, SUNNY_CLOUD_THEME, 1);
        if (cx - 130 * s < 0) paintCloud(c, cx + w, cy, s, SUNNY_CLOUD_THEME, 1);
      });
    });
    const scroll = backgroundParallaxX * L.speed;
    const startX = -(scroll % L.tile);
    ctx.globalAlpha = L.alpha;
    for (let x = startX - L.tile; x < width + L.tile; x += L.tile) ctx.drawImage(tile, Math.round(x), -30);
    ctx.globalAlpha = 1;
  });
}

// One seamless strip of rolling hills. waves: [amplitude, cycles per tile, phase]
function paintHillTile(c, w, h, base, waves, top, bottom, detail) {
  const yAt = x => {
    let y = base;
    waves.forEach(wv => { y += wv[0] * Math.sin((x / w) * Math.PI * 2 * wv[1] + wv[2]); });
    return y;
  };
  const g = c.createLinearGradient(0, base - 60, 0, h);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  c.fillStyle = g;
  c.beginPath();
  c.moveTo(0, h);
  for (let x = 0; x <= w; x += 8) c.lineTo(x, yAt(x));
  c.lineTo(w, h);
  c.closePath();
  c.fill();
  // sunlit rim along the crest
  c.strokeStyle = 'rgba(255,255,220,0.35)';
  c.lineWidth = 2;
  c.beginPath();
  for (let x = 0; x <= w; x += 8) { if (x === 0) c.moveTo(x, yAt(x) + 1); else c.lineTo(x, yAt(x) + 1); }
  c.stroke();
  if (detail) detail(c, w, h, yAt);
}

function drawSunnyHills() {
  const gY = height - groundHeight;
  const top0 = Math.floor(height * 0.38);
  const th = gY - top0 + 4;
  const village = currentLevel === PRO_VILLAGE && state !== 'SPLASH' && state !== 'START';
  const layers = [
    { key: 'far', speed: 0.06, tile: 1600, base: th * 0.32, waves: [[26, 2, 0.3], [14, 5, 1.7], [6, 11, 0.9]],
      top: '#9fcfb2', bottom: '#b9dcc6', detail: (c, w, h, yAt) => {
        // distant flower haze
        for (let i = 0; i < 260; i++) {
          const x = hash2(i, 11) * w, y = yAt(x) + 6 + hash2(i, 12) * (h - yAt(x));
          c.fillStyle = 'rgba(255,' + (150 + Math.floor(hash2(i, 13) * 100)) + ',200,0.35)';
          c.fillRect(x, y, 2, 1);
        }
      } },
    { key: 'mid', speed: 0.14, tile: 1600, base: th * 0.5, waves: [[30, 3, 2.1], [16, 7, 0.4], [7, 13, 2.8]],
      top: '#7cc35f', bottom: '#93cf6c', detail: (c, w, h, yAt) => {
        for (let i = 0; i < 700; i++) {
          const x = hash2(i, 21) * w, y = yAt(x) + 4 + Math.pow(hash2(i, 22), 0.8) * (h - yAt(x));
          c.fillStyle = FLOWER_COLORS[Math.floor(hash2(i, 23) * FLOWER_COLORS.length)];
          c.globalAlpha = 0.55;
          c.fillRect(x, y, 2, 2);
        }
        c.globalAlpha = 1;
        // little trees
        for (let i = 0; i < 14; i++) {
          const x = hash2(i, 24) * w, y = yAt(x) + 6 + hash2(i, 25) * 20;
          c.fillStyle = '#5b3d22'; c.fillRect(x - 1, y - 6, 2, 7);
          c.fillStyle = '#3f8a3a'; c.beginPath(); c.arc(x, y - 10, 7, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#5aa84a'; c.beginPath(); c.arc(x - 2, y - 12, 4, 0, Math.PI * 2); c.fill();
        }
        if (village) {
          // a distant village of thatched roofs
          for (let i = 0; i < 26; i++) {
            const x = hash2(i, 26) * w, y = yAt(x) + 10 + hash2(i, 27) * 26;
            const hw = 9 + hash2(i, 28) * 6;
            c.fillStyle = '#e6d6b0'; c.fillRect(x - hw / 2, y - 6, hw, 6);
            c.fillStyle = '#c49a45';
            c.beginPath(); c.moveTo(x - hw / 2 - 2, y - 5); c.lineTo(x, y - 13); c.lineTo(x + hw / 2 + 2, y - 5); c.fill();
          }
        } else {
          // grazing sheep dots
          for (let i = 0; i < 40; i++) {
            const x = hash2(i, 29) * w, y = yAt(x) + 8 + hash2(i, 30) * 30;
            c.fillStyle = '#fbfbf5'; c.beginPath(); c.ellipse(x, y, 3, 2, 0, 0, Math.PI * 2); c.fill();
            c.fillStyle = '#333'; c.fillRect(x + 2, y - 1, 1.5, 1.5);
          }
        }
      } },
    { key: 'near', speed: 0.3, tile: 1600, base: th * 0.72, waves: [[24, 4, 1.2], [12, 9, 2.4], [5, 17, 0.2]],
      top: '#5fb24a', bottom: '#4fa13f', detail: (c, w, h, yAt) => {
        for (let i = 0; i < 1300; i++) {
          const x = hash2(i, 31) * w, y = yAt(x) + 3 + Math.pow(hash2(i, 32), 0.7) * (h - yAt(x));
          const col = FLOWER_COLORS[Math.floor(hash2(i, 33) * FLOWER_COLORS.length)];
          c.fillStyle = col;
          const s = 2 + Math.floor(hash2(i, 34) * 2);
          c.fillRect(x, y, s, s);
        }
        for (let i = 0; i < 6; i++) {
          const x = hash2(i, 35) * w, y = yAt(x) + 4;
          c.fillStyle = '#5b3d22'; c.fillRect(x - 2, y - 14, 4, 15);
          c.fillStyle = '#2f7a34'; c.beginPath(); c.arc(x, y - 22, 13, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#4c9d45'; c.beginPath(); c.arc(x - 4, y - 26, 8, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#6dbb58'; c.beginPath(); c.arc(x - 6, y - 29, 4, 0, Math.PI * 2); c.fill();
        }
      } }
  ];
  layers.forEach(L => {
    const tile = bgLayer('sunhill|' + L.key + '|' + width + 'x' + height + '|' + (village ? 'v' : 'm'), L.tile, th, (c, w, h) => {
      paintHillTile(c, w, h, L.base, L.waves, L.top, L.bottom, L.detail);
    });
    const scroll = sunnyScroll * L.speed;
    const startX = -(scroll % L.tile);
    for (let x = startX; x < width; x += L.tile) ctx.drawImage(tile, Math.round(x), top0);
  });
}

function drawSunnyBirds() {
  ctx.strokeStyle = '#2b3a4a';
  ctx.lineCap = 'round';
  sunnyBirds.forEach(b => {
    const f = Math.sin(b.phase) * b.size * 0.7;
    ctx.lineWidth = Math.max(1, b.size * 0.3);
    ctx.globalAlpha = 0.5 + b.depth * 0.4;
    ctx.beginPath();
    ctx.moveTo(b.x - b.size, b.y - f);
    ctx.quadraticCurveTo(b.x - b.size * 0.4, b.y - b.size * 0.4, b.x, b.y);
    ctx.quadraticCurveTo(b.x + b.size * 0.4, b.y - b.size * 0.4, b.x + b.size, b.y - f);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';
}

// ---------- ground: wildflower meadow (and a dirt lane in the village) ----------
function drawSunnyGround() {
  const gY = height - groundHeight;
  const village = currentLevel === PRO_VILLAGE && state !== 'SPLASH' && state !== 'START';
  const TW = 640;
  const tile = bgLayer('sunground|' + groundHeight + '|' + (village ? 'v' : 'm'), TW, groundHeight + 8, (c, w, h) => {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#62b84c');
    g.addColorStop(1, '#3f8f37');
    c.fillStyle = g;
    c.fillRect(0, 8, w, h - 8);
    if (village) {
      c.fillStyle = '#c9a66b';
      c.fillRect(0, 30, w, 22);
      c.fillStyle = '#b28f57';
      for (let i = 0; i < 60; i++) c.fillRect(hash2(i, 41) * w, 31 + hash2(i, 42) * 20, 3, 2);
      c.fillStyle = '#ddbf86';
      c.fillRect(0, 30, w, 2);
    }
    // grass blades along the top edge
    for (let x = 0; x < w; x += 3) {
      const bh = 5 + hash2(x, 43) * 7;
      c.fillStyle = hash2(x, 44) < 0.5 ? '#6cc453' : '#57ad44';
      c.fillRect(x, 9 - bh, 2, bh + 1);
    }
    // flowers
    const n = village ? 220 : 520;
    for (let i = 0; i < n; i++) {
      const x = hash2(i, 45) * w;
      let y = 6 + hash2(i, 46) * (h - 10);
      if (village && y > 26 && y < 54) continue;
      const col = FLOWER_COLORS[Math.floor(hash2(i, 47) * FLOWER_COLORS.length)];
      c.fillStyle = '#2f7a2c';
      c.fillRect(x + 1, y + 2, 1, 4);
      c.fillStyle = col;
      c.fillRect(x, y, 3, 3);
      c.fillStyle = '#fff6a8';
      c.fillRect(x + 1, y + 1, 1, 1);
    }
  });
  const startX = -(sunnyScroll % TW);
  for (let x = startX; x < width; x += TW) ctx.drawImage(tile, Math.round(x), gY - 8);
}

// ---------- villager extras used by render-people.js ----------
function drawVillagerTool(k, L, handY) {
  if (k.tool === 'crook') {
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(18, -4, 2, 30);
    ctx.strokeStyle = '#7a5230';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(21, -4, 3, Math.PI, Math.PI * 2.2); ctx.stroke();
  } else if (k.tool === 'basket') {
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(15, handY + 1, 8, 6);
    ctx.fillStyle = '#b07a3e';
    ctx.fillRect(15, handY + 2, 8, 1); ctx.fillRect(15, handY + 4, 8, 1);
    ctx.fillStyle = '#e74c3c'; ctx.fillRect(16, handY, 2, 2);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(19, handY - 1, 2, 2);
  } else if (k.tool === 'lute') {

}

// a lute held across the body, strummed
function drawLute(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.rotate(-0.55);
  ctx.fillStyle = '#4a2c14';
  ctx.fillRect(-14, -1.5, 12, 3);                 // neck
  ctx.fillRect(-17, -2.5, 4, 5);                  // pegbox
  ctx.fillStyle = '#b06a2c';
  ctx.beginPath(); ctx.ellipse(2, 0, 6.5, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8a4f1e';
  ctx.beginPath(); ctx.ellipse(3, 1, 4.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1608';
  ctx.beginPath(); ctx.arc(1, 0, 1.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,240,200,0.7)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(-15, 0); ctx.lineTo(6, 0); ctx.stroke();
  ctx.restore();
}

// draw a villager (render-people.js) standing at feet (x, gY), with scale and facing
function drawProPerson(p, x, footY, legMove, armSwing) {
  ctx.save();
  ctx.translate(x, footY);
  ctx.scale(p.scale || 1, p.scale || 1);
  ctx.translate(-11, -26);
  if (p.dir < 0) { ctx.translate(22, 0); ctx.scale(-1, 1); }
  drawVillagerSprite(p, legMove, armSwing);
  ctx.restore();
}

// ---------- ground scenery ----------
function drawSheep(e, gY) {
  const s = e.lamb ? 0.72 : 1;
  const hop = e.scared > 0 ? Math.abs(Math.sin(e.phase * 0.4)) * 6 : 0;
  const graze = !e.walk && !(e.scared > 0) && Math.sin(e.phase * 0.02 + e.x * 0.1) > 0;
  ctx.save();
  ctx.translate(e.x, gY - hop);
  ctx.scale(e.dir * s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 3, 0, 0, Math.PI * 2); ctx.fill();
  const leg = (e.walk || e.scared > 0) ? Math.sin(e.phase * 0.25) * 2 : 0;
  ctx.fillStyle = '#2b2b2b';
  ctx.fillRect(-9 + leg, -8, 3, 8); ctx.fillRect(-4 - leg, -8, 3, 8);
  ctx.fillRect(4 + leg, -8, 3, 8); ctx.fillRect(8 - leg, -8, 3, 8);
  // wool
  ctx.fillStyle = '#d9d6cb';
  ctx.beginPath(); ctx.ellipse(0, -13, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fbfaf3';
  [[-9, -15, 6], [-3, -18, 7], [4, -17, 7], [10, -14, 5], [-6, -11, 6], [3, -11, 6]].forEach(b => {
    ctx.beginPath(); ctx.arc(b[0], b[1], b[2], 0, Math.PI * 2); ctx.fill();
  });
  // head
  const hx = 13, hy = graze ? -6 : -17;
  ctx.fillStyle = '#2b2b2b';
  ctx.beginPath(); ctx.ellipse(hx, hy, 5, 4, graze ? 0.9 : 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillRect(hx - 6, hy - 3, 3, 2);           // ear
  ctx.fillStyle = '#fbfaf3';
  ctx.beginPath(); ctx.arc(hx - 2, hy - 3, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(hx + 1, hy - 1, 1.5, 1.5);
  ctx.restore();
}

function drawShepherd(e, gY) {
  const p = e.person;
  const jump = e.joy > 0 ? Math.abs(Math.sin(e.joy * 0.25)) * 10 : 0;
  if (e.sitting && e.joy <= 0) {
    // seated on a rock, playing the lute
    ctx.fillStyle = '#8f9499';
    ctx.beginPath(); ctx.ellipse(e.x + 10, gY - 4, 12, 6, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#a9aeb3';
    ctx.beginPath(); ctx.ellipse(e.x + 8, gY - 7, 7, 3, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(e.x - 1, gY - 34);
    ctx.scale(-1, 1);
    ctx.translate(-22, 0);
    const c = p.costume, L = p.look;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(11, 33, 12, 2.4, 0, 0, Math.PI * 2); ctx.fill();
    // legs out in front
    ctx.fillStyle = shadeHex(c.pants, -20);
    ctx.fillRect(10, 20, 13, 5);
    ctx.fillStyle = '#3b2616';
    ctx.fillRect(21, 20, 4, 9);
    ctx.fillStyle = c.pants;
    ctx.fillRect(21, 24, 3, 5);
    // body, head, hair/hat
    ctx.fillStyle = '#1b1410'; ctx.fillRect(5, 5, 12, 17);
    ctx.fillStyle = c.tunic; ctx.fillRect(6, 6, 10, 15);
    ctx.fillStyle = shadeHex(c.tunic, -45); ctx.fillRect(6, 6, 3, 15);
    ctx.fillStyle = '#1b1410'; ctx.fillRect(6, -4, 11, 10);
    ctx.fillStyle = L.skin; ctx.fillRect(7, -3, 9, 8);
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(13, 0, 2, 1);          // eyes closed, enjoying the tune
    ctx.fillStyle = shadeHex(L.skin, -60); ctx.fillRect(13, 3, 3, 1);
    if (L.beard) { ctx.fillStyle = c.hair; ctx.fillRect(8, 2, 9, 4); }
    ctx.fillStyle = '#c9a54a'; ctx.fillRect(3, -5, 17, 2);
    ctx.fillStyle = '#e3c26a'; ctx.fillRect(7, -9, 10, 5);
    // lute and strumming hand
    drawLute(15, 15, 1.05);
    const strum = Math.sin(Date.now() / 90 + e.x) * 1.5;
    ctx.fillStyle = L.skin;
    ctx.fillRect(16, 14 + strum, 3, 3);
    ctx.fillRect(6, 8, 3, 3);
    ctx.restore();
  } else {
    p.dir = -1;
    const wave = e.joy > 0;
    p.wave = wave;
    drawProPerson(p, e.x + 11, gY - jump, 0, 0);
    p.wave = false;
  }
}

function drawMaypole(e, gY) {
  const t = Date.now() / 1000;
  const top = { x: e.x, y: gY - 86 };
  const R = 36;
  const ds = e.dancers.map((d, i) => {
    const a = t * 0.9 + d.phase;
    return { d: d, a: a, x: e.x + Math.cos(a) * R, depth: Math.sin(a), i: i };
  });
  const drawDancer = q => {
    const d = q.d;
    const hop = Math.abs(Math.sin(t * 6 + q.i)) * 4;
    d.dir = -Math.sin(q.a) >= 0 ? 1 : -1;
    d.wave = true;
    const sc = 0.88 + q.depth * 0.1;
    d.scale = sc;
    const fy = gY - 2 + q.depth * 4 - hop;
    drawProPerson(d, q.x, fy, Math.sin(t * 12 + q.i) * 2, 0);
    d.wave = false;
    // ribbon to the top of the pole
    ctx.strokeStyle = e.ribbon[q.i % e.ribbon.length];
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(top.x, top.y + 4);
    ctx.quadraticCurveTo((top.x + q.x) / 2, (top.y + fy - 30) / 2 + 10, q.x + d.dir * 5 * sc, fy - 30 * sc);
    ctx.stroke();
  };
  ds.filter(q => q.depth < 0).sort((a, b) => a.depth - b.depth).forEach(drawDancer);
  // the pole with a flower crown
  ctx.fillStyle = '#7a5230'; ctx.fillRect(e.x - 2.5, top.y, 5, gY - top.y);
  ctx.fillStyle = '#9a6a40'; ctx.fillRect(e.x - 2.5, top.y, 2, gY - top.y);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    ctx.fillStyle = e.ribbon[i % e.ribbon.length];
    ctx.beginPath(); ctx.arc(top.x + Math.cos(a) * 7, top.y + 4 + Math.sin(a) * 3, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#f1c40f';
  ctx.beginPath(); ctx.arc(top.x, top.y - 2, 3, 0, Math.PI * 2); ctx.fill();
  ds.filter(q => q.depth >= 0).sort((a, b) => a.depth - b.depth).forEach(drawDancer);
}

function drawHut(e, gY) {
  const x = e.x, w = e.w, wy = gY - e.wallH;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(x - 4, gY - 3, w + 8, 4);
  // wattle-and-daub walls with a timber frame
  ctx.fillStyle = '#ead9b4';
  ctx.fillRect(x, wy, w, e.wallH);
  ctx.fillStyle = '#d8c497';
  ctx.fillRect(x, gY - 6, w, 6);
  ctx.fillStyle = '#6b4a2b';
  ctx.fillRect(x, wy, 4, e.wallH); ctx.fillRect(x + w - 4, wy, 4, e.wallH);
  ctx.fillRect(x, wy, w, 3);
  ctx.fillRect(x + w * 0.5 - 2, wy, 4, e.wallH);
  ctx.save();
  ctx.strokeStyle = '#6b4a2b'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  if (e.doorLeft) { ctx.moveTo(x + w * 0.5, wy + 3); ctx.lineTo(x + w - 4, gY); }
  else { ctx.moveTo(x + 4, wy + 3); ctx.lineTo(x + w * 0.5, gY); }
  ctx.stroke();
  ctx.restore();
  // door and window
  const dx = e.doorLeft ? x + w * 0.16 : x + w * 0.6;
  ctx.fillStyle = '#4a3020';
  ctx.beginPath();
  ctx.moveTo(dx, gY); ctx.lineTo(dx, gY - 16); ctx.arc(dx + 7, gY - 16, 7, Math.PI, 0); ctx.lineTo(dx + 14, gY); ctx.fill();
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(dx + 6, gY - 22, 2, 22);
  ctx.fillStyle = '#d4a017'; ctx.fillRect(dx + 10, gY - 11, 2, 2);
  const wx = e.doorLeft ? x + w * 0.66 : x + w * 0.2;
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(wx, wy + 8, 11, 9);
  ctx.fillStyle = '#ffd98a'; ctx.fillRect(wx + 1, wy + 9, 9, 7);
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(wx + 5, wy + 8, 1, 9); ctx.fillRect(wx, wy + 12, 11, 1);
  ctx.fillStyle = '#4c9d45'; ctx.fillRect(wx - 1, wy + 17, 13, 3);
  ctx.fillStyle = '#ff5d8f'; ctx.fillRect(wx + 1, wy + 16, 2, 2); ctx.fillRect(wx + 7, wy + 16, 2, 2);
  // thatched roof
  const rTop = wy - e.roofH;
  ctx.fillStyle = '#a77e34';
  ctx.beginPath();
  ctx.moveTo(x - 9, wy + 5);
  ctx.quadraticCurveTo(x + w * 0.12, rTop + 4, x + w * 0.32, rTop);
  ctx.lineTo(x + w * 0.68, rTop);
  ctx.quadraticCurveTo(x + w * 0.88, rTop + 4, x + w + 9, wy + 5);
  ctx.closePath();
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#c9a24a';
  ctx.fillRect(x - 10, rTop, w + 20, e.roofH + 6);
  for (let r = 0; r < 4; r++) {
    const ry = rTop + 6 + r * (e.roofH / 4);
    ctx.fillStyle = '#a77e34';
    ctx.fillRect(x - 10, ry + e.roofH / 4 - 3, w + 20, 2);
    ctx.fillStyle = '#ddb85e';
    ctx.fillRect(x - 10, ry, w + 20, 1);
  }
  ctx.strokeStyle = 'rgba(120,85,30,0.55)';
  ctx.lineWidth = 1;
  for (let i = 0; i < w + 20; i += 4) {
    const sx = x - 10 + i;
    const len = 4 + hash2(e.seed + i, 7) * 6;
    const sy = rTop + hash2(e.seed, i) * e.roofH;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 1, sy + len); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#8f6a2a';
  ctx.fillRect(x + w * 0.3, rTop - 2, w * 0.4, 4);
  // ragged eave
  ctx.fillStyle = '#b58c3c';
  for (let i = -9; i < w + 9; i += 4) ctx.fillRect(x + i, wy + 3 + hash2(e.seed, i + 50) * 4, 3, 3);
  // chimney smoke
  if (e.smoke) {
    const sx = x + w * 0.62, sy = rTop - 2;
    const t = Date.now() / 1000;
    for (let i = 0; i < 5; i++) {
      const k = ((t * 0.5 + i / 5 + e.seed * 0.01) % 1);
      ctx.fillStyle = 'rgba(240,240,240,' + (0.45 * (1 - k)) + ')';
      ctx.beginPath(); ctx.arc(sx - k * 18 + Math.sin(k * 6 + i) * 3, sy - k * 50, 4 + k * 8, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawWell(e, gY) {
  const x = e.x;
  ctx.fillStyle = '#7a5230'; ctx.fillRect(x - 14, gY - 40, 3, 30); ctx.fillRect(x + 11, gY - 40, 3, 30);
  ctx.fillStyle = '#a0522d';
  ctx.beginPath(); ctx.moveTo(x - 20, gY - 38); ctx.lineTo(x, gY - 52); ctx.lineTo(x + 20, gY - 38); ctx.fill();
  ctx.fillStyle = '#5b3d22'; ctx.fillRect(x - 12, gY - 34, 24, 2);
  ctx.strokeStyle = '#d8c497'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 2, gY - 33); ctx.lineTo(x + 2, gY - 24); ctx.stroke();
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(x - 1, gY - 24, 6, 5);
  ctx.fillStyle = '#8f9499'; ctx.fillRect(x - 16, gY - 16, 32, 16);
  ctx.fillStyle = '#a9aeb3';
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) ctx.fillRect(x - 16 + c * 8 + (r % 2) * 4, gY - 16 + r * 5, 6, 4);
  ctx.fillStyle = '#6d7277'; ctx.fillRect(x - 17, gY - 18, 34, 3);
}

function drawHen(h, x, gY) {
  const peck = Math.sin(Date.now() / 200 + h.phase) > 0.6;
  ctx.save();
  ctx.translate(x, gY);
  ctx.scale(h.dir, 1);
  ctx.fillStyle = '#fafafa';
  ctx.beginPath(); ctx.ellipse(0, -6, 6, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e8e2d0'; ctx.fillRect(-7, -9, 3, 4);
  const hy = peck ? -3 : -10;
  ctx.fillStyle = '#fafafa'; ctx.beginPath(); ctx.arc(5, hy, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e74c3c'; ctx.fillRect(4, hy - 4, 2, 2);
  ctx.fillStyle = '#f39c12'; ctx.fillRect(7, hy - 0.5, 2, 1.5);
  ctx.fillStyle = '#f39c12'; ctx.fillRect(-1, -2, 1, 2); ctx.fillRect(1, -2, 1, 2);
  ctx.restore();
}

function drawCrowd(e, gY) {
  const t = Date.now() / 1000;
  e.hens.forEach(h => {
    h.dx += h.dir * 0.08;
    if (Math.random() < 0.005) h.dir *= -1;
    drawHen(h, e.x + h.dx, gY);
  });
  e.people.forEach(p => {
    let legMove = 0, arm = 0, bob = 0;
    const px = e.x + p.dx;
    if (p.act === 'walk' || p.act === 'run' || p.act === 'basket') {
      if (p.speed) {
        p.dx += p.dir * p.speed;
        if (p.dx < -30 || p.dx > e.w) p.dir *= -1;
        legMove = Math.sin(t * (p.act === 'run' ? 16 : 9) + p.phase) * 2;
        arm = legMove;
        if (p.act === 'run') bob = Math.abs(Math.sin(t * 16 + p.phase)) * 2;
      }
    } else if (p.act === 'dance') {
      bob = Math.abs(Math.sin(t * 6 + p.phase)) * 4;
      legMove = Math.sin(t * 12 + p.phase) * 2;
      p.dir = Math.sin(t * 1.5 + p.phase) > 0 ? 1 : -1;
    } else if (p.act === 'talk') {
      bob = Math.abs(Math.sin(t * 3 + p.phase)) * 1;
      arm = Math.sin(t * 4 + p.phase) * 2;
    } else if (p.act === 'lute') {
      p.dir = 1;
      bob = Math.abs(Math.sin(t * 4 + p.phase)) * 1;
    }
    // everyone looks up and waves when the dragon flies over
    const near = Math.abs(dragon.x - px) < 200;
    p.wave = (p.act === 'wave' && near) || p.act === 'dance' || (p.act === 'run' && near && Math.sin(t + p.phase) > 0);
    if (p.act === 'wave' && near) p.dir = dragon.x < px ? -1 : 1;
    drawProPerson(p, px, gY - bob, legMove, arm);
    p.wave = false;
  });
}

// the slavers' castle at the end of the village, with its ballista and knight crew
function drawProCastle(e, gY) {
  const W = e.ref;
  const x = W.x;
  const wallH = proWallHeight();
  const wallTop = gY - wallH;
  const wallW = Math.ceil(width * 0.5 + 260);
  if (!W.owner) W.owner = { brickStyle: 2, brickSeed: 77 };
  drawMasonry(x, wallTop, wallW, wallH, stonePalette, W.owner);
  // shade + crenellations
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x, wallTop, 6, wallH);
  for (let mx = x; mx < x + wallW; mx += 24) {
    drawMasonry(mx, wallTop - 14, 14, 14, stonePalette, W.owner);
  }
  ctx.fillStyle = stonePalette.dark;
  ctx.fillRect(x, wallTop - 2, wallW, 3);
  // gatehouse with a portcullis
  const gx = x + 120, gw = 64;
  ctx.fillStyle = '#0b0f14';
  ctx.beginPath(); ctx.moveTo(gx, gY); ctx.lineTo(gx, gY - 50); ctx.arc(gx + gw / 2, gY - 50, gw / 2, Math.PI, 0); ctx.lineTo(gx + gw, gY); ctx.fill();
  ctx.strokeStyle = '#3d4650'; ctx.lineWidth = 3;
  for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(gx + i * gw / 6, gY - 78); ctx.lineTo(gx + i * gw / 6, gY); ctx.stroke(); }
  for (let j = 0; j < 5; j++) { ctx.beginPath(); ctx.moveTo(gx, gY - 10 - j * 15); ctx.lineTo(gx + gw, gY - 10 - j * 15); ctx.stroke(); }
  // slavers' banners: a golden wheel on black
  [x + 70, x + 220].forEach((bx, i) => {
    const sway = Math.sin(Date.now() / 500 + i) * 2;
    ctx.fillStyle = '#1c1014';
    ctx.beginPath(); ctx.moveTo(bx, wallTop + 10); ctx.lineTo(bx + 30, wallTop + 10); ctx.lineTo(bx + 30 + sway, wallTop + 80); ctx.lineTo(bx + 15 + sway, wallTop + 70); ctx.lineTo(bx + sway, wallTop + 80); ctx.fill();
    ctx.strokeStyle = '#d4a017'; ctx.lineWidth = 2;
    const cx = bx + 15 + sway * 0.5, cy = wallTop + 38;
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.stroke();
    for (let s = 0; s < 4; s++) {
      const a = s * Math.PI / 4;
      ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * 9, cy - Math.sin(a) * 9); ctx.lineTo(cx + Math.cos(a) * 9, cy + Math.sin(a) * 9); ctx.stroke();
    }
  });
  drawProBallista(x, wallTop);
  // the crew
  if (!W.crew) {
    W.crew = [
      { relX: 0, direction: -1, state: 'ALIVE', heat: 0, thrustT: 0, deflectT: 0, aim: -Math.PI / 2 - 0.25 },
      { relX: 86, direction: -1, state: 'ALIVE', heat: 0, thrustT: 0, deflectT: 0, aim: -Math.PI / 2 - 0.15 },
      { relX: 150, direction: -1, state: 'ALIVE', heat: 0, thrustT: 0, deflectT: 0, aim: -Math.PI / 2 - 0.2 }
    ];
  }
  const obsRef = { x: x, bottomY: wallTop - 2 };
  W.crew.forEach(k => { k.obsRef = obsRef; drawSmallKnight(k); });
}

function proBallistaAim(bx, by) {
  return Math.atan2(dragon.y - by, dragon.x - bx);
}

function drawProBallista(x, wallTop) {
  const bx = x + 46, by = wallTop - 22;
  const C = pro && pro.cap;
  const t = C ? C.t : 0;
  // keep pointing at the dragon until the net leaves, then hold
  let aim = proBallistaAim(bx, by);
  if (C && t >= CAP_FIRE) aim = C.aimHold !== undefined ? C.aimHold : (C.aimHold = aim);
  aim = Math.max(Math.PI * 0.8, Math.min(Math.PI * 1.15, aim < 0 ? aim + Math.PI * 2 : aim));
  // stand
  ctx.fillStyle = '#5b3d22';
  ctx.fillRect(bx - 12, by + 4, 4, 18); ctx.fillRect(bx + 8, by + 4, 4, 18);
  ctx.fillRect(bx - 14, by + 18, 28, 4);
  // winch drum
  const spin = C && t >= CAP_PULL && t < CAP_INSIDE ? t * 0.4 : 0;
  ctx.fillStyle = '#7a5230';
  ctx.beginPath(); ctx.arc(bx + 18, by + 10, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3d2a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx + 18 + Math.cos(spin) * 7, by + 10 + Math.sin(spin) * 7); ctx.lineTo(bx + 18 - Math.cos(spin) * 7, by + 10 - Math.sin(spin) * 7); ctx.stroke();
  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(aim);
  // stock
  ctx.fillStyle = '#7a5230';
  ctx.fillRect(-18, -3, 40, 6);
  ctx.fillStyle = '#9a6a40';
  ctx.fillRect(-18, -3, 40, 2);
  // bow arms and string
  const drawn = !C || t < CAP_FIRE;
  const pull = drawn ? (C ? Math.min(1, t / 50) : 0.6) : 0;
  ctx.strokeStyle = '#4a2c14'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(16, -22 + pull * 4); ctx.quadraticCurveTo(24, 0, 16, 22 - pull * 4); ctx.stroke();
  ctx.strokeStyle = '#e8e2d0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(16, -21 + pull * 4); ctx.lineTo(16 - pull * 22, 0); ctx.lineTo(16, 21 - pull * 4); ctx.stroke();
  ctx.fillStyle = '#9aa4ad';
  ctx.fillRect(18, -4, 6, 8);
  // the loaded net bundle
  if (drawn) {
    ctx.fillStyle = '#8c8471';
    ctx.beginPath(); ctx.arc(24, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#5e5747'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(19, -3); ctx.lineTo(29, 3); ctx.moveTo(19, 3); ctx.lineTo(29, -3); ctx.stroke();
  }
  ctx.restore();
}

function drawProEnts() {
  if (!pro || !(state === 'PLAYING' || state === 'PAUSED' || state === 'GAMEOVER' || state === 'CAPTURE')) return;
  const gY = height - groundHeight;
  const order = { castle: 0, hut: 1, well: 2, maypole: 3, sheep: 4, shepherd: 5, crowd: 6 };
  const ents = pro.ents.slice().sort((a, b) => (order[a.type] - order[b.type]));
  ents.forEach(e => {
    if (e.type !== 'castle' && (e.x < -140 || e.x > width + 160)) return;
    if (e.type === 'sheep') drawSheep(e, gY);
    else if (e.type === 'shepherd') drawShepherd(e, gY);
    else if (e.type === 'maypole') drawMaypole(e, gY);
    else if (e.type === 'hut') drawHut(e, gY);
    else if (e.type === 'well') drawWell(e, gY);
    else if (e.type === 'crowd') drawCrowd(e, gY);
    else if (e.type === 'castle') drawProCastle(e, gY);
  });
  // music notes
  ctx.font = 'bold 14px "Proxima Nova", sans-serif';
  ctx.textAlign = 'center';
  pro.notes.forEach(n => {
    ctx.globalAlpha = Math.min(1, n.life / 30);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillText(n.glyph, n.x + 1, n.y + 1);
    ctx.fillStyle = n.color;
    ctx.fillText(n.glyph, n.x, n.y);
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
  // the sheep in Syraxx's claws
  if (pro.carried) {
    const s = { x: dragon.x + 4, dir: 1, phase: pro.carried.t * 3, scared: 1, lamb: pro.carried.lamb };
    drawSheep(s, dragon.y + 46);
  }
  // Khaleesi's gold pouch and its trail of coins
  pro.coins.forEach(c => {
    ctx.globalAlpha = c.life / 20;
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.arc(c.x, c.y, 2, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  const pch = pro.pouch;
  if (pch) {
    ctx.fillStyle = '#8a5a2b';
    ctx.beginPath(); ctx.ellipse(pch.x, pch.y, 6, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b4423'; ctx.fillRect(pch.x - 3, pch.y - 9, 6, 3);
    ctx.fillStyle = '#f1c40f'; ctx.fillRect(pch.x - 2, pch.y - 2, 4, 4);
    ctx.fillStyle = '#fff3a0'; ctx.fillRect(pch.x - 1, pch.y - 1, 1, 1);
  }
}

// title card and fades during the prologue levels
function drawProOverlay() {
  if (!pro) return;
  if (pro.title > 0) {
    const t = PRO_TITLE_FRAMES - pro.title;
    const a = Math.min(1, t / 30, pro.title / 40);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px "Proxima Nova", sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    const title = currentLevel === PRO_MEADOW ? 'THE VALLEY OF PEACE' : 'THE VILLAGE';
    const sub = currentLevel === PRO_MEADOW ? 'PROLOGUE  ·  PART I' : 'PROLOGUE  ·  PART II';
    ctx.fillText(sub, width / 2 + 1, height * 0.3 - 33);
    ctx.fillStyle = '#fffbe6';
    ctx.fillText(sub, width / 2, height * 0.3 - 34);
    ctx.font = 'bold 28px "Proxima Nova", sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(title, width / 2 + 2, height * 0.3 + 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(title, width / 2, height * 0.3);
    ctx.restore();
  }
  let fade = 0;
  if (pro.fadeIn > 0) fade = pro.fadeIn / 40;
  if (pro.ending > 0) fade = Math.min(1, pro.ending / PRO_END_FADE);
  if (fade > 0) {
    ctx.fillStyle = 'rgba(255,250,235,' + fade + ')';
    ctx.fillRect(-20, -20, width + 40, height + 40);
  }
}

// ---------- the capture ----------
function drawProNetMesh(cx, cy, rx, ry, rot) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot || 0);
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(120,110,90,0.18)';
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.strokeStyle = '#6e6553';
  ctx.lineWidth = 1.4;
  for (let i = -rx - ry; i < rx + ry; i += 8) {
    ctx.beginPath(); ctx.moveTo(i, -ry); ctx.lineTo(i + ry * 2, ry); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i, ry); ctx.lineTo(i + ry * 2, -ry); ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = '#4e4738';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawCaptureOverlay() {
  const C = pro && pro.cap;
  if (!C) return;
  const t = C.t;
  const B = proBallista();

  // the rope from the ballista to the net
  if (C.net && t >= CAP_FIRE && t < CAP_INSIDE + 10) {
    const sag = t < CAP_PULL ? 40 : 10;
    ctx.strokeStyle = '#d8cfb4';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(B.x + 18, B.y + 10);
    ctx.quadraticCurveTo((B.x + C.net.x) / 2, Math.max(B.y, C.net.y) + sag, C.net.x, C.net.y);
    ctx.stroke();
  }

  drawDragon(dragon.x, dragon.y, C.tumble ? Math.sin(t * 0.5) * C.tumble * 1.4 : null);

  // the net in flight, opening up
  if (C.net && t >= CAP_FIRE && t < CAP_HIT) {
    const r = 6 + C.net.open * 36;
    drawProNetMesh(C.net.x, C.net.y, r, r * 0.8, t * 0.2);
  }
  // wrapped around Syraxx and Khaleesi
  if (t >= CAP_HIT && t < CAP_PULL) {
    drawProNetMesh(dragon.x, dragon.y - 14, 48, 40, Math.sin(t * 0.6) * 0.1);
  }
  // Khaleesi bundled in the net, reeled to the castle
  if (C.kOff && t <= CAP_INSIDE + 2) {
    ctx.save();
    if (t > CAP_ARRIVE) { ctx.beginPath(); ctx.rect(-50, -50, width + 100, B.wallTop - 14 + 50); ctx.clip(); }
    const wob = Math.sin(t * 0.5) * 0.3;
    ctx.save();
    ctx.translate(C.kx, C.ky);
    ctx.rotate(wob);
    drawKhaleesiSprite(0, 0, 0.9);
    ctx.restore();
    drawProNetMesh(C.kx, C.ky - 2, 13, 16, wob);
    ctx.restore();
    // her cry
    if (t < CAP_ARRIVE + 20) {
      const a = Math.min(1, (t - CAP_PULL) / 8);
      const txt = t < CAP_PULL + 60 ? 'SYRAXX!' : (t < CAP_ARRIVE - 20 ? 'HELP ME!' : 'SYRAXX!!');
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = 'bold 13px "Proxima Nova", sans-serif';
      const tw = ctx.measureText(txt).width + 16;
      const bx = Math.min(width - tw - 6, C.kx - tw / 2), by = C.ky - 52;
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(bx, by, tw, 24, 8); else ctx.rect(bx, by, tw, 24);
      ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(C.kx - 5, by + 23); ctx.lineTo(C.kx, by + 32); ctx.lineTo(C.kx + 5, by + 23); ctx.fill();
      ctx.fillStyle = '#c0392b';
      ctx.textAlign = 'center';
      ctx.fillText(txt, bx + tw / 2, by + 16);
      ctx.restore();
    }
  }
  // Syraxx's roar
  if (t >= CAP_ROAR && t < CAP_ROAR + 50) {
    const a = (t - CAP_ROAR) / 50;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - a)) + ')';
    ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath(); ctx.arc(dragon.x + 30, dragon.y - 6, 20 + a * 120 + i * 18, -0.7, 0.7); ctx.stroke();
    }
  }

  // letterbox, Khaleesi's lines, then the fade to black
  const barH = height * 0.07 * Math.min(1, t / 25);
  ctx.fillStyle = '#000';
  ctx.fillRect(-20, -20, width + 40, barH + 20);
  ctx.fillRect(-20, height - barH, width + 40, barH + 20);
  renderMountedKhaleesiHUD();
  if (t >= CAP_FADE) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, (t - CAP_FADE) / (CAP_END - CAP_FADE - 10)) + ')';
    ctx.fillRect(-20, -20, width + 40, height + 40);
  }
}

// ---------- story message screens (opening invitation and the capture letter) ----------
function drawStoryMessage(lines, donePrompt) {
  const portraitSize = 180;
  const pX = (width - portraitSize) / 2;
  const pY = height / 2 - 10;
  const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;
  const bX = 25, bY = pY - 145, bW = width - 50, bH = 125;

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bX, bY, bW, bH, 14); else ctx.rect(bX, bY, bW, bH);
  ctx.fill();

  const cur = Math.floor(typedCharIndex);
  let counter = 0;
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 13px "Proxima Nova", sans-serif';
  ctx.textAlign = 'center';
  lines.forEach((line, idx) => {
    let visible = '';
    for (let c = 0; c < line.length; c++) {
      if (counter < cur) { visible += line[c]; counter++; }
    }
    ctx.fillText(visible, width / 2, bY + 18 + idx * 18);
    counter++;
  });

  ctx.fillStyle = '#11161d';
  ctx.fillRect(pX, pY, portraitSize, portraitSize);
  if (activeFrame.complete && activeFrame.naturalWidth !== 0) ctx.drawImage(activeFrame, pX, pY, portraitSize, portraitSize);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#f1c40f';
  ctx.strokeRect(pX, pY, portraitSize, portraitSize);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px "Proxima Nova", sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  const prompt = textTypingComplete ? donePrompt : 'TAP TO SHOW FULL MESSAGE';
  ctx.strokeText(prompt, width / 2, pY + portraitSize + 35);
  ctx.fillText(prompt, width / 2, pY + portraitSize + 35);
}

function drawCapturedMessage() {
  ctx.fillStyle = 'rgba(5, 5, 12, 0.55)';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#e74c3c';
  ctx.font = 'bold 24px "Proxima Nova", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('KHALEESI HAS BEEN TAKEN', width / 2, height / 2 - 185);
  drawStoryMessage(fullStoryText, 'TAP TO CONTINUE');
}
