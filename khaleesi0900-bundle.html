      trebuchets.forEach(t => {
        if (state === 'PLAYING') {
          t.x -= scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);

          t.shootCooldown--;
          if (t.shootCooldown <= 0 && t.x > 50 && t.x < width - 10) {
            t.shootCooldown = 80 + Math.random() * 50;
            t.isFiringAnim = true;
            sound.boulderLaunch();

            const launchX = t.x - 20;
            const launchY = gY - 45;
            const targetY = dragon.y;
            const dy = targetY - launchY;
            const dx = dragon.x - launchX;

            const vx = Math.min(-4.0, Math.max(-7.5, dx * 0.025));
            const vy = Math.min(-4.5, Math.max(-9.0, dy * 0.025 - 4.0));

            trebuchetBoulders.push({
              x: launchX,
              y: launchY,
              vx: vx,
              vy: vy,
              gravity: 0.16,
              radius: 9,
              life: 160
            });
          }

          if (t.isFiringAnim) {
            t.armAngle += 0.25;
            if (t.armAngle >= 1.2) {
              t.armAngle = -0.4;
              t.isFiringAnim = false;
            }
          }

          obstacles.forEach(obs => {
            if (obs.isCharred || obs.charProgress > 0) {
              const obsRight = obs.x + obs.width;
              const obsLeft = obs.x;
              if (Math.abs(t.x - obsRight) < 120 || Math.abs(t.x - obsLeft) < 120) {
                t.destroyed = true;
                gameStats.trebuchetsDestroyed++;
                sound.knightHit();
                const scoreResult = addScore(10);
                floatingTexts.push({ x: t.x - 10, y: gY - 50, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), color: '#ff9f43', alpha: 1.0, vy: -1.5 });

                for (let p = 0; p < 16; p++) {
                  particles.push({
                    x: t.x,
                    y: gY - 20,
                    vx: (Math.random() - 0.5) * 10,
                    vy: -Math.random() * 8,
                    size: 4 + Math.random() * 5,
                    life: 35,
                    color: Math.random() < 0.5 ? '#5c3d1e' : '#ff7675'
                  });
                }
              }
            }
          });

          flames.forEach(f => {
            const dist = Math.hypot(f.x - t.x, f.y - (gY - 25));
            if (dist < 34) {
              sound.knightHit();
              t.destroyed = true;
              gameStats.trebuchetsDestroyed++;
              const scoreResult = addScore(10);
              floatingTexts.push({ x: t.x - 10, y: gY - 50, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), color: '#ff9f43', alpha: 1.0, vy: -1.5 });

              for (let p = 0; p < 16; p++) {
                particles.push({
                  x: t.x,
                  y: gY - 20,
                  vx: (Math.random() - 0.5) * 10,
                  vy: -Math.random() * 8,
                  size: 4 + Math.random() * 5,
                  life: 35,
                  color: Math.random() < 0.5 ? '#5c3d1e' : '#ff7675'
                });
              }
            }
          });
        }

        if (t.destroyed) return;

        ctx.save();
        ctx.translate(t.x, gY);

        const wheelRot = -t.x * 0.08;
        const drawWheel = (wx) => {
          ctx.save();
          ctx.translate(wx, -10);
          ctx.rotate(wheelRot);

          ctx.fillStyle = '#2c3e50';
          ctx.beginPath();
          ctx.arc(0, 0, 10, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#7f8c8d';
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#7f8c8d';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-9, 0); ctx.lineTo(9, 0);
          ctx.moveTo(0, -9); ctx.lineTo(0, 9);
          ctx.stroke();

          ctx.restore();
        };

        drawWheel(-22);
        drawWheel(22);

        ctx.fillStyle = '#5c3d1e';
        ctx.fillRect(-28, -20, 56, 10);
        ctx.fillStyle = '#3d2612';
        ctx.fillRect(-24, -18, 48, 6);

        ctx.fillStyle = '#784e24';
        ctx.beginPath();
        ctx.moveTo(-22, -20);
        ctx.lineTo(-4, -48);
        ctx.lineTo(4, -48);
        ctx.lineTo(22, -20);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#4a2f13';
        ctx.fillRect(-4, -48, 8, 28);

        ctx.fillStyle = '#95a5a6';
        ctx.beginPath();
        ctx.arc(0, -46, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(0, -46);
        ctx.rotate(t.armAngle);

        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(-8, -4, 46, 8);
        ctx.fillRect(-24, -6, 18, 12);

        ctx.fillStyle = '#2c3e50';
        ctx.fillRect(-32, 2, 18, 18);

        if (!t.isFiringAnim) {
          ctx.strokeStyle = '#bdc3c7';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(38, 0);
          ctx.lineTo(48, 10);
          ctx.stroke();

          ctx.fillStyle = '#7f8c8d';
          ctx.beginPath();
          ctx.arc(48, 10, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
        ctx.restore();
      });

      trebuchets = trebuchets.filter(t => !t.destroyed && t.x > -60);

      trebuchetBoulders.forEach(b => {
        if (state === 'PLAYING') {
          b.x += b.vx;
          b.y += b.vy;
          b.vy += b.gravity;
          b.life--;

          if (Math.random() < 0.4) {
            particles.push({
              x: b.x,
              y: b.y,
              vx: (Math.random() - 0.5) * 1.5,
              vy: (Math.random() - 0.5) * 1.5,
              size: 3 + Math.random() * 3,
              life: 15,
              color: '#e74c3c'
            });
          }
        }

        ctx.save();
        ctx.translate(b.x, b.y);

        const glowRadius = b.radius + 6;
        const radial = ctx.createRadialGradient(0, 0, 2, 0, 0, glowRadius);
        radial.addColorStop(0, 'rgba(241, 196, 15, 0.8)');
        radial.addColorStop(0.6, 'rgba(231, 76, 60, 0.4)');
        radial.addColorStop(1, 'rgba(231, 76, 60, 0)');
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#7f8c8d';
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#34495e';
        ctx.beginPath();
        ctx.arc(-2, -2, b.radius * 0.4, 0, Math.PI * 2);
        ctx.arc(3, 2, b.radius * 0.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });

      trebuchetBoulders = trebuchetBoulders.filter(b => b.life > 0 && b.y < gY + 10 && b.x > -50);
    }

    function drawKnights() {
      const time = Date.now() / 900;
      const gY = height - groundHeight;

      knights.forEach((k) => {
        const obs = k.obsRef;
        // a royal you missed scrolls off the left edge: silence their entrance sound
        if (k.isRoyal && k.state === 'ALIVE' && !k.soundStopped && (!obs || obs.x + k.relX < -24)) {
          k.soundStopped = true;
          sound.stopRoyalSounds();
        }
        if (!obs || obs.x + obs.baseWidth < -50) return;

        if (k.state === 'FALLING') {
          k.fallVelocityY += 0.48;
          k.fallYOffset += k.fallVelocityY;
          k.relX += k.knockbackVelocity;
          k.rotation += 0.12 * Math.sign(k.knockbackVelocity || 1);

          const currentY = obs.bottomY - 26 + k.fallYOffset;
          if (currentY >= gY - 26) {
            if (!k.pointAwarded) {
              k.pointAwarded = true;
              gameStats.villagersKilled++;
              const scoreResult = addScore(2);
              sound.knightHit();
              floatingTexts.push({ x: obs.x + k.relX, y: gY - 10, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.2 });
            }
            k.state = 'DEAD_ON_GROUND';
          }
        } else {
          if (Math.abs(k.knockbackVelocity) > 0.05) {
            k.relX += k.knockbackVelocity;
            k.knockbackVelocity *= 0.88;

            if (k.relX < -12 || k.relX > obs.width + 12) {
              k.state = 'FALLING';
              k.fallVelocityY = -2.5;
            }
          } else if (k.stunTimer > 0) {
            k.stunTimer--;
          } else if (k.state === 'ALIVE') {
            k.relX += k.direction * 0.2;
            if (k.relX < 6) { k.relX = 6; k.direction = 1; }
            if (k.relX > obs.width - 26) { k.relX = obs.width - 26; k.direction = -1; }
          }
        }

        const kx = obs.x + k.relX;
        const ky = obs.bottomY - 26 + k.fallYOffset;

        if (k.state === 'ALIVE' && k.isRoyal && state === 'PLAYING') {
          const dist = Math.hypot(dragon.x - kx, dragon.y - ky);
          if (dist < dragon.size / 2 + 18) {
            k.state = 'BEHEADED';
            triggerBeheadingCutscene(k.royalType);
            return;
          }
        }

        // invincible (Khaleesi riding): villagers touched by the dragon go flying
        if (k.state === 'ALIVE' && !k.isRoyal && khaleesiMounted && state === 'PLAYING' &&
            Math.hypot(dragon.x - (kx + 11), dragon.y - (ky + 10)) < dragon.size / 2 + 14) {
          k.state = 'FALLING';
          k.fallVelocityY = -4;
          k.knockbackVelocity = (kx + 11 >= dragon.x ? 1 : -1) * 7;
          sound.knightHit();
        }

        const hasFireOnKnight = k.state === 'ALIVE' && (obs.isCharred || obs.charProgress > 0 || obs.surfaceFlames.some(sf => Math.abs((obs.x + sf.relX) - kx) < 24));

        if (hasFireOnKnight) {
          k.state = 'BURNING';
          if (k.isRoyal) {
            sound.stopRoyalSounds();
            resetScoreToZero();
          } else if (!k.pointAwarded) {
            k.pointAwarded = true;
            gameStats.villagersKilled++;
            const scoreResult = addScore(2);
            sound.knightHit();
            floatingTexts.push({ x: kx + 4, y: ky - 8, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.2 });
          }
        }

        if (k.state === 'FALLING') {
          ctx.save();
          ctx.translate(kx + 10, ky + 14);
          ctx.rotate(k.rotation);
          ctx.translate(-11, -10);
          if (k.isRoyal) drawRoyalSprite(k, 0);
          else drawVillagerSprite(k, 2, -3);
          ctx.restore();
          return;
        }

        if (k.state === 'DEAD_ON_GROUND') {
          // body lying on its back in the grass
          ctx.save();
          ctx.translate(kx + 10, gY - 6);
          ctx.rotate(-Math.PI / 2);
          ctx.scale(0.75, 0.75);
          ctx.translate(-11, -9);
          ctx.globalAlpha = 0.85;
          if (k.isRoyal) drawRoyalSprite(k, 0);
          else drawVillagerSprite(k, 0, 0);
          ctx.restore();
          return;
        }

        if (k.state === 'ALIVE') {
          const isStunned = k.stunTimer > 0;
          const isRoyal = k.isRoyal;

          if (isRoyal) {
            const bob = isStunned ? 0 : Math.abs(Math.sin(time * 2 + kx * 0.1)) * -1;
            withFacing(kx, ky, k.direction, () => drawRoyalSprite(k, bob));
          } else {
            const legMove = isStunned ? 0 : Math.sin(time * 2 + kx) * 1.5;
            const armSwing = isStunned ? 0 : Math.sin(time * 2 + kx + 1.2) * 1.5;
            withFacing(kx, ky, k.direction, () => drawVillagerSprite(k, legMove, armSwing));
          }
        } else if (k.state === 'BURNING') {
          k.burnTimer++;
          ctx.fillStyle = 'rgba(18,22,28,' + Math.max(0, 0.9 - k.burnTimer / 45) + ')';
          ctx.fillRect(kx, ky - 2, 22, 28);
          const grow = Math.min(1, 0.4 + k.burnTimer / 20);
          drawFlame(kx + 11, ky + 26, 28 * grow, 50 * grow, kx * 0.2);
          drawFlame(kx + 2, ky + 26, 14 * grow, 26 * grow, kx * 0.2 + 2);
          drawFlame(kx + 20, ky + 26, 14 * grow, 30 * grow, kx * 0.2 + 4);
          if (k.burnTimer > 35) k.state = 'ASH';
        } else if (k.state === 'ASH') {
          ctx.fillStyle = '#34495e';
          ctx.fillRect(kx, ky + 20, 22, 5);
        }
      });
    }

    // ==========================================
    // BETTER FLAMES (shared by the whole game)
    // Layered teardrop tongues, additive blending, per-flame flicker/sway, soft glow, rising embers.
    // ==========================================
</script>
<script>
// render-people.js — Villager and royal sprites (used by drawKnights in render-enemies.js)
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    // ==========================================
    // VILLAGER & ROYAL SPRITES
    // Drawn in a 22 x 34 box: x 0..22, y -8..26 (feet on y = 26), facing right.
    // ==========================================
    const SKIN_TONES = ['#f8c291', '#e0a878', '#c68642', '#8d5524', '#f1d0b0'];

    function shadeHex(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.max(0, Math.min(255, (n >> 16) + amt));
      const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
      const b = Math.max(0, Math.min(255, (n & 255) + amt));
      return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
    }

    function villagerLook(k) {
      if (!k.look) {
        k.look = {
          hat: Math.floor(Math.random() * 4),          // 0 hair, 1 straw hat, 2 hood, 3 bandana
          beard: Math.random() < 0.35,
          skin: SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)],
          apron: Math.random() < 0.3
        };
      }
      return k.look;
    }

    function drawVillagerSprite(k, legMove, armSwing) {
      const c = k.costume || peasantCostumes[0];
      const L = villagerLook(k);
      const out = '#1b1410';
      const tunicDark = shadeHex(c.tunic, -45);
      const pantsDark = shadeHex(c.pants, -35);

      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(11, 26, 9, 2.2, 0, 0, Math.PI * 2); ctx.fill();

      // back arm
      ctx.fillStyle = tunicDark;
      ctx.fillRect(5 - armSwing * 0.5, 7, 3, 8);
      ctx.fillStyle = L.skin;
      ctx.fillRect(5 - armSwing * 0.5, 14, 3, 2);

      // legs + boots
      ctx.fillStyle = pantsDark;
      ctx.fillRect(7 - legMove, 17, 4, 6);
      ctx.fillStyle = c.pants;
      ctx.fillRect(11 + legMove, 17, 4, 6);
      ctx.fillStyle = '#3b2616';
      ctx.fillRect(6 - legMove, 23, 5, 3);
      ctx.fillRect(11 + legMove, 23, 6, 3);
      ctx.fillStyle = '#5a3c24';
      ctx.fillRect(12 + legMove, 23, 4, 1);

      // tunic with shading, collar and belt
      ctx.fillStyle = out;
      ctx.fillRect(5, 5, 12, 14);
      ctx.fillStyle = c.tunic;
      ctx.fillRect(6, 6, 10, 12);
      ctx.fillStyle = tunicDark;
      ctx.fillRect(6, 6, 3, 12);
      ctx.fillRect(6, 17, 10, 1);
      ctx.fillStyle = shadeHex(c.tunic, 35);
      ctx.fillRect(13, 6, 2, 8);
      if (L.apron) {
        ctx.fillStyle = '#d9d2bf';
        ctx.fillRect(9, 12, 7, 6);
        ctx.fillStyle = '#b3aa92';
        ctx.fillRect(9, 17, 7, 1);
      }
      ctx.fillStyle = '#4a3020';
      ctx.fillRect(6, 13, 10, 2);
      ctx.fillStyle = '#d4a017';
      ctx.fillRect(12, 13, 2, 2);
      // long skirt (women in the prologue crowds)
      if (k.dress) {
        ctx.fillStyle = out;
        ctx.beginPath(); ctx.moveTo(5, 13); ctx.lineTo(17, 13); ctx.lineTo(20, 24); ctx.lineTo(2, 24); ctx.closePath(); ctx.fill();
        ctx.fillStyle = c.tunic;
        ctx.beginPath(); ctx.moveTo(6, 14); ctx.lineTo(16, 14); ctx.lineTo(19, 23); ctx.lineTo(3, 23); ctx.closePath(); ctx.fill();
        ctx.fillStyle = tunicDark;
        ctx.fillRect(3, 21, 16, 2);
        ctx.fillStyle = '#4a3020';
        ctx.fillRect(6, 13, 10, 2);
      }
      // neckline
      ctx.fillStyle = L.skin;
      ctx.fillRect(10, 5, 3, 2);

      // head
      ctx.fillStyle = out;
      ctx.fillRect(6, -4, 11, 10);
      ctx.fillStyle = L.skin;
      ctx.fillRect(7, -3, 9, 8);
      ctx.fillRect(16, 0, 1, 2);                  // nose
      ctx.fillStyle = shadeHex(L.skin, -30);
      ctx.fillRect(7, 3, 2, 2);                   // cheek shade
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(13, -1, 2, 2);                 // eye
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(13, -1, 1, 1);
      ctx.fillStyle = shadeHex(L.skin, -60);
      ctx.fillRect(13, 3, 3, 1);                  // mouth

      if (L.beard) {
        ctx.fillStyle = c.hair;
        ctx.fillRect(8, 2, 9, 4);
        ctx.fillRect(10, 5, 5, 2);
        ctx.fillStyle = L.skin;
        ctx.fillRect(13, 3, 3, 1);
      }

      // hair / headwear
      if (L.hat === 1) {
        ctx.fillStyle = '#c9a54a';
        ctx.fillRect(3, -5, 17, 2);
        ctx.fillStyle = '#e3c26a';
        ctx.fillRect(7, -9, 10, 5);
        ctx.fillStyle = '#9c2a2a';
        ctx.fillRect(7, -6, 10, 1);
        ctx.fillStyle = '#a8862f';
        ctx.fillRect(3, -4, 17, 1);
      } else if (L.hat === 2) {
        ctx.fillStyle = tunicDark;
        ctx.fillRect(5, -6, 11, 4);
        ctx.fillRect(5, -6, 4, 11);
        ctx.fillStyle = shadeHex(c.tunic, -20);
        ctx.fillRect(7, -6, 8, 2);
      } else if (L.hat === 3) {
        ctx.fillStyle = c.hair;
        ctx.fillRect(6, -2, 3, 5);
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(6, -6, 11, 4);
        ctx.fillRect(3, -4, 4, 2);
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(10, -5, 1, 1); ctx.fillRect(14, -5, 1, 1);
      } else {
        ctx.fillStyle = c.hair;
        ctx.fillRect(6, -6, 11, 4);
        ctx.fillRect(6, -3, 3, 6);
        ctx.fillRect(15, -3, 2, 1);
        ctx.fillStyle = shadeHex(c.hair, 40);
        ctx.fillRect(9, -6, 5, 1);
      }

      // front arm + tool
      const handY = 12 + armSwing * 0.5;
      if (k.wave) {
        // arm raised, waving (prologue crowds and dancers)
        const sway = Math.sin(Date.now() / 110 + (k.phase || 0)) * 2;
        ctx.fillStyle = c.tunic;
        ctx.fillRect(14, 1, 3, 7);
        ctx.fillStyle = L.skin;
        ctx.fillRect(15 + sway, -4, 3, 5);
        if (k.tool && k.tool !== 'none') drawVillagerTool(k, L, handY);
        return;
      }
      ctx.fillStyle = c.tunic;
      ctx.fillRect(14, 7, 3, 6);
      ctx.fillStyle = L.skin;
      ctx.fillRect(16, handY - 1, 3, 3);

      if (k.hasPitchfork) {
        ctx.fillStyle = '#6b4423';
        ctx.fillRect(18, -2, 2, 26);
        ctx.fillStyle = '#8a5a30';
        ctx.fillRect(18, -2, 1, 26);
        ctx.fillStyle = '#9aa4ad';
        ctx.fillRect(15, -4, 8, 2);
        ctx.fillRect(15, -10, 2, 6);
        ctx.fillRect(18, -11, 2, 7);
        ctx.fillRect(21, -10, 2, 6);
        ctx.fillStyle = '#d5dde3';
        ctx.fillRect(15, -10, 1, 1); ctx.fillRect(18, -11, 1, 1); ctx.fillRect(21, -10, 1, 1);
      } else if (k.tool) {
        drawVillagerTool(k, L, handY);   // prologue: crook, basket, lute or nothing
      } else {
        ctx.fillStyle = '#5a3a1e';
        ctx.fillRect(18, 0, 2, 16);
        ctx.fillStyle = '#3d2a1a';
        ctx.fillRect(17, -1, 4, 3);
        drawFlame(19, 0, 9, 16, (k.relX || 0) * 0.3 + 1.7, 1);
      }
      ctx.fillStyle = L.skin;
      ctx.fillRect(17, handY - 1, 2, 3);
    }

    function drawRoyalSprite(k, bob) {
      const isKing = k.royalType === 'KING';
      const out = '#1b1410';
      const robe = isKing ? '#6a2c91' : '#b3172e';
      const robeDark = shadeHex(robe, -45);
      const robeLight = shadeHex(robe, 40);
      const gold = '#f4c430';
      const goldDark = '#b8860b';
      const skin = '#f3c79e';

      ctx.save();
      ctx.translate(0, bob);

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(11, 26 - bob, 11, 2.4, 0, 0, Math.PI * 2); ctx.fill();

      // long robe / gown, flared at the hem
      ctx.fillStyle = out;
      ctx.beginPath();
      ctx.moveTo(5, 2); ctx.lineTo(17, 2); ctx.lineTo(isKing ? 20 : 22, 26); ctx.lineTo(isKing ? 2 : 0, 26);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = robe;
      ctx.beginPath();
      ctx.moveTo(6, 3); ctx.lineTo(16, 3); ctx.lineTo(isKing ? 19 : 21, 25); ctx.lineTo(isKing ? 3 : 1, 25);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = robeDark;
      ctx.beginPath();
      ctx.moveTo(6, 3); ctx.lineTo(9, 3); ctx.lineTo(7, 25); ctx.lineTo(isKing ? 3 : 1, 25);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = robeLight;
      ctx.fillRect(13, 6, 2, 16);
      // gold hem + center trim
      ctx.fillStyle = gold;
      ctx.fillRect(isKing ? 3 : 1, 23, isKing ? 16 : 20, 2);
      ctx.fillRect(10, 8, 2, 15);
      ctx.fillStyle = goldDark;
      for (let i = 0; i < 4; i++) ctx.fillRect(isKing ? 5 + i * 4 : 3 + i * 5, 24, 1, 1);

      // ermine cape / collar: white with black tail spots
      ctx.fillStyle = out;
      ctx.fillRect(3, 1, 16, 7);
      ctx.fillStyle = '#f7f3ea';
      ctx.fillRect(4, 2, 14, 5);
      ctx.fillStyle = '#d8d0bf';
      ctx.fillRect(4, 6, 14, 1);
      ctx.fillStyle = '#111';
      [[6, 3], [10, 4], [14, 3], [8, 5], [16, 5]].forEach(p => ctx.fillRect(p[0], p[1], 1, 2));
      if (!isKing) {
        // necklace
        ctx.fillStyle = gold;

<script>
// render-masonry.js — Stone/brick textures for castle obstacles and battlements
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).
//
// Each obstacle gets a random masonry style the first time it is drawn. Textures are painted once
// into offscreen canvases (cached by size/style/palette/seed) so scrolling stays cheap.
//   0 running-bond brick   1 rough fieldstone   2 big ashlar blocks with quoins + string courses
//   3 Flemish bond (stretchers + dark headers make a diamond pattern)

const MASONRY_STYLES = 4;
const masonryCache = new Map();

function masonryStyleOf(o) {
  if (o.brickStyle === undefined) {
    o.brickStyle = Math.floor(Math.random() * MASONRY_STYLES);
    o.brickSeed = Math.floor(Math.random() * 1000);
  }
  return o.brickStyle;
}

function masonryRoundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// one stone with a lit top edge and a shadowed bottom/right edge
function masonryBrick(c, x, y, w, h, col) {
  c.fillStyle = col;
  c.fillRect(x, y, w, h);
  c.fillStyle = 'rgba(255,255,255,0.11)';
  c.fillRect(x, y, w, 1.5);
  c.fillRect(x, y, 1, h);
  c.fillStyle = 'rgba(0,0,0,0.24)';
  c.fillRect(x, y + h - 1.5, w, 1.5);
  c.fillRect(x + w - 1, y, 1, h);
}

function paintMasonry(c, w, h, pal, style, seed, charred) {
  const tone = (i, j, spread) => shadeHex(pal.main, Math.round((hash2(i + seed * 31, j + seed * 17) - 0.5) * (spread || 26)));
  c.fillStyle = pal.dark;   // mortar
  c.fillRect(0, 0, w, h);

  if (h <= 14) {
    // cornice / ledge: lit top band, dentil blocks underneath
    c.fillStyle = pal.main;
    c.fillRect(0, 0, w, h);
    c.fillStyle = pal.light;
    c.fillRect(0, 0, w, 3);
    c.fillStyle = 'rgba(255,255,255,0.08)';
    c.fillRect(0, 3, w, 2);
    c.fillStyle = pal.dark;
    for (let x = 3; x < w; x += 9) c.fillRect(x, h - 5, 4, 5);
    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.fillRect(0, h - 1, w, 1);
    return;
  }

  if (style === 0) {
    const bh = 14, bw = 26;
    for (let r = 0, y = 0; y < h; r++, y += bh) {
      const off = (r % 2) * (bw / 2);
      for (let q = -1, x = -off; x < w; q++, x += bw) masonryBrick(c, x + 1, y + 1, bw - 2, bh - 2, tone(q, r));
    }
  } else if (style === 1) {
    // irregular fieldstone laid in uneven courses
    let y = 0, r = 0;
    while (y < h) {
      const rowH = 11 + Math.floor(hash2(r, seed) * 9);
      let x = -Math.floor(hash2(seed, r) * 14), q = 0;
      while (x < w) {
        const sw = 12 + Math.floor(hash2(q + r * 13, seed + 5) * 20);
        const inset = 1 + hash2(q, r + 99) * 1.5;
        c.fillStyle = tone(q, r, 34);
        masonryRoundRect(c, x + inset, y + inset, sw - inset * 2, rowH - inset * 2, 4);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.12)';
        masonryRoundRect(c, x + inset + 1, y + inset, sw - inset * 2 - 3, 3, 2);
        c.fill();
        c.fillStyle = 'rgba(0,0,0,0.22)';
        masonryRoundRect(c, x + inset + 2, y + rowH - inset - 3, sw - inset * 2 - 3, 2, 1);
        c.fill();
        x += sw; q++;
      }
      y += rowH; r++;
    }
  } else if (style === 2) {
    // large ashlar blocks, quoin stones on the corners, string course every few rows
    const bh = 22, bw = 42;
    for (let r = 0, y = 0; y < h; r++, y += bh) {
      if (r % 6 === 5) {
        c.fillStyle = pal.light;
        c.fillRect(0, y + 1, w, 6);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        c.fillRect(0, y + 7, w, 2);
        masonryBrick(c, 0, y + 9, w, bh - 10, tone(0, r, 10));
        continue;
      }
      const off = (r % 2) * (bw / 2);
      for (let q = -1, x = -off; x < w; q++, x += bw) masonryBrick(c, x + 1, y + 1, bw - 2, bh - 2, tone(q, r, 18));
      // quoins: alternating long/short pale corner stones
      const qw = r % 2 ? 16 : 26;
      const qc = shadeHex(pal.main, 22);
      masonryBrick(c, 0, y + 1, qw, bh - 2, qc);
      masonryBrick(c, w - qw, y + 1, qw, bh - 2, qc);
    }
  } else {
    // Flemish bond: stretcher + header alternate; offset rows line headers up into diamonds
    const bh = 12, sw = 24, hw = 12;
    for (let r = 0, y = 0; y < h; r++, y += bh) {
      let x = (r % 2) ? -18 : 0, q = 0;
      while (x < w) {
        const header = q % 2 === 1;
        const bw2 = header ? hw : sw;
        const col = header ? shadeHex(pal.main, -22 + Math.round((hash2(q, r + seed) - 0.5) * 10)) : tone(q, r, 20);
        masonryBrick(c, x + 1, y + 1, bw2 - 2, bh - 2, col);
        x += bw2; q++;
      }
    }
  }

  // weathering: cracks, chipped stones, moss (or soot + embers when charred)
  const area = w * h;
  const cracks = Math.max(1, Math.floor(area / 9000));
  c.strokeStyle = 'rgba(0,0,0,0.45)';
  c.lineWidth = 1;
  for (let i = 0; i < cracks; i++) {
    let cx = hash2(i, seed + 1) * w, cy = hash2(seed + 2, i) * h;
    c.beginPath();
    c.moveTo(cx, cy);
    for (let s = 0; s < 4; s++) {
      cx += (hash2(i * 7 + s, seed) - 0.5) * 10;
      cy += 4 + hash2(s, i + seed) * 6;
      c.lineTo(cx, cy);
    }
    c.stroke();
  }
  const chips = Math.floor(area / 2500);
  for (let i = 0; i < chips; i++) {
    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.fillRect(Math.floor(hash2(i + 50, seed) * w), Math.floor(hash2(seed, i + 50) * h), 2 + Math.floor(hash2(i, 3) * 3), 2);
  }

  if (!charred) {
    const moss = Math.floor(area / 6000);
    for (let i = 0; i < moss; i++) {
      const mx = hash2(i + 200, seed) * w;
      const my = h * (0.5 + hash2(seed, i + 200) * 0.5);
      const mr = 4 + hash2(i, seed + 9) * 8;
      const g = c.createRadialGradient(mx, my, 0, mx, my, mr);
      g.addColorStop(0, 'rgba(70,120,60,0.45)');
      g.addColorStop(1, 'rgba(70,120,60,0)');
      c.fillStyle = g;
      c.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
    }
    // moss along the base
    const base = c.createLinearGradient(0, h - 18, 0, h);
    base.addColorStop(0, 'rgba(60,100,50,0)');
    base.addColorStop(1, 'rgba(60,100,50,0.22)');
    c.fillStyle = base;
    c.fillRect(0, h - 18, w, 18);
  } else {
    const streaks = Math.floor(w / 14);
    for (let i = 0; i < streaks; i++) {
      const sx = hash2(i, seed + 40) * w;
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(0,0,0,0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.fillRect(sx, 0, 3 + hash2(seed, i) * 5, h * (0.3 + hash2(i, i) * 0.6));
    }
    const embers = Math.floor(area / 3000);
    for (let i = 0; i < embers; i++) {
      c.fillStyle = hash2(i, 77) < 0.5 ? 'rgba(255,120,40,0.55)' : 'rgba(255,190,80,0.45)';
      c.fillRect(Math.floor(hash2(i + 9, seed) * w), Math.floor(hash2(seed, i + 9) * h), 1.5, 1.5);
    }
  }

  // ambient occlusion toward the bottom
  const ao = c.createLinearGradient(0, 0, 0, h);
  ao.addColorStop(0, 'rgba(0,0,0,0)');
  ao.addColorStop(1, 'rgba(0,0,0,0.18)');
  c.fillStyle = ao;
  c.fillRect(0, 0, w, h);
}

// Draw a textured masonry rectangle at (rx, ry). `owner` (obstacle/battlement) supplies style + seed.
function drawMasonry(rx, ry, rw, rh, pal, owner) {
  const w = Math.round(rw), h = Math.round(rh);
  if (w <= 0 || h <= 0) return;
  const style = masonryStyleOf(owner);
  const charred = pal === charPalette;
  const key = w + '|' + h + '|' + style + '|' + (charred ? 'c' : 's') + '|' + owner.brickSeed;
  let tex = masonryCache.get(key);
  if (!tex) {
    tex = document.createElement('canvas');
    tex.width = w;
    tex.height = h;
    paintMasonry(tex.getContext('2d'), w, h, pal, style, owner.brickSeed, charred);
    masonryCache.set(key, tex);
    if (masonryCache.size > 70) masonryCache.delete(masonryCache.keys().next().value);
  }
  ctx.drawImage(tex, Math.round(rx), Math.round(ry));
}

// effects.js — Flame renderer, breath blobs, archer detail, particles/debris/floating text
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    let flameDrawCount = 0;
    const FLAME_PAL_FIRE  = { outer: [231, 76, 60],  mid: [243, 156, 18],  inner: [241, 196, 15],  core: [255, 248, 214] };
    const FLAME_PAL_VIOLET = { outer: [142, 68, 173], mid: [187, 107, 230], inner: [222, 180, 255], core: [250, 240, 255] };
    const FLAME_PAL_GOLD   = { outer: [214, 137, 16], mid: [245, 196, 48],  inner: [255, 230, 140], core: [255, 252, 235] };
    const FLAME_PAL_BLUE  = { outer: [41, 128, 185], mid: [93, 173, 226],  inner: [169, 204, 227], core: [235, 245, 255] };
    const FLAME_PAL_GREEN = { outer: [30, 168, 90],  mid: [88, 214, 141],  inner: [171, 235, 198], core: [240, 255, 245] };

    function hexToRgb(hex) {
      if (typeof hex !== 'string' || hex[0] !== '#') return [255, 136, 0];
      let h = hex.slice(1);
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      if (isNaN(n)) return [255, 136, 0];
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgbaStr(c, a) {
      return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
    }

    // x,y = centre of the flame's base; w = base width; h = height; seed = per-flame phase offset
    function drawFlame(x, y, w, h, seed, alpha, pal) {
      if (w < 1 || h < 1) return;
      const a = (alpha === undefined) ? 1 : alpha;
      if (a <= 0.01) return;
      const P = pal || FLAME_PAL_FIRE;
      const cheap = ++flameDrawCount > 40;      // keep the frame rate up when lots of fire is on screen
      const t = Date.now() / 1000;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      if (!cheap) {
        const gy = y - h * 0.35;
        const gr = Math.max(w, h * 0.7) * 1.15;
        const glow = ctx.createRadialGradient(x, gy, 1, x, gy, gr);
        glow.addColorStop(0, rgbaStr(P.outer, 0.30 * a));
        glow.addColorStop(1, rgbaStr(P.outer, 0));
        ctx.fillStyle = glow;
        ctx.fillRect(x - gr, gy - gr, gr * 2, gr * 2);
      }

      const tongues = cheap
        ? [{ dx: 0, wk: 1.0, hk: 1.0, ph: 0 }]
        : [{ dx: -0.28, wk: 0.62, hk: 0.68, ph: 1.9 }, { dx: 0.30, wk: 0.58, hk: 0.74, ph: 3.7 }, { dx: 0, wk: 1.0, hk: 1.0, ph: 0 }];
      const layers = [
        { c: P.outer, s: 1.00, a: 0.55, grad: true },
        { c: P.mid,   s: 0.72, a: 0.60, grad: true },
        { c: P.inner, s: 0.46, a: 0.70, grad: false },
        { c: P.core,  s: 0.24, a: 0.80, grad: false }
      ];

      for (let li = 0; li < layers.length; li++) {
        const L = layers[li];
        for (let ti = 0; ti < tongues.length; ti++) {
          const T = tongues[ti];
          const flick = 1 + Math.sin(t * 11 + seed * 2 + T.ph) * 0.10 + Math.sin(t * 5.3 + seed + T.ph) * 0.08;
          const sway = (Math.sin(t * 8 + seed + T.ph) * 0.5 + Math.sin(t * 13.7 + seed * 1.7 + T.ph) * 0.3) * w * 0.35;
          const px = x + T.dx * w;
          const bw = w * 0.5 * T.wk * L.s;
          const th = h * T.hk * L.s * flick;
          const tipX = px + sway * (0.5 + 0.5 * L.s);
          const tipY = y - th;

          ctx.beginPath();
          ctx.moveTo(px - bw, y);
          ctx.bezierCurveTo(px - bw * 1.1, y - th * 0.35, px - bw * 0.35 + sway * 0.4, y - th * 0.72, tipX, tipY);
          ctx.bezierCurveTo(px + bw * 0.35 + sway * 0.2, y - th * 0.66, px + bw * 1.1, y - th * 0.30, px + bw, y);
          ctx.quadraticCurveTo(px, y + bw * 0.35, px - bw, y);
          ctx.closePath();

          const aa = L.a * a;
          if (L.grad && !cheap) {
            const g = ctx.createLinearGradient(0, y, 0, tipY);
            g.addColorStop(0, rgbaStr(L.c, aa));
            g.addColorStop(0.55, rgbaStr(L.c, aa * 0.7));
            g.addColorStop(1, rgbaStr(L.c, 0));
            ctx.fillStyle = g;
          } else {
            ctx.fillStyle = rgbaStr(L.c, aa * 0.8);
          }
          ctx.fill();
        }
      }
      ctx.restore();

      // rising embers
      if (Math.random() < 0.06 * a && particles.length < 500) {
        particles.push({
          x: x + (Math.random() - 0.5) * w * 0.6,
          y: y - h * 0.5 * Math.random(),
          vx: (Math.random() - 0.5) * 0.9,
          vy: -0.8 - Math.random() * 1.4,
          size: 1.5 + Math.random() * 1.5,
          life: 22 + Math.random() * 18,
          color: Math.random() < 0.5 ? '#ffb347' : '#ffd966'
        });
      }
    }

    // The dragon's breath: a soft, additive, motion-stretched fireball instead of a hard square.
    function drawBreathBlob(f, lifeRatio, size) {
      const c = hexToRgb(f.color);
      const flick = 1 + Math.sin(Date.now() / 45 + f.x * 0.13 + f.y) * 0.1;
      const r = Math.max(3, size * 0.95 * flick);
      const a = Math.min(1, 0.15 + lifeRatio * 0.95);
      const hot = lifeRatio > 0.55;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(f.x + size / 2, f.y + size / 2);
      ctx.rotate(Math.atan2(f.vy, f.vx));
      ctx.translate(-r * 0.7, 0);
      ctx.scale(2.0, 1);
      const g = ctx.createRadialGradient(r * 0.15, 0, 0, 0, 0, r);
      g.addColorStop(0, hot ? rgbaStr([255, 255, 236], a) : rgbaStr(c, a));
      g.addColorStop(0.3, rgbaStr(c, a * 0.85));
      g.addColorStop(0.65, rgbaStr(c, a * 0.35));
      g.addColorStop(1, rgbaStr(c, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ==========================================
    // DETAILED ARCHER (used by wall archers AND the siege-tower archers)
    // Origin = centre of the body; the old sprite's footprint (10 wide, ~20 tall, bow on the left).
    // poses: hidden, alert, draw (glowing), hold (aiming), ready, walk, climb
    // ==========================================
    function drawArcherDetail(pose, anim, legs) {
      if (pose === 'hidden') {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(-5, 0, 10, 5);
        ctx.fillRect(-3, -3, 6, 3);
        ctx.fillStyle = '#58d68d';
        ctx.fillRect(-3, -3, 4, 1);
        ctx.fillStyle = '#1e8449';
        ctx.fillRect(-5, 4, 10, 1);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(1, -6, 1, 3);
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(2, -5, 1, 2);

      }

      const drawn = pose === 'draw' || pose === 'hold';
      const walking = pose === 'walk';
      const climbing = pose === 'climb';
      const alert = pose === 'alert';
      const step = Math.sin((anim || 0) * 0.4);

      if (glowing) {
        const glowFactor = Math.sin(Date.now() / 30) * 0.5 + 0.5;
        const radialGlow = ctx.createRadialGradient(0, -6, 2, 0, -6, 26);
        radialGlow.addColorStop(0, 'rgba(241, 196, 15, ' + (0.4 + glowFactor * 0.4) + ')');
        radialGlow.addColorStop(1, 'rgba(241, 196, 15, 0)');
        ctx.fillStyle = radialGlow;
        ctx.beginPath();
        ctx.arc(0, -6, 26, 0, Math.PI * 2);
        ctx.fill();

      ctx.fillStyle = '#5b3a1e';
      ctx.fillRect(3, -5, 3, 11);
      ctx.fillStyle = '#3e2713';
      ctx.fillRect(3, 4, 3, 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(3, -7, 1, 2);
      ctx.fillRect(5, -7, 1, 2);
      ctx.fillStyle = '#ecf0f1';
      ctx.fillRect(4, -8, 1, 3);

      // legs (boss archers walk and climb; wall archers are cut off by the parapet)
      if (legs) {
        const l1 = walking ? step * 2 : (climbing ? (step > 0 ? -2 : 0) : 0);
        const l2 = walking ? -step * 2 : (climbing ? (step > 0 ? 0 : -2) : 0);
        ctx.fillStyle = '#3d4a5c';
        ctx.fillRect(-4 + (walking ? l1 : 0), 8 + (climbing ? l1 : 0), 3, 3);

    function drawParticles() {
  const gY = height - groundHeight;
  
  for (let i = blackDebris.length - 1; i >= 0; i--) {
    const d = blackDebris[i];
    d.x += d.vx;
    d.y += d.vy;
    d.vy += d.gravity;
    d.rotation += d.rotSpeed;

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rotation);
    
    ctx.fillStyle = '#11161d';
    const halfSize = d.size / 2;
    ctx.beginPath();
    ctx.moveTo(0, -halfSize);
    ctx.lineTo(halfSize, -halfSize * 0.6);
    ctx.lineTo(halfSize * 0.8, halfSize);
    ctx.lineTo(-halfSize * 0.8, halfSize);
    ctx.lineTo(-halfSize, -halfSize * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (d.y >= gY) {
      for (let s = 0; s < 5; s++) {
         particles.push({
            x: d.x,
            y: gY,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.7) * 4,
            size: 2 + Math.random() * 2,
            life: 15 + Math.random() * 10,
            color: '#e74c3c'
          });
      }
      blackDebris.splice(i, 1);
    }
  }

  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];

    // Physics update runs in both PLAYING and BOSS states
    f.vx *= f.dragX;
    f.vy += f.gravity;
    f.x += f.vx;
    f.y += f.vy;
    f.life--;

    const lifeRatio = f.life / f.maxLife;
    const curSize = f.size * lifeRatio;

    if (Math.random() < 0.25) {
      particles.push({
        x: f.x + (Math.random() - 0.5) * 6,
        y: f.y + (Math.random() - 0.5) * 6,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        size: 2 + Math.random() * 2,
        life: 15,
        color: f.color
      });
    }

    drawBreathBlob(f, lifeRatio, curSize);

    if (f.y >= gY - 4) {
      if (Math.random() < 0.35) {
        groundFlames.push({
          x: f.x,
          life: 80 + Math.random() * 60,
          boostIntensity: 1.0
        });
      }
      flames.splice(i, 1);
      continue;
    }

    obstacles.forEach(obs => {
      if (f.x >= obs.x - 10 && f.x <= obs.x + obs.width + 10 && f.y >= obs.bottomY - 14 && f.y <= obs.bottomY + 20) {
        if (Math.random() < 0.45) {
          obs.surfaceFlames.push({
            relX: f.x - obs.x,
            width: 12,
            maxWidth: 32 + Math.random() * 22,
            height: 14,
            maxHeight: 38 + Math.random() * 24,
            spreadSpeed: (Math.random() - 0.5) * 1.4
          });
        }
      }
    });

    if (f.life <= 0) flames.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    
    ctx.fillStyle = p.color;
    
    if (p.isSmoke) {
      ctx.globalAlpha = p.life / 60.0;
      ctx.beginPath();
      const halfSize = p.size / 2;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.arc(p.x - halfSize, p.y + halfSize * 0.7, p.size * 0.8, 0, Math.PI * 2);
      ctx.arc(p.x + halfSize, p.y - halfSize * 0.3, p.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    } else {
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = 'bold 24px "Proxima Nova", sans-serif';
    ctx.fillStyle = ft.color || '#2ecc71';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();

    ft.y += ft.vy;
    ft.alpha -= 0.015;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}

<script>
// boss.js — Siege engine boss state, geometry, archer spawning/waves, burn helpers
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    // ==========================================
// SIEGE ENGINE BOSS LOGIC & RENDERING
// ==========================================

function bossBurnNew() {
  return { flames: [], charProgress: 0, charred: false };
}

var bossState = {
  active: false,
  x: 0,
  baseX: 0,
  swayAmp: 0,
  frame: 0,
  bump: 0,
  rumbleY: 0,
  groundScroll: 0,
  roll: 1,
  wheelAngle: 0,
  topHp: 100,
  midHp: 100,
  botHp: 100,
  topTimer: 0,
  botTimer: 0,
  topChainProgress: 0,
  botChainProgress: 0,
  topState: 'IDLE',
  botState: 'IDLE',
  archers: [],
  groupShootTimer: 0,
  speechBubbleTimer: 0,
  spawnTimer: 0,
  clearHold: 0,
  topFlash: 0,
  midFlash: 0,
  botFlash: 0,
  burn: { top: bossBurnNew(), mid: bossBurnNew(), bot: bossBurnNew() }
};

const BOSS_MAX_ARCHERS = 50;
const BOSS_CANNON_RELOAD = 160;   // frames between cannon shots (was 220, then 190)
const BOSS_WINDOW_FRAMES = 300;   // how long the center is open after you clear a wave
const BOSS_ROLL_SPEED = 9.0;      // ground speed under the wheels (px/frame); was 3
const BOSS_BG_SPEED = 2.2;        // sky/castle parallax speed during the chase (normal play is 0.4)
const BOSS_CHASE_AHEAD = 0.14;    // how far (fraction of screen width) the tower can lunge toward the dragon
const BOSS_CHASE_BACK = 0.03;     // how far it can fall back to the right
let bossRocks = [];               // dirt and stones thrown up by the wheels
let bossCinematic = false;        // true while the intro cinematic draws the tower (no HUD bars)
const BOSS_FIRST_WAVE = 14;       // garrison already on the platform
const BOSS_WAVE_GROWTH = 6;       // each later wave brings this many more archers
const BOSS_WAVE_SPAWN_GAP = 22;   // frames between archers coming out of the door during a wave
const BOSS_REINFORCE_FRAMES = 480; // next wave starts this long after the last one finished climbing out, even if it is still alive
const BOSS_REINFORCE_MAX_ALIVE = 30; // ...unless this many archers are already alive
const BOSS_VOLLEY_CYCLE = 155;    // frames between archer volleys (was 180)
const BOSS_KILLS_PER_SHOT = 3;    // one breath (6 flames) can take out at most this many archers

// Archers come in waves: SPAWNING (climbing out) -> FIGHTING (no reinforcements) -> OPEN (center exposed).
function bossWaveSize(wave) {
  return Math.min(BOSS_MAX_ARCHERS, BOSS_FIRST_WAVE + (wave - 1) * BOSS_WAVE_GROWTH);
}

// The center can be burned whenever no archer is standing ready on the platform
// (an empty platform, or a new wave still climbing the ladder).
function bossMidOpen() {
  if (bossState.midHp <= 0) return false;
  for (let i = 0; i < bossState.archers.length; i++) if (bossState.archers[i].phase === 'READY') return false;
  return true;
}

// All boss dimensions in one place. Archer x values are relative to the tower's left edge.
function bossGeom() {
  const bw = width * 0.40;
  const gY = height - groundHeight;
  // the tower rides on a wheeled platform that is wider than the tower itself
  const over = bw * 0.16;                                  // platform overhang on each side
  const wheelR = Math.max(40, Math.min((bw + 2 * over) * 0.235, height * 0.09, 80));
  const deckH = 20;
  const deckTop = gY - 2 * wheelR + 6;                     // deck rides on top of the wheels
  const turretH = height / 3;
  const baseTop = deckTop - 84;                            // stone lower section rests on the deck
  const platY = turretH + (baseTop - turretH) * 0.42;   // upper archer platform
  const platY2 = baseTop - 22;                            // lower archer platform
  const rBall = height / 6.8;
  const ladderX = bw * 0.58;
  const slots = [];
  const rowDy = [0, -6, -12];
  // upper platform: 3 rows; lower platform: 2 rows
  [[platY, 3, 1], [platY2, 2, 2]].forEach(pl => {
    for (let row = 0; row < pl[1]; row++) {
      const off = row * 5;
      for (let sx = 20 + off; sx <= ladderX - 12; sx += 10) slots.push({ x: sx, row: row, dy: rowDy[row], py: pl[0], plat: pl[2] });
      for (let sx = ladderX + 14 + off; sx <= bw - 14; sx += 10) slots.push({ x: sx, row: row, dy: rowDy[row], py: pl[0], plat: pl[2] });
    }
  });
  return {
    bw, gY, wheelR, turretH, baseTop, platY, platY2, rBall, ladderX,
    over, deckTop, deckH,
    wheelXs: [-over + wheelR + 2, bw + over - wheelR - 2],
    sillY: baseTop + 64,
    doorCx: bw * 0.83,
    doorW: Math.max(24, Math.min(34, bw * 0.17)),
    doorH: 38,
    cyTop: rBall + 4,
    cyBot: baseTop + 50,
    barrelLen: 36,
    slots: slots
  };
}

function bossAliveArchers() {
  let n = 0;
  for (let i = 0; i < bossState.archers.length; i++) if (bossState.archers[i].phase !== 'DYING') n++;
  return n;
}

function bossFreeSlot() {
  const g = bossGeom();
  const used = {};
  const perPlat = { 1: 0, 2: 0 };
  bossState.archers.forEach(a => { if (a.slot >= 0 && g.slots[a.slot]) { used[a.slot] = true; perPlat[g.slots[a.slot].plat]++; } });
  // fill whichever platform currently has fewer archers
  const want = perPlat[2] < perPlat[1] ? 2 : 1;
  for (let i = 0; i < g.slots.length; i++) if (!used[i] && g.slots[i].plat === want) return i;
  for (let i = 0; i < g.slots.length; i++) if (!used[i]) return i;
  return -1;
}

function bossSpawnArcher(instant) {
  if (bossAliveArchers() >= BOSS_MAX_ARCHERS) return false;
  const g = bossGeom();
  const slot = bossFreeSlot();
  const a = { slot: slot, anim: Math.random() * 10, phase: 'EMERGE', fade: 0, recoil: 0, aim: false, fireIn: -1, dieT: 0, x: g.doorCx, y: g.sillY };
  if (instant) {
    if (slot < 0) return false;
    a.phase = 'READY';
    a.fade = 1;
    a.x = g.slots[slot].x;
    a.y = g.slots[slot].py + g.slots[slot].dy;
  }
  bossState.archers.push(a);
  return true;
}

function bossKillArcher(a) {
  if (!a || a.phase === 'DYING') return;
  a.phase = 'DYING';
  a.dieT = 0;
  a.slot = -1;
  a.aim = false;
  a.fireIn = -1;
  if (sound.knightHit) sound.knightHit();
}

function bossResetState() {
  bossState.baseX = width;
  bossState.x = width;
  bossState.swayAmp = 0;
  bossState.arrived = false;
  bossState.chaseOff = 0;
  bossState.chaseV = 0;
  bossState.chaseTarget = 0;
  bossState.chaseTimer = 120;
  bossState.frame = 0;
  bossState.bump = 0;
  bossState.rumbleY = 0;
  bossState.groundScroll = 0;
  bossState.roll = 1;
  bossState.wheelAngle = 0;
  bossState.topHp = 100;
  bossState.midHp = 100;
  bossState.botHp = 100;
  bossState.topState = 'IDLE';
  bossState.botState = 'IDLE';
  bossState.topTimer = 100;
  bossState.botTimer = 180;
  bossState.topChainProgress = 0;
  bossState.botChainProgress = 0;
  bossState.groupShootTimer = 0;
  bossState.speechBubbleTimer = 0;
  bossState.spawnTimer = 0;
  bossState.clearHold = 0;
  bossState.wave = 1;
  bossState.waveState = 'FIGHTING';
  bossState.waveToSpawn = 0;
  bossState.fightTimer = 0;
  bossState.shotKills = {};
  bossState.topFlash = 0;
  bossState.midFlash = 0;
  bossState.botFlash = 0;
  bossState.burn = { top: bossBurnNew(), mid: bossBurnNew(), bot: bossBurnNew() };
  invulnerableTimer = 0;

  // A garrison is already on the platform; more keep coming up the ladder.
  bossState.archers = [];
  for (let i = 0; i < BOSS_FIRST_WAVE; i++) bossSpawnArcher(true);
  bossRocks = [];
}

// Clear the level so only the dragon and the tower are left.
function bossClearWorld() {

  obstacles = [];
  battlements = [];
  archers = [];
  knights = [];
  clearLevelExtras();
  trebuchets = [];
  arrows = [];
  trebuchetBoulders = [];
  flames = [];
  groundFlames = [];
  collectableHearts = [];
  khaleesis = [];
  isHoldingAction = false;
  holdTimer = 0;
}

function triggerBossBattle() {
  bossIntro = null;
  bossCinematic = false;
  state = 'BOSS';
  bossState.active = true;
  bossResetState();
  bossClearWorld();
  invulnerableTimer = 0;
  // the beheading music plays during the boss fight; start it from the top
  if (cutsceneMusicAudio.paused) cutsceneMusicAudio.currentTime = 0;
  showKhaleesiBanner('"Here it comes! Burn it down, Syraxx!"', 220);
  updateLevelBadgeUI();
}

// Where a launched sphere is, and how big. Starts small at the cannon mouth, then "swells" as it
// flies at the dragon. Shared by rendering and collision so they always agree.
function bossBall(progress, cy) {
  const g = bossGeom();
  const muzzleX = bossState.x - g.barrelLen;
  const grow = Math.min(1, 0.12 + progress * 4.2);
  const r = Math.max(13, g.rBall * grow);
  return { x: muzzleX - progress * width, y: cy, r: r, rot: -(progress * width) / g.rBall, muzzleX: muzzleX };
}

function bossMuzzleBlast(cy) {
  const g = bossGeom();
  const mx = bossState.x - g.barrelLen;
  sound.boulderLaunch();
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: mx, y: cy,
      vx: -1 - Math.random() * 4, vy: (Math.random() - 0.5) * 3,
      size: 10 + Math.random() * 12, life: 40 + Math.random() * 20,
      color: 'rgba(70,70,80,0.8)', isSmoke: true
    });
  }
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: mx, y: cy,
      vx: -3 - Math.random() * 6, vy: (Math.random() - 0.5) * 6,
      size: 2 + Math.random() * 3, life: 12 + Math.random() * 10,
      color: Math.random() < 0.5 ? '#f1c40f' : '#e67e22'
    });
  }
}

// Same destruction sequence as the castle towers: ignite, a dark char wave sweeps down with
// falling debris and smoke, then the section is charred and the tower-destroyed sound plays.
function bossSectionRange(sec, g) {
  if (sec === 'top') return [0, g.turretH];
  if (sec === 'mid') return [g.turretH, g.baseTop];
  return [g.baseTop, g.gY];
}

function bossUpdateBurn(sec, hp, g) {
  const b = bossState.burn[sec];

  // surface flames grow, drift and eventually die down (unless the section is going down)
  for (let i = b.flames.length - 1; i >= 0; i--) {
    const f = b.flames[i];
    if (f.w < f.mw) f.w += 0.45;
    if (f.h < f.mh) f.h += 0.55;
    f.x += f.spread;
    f.x = Math.max(6, Math.min(g.bw - 6, f.x));
    f.life--;
    if (f.life <= 0 && !(hp <= 0 && !b.charred)) b.flames.splice(i, 1);
  }

  if (hp <= 0 && b.charProgress === 0 && !b.charred) {
    b.charProgress = 0.01;
    sound.score();
  }

  if (b.charProgress > 0 && !b.charred) {
    b.charProgress += 0.007;
    const range = bossSectionRange(sec, g);
    const waveY = range[0] + (range[1] - range[0]) * b.charProgress;

    if (Math.random() < 0.6) {
      blackDebris.push({
        x: bossState.x + Math.random() * g.bw,
        y: waveY,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 2,
        gravity: 0.25,
        size: 8 + Math.random() * 8,
        life: 60,
        rotation: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.15
      });
    }
    if (Math.random() < 0.4) {
      particles.push({
        x: bossState.x + Math.random() * g.bw,
        y: waveY - 5,
        vx: (Math.random() - 0.5) * 2.0,
        vy: -Math.random() * 1.5,
        size: 6 + Math.random() * 6,
        life: 60,
        color: 'rgba(10, 10, 15, 0.9)',
        isSmoke: true
      });
    }
    if (b.charProgress >= 1.0) {
      b.charProgress = 1.0;
      b.charred = true;
      b.flames = [];
      gameStats.burnedTowers++;
      sound.towerDestroy();
    }
  }

  // smouldering once it is a burnt-out shell
  if (b.charred && Math.random() < 0.03) {
    const range = bossSectionRange(sec, g);
    particles.push({
      x: bossState.x + Math.random() * g.bw,
      y: range[0] + Math.random() * (range[1] - range[0]),
      vx: (Math.random() - 0.5) * 0.8,
      vy: -0.6 - Math.random() * 0.8,
      size: 5 + Math.random() * 5,
      life: 50,
      color: 'rgba(10, 10, 15, 0.7)',
      isSmoke: true
    });
  }
}

function bossAddSurfaceFlame(sec, f, g) {
  const b = bossState.burn[sec];
  if (b.flames.length >= 14 || Math.random() > 0.45) return;
  b.flames.push({
    x: Math.max(8, Math.min(g.bw - 8, f.x - bossState.x)),
    y: f.y,
    w: 12, mw: 28 + Math.random() * 20,
    h: 14, mh: 34 + Math.random() * 22,
    spread: (Math.random() - 0.5) * 0.8,
    life: 240 + Math.random() * 120
  });
}

<script>
// boss-update.js — Siege engine boss per-frame logic: movement, cannons, archer waves, flame hits
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

function updateBossLogic() {
  const g = bossGeom();
  bossState.frame++;

  // ---- roll in, then chase: the tower keeps its spot on screen but lunges toward the dragon
  //      and falls back again, so it feels like it's running you down ----
  const restX = width - g.bw;
  const prevX = bossState.x;
  if (!bossState.arrived) {
    bossState.baseX = Math.max(restX, bossState.baseX - 2.4);
    if (bossState.baseX <= restX) bossState.arrived = true;
  } else {
    bossState.chaseTimer--;
    if (bossState.chaseTimer <= 0) {
      const lunge = Math.random() < 0.6;
      bossState.chaseTarget = lunge
        ? -width * BOSS_CHASE_AHEAD * (0.45 + Math.random() * 0.55)
        : width * BOSS_CHASE_BACK * Math.random();
      bossState.chaseTimer = 140 + Math.random() * 160;
    }
    // a stopped (wrecked) base can't chase any more
    const target = bossState.roll > 0.3 ? bossState.chaseTarget : 0;
    bossState.chaseV += (target - bossState.chaseOff) * 0.0022;
    bossState.chaseV *= 0.94;
    bossState.chaseOff += bossState.chaseV;
    bossState.baseX = restX + bossState.chaseOff;
  }
  bossState.swayAmp += ((bossState.arrived ? 1 : 0) - bossState.swayAmp) * 0.02;
  bossState.x = bossState.baseX + Math.sin(bossState.frame * 0.05) * 3 * bossState.swayAmp;
  const moved = prevX - bossState.x;   // + when it moves left on screen

  // heavy rumble: constant judder plus bumps over rough ground
  const rollNow = Math.max(0, bossState.roll);
  if (Math.random() < 0.035 * rollNow) bossState.bump = 2.5 + Math.random() * 3.5;
  bossState.bump *= 0.82;
  bossState.rumbleY = -(Math.abs(Math.sin(bossState.frame * 1.1)) * 1.6 * rollNow + bossState.bump);

  // tower and dragon travel together: the world scrolls past fast, wheels turn with the ground
  const rollTarget = bossState.botHp > 0 ? 1 : 0;
  bossState.roll += (rollTarget - bossState.roll) * 0.02;
  const groundSpeed = BOSS_ROLL_SPEED * bossState.roll;
  bossState.groundScroll += groundSpeed;
  bossState.wheelAngle += (groundSpeed - moved) / g.wheelR;
  backgroundParallaxX += BOSS_BG_SPEED * Math.max(0.15, bossState.roll);

  // wheels kick up dust clouds, dirt clods and stones
  if (bossState.roll > 0.15) {
    g.wheelXs.forEach(wx => {
      const cx = bossState.x + wx;
      if (Math.random() < 0.7 * rollNow) {
        particles.push({
          x: cx - g.wheelR * (0.2 + Math.random() * 0.6), y: g.gY - 4,
          vx: -(2 + Math.random() * 4) * rollNow, vy: -0.4 - Math.random() * 1.4,
          size: 6 + Math.random() * 10, life: 26 + Math.random() * 20,
          color: 'rgba(150,130,100,0.55)', isSmoke: true
        });
      }
      if (Math.random() < 0.5 * rollNow) {
        bossRocks.push({
          x: cx - g.wheelR * (0.1 + Math.random() * 0.5), y: g.gY - 3,
          vx: -(1.5 + Math.random() * 5) * rollNow, vy: -(2.5 + Math.random() * 5.5),
          size: 2 + Math.random() * 4.5, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 0.4,
          color: ['#6b5a44', '#8a7a62', '#5a4a38', '#9a9286', '#4b4038'][Math.floor(Math.random() * 5)],
          bounced: false, life: 90
        });
      }
    });
  }
  for (let i = bossRocks.length - 1; i >= 0; i--) {
    const r = bossRocks[i];
    r.vy += 0.38;
    r.x += r.vx;
    r.y += r.vy;
    r.rot += r.spin;
    r.life--;
    if (r.y >= g.gY - r.size / 2) {
      r.y = g.gY - r.size / 2;
      if (!r.bounced && r.vy > 2) { r.vy *= -0.35; r.bounced = true; }
      else { r.vy = 0; r.vx = -groundSpeed; }   // lands and is carried off with the ground
    }
    if (r.life <= 0 || r.x < -20) bossRocks.splice(i, 1);
  }

  if (bossState.topFlash > 0) bossState.topFlash--;
  if (bossState.midFlash > 0) bossState.midFlash--;
  if (bossState.botFlash > 0) bossState.botFlash--;

  // These normally live in update() AFTER the BOSS early-return, so they never ran:
  if (invulnerableTimer > 0) invulnerableTimer--;

  if (khaleesiMounted) {
    khaleesiTimer--;
    if (khaleesiTimer <= 0) {
      khaleesiMounted = false;
      khaleesiCombo = 0;
      showKhaleesiBanner('"I LOVE YOU ALWAYS, SYRAXX!"', 240);
    }
  }

  // Hold-to-boost (was only implemented for PLAYING)
  if (isHoldingAction) {
    holdTimer++;
    if (holdTimer > 4 && holdTimer < 45) {
      dragon.vx += 0.95;
      dragon.wingState = 0.8;
      sound.whoosh();
    }
  }

  // ----------------------------------------------------
  // DRAGON FLIGHT, GRAVITY & SCREEN BOUNDS IN BOSS MODE
  // ----------------------------------------------------
  dragon.velocity += dragon.gravity;
  dragon.y += dragon.velocity;

  const gY = height - groundHeight;

  if (dragon.y + dragon.size / 2 >= gY || dragon.y - dragon.size / 2 <= 0) {
    if (!khaleesiMounted) {
      triggerHit();
      if (lives > 0) {
        dragon.y = height * 0.4;
        dragon.velocity = 0;
      }
    } else {
      dragon.y = Math.max(dragon.size / 2, Math.min(gY - dragon.size / 2, dragon.y));
    }
  }

  dragon.x += dragon.vx;
  dragon.vx *= 0.90;

  const thirtyPercentWidth = width * 0.30;
  if (dragon.x > dragon.baseX) {
    let returnSpeed = 1.2;
    if (dragon.x > thirtyPercentWidth) {
      const extraRatio = (dragon.x - thirtyPercentWidth) / (width - thirtyPercentWidth);
      returnSpeed = 3.5 + extraRatio * 9.0;
    }
    dragon.x -= returnSpeed;
    if (dragon.x < dragon.baseX) dragon.x = dragon.baseX;
  }

  // ----------------------------------------------------
  // CANNONS (top & bottom): wind up, fire a metal sphere
  // ----------------------------------------------------
  if (bossState.topHp <= 0) { bossState.topState = 'IDLE'; bossState.topChainProgress = 0; }
  if (bossState.botHp <= 0) { bossState.botState = 'IDLE'; bossState.botChainProgress = 0; }

  if (bossState.topHp > 0) {
    bossState.topTimer--;
    if (bossState.topTimer <= 0) {
      if (bossState.topState !== 'LAUNCHING') bossMuzzleBlast(g.cyTop);
      bossState.topState = 'LAUNCHING';
      bossState.topChainProgress += 0.02;
      if (bossState.topChainProgress >= 1) {
        bossState.topState = 'IDLE';
        bossState.topChainProgress = 0;
        bossState.topTimer = BOSS_CANNON_RELOAD;
      }
    }
  }

  if (bossState.botHp > 0) {
    bossState.botTimer--;
    if (bossState.botTimer <= 0) {
      if (bossState.botState !== 'LAUNCHING') bossMuzzleBlast(g.cyBot);
      bossState.botState = 'LAUNCHING';
      bossState.botChainProgress += 0.02;
      if (bossState.botChainProgress >= 1) {
        bossState.botState = 'IDLE';
        bossState.botChainProgress = 0;
        bossState.botTimer = BOSS_CANNON_RELOAD;
      }
    }
  }

  const ballHit = (st, progress, cy) => {
    if (st !== 'LAUNCHING' || khaleesiMounted) return;
    const b = bossBall(progress, cy);
    if (Math.hypot(dragon.x - b.x, dragon.y - b.y) < b.r + dragon.size / 2 - 8) triggerHit();
  };
  ballHit(bossState.topState, bossState.topChainProgress, g.cyTop);
  ballHit(bossState.botState, bossState.botChainProgress, g.cyBot);

  // Flying into the tower body hurts too
  if (!khaleesiMounted && dragon.x + dragon.size / 2 - 6 > bossState.x) triggerHit();
  if (!khaleesiMounted && dragon.y + dragon.size / 2 > g.deckTop && dragon.x + dragon.size / 2 - 6 > bossState.x - g.over) triggerHit();

  // ----------------------------------------------------
  // ARCHERS: climb out of the door, up the ladder, onto the platform (up to 50)
  // ----------------------------------------------------
  if (bossState.midHp > 0) {
    const aliveN = bossAliveArchers();
    if (bossState.waveState === 'SPAWNING') {
      bossState.spawnTimer++;
      if (bossState.spawnTimer >= BOSS_WAVE_SPAWN_GAP) {
        bossState.spawnTimer = 0;
        if (bossState.waveToSpawn > 0 && bossSpawnArcher(false)) bossState.waveToSpawn--;
        else bossState.waveToSpawn = 0;
        if (bossState.waveToSpawn <= 0) { bossState.waveState = 'FIGHTING'; bossState.fightTimer = 0; }
      }
    } else if (bossState.waveState === 'FIGHTING') {
      // reinforcements march out after a while even if this wave is still alive;
      // wipe a wave out before they arrive and the center opens up
      bossState.fightTimer = (bossState.fightTimer || 0) + 1;
      if (aliveN > 0 && bossState.fightTimer >= BOSS_REINFORCE_FRAMES && aliveN < BOSS_REINFORCE_MAX_ALIVE) {
        bossState.wave++;
        bossState.waveState = 'SPAWNING';
        bossState.waveToSpawn = bossWaveSize(bossState.wave);
        bossState.spawnTimer = BOSS_WAVE_SPAWN_GAP;
        showKhaleesiBanner('"More archers are coming up the ladder!"', 140);
      } else if (aliveN === 0) {
        bossState.waveState = 'OPEN';
        bossState.clearHold = 0;
        showKhaleesiBanner('"The archers are down! Burn the center, Syraxx!"', 160);
      }
    } else if (bossState.waveState === 'OPEN') {
      bossState.clearHold++;
      if (bossState.clearHold >= BOSS_WINDOW_FRAMES) {
        bossState.wave++;
        bossState.waveState = 'SPAWNING';
        bossState.waveToSpawn = bossWaveSize(bossState.wave);
        bossState.spawnTimer = BOSS_WAVE_SPAWN_GAP;
      }
    }
  } else {
    bossState.archers.forEach(a => bossKillArcher(a));
  }

  const speed = 1.1;
  bossState.archers.forEach(a => {
    a.anim += 1;
    if (a.recoil > 0) a.recoil--;
    if (a.phase === 'DYING') { a.dieT++; return; }

    switch (a.phase) {
      case 'EMERGE':
        a.fade = Math.min(1, a.fade + 0.05);
        a.x -= 0.5;
        if (a.fade >= 1) a.phase = 'TO_LADDER';
        break;
      case 'TO_LADDER':
        a.x -= speed;
        if (a.x <= g.ladderX) { a.x = g.ladderX; a.phase = 'CLIMB'; }
        break;
      case 'CLIMB': {
        if (a.slot < 0) a.slot = bossFreeSlot();
        // queue on the ladder: don't climb into the archer above
        let blocked = false;
        for (let i = 0; i < bossState.archers.length; i++) {
          const b = bossState.archers[i];
          if (b !== a && b.phase === 'CLIMB' && b.y < a.y && a.y - b.y < 17) { blocked = true; break; }
        }
        if (a.slot < 0 && a.y <= g.platY2 + 20) blocked = true;   // no room on either platform yet
        if (!blocked) a.y -= 1.5;
        const climbTo = a.slot >= 0 && g.slots[a.slot] ? g.slots[a.slot].py : g.platY;
        if (a.slot >= 0 && a.y <= climbTo) { a.y = climbTo; a.phase = 'TO_SLOT'; }
        break;
      }
      case 'TO_SLOT': {
        if (a.slot < 0) a.slot = bossFreeSlot();
        if (a.slot < 0) break;
        const s = g.slots[a.slot];
        const ty = s.py + s.dy;
        if (a.y > ty) a.y = Math.max(ty, a.y - 0.5);
        const dir = s.x > a.x ? 1 : -1;
        if (Math.abs(s.x - a.x) > speed) a.x += dir * speed; else a.x = s.x;
        if (a.x === s.x && a.y === ty) a.phase = 'READY';
        break;
      }
    }
  });

  for (let i = bossState.archers.length - 1; i >= 0; i--) {
    const a = bossState.archers[i];
    if (a.phase === 'DYING' && a.dieT >= 24) {
      const colors = ['#2980b9', '#f8c291', '#27ae60', '#e74c3c'];
      for (let p = 0; p < 6; p++) {
        particles.push({
          x: bossState.x + a.x, y: a.y - 12,
          vx: (Math.random() - 0.5) * 5, vy: -Math.random() * 3,
          size: 2 + Math.random() * 2, life: 14 + Math.random() * 10,
          color: colors[p % colors.length]
        });
      }
      bossState.archers.splice(i, 1);
    }
  }

  // volleys: a selection of the ready archers draws (glows), then looses with a little stagger
  if (bossState.midHp > 0) {
    bossState.groupShootTimer++;
    const ready = bossState.archers.filter(a => a.phase === 'READY');
    if (bossState.groupShootTimer === BOSS_VOLLEY_CYCLE - 30) {
      const pool = ready.slice().sort(() => Math.random() - 0.5);
      const n = Math.min(pool.length, Math.min(16, 6 + Math.floor(pool.length * 0.25)));
      for (let i = 0; i < n; i++) pool[i].aim = true;
    }
    if (bossState.groupShootTimer >= BOSS_VOLLEY_CYCLE) {
      bossState.groupShootTimer = 0;
      const shooters = bossState.archers.filter(a => a.aim);
      if (shooters.length > 0) {
        bossState.speechBubbleTimer = 60;
        sound.arrowLaunch();
        shooters.forEach(a => { a.fireIn = Math.floor(Math.random() * 26); });
      }
    }
    bossState.archers.forEach(a => {
      if (a.phase !== 'READY' || a.fireIn < 0) return;
      a.fireIn--;
      if (a.fireIn < 0) {
        a.aim = false;
        a.recoil = 8;
        arrows.push({
          x: bossState.x + a.x - 12,
          y: a.y - 14,
          vx: -7.5,
          vy: (Math.random() - 0.5) * 1.5,
          angle: Math.PI,
          life: 180
        });
      }
    });
    if (bossState.speechBubbleTimer > 0) bossState.speechBubbleTimer--;
  }

  // Active arrows travel toward the dragon and trigger damage hits
  arrows.forEach((arr) => {
    arr.x += arr.vx;
    arr.y += arr.vy;
    arr.life--;

    const distToDragon = Math.hypot(dragon.x - arr.x, dragon.y - arr.y);
    if (distToDragon < dragon.size / 2 + 4) {
      if (!khaleesiMounted) {
        triggerHit();
      }
      arr.life = 0;
    }
  });
  arrows = arrows.filter(arr => arr.life > 0 && arr.x > -40 && arr.x < width + 40);

  // ----------------------------------------------------
  // PLAYER FLAMES: shoot archers in the open middle; damage sections otherwise
  // ----------------------------------------------------
  const FLAME_DAMAGE = 0.6;       // top / bottom cannon, per flame hit (was 1.5, 0.85, 0.72)
  const MID_DAMAGE = 1.2;         // center, while no archer is standing ready
  const laneA = g.turretH;
  const laneB = g.baseTop;
  const midOpen = bossMidOpen();

  flames.forEach(f => {
    if (f.hitBoss) return;

    // flames fly through the open timbers; each flame burns exactly one archer,
    // and one breath can only take out a few of them
    if (bossState.midHp > 0 && f.x > bossState.x - 8 && f.y >= laneA && f.y < laneB) {
      const shot = f.shotId || 0;
      const shotUsed = bossState.shotKills[shot] || 0;
      let victim = null, best = 9999;
      bossState.archers.forEach(a => {
        if (a.phase === 'DYING') return;
        const d = Math.hypot(f.x - (bossState.x + a.x), f.y - (a.y - 14));
        if (d < best) { best = d; victim = a; }
      });
      if (victim && best < 16 + f.size * 0.25) {
        if (shotUsed < BOSS_KILLS_PER_SHOT) {
          bossKillArcher(victim);
          bossState.shotKills[shot] = shotUsed + 1;
        }
        f.hitBoss = true;
        f.life = 0;
        bossState.midFlash = 3;
        return;
      }
    }

    // the wide wheeled platform sticks out in front of the tower
    if (f.x <= (f.y >= g.deckTop ? bossState.x - g.over : bossState.x)) return;

    let sec = null, dmg = 0;
    if (f.y < laneA) {
      if (bossState.topHp > 0) { sec = 'top'; dmg = FLAME_DAMAGE; }
    } else if (f.y < laneB) {
      // the center cannot be hurt while archers are standing ready on the platform
      if (midOpen) { sec = 'mid'; dmg = MID_DAMAGE; }
    } else {
      if (bossState.botHp > 0) { sec = 'bot'; dmg = FLAME_DAMAGE; }
    }
    if (!sec) return;

    if (sec === 'top') { bossState.topHp = Math.max(0, bossState.topHp - dmg); bossState.topFlash = 6; }
    else if (sec === 'mid') { bossState.midHp = Math.max(0, bossState.midHp - dmg); bossState.midFlash = 6; }
    else { bossState.botHp = Math.max(0, bossState.botHp - dmg); bossState.botFlash = 6; }

    bossAddSurfaceFlame(sec, f, g);
    f.hitBoss = true;
    f.life = 0;
    for (let p = 0; p < 4; p++) {
      particles.push({
        x: f.x, y: f.y,
        vx: -2 - Math.random() * 4, vy: (Math.random() - 0.5) * 5,
        size: 2 + Math.random() * 3, life: 14 + Math.random() * 8,
        color: Math.random() < 0.5 ? '#f1c40f' : '#e67e22'
      });
    }
  });

  // castle-style burn / char / destroy for each section
  bossUpdateBurn('top', bossState.topHp, g);
  bossUpdateBurn('mid', bossState.midHp, g);
  bossUpdateBurn('bot', bossState.botHp, g);

  if (bossState.burn.top.charred && bossState.burn.mid.charred && bossState.burn.bot.charred) {
    bossState.active = false;
    startLevelCelebration(4, 'BOSS_CLEAR');
  }
}
