<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Dragon Conqueror</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b1a">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b1a;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #0f0f2d;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .score-display {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      font-size: 42px;
      font-weight: 800;
      color: #fff;
      text-shadow: 3px 3px 0px #000, -2px -2px 0px #000;
      pointer-events: none;
      z-index: 10;
    }
    .hearts-display {
      position: absolute;
      top: 55px;
      right: 15px;
      font-size: 18px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 2px 2px 0 #000;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .level-progress-badge {
      position: absolute;
      top: 12px;
      right: 15px;
      width: 150px;
      height: 28px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #f1c40f;
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .level-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
      transition: width 0.1s linear;
      z-index: 1;
    }
    .level-progress-text {
      position: absolute;
      top: 0;
      right: 10px;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
      z-index: 2;
      letter-spacing: 1px;
    }
    .bottom-controls-bar {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
      z-index: 50;
    }
    .bottom-controls-bar.flipped {
      flex-direction: row-reverse;
    }
    .action-btn {
      background: rgba(16, 20, 30, 0.85);
      border: 2px solid #f1c40f;
      color: #fff;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      min-height: 52px;
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #8e44ad;
      touch-action: manipulation;
      white-space: nowrap;
      flex: 1;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .btn-symbol {
      font-size: 18px;
      line-height: 1;
    }
    .btn-symbol-large {
      font-family: 'Segoe UI Symbol', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }
    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8e44ad;
    }
    .action-btn.active {
      background: rgba(16, 20, 30, 0.85);
      border-color: #f1c40f;
      box-shadow: 0 4px 0 #8e44ad;
    }
/* PAUSE SCREEN & MODAL BUTTON SIZING & TOUCH HITBOXES */
    .modal-btn,
    .pause-btn,
    .pause-overlay button {
      min-height: 60px !important;
      width: 100% !important;
      font-size: 16px !important;
      font-weight: 800 !important;
      padding: 0 16px !important;
      border-radius: 10px !important;
      touch-action: manipulation;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 60px;
      pointer-events: auto !important; /* Button itself receives taps */
    }

    /* Prevent icons/text inside pause buttons from blocking clicks */
    .modal-btn *,
    .pause-btn *,
    .pause-overlay button * {
      pointer-events: none !important;
    }
    .fire-btn {

      border-color: #ffffff !important;
      box-shadow: 0 4px 0 #990000 !important;
      color: #ffffff !important;
      text-shadow: 1px 1px 2px #000;

      max-width: 28% !important;
      width: 28% !important;

    .fire-btn:active {
      box-shadow: 0 2px 0 #990000 !important;
    }

      opacity: 0.35;
      filter: grayscale(1);
    }
    .sound-toggle-btn {
      max-width: 48px;
      min-width: 44px;
      height: 52px;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      flex: 0 0 auto;

    .modal-overlay {

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

<script>
// audio.js — SoundEngine (Web Audio synth + <audio> element playback)
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isBoostPlaying = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playSoundEffect(audioElem, volume = 0.8) {
        if (this.muted) return;
        if (audioElem && audioElem.src) {
          try {
            audioElem.currentTime = 0;
            audioElem.volume = volume;
            audioElem.play().catch(() => {});
          } catch(e) {}
        }
      }

      stopRoyalSounds() {
        if (sfxQueenEntrance) {
          sfxQueenEntrance.pause();
          sfxQueenEntrance.currentTime = 0;
        }
        if (sfxKingEntrance) {
          sfxKingEntrance.pause();
          sfxKingEntrance.currentTime = 0;
        }
      }

      playFlapSound() {
        if (this.muted || this.isBoostPlaying) return;
        
        if (sfxBoost && sfxBoost.src) {
          this.isBoostPlaying = true;
          sfxBoost.currentTime = 0;
          sfxBoost.volume = 0.4;
          
          const handleEnded = () => {
            this.isBoostPlaying = false;
            sfxBoost.removeEventListener('ended', handleEnded);
          };
          
          sfxBoost.addEventListener('ended', handleEnded);
          
          sfxBoost.play().catch(() => {
            this.isBoostPlaying = false;
          });
        }
      }

      whoosh() {
        this.playFlapSound();
      }

      flap() {
        this.playFlapSound();
      }

      fireRoar() {
    if (this.muted) return;
    this.init();
    
    // Create a low frequency pitch sweep for the fire roar core
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'sawtooth';
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    // Pitch drop simulation (fire release crackle into low rumble)
    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.35);
    
    // Volume envelope (quick attack, smooth decay)
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);

      setRumble(level) {
        if (!this.ctx) return;
        if (this.muted) level = 0;
        if (!this.rumbleGain) {
          if (level <= 0) return;
          const sr = this.ctx.sampleRate;
          const buf = this.ctx.createBuffer(1, sr * 2, sr);
          const d = buf.getChannelData(0);
          let last = 0;
          for (let i = 0; i < d.length; i++) {            // brown noise: deep and rolling
            last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
            d[i] = last * 3.5;
          }
          const src = this.ctx.createBufferSource();
          src.buffer = buf;
          src.loop = true;
          const lp = this.ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 160;
          const throb = this.ctx.createGain();          // wheels thudding over the ground
          throb.gain.value = 0.7;
          const lfo = this.ctx.createOscillator();
          lfo.frequency.value = 6;
          const lfoAmt = this.ctx.createGain();
          lfoAmt.gain.value = 0.3;
          lfo.connect(lfoAmt).connect(throb.gain);
          this.rumbleGain = this.ctx.createGain();
          this.rumbleGain.gain.value = 0;
          src.connect(lp).connect(throb).connect(this.rumbleGain).connect(this.ctx.destination);
          src.start();
          lfo.start();
          this.rumbleLevel = 0;
        }
        if (Math.abs(level - this.rumbleLevel) < 0.01) return;
        this.rumbleLevel = level;
        this.rumbleGain.gain.setTargetAtTime(level * 0.9, this.ctx.currentTime, 0.15);

<script>
// ui.js — HUD, pause, level progression, score/hearts, save codes, share graphic, reset
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    function getLevelScrollSpeed() {
      return 2.5;
    }

    function toggleModeSwitch() {
      isFlapLockActive = !isFlapLockActive;
      toggleFireModeBtn.classList.toggle('active', isFlapLockActive);
      manualFireBtn.style.display = isFlapLockActive ? 'inline-block' : 'none';
    }

    let statePrePause = 'PLAYING';
    function togglePauseGame() {
      if (state === 'PLAYING' || state === 'BOSS') {
        statePrePause = state;
        state = 'PAUSED';
      } else if (state === 'PAUSED') {
        resumeFromPause();
      }
    }

    // Leave the pause screen with a free flap so the dragon doesn't drop straight down.
    function resumeFromPause() {
      if (state !== 'PAUSED') return;
      state = statePrePause || 'PLAYING';
      dragon.velocity = dragon.jump;
      dragon.wingState = 1.0;
      sound.flap();
    }

    function startLevelCelebration(nextLvl, targetDialogueType) {
      currentLevel = nextLvl;
      levelTimerSeconds = 0;
      levelDialogueType = targetDialogueType;
      celebrationTimer = 0;
      celebrationAngle = 0;
      celebrationFadeAlpha = 0;
      state = 'LEVEL_CELEBRATE';
      sound.powerup();
      updateLevelBadgeUI();
    }

    function checkLevelProgression() {
      if (state !== 'PLAYING' || inPrologue()) return;   // prologue.js ends its own levels

      const targetDuration = LEVEL_DURATIONS[currentLevel] || 90;

      if (levelTimerSeconds >= targetDuration) {
        if (currentLevel === 1) {
          startLevelCelebration(2, 'LEVEL1_CLEAR');
        } else if (currentLevel === 2) {
          startLevelCelebration(3, 'LEVEL2_CLEAR');
        } else if (currentLevel === 3) {
          // level 3 ends with fireworks, then the siege-tower cinematic and boss; beating it leads to level 4
          startLevelCelebration(3, 'BOSS_INTRO');
        } else if (currentLevel === 4) {
          startLevelCelebration(5, 'LEVEL4_CLEAR');
        } else if (currentLevel === 5) {
          startLevelCelebration(FINAL_LEVEL + 1, 'VICTORY');
        }
      }
    }

      if (currentLevel === 2) setTimeout(() => showKhaleesiBanner('"Beware the armored knights, Syraxx! Keep your fire on them until their armor melts!"', 260), 4500);
      else if (currentLevel === 4) showKhaleesiBanner('"The armored knights are everywhere now, Syraxx! Burn them down!"', 260);
      else if (currentLevel === 5) { showKhaleesiBanner('"Golden knights! Snatch one while its guard is down and take its shield!"', 280); gkTalkSeen.spot = true; }

      activeMultiplier *= treasureMultiplier();
      const totalPts = pts * activeMultiplier;
      score += totalPts;
      scoreDisplay.innerText = score;
      return { totalPts, multiplier: activeMultiplier };
    }

    function updateHeartsDisplay() {

    const CODE_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const SAVE_CODE_BOSS = 11;   // level character "B": the code starts the siege-tower boss
    let saveCodeBoss = false;    // set by loadSaveCode() when the code is a boss code

    function atBossFight() {
      if (state === 'BOSS_INTRO') return true;
      if (!bossState.active) return false;
      return state === 'BOSS' || (state === 'PAUSED' && statePrePause === 'BOSS');
    }
    
    // Save code: 12 characters, shown as XXXX-XXXX-XXXX.
    //   score (5) · kings (1) · queens (1) · villagers (3) · level (1, "B" = boss) · check (1)
    // Old 6- and 7-character codes still load.
    function codeEncode(n, len) {
      let s = '';
      for (let i = 0; i < len; i++) { s = CODE_CHARS[n % 36] + s; n = Math.floor(n / 36); }
      return s;
    }
    function codeDecode(str) {
      let n = 0;
      for (let i = 0; i < str.length; i++) {
        const v = CODE_CHARS.indexOf(str[i]);
        if (v < 0) return -1;
        n = n * 36 + v;
      }
      return n;
    }
    function codeCheckChar(body) {
      let sum = 0;
      for (let i = 0; i < body.length; i++) sum += CODE_CHARS.indexOf(body[i]) * (i + 3);
      return CODE_CHARS[sum % 36];
    }

    function generateSaveCode() {
      const p = Math.min(Math.max(0, Math.floor(score)), 36 ** 5 - 1);
      const k = Math.min(gameStats.kingsBeheaded, 35);
      const q = Math.min(gameStats.queensBeheaded, 35);
      const v = Math.min(gameStats.villagersKilled, 36 ** 3 - 1);
      let lvl = atBossFight() ? SAVE_CODE_BOSS : Math.min(currentLevel, FINAL_LEVEL);
      if (inPrologue() || state === 'CAPTURE') lvl = currentLevel === PRO_MEADOW ? PRO_CODE_MEADOW : PRO_CODE_VILLAGE;
      const body = codeEncode(p, 5) + CODE_CHARS[k] + CODE_CHARS[q] + codeEncode(v, 3) + CODE_CHARS[lvl];
      const code = body + codeCheckChar(body);
      return code.slice(0, 4) + '-' + code.slice(4, 8) + '-' + code.slice(8);
    }

    function loadSaveCode(codeStr) {
      if (!codeStr) return false;
      const clean = codeStr.toUpperCase().replace(/[^0-9A-Z]/g, '');
      let savedScore, savedKings, savedQueens, savedVillagers, lvlVal;

      if (clean.length === 12) {
        const body = clean.slice(0, 11);
        if (codeCheckChar(body) !== clean[11]) return false;   // typo
        savedScore = codeDecode(body.slice(0, 5));
        savedKings = codeDecode(body[5]);
        savedQueens = codeDecode(body[6]);
        savedVillagers = codeDecode(body.slice(7, 10));
        lvlVal = codeDecode(body[10]);
      } else if (clean.length === 6 || clean.length === 7) {
        // old short format: score (2) kings queens villagers (2) [level]
        savedScore = codeDecode(clean.slice(0, 2));
        savedKings = codeDecode(clean[2]);
        savedQueens = codeDecode(clean[3]);
        savedVillagers = codeDecode(clean.slice(4, 6));
        lvlVal = clean.length === 7 ? codeDecode(clean[6]) : Math.min(3, Math.max(1, Math.floor(savedScore / 1000) + 1));
      } else return false;

      if ([savedScore, savedKings, savedQueens, savedVillagers, lvlVal].some(x => x < 0)) return false;

      const isBoss = lvlVal === SAVE_CODE_BOSS;
      let savedLvl = isBoss ? 3 : Math.max(1, Math.min(FINAL_LEVEL, lvlVal));
      if (clean.length === 12 && isPrologueCode(lvlVal)) savedLvl = lvlVal === PRO_CODE_MEADOW ? PRO_MEADOW : PRO_VILLAGE;

      resetGame();
      score = savedScore;
      currentLevel = savedLvl;
      levelTimerSeconds = 0;
      gameStats.kingsBeheaded = savedKings;
      gameStats.queensBeheaded = savedQueens;
      gameStats.villagersKilled = savedVillagers;
      gameStats.burnedTowers = Math.floor(savedScore / 25);

      royalHeads = savedKings + savedQueens;
      royalHeadTypes = [
        ...Array(savedKings).fill('KING'),
        ...Array(savedQueens).fill('QUEEN')
      ];

      updateLevelBadgeUI();
      scoreDisplay.innerText = score;
      updateHeartsDisplay();
      saveCodeBoss = isBoss;
      return true;
    }

    function saveGame() {

// input.js — Click/touch/mouse input, button listeners, modal touch isolation
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    function checkLevelDialogueClick(clientX, clientY) {
      if (state !== 'LEVEL_DIALOGUE') return false;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const pSize = 140;
      const pY = 120;
      const isIntroStyle = (levelDialogueType === 'INTRO' || levelDialogueType === 'LEVEL1_CLEAR');
      const statsBoxY = isIntroStyle ? (pY + pSize + 20) : (pY + pSize + 40);
      const statsBoxH = isIntroStyle ? 90 : 175;

      const btnW = 220;
      const btnH = 46;
      const btnX = (width - btnW) / 2;
      const btnY = statsBoxY + statsBoxH + 20;

      if (canvasX >= btnX && canvasX <= btnX + btnW && canvasY >= btnY && canvasY <= btnY + btnH) {
        if (levelDialogueType === 'VICTORY') {
          resetGame();
          state = 'PLAYING';
        } else {
          state = 'PLAYING';
          dragon.velocity = dragon.jump;
          dragon.wingState = 1.0;
          sound.flap();
          announceLevelStart();
        }
        return true;
      }
      return false;
    }

    function checkCutsceneReturnClick(clientX, clientY) {
      if (state !== 'CUTSCENE' || cutsceneTimer < CUTSCENE_BUTTON_FRAME) return false;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const boxSize = 240;
      const bY = height / 2 - 80;
      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;
      const btnY = bY + boxSize + 45;

      if (canvasX >= btnX && canvasX <= btnX + btnW && canvasY >= btnY && canvasY <= btnY + btnH) {
        state = 'PLAYING';
        dragon.velocity = dragon.jump;
        dragon.wingState = 1.0;
        sound.flap();
        return true;
      }
      return false;
    }

  function checkPauseScreenClick(clickX, clickY) {
      if (state !== 'PAUSED') return false;

      const btnW = 240;
      const btnH = 56;
      const btnGap = 14;
      const btnX = (width - btnW) / 2;

      const resumeBtnY = height / 2 - 80;
      const saveBtnY = resumeBtnY + btnH + btnGap;
      const loadBtnY = saveBtnY + btnH + btnGap;
      const flipBtnY = loadBtnY + btnH + btnGap;
      const shareBtnY = flipBtnY + btnH + btnGap;

      if (clickX >= btnX && clickX <= btnX + btnW) {
        if (clickY >= resumeBtnY && clickY <= resumeBtnY + btnH) {
          resumeFromPause();
          return true;
        }

        if (clickY >= saveBtnY && clickY <= saveBtnY + btnH) {
          saveGame();
          pauseModal.style.display = 'flex';
          return true;
        }

        if (clickY >= loadBtnY && clickY <= loadBtnY + btnH) {
          openLoadGameModal();
          return true;
        }

        if (clickY >= flipBtnY && clickY <= flipBtnY + btnH) {
          isControlFlipped = !isControlFlipped;
          bottomControlsBar.classList.toggle('flipped', isControlFlipped);
          return true;
        }

        if (clickY >= shareBtnY && clickY <= shareBtnY + btnH) {
          generateSharePostGraphic();
          return true;
        }
      }
      return false;
    }
    function checkGameOverClick(clickX, clickY) {
      if (state !== 'GAMEOVER') return false;

      if (noHeadContinuePopupTimer > 0) {
        noHeadContinuePopupTimer = 0;
        return true;
      }

      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;

      const continueBtnY = height / 2 - 40;
      const restartBtnY = continueBtnY + 54;
      const loadBtnY = restartBtnY + 54;

      if (clickX >= btnX && clickX <= btnX + btnW) {
        if (clickY >= continueBtnY && clickY <= continueBtnY + btnH) {
          if (royalHeads > 0 && headFadingIndex < 0) {
            headFadingIndex = royalHeads - 1;
            headFadeTimer = 35;
          } else if (royalHeads === 0) {
            noHeadContinuePopupTimer = 240;
          }
          return true;
        }

        if (clickY >= restartBtnY && clickY <= restartBtnY + btnH) {
          const proLvl = inPrologue() ? currentLevel : null;   // dying in the prologue restarts that prologue level
          resetGame();
          if (proLvl !== null) startPrologueLevel(proLvl);
          else state = 'PLAYING';
          return true;
        }

        if (clickY >= loadBtnY && clickY <= loadBtnY + btnH) {
          openLoadGameModal();
          return true;
        }
      }
      return false;
    }

    function handleActionPress(clientX, clientY) {
      if (khaleesiSplash) return;   // ignore taps while the Khaleesi splash is up
      sound.init();

      if (state === 'BOSS_INTRO') { skipBossIntro(); return; }
      if (state === 'CAPTURE') return;   // the ballista capture plays out on its own

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (clientX !== undefined) ? (clientX - rect.left) * scaleX : undefined;
      const clickY = (clientY !== undefined) ? (clientY - rect.top) * scaleY : undefined;

      if (state === 'LEVEL_DIALOGUE') {
        if (clientX !== undefined && clientY !== undefined) {
          checkLevelDialogueClick(clientX, clientY);
        }
        return;
      }

      if (state === 'CUTSCENE') {
        if (clientX !== undefined && clientY !== undefined) {
          checkCutsceneReturnClick(clientX, clientY);
        }
        return;
      }

      if (state === 'PAUSED') {
        if (clickX !== undefined && clickY !== undefined) {
          checkPauseScreenClick(clickX, clickY);
        }
        return;
      }

      if (state === 'SPLASH') {
        if (!textTypingComplete) {
          typedCharIndex = totalCharCount;
          textTypingComplete = true;
        } else {
          state = 'START';
        }
        return;
      }

      if (state === 'CAPTURED_MSG') {
        if (!textTypingComplete) {
          typedCharIndex = totalCharCount;
          textTypingComplete = true;
        } else {
          levelDialogueType = 'INTRO';
          state = 'LEVEL_DIALOGUE';
        }
        return;
      }

      const btnW = 200;
      const btnX = (width - btnW) / 2;

      if (state === 'START') {
        const startBtnY = height / 2 - 10;
        const loadBtnY = startBtnY + 58;

        if (clickX !== undefined && clickY !== undefined && clickX >= btnX && clickX <= btnX + btnW) {
          if (clickY >= loadBtnY && clickY <= loadBtnY + 44) {
            openLoadGameModal();
            return;
          }
          if (clickY >= startBtnY && clickY <= startBtnY + 44) {
            resetGame();
            startPrologueLevel(PRO_MEADOW);
            return;
          }
        }
        resetGame();
        startPrologueLevel(PRO_MEADOW);
        return;
      }

      if (state === 'GAMEOVER') {
        if (clickX !== undefined && clickY !== undefined) {
          checkGameOverClick(clickX, clickY);
        }
        return;
      }

      if (state === 'PLAYING' || state === 'BOSS'){
        dragon.velocity = dragon.jump;
        dragon.wingState = 1.0;
        sound.flap();
        if (!isFlapLockActive) {
          shootFire();
        }
        isHoldingAction = true;
        holdTimer = 0;
      }
    }

    function handleActionRelease() {
      isHoldingAction = false;
      holdTimer = 0;
    }

    container.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      handleActionPress(touch.clientX, touch.clientY);
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
        handleActionRelease();
      }
    });

    container.addEventListener('touchcancel', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
        handleActionRelease();
      }
    });

    container.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
      handleActionPress(e.clientX, e.clientY);
    });

    container.addEventListener('mouseup', (e) => {
      handleActionRelease();
    });

    function isolateBtnTouch(btn, callback) {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
      }, { passive: false });
      
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        callback(e);
      }, { passive: false });

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        callback(e);
      });
    }

    isolateBtnTouch(toggleFireModeBtn, () => {

    });

    isolateBtnTouch(manualFireBtn, () => {

        shootFire();
      }
    });

    isolateBtnTouch(pauseBtn, () => {
      togglePauseGame();
    });

    isolateBtnTouch(closeSaveModalBtn, () => {
      pauseModal.style.display = 'none';
      // back to the pause menu, not straight into the game
    });

    isolateBtnTouch(closeShareModalBtn, () => {
      shareModal.style.display = 'none';
    });

    isolateBtnTouch(copyCodeBtn, () => {
      const textToCopy = saveCodeDisplay.innerText.trim();
      if (!textToCopy || textToCopy === '-------') return;

      const setCopySuccessVisual = () => {
        const origText = copyCodeBtn.innerText;
        copyCodeBtn.innerText = 'COPIED!';
        copyCodeBtn.style.background = '#2ecc71';
        setTimeout(() => {
          copyCodeBtn.innerText = origText;
          copyCodeBtn.style.background = '';
        }, 1500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(setCopySuccessVisual).catch(() => {
          fallbackCopyText(textToCopy, setCopySuccessVisual);
        });
      } else {
        fallbackCopyText(textToCopy, setCopySuccessVisual);
      }
    });

    function fallbackCopyText(text, successCallback) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        if (successCallback) successCallback();
      } catch (err) {
        alert("Copy failed. Please manually select and copy: " + text);
      }
      document.body.removeChild(textArea);
    }

    isolateBtnTouch(downloadShareBtn, () => {
      if (!shareCanvas) return;

      shareCanvas.toBlob((blob) => {
        if (!blob) return;

        const blobUrl = URL.createObjectURL(blob);

        if (navigator.canShare && navigator.share) {
          const file = new File([blob], 'conqueror.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {

              files: [file],
              title: 'Flappy Dragon Conqueror',
              text: `I scored ${score} pts in Flappy Dragon Conqueror!`
            }).catch(() => {});
          }
        }

        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = blobUrl;
        downloadAnchor.download = 'conqueror.png';
        downloadAnchor.target = '_blank';
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

        setTimeout(() => {
          window.open(blobUrl, '_blank');
        }, 100);

        setTimeout(() => {
          URL.revokeObjectURL(blobUrl);
        }, 10000);
      }, 'image/png');

      sound.muted = !sound.muted;
      soundBtn.innerText = sound.muted ? '🔇' : '🔊';
      sound.updateMusicState(state);
    });

    isolateBtnTouch(confirmLoadBtn, () => {
      const code = loadCodeInput.value.trim();
      if (code && loadSaveCode(code)) {
        loadModal.style.display = 'none';
        pauseModal.style.display = 'none';

        if (saveCodeBoss) triggerBossBattle();   // a boss code drops you straight into the siege-tower fight
        else if (inPrologue()) startPrologueLevel(currentLevel);
      } else {

    isolateBtnTouch(cancelLoadBtn, () => {
      loadModal.style.display = 'none';

    pauseModal.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: false });
    pauseModal.addEventListener('touchend', (e) => e.stopPropagation(), { passive: false });
    pauseModal.addEventListener('mousedown', (e) => e.stopPropagation());

    shareModal.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: false });

    shareModal.addEventListener('mousedown', (e) => e.stopPropagation());

    loadModal.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: false });
    loadModal.addEventListener('touchend', (e) => e.stopPropagation(), { passive: false });
    loadModal.addEventListener('mousedown', (e) => e.stopPropagation());

<script>
// render-sky.js — Night sky, stars, moon, clouds, parallax castle backdrop (cached layers)
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    // ==========================================
    // BACKGROUND: sky, moon, clouds, castle parallax
    // Static layers are painted once into cached offscreen canvases (keyed by size + level)
    // and blitted each frame; only twinkles, window glows and scrolling are per-frame.
    // ==========================================
    const bgCache = {};
    let bgCacheCount = 0;
    function bgLayer(key, w, h, paint) {
      let c = bgCache[key];
      if (!c) {
        if (bgCacheCount > 40) { for (const k in bgCache) delete bgCache[k]; bgCacheCount = 0; }
        c = document.createElement('canvas');
        c.width = Math.max(1, Math.ceil(w));
        c.height = Math.max(1, Math.ceil(h));
        paint(c.getContext('2d'), c.width, c.height);
        bgCache[key] = c;
        bgCacheCount++;
      }
      return c;
    }

    // deterministic 0..1 noise so cached art and per-brick shading never flicker
    function hash2(x, y) {
      let h = (x * 374761393 + y * 668265263) | 0;
      h = (h ^ (h >>> 13)) * 1274126177 | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }

    function skyTheme() {
      if (currentLevel === 1) return {
        top: '#030817', mid: '#0b1d3d', low: '#1d3f63', horizon: '#3d6b8c',
        haze: '120,170,220', band: '160,190,255', cloudLit: '205,220,245', cloudBody: '60,78,110',
        castleFar: '#16233a', castleNear: '#0c121c', rim: 'rgba(170,200,240,', window: '255,214,140',
        moonTint: null
      };
      if (currentLevel === 2) return {
        top: '#05030f', mid: '#170f35', low: '#34204f', horizon: '#6a3a64',
        haze: '200,130,190', band: '210,170,255', cloudLit: '225,200,240', cloudBody: '70,52,100',
        castleFar: '#221a38', castleNear: '#100b1c', rim: 'rgba(210,180,240,', window: '255,200,130',
        moonTint: null
      };
      if (currentLevel === 4) return {
        // emerald aurora night
        top: '#01080a', mid: '#062a2a', low: '#0f4a44', horizon: '#3d8a6e',
        haze: '90,220,170', band: '140,255,210', cloudLit: '190,240,225', cloudBody: '30,70,72',
        castleFar: '#0f2a2c', castleNear: '#071416', rim: 'rgba(150,255,210,', window: '255,90,90',
        moonTint: 'rgba(90,220,170,0.12)'
      };
      if (currentLevel >= 5) return {
        // golden storm dusk
        top: '#0a0610', mid: '#2a1636', low: '#6e3426', horizon: '#d98a3a',
        haze: '255,190,90', band: '255,220,160', cloudLit: '255,215,160', cloudBody: '78,48,58',
        castleFar: '#2c1a26', castleNear: '#140b12', rim: 'rgba(255,205,120,', window: '255,230,140',
        moonTint: 'rgba(255,190,90,0.18)'
      };
      return {
        top: '#0d0204', mid: '#2c0910', low: '#5a1616', horizon: '#a1421f',
        haze: '255,120,60', band: '255,170,140', cloudLit: '255,190,150', cloudBody: '80,30,32',
        castleFar: '#2a0f14', castleNear: '#140709', rim: 'rgba(255,150,110,', window: '255,170,90',
        moonTint: 'rgba(200,60,30,0.38)'
      };
    }

    function drawNightSky() {
      const th = skyTheme();
      const sky = bgLayer('sky|' + width + 'x' + height + '|' + currentLevel, width, height, (c, w, h) => {
        const g = c.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, th.top);
        g.addColorStop(0.45, th.mid);
        g.addColorStop(0.8, th.low);
        g.addColorStop(1, th.horizon);
        c.fillStyle = g;
        c.fillRect(0, 0, w, h);

        // faint galactic band sweeping diagonally across the sky
        c.save();
        c.translate(w * 0.5, h * 0.3);
        c.rotate(-0.42);
        for (let i = 0; i < 26; i++) {
          const bx = (hash2(i, 1) - 0.5) * w * 1.6;
          const by = (hash2(i, 2) - 0.5) * 70;
          const br = 40 + hash2(i, 3) * 90;
          const rg = c.createRadialGradient(bx, by, 0, bx, by, br);
          rg.addColorStop(0, 'rgba(' + th.band + ',0.07)');
          rg.addColorStop(1, 'rgba(' + th.band + ',0)');
          c.fillStyle = rg;
          c.fillRect(bx - br, by - br, br * 2, br * 2);
        }
        for (let i = 0; i < 380; i++) {
          const sx = (hash2(i, 7) - 0.5) * w * 1.7;
          const sy = (hash2(i, 8) - 0.5) * (hash2(i, 9) < 0.7 ? 60 : 160);
          c.fillStyle = 'rgba(255,255,255,' + (0.08 + hash2(i, 10) * 0.35) + ')';
          c.fillRect(sx, sy, 1, 1);
        }
        c.restore();

        // tiny static background stars
        for (let i = 0; i < 160; i++) {
          c.fillStyle = 'rgba(255,255,255,' + (0.1 + hash2(i, 21) * 0.3) + ')';
          c.fillRect(hash2(i, 22) * w, hash2(i, 23) * h * 0.75, 1, 1);
        }

        // warm/cool haze rising off the horizon
        const hz = c.createLinearGradient(0, h * 0.55, 0, h);
        hz.addColorStop(0, 'rgba(' + th.haze + ',0)');
        hz.addColorStop(1, 'rgba(' + th.haze + ',0.28)');
        c.fillStyle = hz;
        c.fillRect(0, h * 0.55, w, h * 0.45);
      });
      ctx.drawImage(sky, 0, 0);

      // moving, twinkling stars (movement unchanged)
      const tw = Date.now() / 400;
      ctx.fillStyle = '#ffffff';
      stars.forEach((s, i) => {
        const twinkle = 0.65 + 0.35 * Math.sin(tw * (1 + (i % 5) * 0.37) + i * 1.7);
        ctx.globalAlpha = s.alpha * twinkle;
        if (s.size >= 3) {
          ctx.fillRect(s.x, s.y, 2, 2);
          ctx.globalAlpha = s.alpha * twinkle * 0.45;
          ctx.fillRect(s.x - 2, s.y + 0.5, 6, 1);
          ctx.fillRect(s.x + 0.5, s.y - 2, 1, 6);
        } else {
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }
        if (state === 'PLAYING' || state === 'LEVEL_CELEBRATE') {
          s.x -= s.speed * (khaleesiMounted ? 2.2 : 1.0);
          if (s.x < 0) s.x = width;
        }
      });
      ctx.globalAlpha = 1.0;
    }

    function drawMoon() {
      const moonX = width * 0.72;
      const moonY = height * 0.22;
      const R = 54;
      const th = skyTheme();

      // soft layered halo
      const glow = ctx.createRadialGradient(moonX, moonY, R * 0.8, moonX, moonY, R * 3.4);
      const haloCol = currentLevel === 3 ? '255,150,110' : (currentLevel >= 5 ? '255,215,150' : '255,243,205');
      glow.addColorStop(0, 'rgba(' + haloCol + ',0.42)');
      glow.addColorStop(0.35, 'rgba(' + haloCol + ',0.12)');
      glow.addColorStop(1, 'rgba(' + haloCol + ',0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, R * 3.4, 0, Math.PI * 2);
      ctx.fill();

      const moon = bgLayer('moon2|' + currentLevel, R * 2 + 8, R * 2 + 8, (c, w, h) => {
        const cx = w / 2, cy = h / 2;
        c.save();
        c.beginPath();
        c.arc(cx, cy, R, 0, Math.PI * 2);
        c.clip();

        // bright cratered highlands
        c.fillStyle = '#ecebe2';
        c.fillRect(0, 0, w, h);
        for (let i = 0; i < 260; i++) {
          const a = hash2(i, 31) * Math.PI * 2, rr = Math.sqrt(hash2(i, 32)) * R;
          c.fillStyle = hash2(i, 33) < 0.5 ? 'rgba(200,198,186,0.35)' : 'rgba(255,255,250,0.35)';
          c.fillRect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, 1 + hash2(i, 34) * 2, 1 + hash2(i, 35) * 2);
        }

        // maria (the dark "seas"), placed like the real near side at full moon (north up)
        const mare = (u, v, ru, rv, rot, alpha) => {
          const x = cx + u * R, y = cy + v * R;
          c.save();
          c.translate(x, y); c.rotate(rot || 0); c.scale(1, rv / ru);
          const g = c.createRadialGradient(0, 0, 0, 0, 0, ru * R);
          g.addColorStop(0, 'rgba(118,120,116,' + alpha + ')');
          g.addColorStop(0.7, 'rgba(126,128,122,' + (alpha * 0.85) + ')');
          g.addColorStop(1, 'rgba(126,128,122,0)');
          c.fillStyle = g;
          c.beginPath(); c.arc(0, 0, ru * R, 0, Math.PI * 2); c.fill();
          c.restore();
        };
        // Oceanus Procellarum: the huge western sea
        mare(-0.58, -0.05, 0.30, 0.48, 0.15, 0.75);
        mare(-0.50, -0.32, 0.22, 0.20, 0, 0.7);
        mare(-0.55, 0.28, 0.24, 0.20, 0, 0.7);
        mare(-0.70, 0.05, 0.16, 0.30, 0, 0.6);
        // Mare Imbrium (big round sea, upper left)
        mare(-0.24, -0.36, 0.30, 0.25, 0, 0.85);
        // Mare Frigoris (thin band across the north)
        mare(-0.18, -0.70, 0.36, 0.07, -0.08, 0.7);
        mare(0.18, -0.66, 0.20, 0.06, 0.1, 0.6);
        // Mare Serenitatis and Mare Vaporum
        mare(0.16, -0.33, 0.17, 0.16, 0, 0.85);
        mare(-0.02, -0.16, 0.10, 0.08, 0, 0.7);
        // Mare Tranquillitatis
        mare(0.30, -0.04, 0.21, 0.16, 0.3, 0.85);
        mare(0.20, 0.08, 0.12, 0.10, 0, 0.75);
        // Mare Crisium (isolated oval near the eastern limb)
        mare(0.64, -0.27, 0.12, 0.10, 0, 0.9);
        // Mare Fecunditatis and Mare Nectaris
        mare(0.56, 0.14, 0.12, 0.19, 0.2, 0.75);
        mare(0.36, 0.30, 0.09, 0.09, 0, 0.75);
        // Mare Nubium, Mare Cognitum and Mare Humorum
        mare(-0.14, 0.34, 0.18, 0.14, 0, 0.75);
        mare(-0.30, 0.18, 0.12, 0.09, 0, 0.65);
        mare(-0.48, 0.44, 0.10, 0.09, 0, 0.8);

        // Tycho: bright young crater in the south with long rays
        const tx = cx - 0.12 * R, ty = cy + 0.70 * R;
        c.strokeStyle = 'rgba(255,255,250,0.11)';
        c.lineWidth = 1;
        for (let i = 0; i < 14; i++) {
          const a = (i / 14) * Math.PI * 2 + hash2(i, 41) * 0.3;
          const len = R * (0.4 + hash2(i, 42) * 0.9);
          c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx + Math.cos(a) * len, ty + Math.sin(a) * len); c.stroke();
        }
        const tg = c.createRadialGradient(tx, ty, 0, tx, ty, 6);
        tg.addColorStop(0, 'rgba(255,255,255,1)');
        tg.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = tg; c.fillRect(tx - 6, ty - 6, 12, 12);
        c.fillStyle = 'rgba(150,148,140,0.8)'; c.beginPath(); c.arc(tx, ty, 1.6, 0, Math.PI * 2); c.fill();
        // Copernicus and Kepler: small bright ray craters in the western seas
        [[-0.30, -0.08, 4.5], [-0.62, -0.06, 3.2], [-0.36, -0.52, 2.4]].forEach(k => {
          const kx = cx + k[0] * R, ky = cy + k[1] * R;
          const kg = c.createRadialGradient(kx, ky, 0, kx, ky, k[2]);
          kg.addColorStop(0, 'rgba(255,255,250,0.95)');
          kg.addColorStop(1, 'rgba(255,255,250,0)');
          c.fillStyle = kg; c.fillRect(kx - k[2], ky - k[2], k[2] * 2, k[2] * 2);
        });
        // a few small craters in the highlands
        [[0.42, 0.55, 2.2], [0.10, 0.58, 1.8], [0.55, 0.42, 1.6], [-0.30, 0.62, 1.6], [0.70, 0.10, 1.4]].forEach(k => {
          c.fillStyle = 'rgba(170,168,158,0.6)';
          c.beginPath(); c.arc(cx + k[0] * R, cy + k[1] * R, k[2], 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(255,255,250,0.6)';
          c.beginPath(); c.arc(cx + k[0] * R + 0.6, cy + k[1] * R + 0.6, k[2] * 0.6, 0, Math.PI * 2); c.fill();
        });

        // gentle limb darkening (a full moon has no hard terminator)
        const limb = c.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
        limb.addColorStop(0, 'rgba(40,40,60,0)');
        limb.addColorStop(1, 'rgba(40,40,60,0.28)');
        c.fillStyle = limb;
        c.fillRect(0, 0, w, h);

        if (th.moonTint) {
          c.fillStyle = th.moonTint;
          c.fillRect(0, 0, w, h);
        }
        c.restore();

      });
      ctx.drawImage(moon, moonX - moon.width / 2, moonY - moon.height / 2);
    }

    // a soft cumulus: overlapping puffs, moon-lit tops, darker bellies
    function paintCloud(c, x, y, scale, th, alpha) {
      const puffs = [[-70, 10, 34], [-40, -8, 44], [0, -22, 56], [44, -10, 46], [80, 8, 32], [-20, 14, 38], [26, 14, 40]];
      c.save();
      c.globalAlpha = alpha;
      // body
      puffs.forEach(p => {
        const px = x + p[0] * scale, py = y + p[1] * scale, r = p[2] * scale;
        const g = c.createRadialGradient(px, py - r * 0.4, r * 0.2, px, py, r);
        g.addColorStop(0, 'rgba(' + th.cloudLit + ',0.9)');
        g.addColorStop(0.55, 'rgba(' + th.cloudBody + ',0.85)');
        g.addColorStop(1, 'rgba(' + th.cloudBody + ',0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2); c.fill();
      });
      // flat, darker underside
      const ub = c.createLinearGradient(0, y, 0, y + 40 * scale);
      ub.addColorStop(0, 'rgba(' + th.cloudBody + ',0)');
      ub.addColorStop(1, 'rgba(' + th.cloudBody + ',0.55)');
      c.fillStyle = ub;
      c.beginPath();
      c.ellipse(x, y + 18 * scale, 100 * scale, 22 * scale, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function drawGiantClouds() {
      const th = skyTheme();
      const layers = [
        { speed: 0.08, tile: 1400, alpha: 0.35, key: 'far',
          clouds: [[160, 0.10, 0.9], [620, 0.20, 0.7], [1080, 0.06, 1.1]] },
        { speed: 0.15, tile: 1200, alpha: 0.55, key: 'near',
          clouds: [[120, 0.16, 1.15], [550, 0.28, 0.95], [900, 0.09, 1.35]] }
      ];
      layers.forEach(L => {
        const tileH = Math.ceil(height * 0.5);
        const tile = bgLayer('clouds|' + L.key + '|' + height + '|' + currentLevel, L.tile, tileH, (c, w, h) => {
          L.clouds.forEach(cl => {
            const cx = cl[0], cy = height * cl[1] + 40, s = cl[2];
            paintCloud(c, cx, cy, s, th, 1);
            // wrap clouds that straddle the tile edge so the strip tiles seamlessly
            if (cx + 130 * s > w) paintCloud(c, cx - w, cy, s, th, 1);
            if (cx - 130 * s < 0) paintCloud(c, cx + w, cy, s, th, 1);
          });
        });
        const scroll = backgroundParallaxX * L.speed;
        const startX = -(scroll % L.tile);
        ctx.globalAlpha = L.alpha;
        for (let offset = startX - L.tile; offset < width + L.tile; offset += L.tile) {
          ctx.drawImage(tile, Math.round(offset), -40);
        }
        ctx.globalAlpha = 1.0;
      });
    }

    // One castle silhouette tile. towers: [x, w, hFrac, roof], walls: [x, w, hFrac]
    function paintCastleTile(c, w, h, baseY, maxH, color, rim, detail) {
      c.fillStyle = color;
      const crenels = (x, top, ww, cw, gap) => {
        for (let bx = x; bx < x + ww - cw + 1; bx += cw + gap) c.fillRect(bx, top - cw * 0.8, cw, cw * 0.8);
      };
      const towers = detail
        ? [[20, 50, 1.0, 'cone'], [190, 110, 0.88, 'flat'], [400, 60, 0.95, 'cone'], [520, 40, 0.7, 'cone']]
        : [[60, 70, 0.85, 'cone'], [300, 50, 1.0, 'cone'], [470, 90, 0.75, 'flat']];
      const walls = detail
        ? [[70, 120, 0.65], [300, 100, 0.58], [460, 140, 0.45]]
        : [[0, 60, 0.5], [130, 170, 0.55], [350, 120, 0.6], [560, 40, 0.5]];

      walls.forEach(wl => {
        const top = baseY - maxH * wl[2];
        c.fillRect(wl[0], top, wl[1], baseY - top);
        crenels(wl[0], top, wl[1], detail ? 8 : 6, detail ? 8 : 6);
      });

      towers.forEach(t => {
        const tx = t[0], tw = t[1], top = baseY - maxH * t[2];
        c.fillStyle = color;
        c.fillRect(tx, top, tw, baseY - top);
        if (t[3] === 'cone') {
          c.beginPath();
          c.moveTo(tx - 6, top);
          c.lineTo(tx + tw / 2, top - tw * 0.95);
          c.lineTo(tx + tw + 6, top);
          c.closePath();
          c.fill();
          // pennant
          c.fillRect(tx + tw / 2 - 1, top - tw * 0.95 - 14, 2, 14);
          c.beginPath();
          c.moveTo(tx + tw / 2 + 1, top - tw * 0.95 - 14);
          c.lineTo(tx + tw / 2 + 14, top - tw * 0.95 - 10);
          c.lineTo(tx + tw / 2 + 1, top - tw * 0.95 - 6);
          c.fill();
        } else {
          c.fillRect(tx - 4, top - 6, tw + 8, 6);
          crenels(tx - 4, top - 6, tw + 8, 10, 8);
        }

        if (detail) {
          // moonlit right edge and roof edge
          c.fillStyle = rim + '0.16)';
          c.fillRect(tx + tw - 3, top, 3, baseY - top);
          if (t[3] === 'cone') {
            c.strokeStyle = rim + '0.25)';
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(tx + tw / 2, top - tw * 0.95);
            c.lineTo(tx + tw + 6, top);
            c.stroke();
          }
          // dark arrow slits
          c.fillStyle = 'rgba(0,0,0,0.45)';
          for (let sy = top + 40; sy < baseY - 40; sy += 46) c.fillRect(tx + tw / 2 - 2, sy, 4, 14);
          // faint stone courses
          c.fillStyle = 'rgba(255,255,255,0.025)';
          for (let sy = top + 8; sy < baseY; sy += 10) c.fillRect(tx, sy, tw, 1);
          c.fillStyle = color;
        }
      });

      if (detail) {
        // great gate on the big tower
        c.fillStyle = 'rgba(0,0,0,0.55)';
        c.beginPath();
        c.arc(245, baseY - 40, 24, Math.PI, 0);
        c.rect(221, baseY - 40, 48, 40);
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.5)';
        c.lineWidth = 1;
        for (let gx = 225; gx < 268; gx += 6) { c.beginPath(); c.moveTo(gx, baseY - 60); c.lineTo(gx, baseY); c.stroke(); }
        // moonlit wall tops
        c.fillStyle = rim + '0.12)';
        walls.forEach(wl => c.fillRect(wl[0], baseY - maxH * wl[2], wl[1], 2));
      }
    }

    // window positions (relative to the near tile) that glow and flicker
    const CASTLE_WINDOWS = [
      [45, 0.92], [105, 0.58], [155, 0.58], [215, 0.80], [275, 0.80], [245, 0.70],
      [350, 0.52], [430, 0.86], [490, 0.38], [540, 0.62]
    ];

    function drawParallaxCastleBackground() {
      const gY = height - groundHeight;
      const maxCastleH = height * 0.40;
      const th = skyTheme();
      const tileH = Math.ceil(maxCastleH * 1.6 + 40);
      const tileBase = tileH;   // ground line inside the tile

      // far hills + distant castle (slower)
      const farTile = bgLayer('castleFar|' + height + '|' + currentLevel, 640, tileH, (c, w, h) => {
        c.fillStyle = th.castleFar;
        c.beginPath();
        c.moveTo(0, h);
        for (let x = 0; x <= w; x += 16) {
          const y = h - maxCastleH * 0.32 - Math.sin(x / w * Math.PI * 2) * 18 - Math.sin(x / w * Math.PI * 6 + 1) * 8;
          c.lineTo(x, y);
        }
        c.lineTo(w, h);
        c.closePath();
        c.fill();
        paintCastleTile(c, w, h, h - maxCastleH * 0.25, maxCastleH * 0.55, th.castleFar, th.rim, false);
        // distance haze over the far layer
        const hz = c.createLinearGradient(0, h - maxCastleH, 0, h);
        hz.addColorStop(0, 'rgba(' + th.haze + ',0.10)');
        hz.addColorStop(1, 'rgba(' + th.haze + ',0.22)');

<script>
// render-world.js — Ground, ground flames, battlements, archers & arrows
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    function drawGround() {
      const gY = height - groundHeight;
      const scrollSpeed = getLevelScrollSpeed();

      ctx.fillStyle = '#181e28';
      ctx.fillRect(0, gY, width, groundHeight);
      
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(0, gY, width, 8);

      ctx.fillStyle = '#2ecc71';
      for (let x = -(gScroll % 12); x < width; x += 12) {
        ctx.fillRect(x, gY - 2, 6, 4);
      }
      if (gScroll > 0) {
        // stones and dirt streaks rushing past in the foreground
        for (let k = 0; k < 9; k++) {
          const px = (((k * 61 - gScroll * 1.5) % (width + 60)) + (width + 60)) % (width + 60) - 30;
          ctx.fillStyle = '#232c3a';
          ctx.fillRect(px, gY + 14 + (k % 3) * 16, 16 + (k % 4) * 6, 3);
          ctx.fillStyle = '#2c3748';
          ctx.fillRect(px + 2, gY + 11 + (k % 3) * 16, 8, 3);
        }
      }

      const t = Date.now() / 150;
      groundFlames.forEach((gf) => {
        gf.x -= scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);
        gf.life--;

        const boostMult = gf.boostIntensity || 1.0;
        const flick = Math.sin(t * 2 + gf.x) * (4 * boostMult);

        drawFlame(gf.x, gY, 20 * boostMult, 30 * boostMult, gf.x * 0.07, Math.min(1, gf.life / 30));

        if (gf.boostIntensity > 1.0) gf.boostIntensity *= 0.98;
      });

      groundFlames = groundFlames.filter(gf => gf.life > 0 && gf.x > -20);
    }

    function drawBattlements() {
      const gY = height - groundHeight;

      battlements.forEach(b => {
        const bX = b.x;
        const bY = gY - b.height;
        const bW = b.width;

        if (bW <= 0 || bX + bW < -40 || bX > width + 40) return;

        const useP = (b.isCrushed || b.isCharred) ? charPalette : stonePalette;

        drawMasonry(bX, bY, bW, b.height, useP, b);

        ctx.fillStyle = useP.light;
        ctx.fillRect(bX, bY, bW, 3);

        const crenelW = 28;
        const crenelH = 20;
        const crenelGap = 16;
        const step = crenelW + crenelGap;

        for (let relX = 4; relX <= bW - crenelW - 4; relX += step) {
          const x = bX + relX;
          drawMasonry(x, bY - crenelH, crenelW, crenelH, useP, b);

          ctx.fillStyle = useP.light;
          ctx.fillRect(x, bY - crenelH, crenelW, 3);
          ctx.fillRect(x, bY - crenelH, 3, crenelH);

          ctx.fillStyle = useP.dark;
          ctx.fillRect(x + crenelW - 3, bY - crenelH, 3, crenelH);
        }
      });

    // Level 5: every archer on screen follows one shared clock, like the siege tower's archers:
    // they rise, draw together, a "LOOSE!" shout goes up, and they all fire at once.
    const ARCHER_VOLLEY_CYCLE = 240;
    const ARCHER_VOLLEY = { reveal: 100, draw: 150, shout: 192, fire: 210, hide: 235 };
    let archerVolleyT = 0;

    function archerVolleyState(t) {
      if (t < ARCHER_VOLLEY.reveal || t >= ARCHER_VOLLEY.hide) return 'HIDDEN';
      if (t < ARCHER_VOLLEY.draw) return 'REVEALED';
      if (t < ARCHER_VOLLEY.fire) return 'GLOWING';
      return 'HOLDING';
    }

    function fireArcherArrow(archerX, bY) {
      const archerY = bY - 14;
      const dx = dragon.x - archerX;
      const dy = dragon.y - archerY;
      const dist = Math.hypot(dx, dy) || 1;
      const speed = 4.2;
      arrows.push({ x: archerX, y: archerY, vx: (dx / dist) * speed, vy: (dy / dist) * speed, angle: Math.atan2(dy, dx), life: 180 });
    }

    function drawArchersAndArrows() {
      const gY = height - groundHeight;
      const volley = currentLevel >= 5;
      let volleyPhase = -1;
      if (volley) {
        if (state === 'PLAYING') archerVolleyT++;
        volleyPhase = archerVolleyT % ARCHER_VOLLEY_CYCLE;
        if (state === 'PLAYING' && volleyPhase === ARCHER_VOLLEY.fire && archers.some(a => !a.destroyed && a.battlementRef && a.battlementRef.x + a.relX > 0 && a.battlementRef.x + a.relX < width)) sound.arrowLaunch();
      }
      const shouters = [];

      archers.forEach(a => {
        const b = a.battlementRef;
        if (!b || a.destroyed) return;

        const bX = b.x;
        const bY = gY - b.height;
        const archerX = bX + a.relX;

        if (archerX < -40 || (bX + b.width) < -40) {
          a.destroyed = true;
          return;
        }

        if (state === 'PLAYING' && volley) {
          a.state = archerVolleyState(volleyPhase);
          a.isExposed = a.state !== 'HIDDEN';
          if (volleyPhase === ARCHER_VOLLEY.fire && archerX > 0 && archerX < width) fireArcherArrow(archerX, bY);
          if (volleyPhase >= ARCHER_VOLLEY.shout && volleyPhase < ARCHER_VOLLEY.hide && archerX > 10 && archerX < width - 10 && !shouters.some(s => s.b === b)) shouters.push({ b: b, x: archerX, y: bY - 14 });
        } else if (state === 'PLAYING') {
          a.timer++;
          a.cycleTimer++;

          switch (a.state) {
            case 'HIDDEN':
              a.isExposed = false;
              if (a.cycleTimer >= 220) {
                a.state = 'REVEALED';
                a.timer = 0;
                a.isExposed = true;
              }
              break;
            case 'REVEALED':
              a.isExposed = true;
              if (a.timer >= 50) {
                a.state = 'GLOWING';
                a.timer = 0;
              }
              break;
            case 'GLOWING':
              a.isExposed = true;
              if (a.timer >= 60) {
                a.state = 'HOLDING';
                a.timer = 0;
              }
              break;
            case 'HOLDING':
              a.isExposed = true;
              if (a.timer >= 25 && !a.isFiring) {
                a.isFiring = true;
                sound.arrowLaunch();

                const archerY = bY - 14;
                const dx = dragon.x - archerX;
                const dy = dragon.y - archerY;
                const dist = Math.hypot(dx, dy) || 1;
                const speed = 4.2;

                arrows.push({
                  x: archerX,
                  y: archerY,
                  vx: (dx / dist) * speed,
                  vy: (dy / dist) * speed,
                  angle: Math.atan2(dy, dx),
                  life: 180
                });
              }
              if (a.timer >= 35) {
                a.state = 'HIDDEN';
                a.timer = 0;
                a.cycleTimer = 0;
                a.isExposed = false;
                a.isFiring = false;
              }
              break;
          }
        }

        if (a.isExposed && !a.archerAwarded) {
          const archerY = bY - 14;

          flames.forEach(f => {
            if (Math.hypot(f.x - archerX, f.y - archerY) < 24) {
              a.destroyed = true;
              a.archerAwarded = true;
              gameStats.villagersKilled++;
              gameStats.archersKilled++;
              sound.knightHit();
              const scoreResult = addScore(20);
              floatingTexts.push({ x: archerX - 15, y: archerY - 20, text: 'ARCHER! +' + scoreResult.totalPts, color: '#f1c40f', alpha: 1.0, vy: -1.5 });
              
              for (let p = 0; p < 12; p++) {
                particles.push({
                  x: archerX,
                  y: archerY,
                  vx: (Math.random() - 0.5) * 8,
                  vy: (Math.random() - 0.5) * 8,
                  size: 3 + Math.random() * 3,
                  life: 25,
                  color: '#e74c3c'
                });
              }
            }
          });
        }

        if (a.destroyed) return;

        ctx.save();
        ctx.translate(archerX, bY - 14);

        {
          let pose = 'hidden';
          if (a.isExposed) pose = a.state === 'REVEALED' ? 'alert' : (a.state === 'GLOWING' ? 'draw' : 'hold');
          if (pose === 'hidden') ctx.translate(0, -10);
          drawArcherDetail(pose, Date.now() / 16, false);
        }

        ctx.restore();
      });

      archers = archers.filter(a => !a.destroyed);

      // one "LOOSE!" shout per battlement during a level 5 volley
      shouters.forEach(s => drawLooseBubble(s.x, s.y));

      arrows.forEach(arr => {
        if (state === 'PLAYING') {
          arr.x += arr.vx;
          arr.y += arr.vy;
          arr.life--;

          if (arr.bounced) {
            // deflected arrow tumbles away under gravity
            arr.vy += 0.3;
            arr.angle += arr.spin;
          } else {
            const distToDragon = Math.hypot(dragon.x - arr.x, dragon.y - arr.y);
            if (distToDragon < dragon.size / 2 + 4) {
              if (dragonShielded()) {
                shieldDeflect(arr.x, arr.y);
                arr.bounced = true;
                arr.vx = Math.abs(arr.vx) * 0.5 + 2;
                arr.vy = -3.5 - Math.random() * 2.5;
                arr.spin = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.3);
                arr.life = Math.max(arr.life, 60);
              } else {
                if (!khaleesiMounted) triggerHit();
                arr.life = 0;
              }
            }
          }
        }

        ctx.save();
        ctx.translate(arr.x, arr.y);
        ctx.rotate(arr.angle);

        ctx.strokeStyle = '#784e24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(6, 0);
        ctx.stroke();

        ctx.fillStyle = '#bdc3c7';
        ctx.beginPath();
        ctx.moveTo(6, -3);
        ctx.lineTo(12, 0);
        ctx.lineTo(6, 3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-10, -2, 3, 4);

        ctx.restore();
      });

      arrows = arrows.filter(arr => arr.life > 0 && arr.x > -40 && arr.x < width + 40 && arr.y > -40 && arr.y < height + 40);
    }


    // speech bubble matching the siege tower's "LOOSE!" shout
    function drawLooseBubble(ax, ay) {
      const bwid = 62, bh = 26;
      const bubX = Math.max(4, Math.min(width - bwid - 4, ax - bwid / 2 + 14)), bubY = ay - 64;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(bubX, bubY, bwid, bh); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax + 4, bubY + bh);
      ctx.lineTo(ax, bubY + bh + 12);
      ctx.lineTo(ax + 16, bubY + bh);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ax + 5, bubY + bh - 2, 10, 3);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LOOSE!', bubX + bwid / 2, bubY + 18);
      ctx.restore();
    }

// render-characters.js — Khaleesi, mounted HUD, castle walls, collectable hearts

    function drawKhaleesiSprite(kx, ky, scale = 1.0) {

      ctx.fillStyle = '#f5f6fa';

      ctx.fillStyle = '#1e3799';

    function drawKhaleesis() {
      khaleesis.forEach(k => {
        if (k.rescued) return;
        const obs = k.obsRef;
        if (!obs || obs.x + obs.baseWidth < -50) return;

        if (state === 'PLAYING') {
          k.relX += k.direction * 0.15;
          if (k.relX < 4) { k.relX = 4; k.direction = 1; }
          if (k.relX > obs.width - 20) { k.relX = obs.width - 20; k.direction = -1; }

          const kx = obs.x + k.relX;
          const ky = obs.bottomY - 14;
          const dist = Math.hypot(dragon.x - kx, dragon.y - ky);

          if (dist < dragon.size / 2 + 18) {
            k.rescued = true;
            khaleesiMounted = true;
            showKhaleesiSplash();
            khaleesiTimer = KHALEESI_MAX_TIME;
            gameStats.khaleesiRescues++;
            
            lives = 3;
            updateHeartsDisplay();
            const scoreResult = addScore(500);

            sound.powerup();

            floatingTexts.push({
              x: dragon.x - 30,
              y: dragon.y - 35,
              text: 'KHALEESI! +' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x Combo!)',
              color: '#f6b93b',

              vy: -1.8
            });

    function renderMountedKhaleesiHUD() {
      const pSize = 64;
      const pX = 15;
      const pY = 15;

      const renderBubbleBelow = (textString, isMountedSubtitle = false) => {
        ctx.save();
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        
        const rawWords = textString.replace(/"/g, '').split(' ');
        const lines = [];
        let currentLine = '';
        const maxTextWidth = width * 0.76;

        for (let i = 0; i < rawWords.length; i++) {
          let testLine = currentLine ? (currentLine + ' ' + rawWords[i]) : rawWords[i];
          if (ctx.measureText(testLine).width > maxTextWidth && currentLine) {
            lines.push(currentLine);
            currentLine = rawWords[i];
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);

        let longestLineW = 0;
        lines.forEach(l => {
          const w = ctx.measureText(l).width;
          if (w > longestLineW) longestLineW = w;
        });

        const bPaddingX = 14;
        const bPaddingY = 10;
        const lineH = 20;
        const bW = Math.max(160, longestLineW + (bPaddingX * 2));
        const bH = (lines.length * lineH) + (bPaddingY * 2);

        const bX = Math.min(width - bW - 15, pX);
        const bY = pY + pSize + 14;

        ctx.fillStyle = '#ffffff';

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(bX, bY, bW, bH, 10);
        } else {
          ctx.fillRect(bX, bY, bW, bH);
        }
        ctx.fill();

        ctx.fillStyle = isMountedSubtitle ? '#d63031' : '#000000';
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        lines.forEach((l, idx) => {
          ctx.fillText(l, bX + (bW / 2), bY + bPaddingY + 14 + (idx * lineH));
        });

        ctx.restore();
      };

      if (khaleesiMounted) {
        const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, pSize, pSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, pSize, pSize);

        renderBubbleBelow('BREAK THE WHEEL!', true);
      } else if (khaleesiBannerTimer > 0) {
        khaleesiBannerTimer--;
        const activeFrame = (Math.floor(Date.now() / 300) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, pSize, pSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, pSize, pSize);

        renderBubbleBelow(khaleesiBannerText, false);
      }
    }

    function drawCastleWalls(obs) {
      const gY = height - groundHeight;
      
      let pBottom;
      if (obs.isCharred || obs.charProgress > 0) { pBottom = charPalette; }
      else { pBottom = stonePalette; }

      if (obs.topIsCharred) { pTop = charPalette; }

        ctx.fillRect(rx, ry, rw, 3);
        ctx.fillRect(rx, ry, 3, rh);

        ctx.fillStyle = useP.dark;
        ctx.fillRect(rx + rw - 3, ry, 3, rh);
      };

      const drawLevelTorch = (tx, ty) => {
        ctx.fillStyle = '#111';

        ctx.fillRect(tx - 1, ty + 14, 2, 6);

        let flameCore = '#abebc6';

        if (currentLevel === 1) {
          glowColor = 'rgba(52, 152, 219, 0.45)';
          flameMain = '#3498db';
          flameCore = '#a9cce3';
        } else if (currentLevel === 4) {
          glowColor = 'rgba(155, 89, 230, 0.5)';
        } else if (currentLevel >= 5) {

        } else if (currentLevel >= 3) {

        drawFlame(tx, ty + 6, 14, 26, tx * 0.31, 1, torchPal);
      };

      const drawArchedWindow = (wx, wy) => {
        const ww = 32;
        const wh = 54;

        ctx.fillStyle = '#e67e22';

        ctx.arc(wx + ww / 2, wy + 14, ww / 2, Math.PI, 0);
        ctx.stroke();

        ctx.strokeStyle = '#1e2b37';
        
        ctx.beginPath();
        ctx.arc(wx + 8, wy + 26, 8, Math.PI, 0);

    const HEART_DRIFT_DELAY = 240;   // frames before a floating heart starts drifting up like a balloon

    // Arched wooden castle door in a stone frame (replaces the old open archways).
    function drawWoodenDoor(x, archCenterY, w, r, archHeight, charred, owner) {
      const top = archCenterY - r, bottom = archCenterY + archHeight;
      const cxm = x + r;
      const base = charred ? '#2a1a10' : (currentLevel === 4 ? '#7a1220' : '#6b4423');

        ctx.fillStyle = '#7d8a96';

        ctx.fillRect(cxm - 2.5, archCenterY - r * 0.45, 1.5, 9); ctx.fillRect(cxm + 1, archCenterY - r * 0.45, 1.5, 9);

      const glow = ctx.createRadialGradient(cx, cy, size * 0.3, cx, cy, size * 0.95);

      ctx.fillRect(cx - size, cy - size, size * 2, size * 2);

      ctx.fillRect(cx - size / 2, cy - size / 2, size, size);
      if (img.complete && img.naturalWidth !== 0) ctx.drawImage(img, cx - size / 2, cy - size / 2, size, size);
      ctx.lineWidth = 6;
      ctx.strokeStyle = rainbow[Math.floor(s.t / 4) % rainbow.length];
      ctx.strokeRect(cx - size / 2, cy - size / 2, size, size);
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#f1c40f';
      ctx.strokeRect(cx - size / 2 - 6, cy - size / 2 - 6, size + 12, size + 12);

      // titles
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px "Proxima Nova", sans-serif';
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#2a0a3a';
      ctx.strokeText('KHALEESI RIDES!', cx, cy - size / 2 - 22);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('KHALEESI RIDES!', cx, cy - size / 2 - 22);
      const bounce = Math.sin(s.t * 0.3) * 3;
      ctx.font = 'bold 36px "Proxima Nova", sans-serif';
      const tg = ctx.createLinearGradient(cx - 120, 0, cx + 120, 0);
      rainbow.forEach((c, i) => tg.addColorStop(i / (rainbow.length - 1), c));
      ctx.strokeText('INVINCIBLE!', cx, cy + size / 2 + 46 + bounce);
      ctx.fillStyle = tg;
      ctx.fillText('INVINCIBLE!', cx, cy + size / 2 + 46 + bounce);
      ctx.font = 'bold 15px "Proxima Nova", sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Smash everything in your path!', cx, cy + size / 2 + 72 + bounce);
      ctx.restore();
    }
