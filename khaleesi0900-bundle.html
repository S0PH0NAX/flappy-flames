    ctx.fillStyle = 'rgba(255,250,235,' + fade + ')';
    ctx.fillRect(-20, -20, width + 40, height + 40);
  }
}

// ---------- the capture ----------
// A big square net: a rope grid with a thick border and stone weights at the corners.
// (cx, cy) is the centre, s the side length; `drape` bends the edges down around whatever is inside.
function drawSquareNet(cx, cy, s, rot, drape, thin) {
  const lw = thin || 1;   // rope thickness multiplier (the close-up is drawn scaled up, so it uses thinner ropes)
  const h = s / 2;
  const d = drape || 0;
  const N = 8;
  // a point on the net: u, v in -1..1; the sides sag downward when draped
  const pt = (u, v) => {
    let x = u * h, y = v * h;
    if (d) {
      const edge = Math.max(Math.abs(u), Math.abs(v));
      y += d * edge * edge * h * 0.55;          // the edges hang down
      x *= 1 - d * 0.12 * (1 - Math.abs(v));     // and pull in a little at the middle
    }
    return [x, y];
  };
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot || 0);
  ctx.fillStyle = 'rgba(110,100,80,0.14)';
  ctx.beginPath();
  for (let i = 0; i <= N; i++) { const p = pt(-1 + 2 * i / N, -1); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }
  for (let i = 0; i <= N; i++) { const p = pt(1, -1 + 2 * i / N); ctx.lineTo(p[0], p[1]); }
  for (let i = N; i >= 0; i--) { const p = pt(-1 + 2 * i / N, 1); ctx.lineTo(p[0], p[1]); }
  for (let i = N; i >= 0; i--) { const p = pt(-1, -1 + 2 * i / N); ctx.lineTo(p[0], p[1]); }
  ctx.fill();
  const line = (fixed, horiz) => {
    ctx.beginPath();
    for (let i = 0; i <= 16; i++) {
      const k = -1 + 2 * i / 16;
      const p = horiz ? pt(k, fixed) : pt(fixed, k);
      i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]);
    }
    ctx.stroke();
  };
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#2e2a22';
  ctx.lineWidth = (Math.max(1.6, s / 70) + 1.2) * lw;
  for (let i = 0; i <= N; i++) { line(-1 + 2 * i / N, true); line(-1 + 2 * i / N, false); }
  ctx.strokeStyle = '#7d735c';
  ctx.lineWidth = Math.max(1, s / 70) * lw;
  for (let i = 0; i <= N; i++) { line(-1 + 2 * i / N, true); line(-1 + 2 * i / N, false); }
  // heavy border rope
  ctx.strokeStyle = '#4a4232';
  ctx.lineWidth = Math.max(2.5, s / 40) * lw;
  line(-1, true); line(1, true); line(-1, false); line(1, false);
  // knots
  ctx.fillStyle = '#5a5141';
  const kr = Math.max(1.2, s / 90) * lw;
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const p = pt(-1 + 2 * i / N, -1 + 2 * j / N);
    ctx.fillRect(p[0] - kr, p[1] - kr, kr * 2, kr * 2);
  }
  // stone weights on the corners
  [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(c => {
    const p = pt(c[0], c[1]);
    const r = Math.max(3, s / 26) * Math.max(0.7, lw);
    ctx.fillStyle = '#6d7277';
    ctx.beginPath(); ctx.arc(p[0], p[1] + r * 0.6, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#9aa0a6';
    ctx.beginPath(); ctx.arc(p[0] - r * 0.3, p[1] + r * 0.3, r * 0.4, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
  ctx.lineCap = 'butt';
}

function drawCaptureOverlay() {
  const C = pro && pro.cap;
  if (!C) return;
  const t = C.t;
  if (t >= CAP_IMG1) { drawCaptureImages(t); return; }
  if (t >= CAP_CLOSE) { drawCaptureFall(t - CAP_CLOSE); return; }
  const B = proBallista();

  // the rope from the ballista winch to the net
  if (C.net && t >= CAP_FIRE) {
    const nx = t < CAP_HIT ? C.net.x : dragon.x, ny = t < CAP_HIT ? C.net.y : dragon.y - 20;
    const sag = t < CAP_DRAG ? 40 : 6;
    ctx.strokeStyle = '#d8cfb4';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(B.x + 18, B.y + 10);
    ctx.quadraticCurveTo((B.x + nx) / 2, Math.max(B.y, ny) + sag, nx, ny);
    ctx.stroke();
  }

  // once they go over the battlements, only the part above the wall shows
  ctx.save();
  if (t >= CAP_OVER) { ctx.beginPath(); ctx.rect(-50, -50, width + 100, B.wallTop - 14 + 50); ctx.clip(); }
  const pitch = t >= CAP_HIT ? Math.sin(t * 0.35) * (0.25 + C.tumble * 0.6) : null;
  drawDragon(dragon.x, dragon.y, pitch);
  if (C.net && t >= CAP_FIRE && t < CAP_HIT) {
    // flying open, spinning
    drawSquareNet(C.net.x, C.net.y, 10 + C.net.open * 104, C.net.spin, 0);
  } else if (t >= CAP_HIT) {
    // draped over both of them
    const wrap = Math.min(1, (t - CAP_HIT) / 10);
    drawSquareNet(dragon.x + 4, dragon.y - 18, 114 - wrap * 6, (pitch || 0) * 0.8, 0.35 + wrap * 0.45);
  }
  ctx.restore();

  // letterbox, Khaleesi's lines, then a flash into the close-up
  const barH = height * 0.07 * Math.min(1, t / 25);
  ctx.fillStyle = '#000';
  ctx.fillRect(-20, -20, width + 40, barH + 20);
  ctx.fillRect(-20, height - barH, width + 40, barH + 20);
  renderMountedKhaleesiHUD();
  if (t >= CAP_CLOSE - 18) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, (t - (CAP_CLOSE - 18)) / 16) + ')';
    ctx.fillRect(-20, -20, width + 40, height + 40);
  }
}

// Close-up: Cyndraxx and Khaleesi bound together in the net, tumbling through the dusk sky.
// The slavers' wall seen from inside the fall: stone courses scrolling up the right side of the screen,
// with its battlements rushing past at the start. f = frame of the fall.
function drawFallWall(f) {
  const wx = Math.round(width * 0.74);
  const top = Math.round(height * 0.3 - f * 5);      // top of the wall (battlements above it)
  const y0 = Math.max(top, 0);
  ctx.fillStyle = '#4a3f45';
  ctx.fillRect(wx, y0, width - wx, height - y0);
  const rowH = 18, brickW = 34;
  const first = Math.floor((y0 - top) / rowH);
  for (let r = first; top + r * rowH < height; r++) {
    const y = top + r * rowH;
    const off = (r % 2) * (brickW / 2);
    for (let x = wx - off; x < width; x += brickW) {
      const n = hash2(Math.floor((x - wx + off) / brickW) + 7, r);
      ctx.fillStyle = n < 0.33 ? '#564a50' : (n < 0.66 ? '#4f444a' : '#5c4f53');
      ctx.fillRect(Math.max(x, wx) + 1, y + 1, Math.min(brickW - 2, x + brickW - 1 - Math.max(x, wx)), rowH - 2);
    }
    // a lit arrow slit now and then
    if (r > 2 && hash2(r, 41) < 0.12) {
      const sx = wx + 14 + Math.floor(hash2(r, 42) * Math.max(1, width - wx - 34));
      ctx.fillStyle = '#1a1014'; ctx.fillRect(sx, y + 2, 6, rowH * 2 - 4);
      ctx.fillStyle = 'rgba(255,170,90,0.55)'; ctx.fillRect(sx + 2, y + 4, 2, rowH * 2 - 8);
    }
  }
  // battlements on top
  if (top > -30) {
    ctx.fillStyle = '#4a3f45';
    for (let x = wx; x < width; x += 28) ctx.fillRect(x, top - 16, 16, 16);
    ctx.fillStyle = '#6a5c60';
    for (let x = wx; x < width; x += 28) ctx.fillRect(x, top - 16, 16, 3);
  }
  // shadow along the wall's edge, so it reads as a face turned away from the light
  const sh = ctx.createLinearGradient(wx, 0, wx + 26, 0);
  sh.addColorStop(0, 'rgba(0,0,0,0.45)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = sh;
  ctx.fillRect(wx, y0, 26, height - y0);
  ctx.fillStyle = 'rgba(20,10,30,0.25)';   // dusk haze over the stone
  ctx.fillRect(wx, y0, width - wx, height - y0);
}

function drawCaptureFall(f) {
  const t = f / 60;
  const g = ctx.createLinearGradient(0, 0, 0, height);
  g.addColorStop(0, '#120c24');
  g.addColorStop(0.55, '#3b1f45');
  g.addColorStop(1, '#7a3a3a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, width, height);
  // clouds and wind streaks rushing up past them
  for (let i = 0; i < 7; i++) {
    const y = height + 120 - ((f * (2.2 + (i % 3) * 0.8) + i * 170) % (height + 260));
    const x = hash2(i, 3) * width;
    ctx.fillStyle = 'rgba(200,170,210,' + (0.06 + (i % 3) * 0.03) + ')';
    ctx.beginPath(); ctx.ellipse(x, y, 90 + (i % 3) * 40, 26 + (i % 2) * 12, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 26; i++) {
    const x = hash2(i, 9) * width;
    const len = 40 + hash2(i, 10) * 90;
    const y = height + len - ((f * (9 + hash2(i, 11) * 10) + hash2(i, 12) * 900) % (height + len * 2));
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
  }
  // the inside face of the slavers' wall, rushing up past them (its battlements pass at the start)
  drawFallWall(f);
  // the two of them at their normal size, tumbling slowly down the screen
  const k0 = Math.min(1, f / CAP_FALL_FRAMES);
  const cx = width * 0.42 + Math.sin(t * 0.9) * 14;
  const cy = height * (0.2 + 0.32 * k0) + Math.sin(t * 1.3) * 6;
  const rot = Math.sin(t * 0.7) * 0.4 + 0.15;
  const glow = ctx.createRadialGradient(cx, cy - 12, 4, cx, cy - 12, 80);
  glow.addColorStop(0, 'rgba(255,200,150,0.28)');
  glow.addColorStop(1, 'rgba(255,200,150,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, width, height);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  dragon.wingState = 0.12 + Math.abs(Math.sin(f * 0.07)) * 0.08;   // wings pinned, barely moving
  drawDragon(0, 0, -0.15);
  ctx.globalAlpha = 0.8;                // the game's net wrapped around them, a little see-through so they still read
  drawSquareNet(3, -14, 92, 0, 0.75);
  ctx.globalAlpha = 1;
  ctx.restore();
  // a tear-shaped heart rising between them
  if (f > 70) {
    const k = ((f - 70) % 150) / 150;
    const hx = cx + 4, hy = cy - 40 - k * 40;
    ctx.save();
    ctx.globalAlpha = Math.sin(k * Math.PI) * 0.85;
    ctx.fillStyle = '#ff6b8a';
    ctx.translate(hx, hy);
    ctx.scale(1.4, 1.4);
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(-7, -2, -4, -8, 0, -4);
    ctx.bezierCurveTo(4, -8, 7, -2, 0, 4);
    ctx.fill();
    ctx.restore();
  }
  // her words, typed slowly
  if (f > 40) {
    ctx.font = 'bold 15px "Proxima Nova", sans-serif';
    ctx.textAlign = 'center';
    const shown = CAP_FALL_LINE.slice(0, Math.floor((f - 40) * 0.55));
    const lines = biWrap(CAP_FALL_LINE, width - 60);
    let left = shown.length;
    lines.forEach((ln, i) => {
      const part = ln.slice(0, Math.max(0, left));
      left -= ln.length + 1;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillText(part, width / 2 + 1, height * 0.78 + i * 21 + 1);
      ctx.fillStyle = '#ffe9f0';
      ctx.fillText(part, width / 2, height * 0.78 + i * 21);
    });
    ctx.textAlign = 'left';
  }
  // letterbox and fades
  const barH = height * 0.07;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, barH);
  ctx.fillRect(0, height - barH, width, barH);
  let fade = 0;
  if (f < 30) fade = 1 - f / 30;
  if (f > CAP_FALL_FRAMES - 45) fade = Math.min(1, (f - (CAP_FALL_FRAMES - 45)) / 40);
  if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + fade + ')'; ctx.fillRect(0, 0, width, height); }
}

// The two story paintings, each fading in and out with a slow push-in and a caption.
function drawCaptureImages(t) {
  const second = t >= CAP_IMG2;
  drawStoryPicture(second ? captureImg2 : captureImg1, CAP_IMG_CAPTIONS[second ? 1 : 0], t - (second ? CAP_IMG2 : CAP_IMG1), CAP_IMG_FRAMES);
}

// One full-screen storybook picture: fade in, slow push-in, caption, fade out. f = frame within it.
function drawStoryPicture(img, cap, f, frames) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);
  if (img.complete && img.naturalWidth) {
    const zoom = 1 + (f / frames) * 0.06;
    const sc = Math.min(width / img.naturalWidth, height / img.naturalHeight) * zoom;
    const w = img.naturalWidth * sc, h = img.naturalHeight * sc;
    ctx.drawImage(img, (width - w) / 2, (height - h) / 2, w, h);
  }
  // caption on a dark band at the bottom
  const ca = Math.max(0, Math.min(1, (f - 30) / 25));
  if (ca > 0) {
    const bandH = 54;
    const gr = ctx.createLinearGradient(0, height - bandH - 30, 0, height);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(0.4, 'rgba(0,0,0,' + 0.75 * ca + ')');
    gr.addColorStop(1, 'rgba(0,0,0,' + 0.85 * ca + ')');
    ctx.fillStyle = gr;
    ctx.fillRect(0, height - bandH - 30, width, bandH + 30);
    ctx.globalAlpha = ca;
    ctx.fillStyle = '#f3e6d0';
    ctx.font = 'bold 15px "Proxima Nova", sans-serif';
    ctx.textAlign = 'center';
    biWrap(cap, width - 40).forEach((ln, i) => ctx.fillText(ln, width / 2, height - bandH + 14 + i * 19));
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
  let fade = 0;
  if (f < 25) fade = 1 - f / 25;
  if (f > frames - 25) fade = (f - (frames - 25)) / 25;
  if (fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, fade) + ')'; ctx.fillRect(0, 0, width, height); }
}

// ---------- the spring festival ----------
// the great hall: plank walls, flower garlands, a big thatched roof with crossed gable timbers
function drawFestHall(x, base, seed) {
  const w = FEST_HALL_W, wy = base - FEST_WALL_H, rTop = wy - FEST_ROOF_H;
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(x - 6, base - 3, w + 12, 5);
  // plank walls
  ctx.fillStyle = '#9a6a3c';
  ctx.fillRect(x, wy, w, FEST_WALL_H);
  for (let px = x; px < x + w; px += 9) {
    ctx.fillStyle = hash2(seed, px) < 0.5 ? '#8a5c32' : '#a8774a';
    ctx.fillRect(px, wy, 8, FEST_WALL_H);
    ctx.fillStyle = '#6b4423';
    ctx.fillRect(px + 8, wy, 1, FEST_WALL_H);
  }
  ctx.fillStyle = '#5a3a1e';
  ctx.fillRect(x, wy, 5, FEST_WALL_H); ctx.fillRect(x + w - 5, wy, 5, FEST_WALL_H);
  ctx.fillRect(x, wy + FEST_WALL_H * 0.45, w, 3);
  // big double doors, open, with warm light inside
  const dx = x + w * 0.62, dw = 40;
  ctx.fillStyle = '#ffcf7a';
  ctx.fillRect(dx, base - 38, dw, 38);
  ctx.fillStyle = '#e8a64a';
  ctx.fillRect(dx, base - 12, dw, 12);
  ctx.fillStyle = '#5a3a1e';
  ctx.fillRect(dx - 4, base - 42, dw + 8, 4);
  ctx.fillRect(dx - 10, base - 38, 8, 38); ctx.fillRect(dx + dw + 2, base - 38, 8, 38);
  // windows
  [x + w * 0.12, x + w * 0.34].forEach(wx => {
    ctx.fillStyle = '#3a2410'; ctx.fillRect(wx, wy + 9, 16, 13);
    ctx.fillStyle = '#ffd98a'; ctx.fillRect(wx + 2, wy + 11, 12, 9);
    ctx.fillStyle = '#5a3a1e'; ctx.fillRect(wx + 7, wy + 9, 2, 13);
  });
  // thatched roof
  ctx.fillStyle = '#a77e34';
  ctx.beginPath();
  ctx.moveTo(x - 16, wy + 8);
  ctx.quadraticCurveTo(x + w * 0.06, rTop + 10, x + w * 0.2, rTop);
  ctx.lineTo(x + w * 0.8, rTop);
  ctx.quadraticCurveTo(x + w * 0.94, rTop + 10, x + w + 16, wy + 8);
  ctx.closePath();
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#d4ad55';
  ctx.fillRect(x - 20, rTop, w + 40, FEST_ROOF_H + 10);
  for (let r = 0; r < 5; r++) {
    const ry = rTop + 8 + r * (FEST_ROOF_H / 5);
    ctx.fillStyle = '#b08636'; ctx.fillRect(x - 20, ry + FEST_ROOF_H / 5 - 3, w + 40, 2);
    ctx.fillStyle = '#e6c46e'; ctx.fillRect(x - 20, ry, w + 40, 1);
  }
  ctx.strokeStyle = 'rgba(120,85,30,0.5)';
  ctx.lineWidth = 1;
  for (let i = 0; i < w + 40; i += 4) {
    const sx = x - 20 + i, sy = rTop + hash2(seed, i) * FEST_ROOF_H, len = 4 + hash2(seed + i, 3) * 7;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 1, sy + len); ctx.stroke();
  }
  // flower petals scattered on the thatch
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = FLOWER_COLORS[Math.floor(hash2(seed + i, 9) * FLOWER_COLORS.length)];
    ctx.fillRect(x + hash2(seed, i + 70) * w, rTop + 6 + hash2(seed, i + 140) * (FEST_ROOF_H - 10), 2, 2);
  }
  ctx.restore();
  // ridge and crossed gable timbers
  ctx.fillStyle = '#8f6a2a';
  ctx.fillRect(x + w * 0.2, rTop - 3, w * 0.6, 5);
  [[x + w * 0.2, -1], [x + w * 0.8, 1]].forEach(g => {
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(g[0] - 10, rTop + 6); ctx.lineTo(g[0] + 10, rTop - 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(g[0] + 10, rTop + 6); ctx.lineTo(g[0] - 10, rTop - 16); ctx.stroke();
    ctx.lineCap = 'butt';
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = FLOWER_COLORS[(i + (g[1] > 0 ? 2 : 0)) % FLOWER_COLORS.length];
      ctx.beginPath(); ctx.arc(g[0] - 8 + i * 4, rTop - 1 + (i % 2) * 2, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  });
  // ragged eave and a flower garland under it
  ctx.fillStyle = '#b58c3c';
  for (let i = -16; i < w + 16; i += 4) ctx.fillRect(x + i, wy + 5 + hash2(seed, i + 300) * 5, 3, 4);
  for (let s = 0; s < 4; s++) {
    const gx = x + 6 + s * (w - 12) / 4, gw = (w - 12) / 4;
    for (let i = 0; i <= 8; i++) {
      const px = gx + gw * i / 8, py = wy + 14 + Math.sin(Math.PI * i / 8) * 9;
      ctx.fillStyle = i % 2 ? '#3f8a3a' : FLOWER_COLORS[(i + s) % FLOWER_COLORS.length];
      ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function drawFestival(e) {
  const hallBase = proGroundY(e.x + FEST_HALL_W / 2);
  const sqX = e.x + FEST_HALL_W + FEST_GAP;
  // packed-earth square
  const sqY = proGroundY(sqX + FEST_SQUARE_W / 2);
  ctx.fillStyle = 'rgba(201,166,107,0.85)';
  ctx.beginPath(); ctx.ellipse(sqX + FEST_SQUARE_W / 2, sqY + 6, FEST_SQUARE_W / 2 + 10, 12, 0, 0, Math.PI * 2); ctx.fill();
  drawFestHall(e.x, hallBase, e.seed);
  // bunting from the hall roof to the maypole and on to a post
  const poleX = sqX + FEST_POLE_DX;
  const topY = proGroundY(poleX) - 86;
  const post = { x: sqX + FEST_SQUARE_W - 6, y: proGroundY(sqX + FEST_SQUARE_W - 6) - 52 };
  ctx.fillStyle = '#7a5230'; ctx.fillRect(post.x - 2, post.y, 4, 52);
  const hang = (ax, ay, bx, by) => {
    ctx.strokeStyle = '#efe3c8'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2, Math.max(ay, by) + 20, bx, by); ctx.stroke();
    for (let i = 1; i < 12; i++) {
      const u = i / 12;
      const px = ax + (bx - ax) * u;
      const py = (1 - u) * (1 - u) * ay + 2 * u * (1 - u) * (Math.max(ay, by) + 20) + u * u * by;
      ctx.fillStyle = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#ff7fbf', '#9b59b6'][i % 6];
      ctx.beginPath(); ctx.moveTo(px - 4, py); ctx.lineTo(px + 4, py); ctx.lineTo(px, py + 8); ctx.fill();
    }
  };
  hang(e.x + FEST_HALL_W * 0.8 + 8, hallBase - FEST_WALL_H - FEST_ROOF_H + 4, poleX, topY + 6);
  hang(poleX, topY + 6, post.x, post.y);
  // the maypole ring and the crowd
  e.pole.x = poleX;
  drawMaypole(e.pole, proGroundY(poleX));
  e.crowd.x = sqX;
  drawCrowd(e.crowd);
  // "land here" marker while flying in
  const F = pro.fest;
  if (F && F.ent === e && F.phase === 'approach' && F.announced) {
    const ax = e.x + FEST_HALL_W * 0.45;
    const ay = hallBase - FEST_WALL_H - FEST_ROOF_H - 40 - Math.abs(Math.sin(Date.now() / 220)) * 10;
    ctx.save();
    ctx.fillStyle = '#ffe14d'; ctx.strokeStyle = '#5a3a00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax - 12, ay); ctx.lineTo(ax + 12, ay); ctx.lineTo(ax + 12, ay + 10); ctx.lineTo(ax + 20, ay + 10);
    ctx.lineTo(ax, ay + 28); ctx.lineTo(ax - 20, ay + 10); ctx.lineTo(ax - 12, ay + 10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.font = 'bold 13px "Proxima Nova", sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeText('LAND HERE', ax, ay - 6); ctx.fillText('LAND HERE', ax, ay - 6);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

// the festival storybook (dance1, dance2), drawn over everything
function drawFestStory() {
  const F = pro && pro.fest;
  if (!F || F.phase !== 'story') return;
  const second = F.t >= FEST_IMG_FRAMES;
  drawStoryPicture(second ? danceImg2 : danceImg1, FEST_CAPTIONS[second ? 1 : 0], F.t - (second ? FEST_IMG_FRAMES : 0), FEST_IMG_FRAMES);
}

// ---------- story message screens (opening invitation and the capture letter) ----------
function drawStoryMessage(lines, donePrompt, nameTag) {
  const portraitSize = 180;
  const pX = (width - portraitSize) / 2;
  const pY = height / 2 - 10;
  const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;
  const bH = speechBoxHeight(lines.length, 13, 18);
  drawSpeechBox(lines, width / 2, pY - 20 - bH, 13, 18, '#000000', Math.floor(typedCharIndex));

  ctx.fillStyle = '#11161d';
  ctx.fillRect(pX, pY, portraitSize, portraitSize);
  if (activeFrame.complete && activeFrame.naturalWidth !== 0) ctx.drawImage(activeFrame, pX, pY, portraitSize, portraitSize);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#f1c40f';
  ctx.strokeRect(pX, pY, portraitSize, portraitSize);

  let promptY = pY + portraitSize + 35;
  if (nameTag) {   // who is speaking, on a gold plate under the portrait
    fitFont(nameTag, 20, width - 40);
    const tw = ctx.measureText(nameTag).width + 28, ty = pY + portraitSize + 8;
    ctx.fillStyle = '#5a1a12';
    ctx.fillRect((width - tw) / 2, ty, tw, 30);
    ctx.strokeStyle = '#f1c40f';
    ctx.lineWidth = 2;
    ctx.strokeRect((width - tw) / 2, ty, tw, 30);
    ctx.fillStyle = '#f1c40f';
    ctx.textAlign = 'center';
    ctx.fillText(nameTag, width / 2, ty + 22);
    promptY += 34;
  }

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 16px "Proxima Nova", sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  const prompt = textTypingComplete ? donePrompt : 'TAP TO SHOW FULL MESSAGE';
  ctx.strokeText(prompt, width / 2, promptY);
  ctx.fillText(prompt, width / 2, promptY);
}

function drawCapturedMessage() {
  ctx.fillStyle = 'rgba(5, 5, 12, 0.55)';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#e74c3c';
  fitFont('DRAGON QUEEN SARAI HAS BEEN TAKEN', 24, width - 24);
  ctx.textAlign = 'center';
  ctx.fillText('DRAGON QUEEN SARAI HAS BEEN TAKEN', width / 2, height / 2 - 185);
  drawStoryMessage(fullStoryText, 'TAP TO CONTINUE');
}
</script>
<script>
// cathedral.js — Level 2's optional cathedral encounter: a tall tower with a red tiled roof and a great
// stained-glass window appears 3/4 of the way through level 2. No one mentions it. Flying into the window
// (no damage) starts a cutscene (state 'CATHEDRAL'): Cyndraxx falls through a vast golden cathedral, lands
// on the carpet and may REST (dream of the festival, gain a heart container, then doubt, guilt, and the
// priest Clement the Simple, whose strange power sends him back) or FIGHT ON (back to the level at once).
// Drawing is in render-cathedral.js. Classic script: shares global scope with the other src/js files.

const CATH_AT = 135;                    // seconds into level 2 (3/4 of its 180s) when the tower comes
const CATH_W = 150;                     // tower width
const CATH_WIN_W = 70, CATH_WIN_H = 120;  // the great stained-glass window, centered at mid-screen height
const CATH_ROOF_H = 78;                 // red tiled roof above the tower body
const CATH_FALL = 330;                  // frames of the fall through the cathedral
const CATH_DREAM = 270;                 // frames per dream picture (dance1, dance2); a tap moves on
const CATH_MAX_LIVES = 5;
const CATH_CLEM_MID = 36;               // Clement's sphere is centered this far above his feet
const CATH_SPHERE_R = 60;

let cathedral = null;        // the tower in the level { x, broken, noHit }
let cathedralSpawned = false;
let cathScene = null;        // the cutscene while state === 'CATHEDRAL'
let cathDread = false;       // after Clement: a faint dark vignette for the rest of level 2
let cathAfter = null;        // a thought shown back in the level { text, t, dur }
let cathFadeIn = null;       // fading back into the level { color, t, dur }

const cynPortrait = new Image(); cynPortrait.src = 'assets/images/cyndraxx1.jpg';

function resetCathedral() {
  cathedral = null;
  cathedralSpawned = false;
  cathScene = null;
  cathDread = false;
  cathAfter = null;
  cathFadeIn = null;
}

// ---- the tower in level 2 ----
function cathedralGeom(c) {
  const gY = height - groundHeight;
  const winTop = height * 0.5 - CATH_WIN_H / 2;
  const bodyTop = winTop - 34;
  return {
    gY: gY,
    winTop: winTop,
    winBot: winTop + CATH_WIN_H,
    winX: c.x + (CATH_W - CATH_WIN_W) / 2,
    bodyTop: bodyTop,
    roofPeak: bodyTop - CATH_ROOF_H
  };
}

// Is this point inside the tower's stone or roof? (The band at window height is open: that's the way in.)
function cathSolidAt(c, g, px, py) {
  if (px < c.x - 10 || px > c.x + CATH_W + 10 || py > g.gY) return false;
  if (py >= g.winTop && py <= g.winBot) return false;
  if (py >= g.bodyTop) return px >= c.x && px <= c.x + CATH_W;
  if (py < g.roofPeak) return false;
  const half = CATH_W / 2 + 10;          // the roof overhangs a little
  const k = (py - g.roofPeak) / (g.bodyTop - g.roofPeak);
  return Math.abs(px - (c.x + CATH_W / 2)) <= half * k;
}

// Normal towers hold back so the cathedral has the sky to itself.
function cathedralBlocksSpawn() {
  if (currentLevel !== 2 || inPrologue()) return false;
  if (!cathedralSpawned && levelTimerSeconds >= CATH_AT) return true;
  return !!cathedral && cathedral.x + CATH_W > width - 340;
}

// Called every game step while playing (from updateLevelExtras).
function updateCathedralTower(shift) {
  if (cathAfter && ++cathAfter.t >= cathAfter.dur) cathAfter = null;
  if (cathFadeIn && ++cathFadeIn.t >= cathFadeIn.dur) cathFadeIn = null;
  if (currentLevel !== 2) { cathDread = false; return; }
  if (!cathedralSpawned && levelTimerSeconds >= CATH_AT) {
    const last = obstacles[obstacles.length - 1];
    if (!last || width - last.x > last.baseWidth + 400) {
      cathedral = { x: width + 20, broken: false, noHit: false };
      cathedralSpawned = true;
    }
  }
  const c = cathedral;
  if (!c) return;
  c.x -= shift;
  if (c.x + CATH_W < -160) { cathedral = null; return; }
  if (c.broken || khaleesiMounted) return;

  const g = cathedralGeom(c);
  const pad = 7;
  const L = dragon.x - dragon.size / 2 + pad, R = dragon.x + dragon.size / 2 - pad;
  const T = dragon.y - dragon.size / 2 + pad, B = dragon.y + dragon.size / 2 - pad;
  // into the window: no damage, the cutscene begins
  if (R > g.winX + 6 && L < g.winX + CATH_WIN_W && dragon.y > g.winTop + 4 && dragon.y < g.winBot - 4) {
    startCathedralScene();
    return;
  }
  if (c.noHit) return;
  const pts = [[L, T], [R, T], [L, B], [R, B], [dragon.x, T], [dragon.x, B], [L, dragon.y], [R, dragon.y]];
  if (pts.some(p => cathSolidAt(c, g, p[0], p[1]))) {
    obstacleHit();
    c.noHit = true;             // like a normal tower: one knock, then it lets you go
  }
}

// ---- the cutscene ----
const CATH_LINES = {
  rest: 'I think I might be able to rest here for a little while.',
  think1: 'In the beauty of this place I wonder... why do the peasants serve such a cruel king?',
  think2: 'Why do they go to the towers to die? Why give their lives in the name of cruelty?',
  think3: 'Sarai has promised to liberate these people. How can I kill those Sarai would liberate?',
  priestIntro: 'A priest steps out of the shadows: Clement the Simple. He seems to hear Cyndraxx\'s questions, though not one was spoken aloud.',
  clement1: 'They serve to redeem their sins. They give their lives to purify their souls. Nothing matters in this sinful world. This is their path to redemption.',
  think4: 'This man holds some horrible power over the people of the castle...',
  fire: 'If that\'s what you believe, Clement, I can offer you a great gift. For nothing is more purifying than fire!',
  power: 'There is some greater power here I don\'t understand. This priest is much more than he seems.',
  begone: 'Begone, foul beast of fire!',
  dread: 'An extra heart beats in my chest... yet a strange dread follows me.'
};

function cathStartSteps() {
  return [
    { act: 'crash', frames: 44 },
    { act: 'fall', frames: CATH_FALL },
    { act: 'land', frames: 50 },
    { say: 'CYN', text: CATH_LINES.rest, choice: true }
  ];
}

function cathRestSteps() {
  return [
    { act: 'sleep', frames: 170 },
    { act: 'dream', frames: CATH_DREAM * 2 },
    { act: 'wake', frames: 80 },
    { act: 'heart', frames: 230 },
    { say: 'THINK', text: CATH_LINES.think1 },
    { say: 'THINK', text: CATH_LINES.think2 },
    { say: 'THINK', text: CATH_LINES.think3 },
    { act: 'cry', frames: 150 },
    { act: 'priest', frames: 90 },
    { say: 'NARR', text: CATH_LINES.priestIntro },
    { say: 'CLEM', text: CATH_LINES.clement1 },
    { say: 'THINK', text: CATH_LINES.think4 },
    { say: 'CYN', text: CATH_LINES.fire },
    { act: 'breath', frames: 230 },
    { say: 'CYN', text: CATH_LINES.power },
    { say: 'CLEM', text: CATH_LINES.begone },
    { act: 'teleport', frames: 160 },
    { act: 'return', frames: 1 }
  ];
}

function cathFightSteps() {
  return [
    { act: 'fade', frames: 55 },
    { act: 'returnPlain', frames: 1 }
  ];
}

function startCathedralScene() {
  const c = cathedral;
  c.broken = true;
  const g = cathedralGeom(c);
  state = 'CATHEDRAL';
  isHoldingAction = false;
  holdTimer = 0;
  khaleesiBannerTimer = 0;
  invulnerableTimer = 0;
  sound.glassShatter();
  // a burst of colored glass where the window was
  const glass = ['#e74c3c', '#2e86de', '#f1c40f', '#27ae60', '#9b59b6', '#ffffff'];
  for (let i = 0; i < 46; i++) {
    particles.push({
      x: g.winX + Math.random() * CATH_WIN_W,
      y: g.winTop + Math.random() * CATH_WIN_H,
      vx: (Math.random() - 0.3) * 7,
      vy: (Math.random() - 0.7) * 6,
      size: 2 + Math.random() * 4,
      life: 30 + Math.random() * 25,
      color: glass[i % glass.length]
    });
  }
  cathScene = {
    steps: cathStartSteps(), i: 0, t: 0, typed: 0,
    clock: 0, dragonY: -60, rot: 0, tears: false, asleep: false, clement: 0, sphere: 0,
    fx: [], shards: [], buttons: null, crash: { x: g.winX + CATH_WIN_W / 2, y: height * 0.5 }
  };
  // glass falling with him through the cathedral
  for (let i = 0; i < 38; i++) {
    cathScene.shards.push({
      x: width * (0.25 + Math.random() * 0.5), off: -220 + Math.random() * 300,   // height relative to Cyndraxx
      vx: (Math.random() - 0.5) * 1.2, vo: -0.3 + Math.random() * 1.1,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
      s: 3 + Math.random() * 6, color: glass[i % glass.length]
    });
  }
}

function cathStep() { return cathScene && cathScene.steps[cathScene.i]; }

// HUD and buttons hide once we are inside (prologue.js updateFireButtonLock reads this)
function cathCinematic() {
  const s = cathStep();
  return state === 'CATHEDRAL' && !!s && s.act !== 'crash';
}

function cathNext() {
  const S = cathScene;
  S.i++;
  S.t = 0;
  S.typed = 0;
  S.buttons = null;
  const s = cathStep();
  if (!s) return;
  if (s.act === 'heart') {
    maxLives = Math.min(CATH_MAX_LIVES, maxLives + 1);
    lives = maxLives;
    updateHeartsDisplay();
    sound.powerup();
    sound.heartPickup();
  } else if (s.act === 'priest') {
    sound.magicShimmer(1.2);
  } else if (s.act === 'breath') {
    sound.bigBreath();
  } else if (s.act === 'teleport') {
    sound.teleportWhoosh();
    sound.magicShimmer(1.8);
  } else if (s.act === 'sleep') {
    S.asleep = true;
  } else if (s.act === 'cry') {
    S.tears = true;
  } else if (s.say === 'CYN' && s.text === CATH_LINES.fire) {
    S.tears = false;
  } else if (s.act === 'return' || s.act === 'returnPlain') {
    cathReturnToLevel(s.act === 'return');
  }
}

// Where Cyndraxx and Clement stand once he has landed (in screen coordinates; the camera rests on the floor).
function cathDragonSpot() { return { x: width * 0.34, y: height - Math.max(70, height * 0.16) }; }
function cathClementSpot() { return { x: width * 0.74, y: height - Math.max(70, height * 0.16) + 8 }; }
function cathInteriorH() { return height * 3; }

function updateCathedralScene() {
  const S = cathScene;
  const s = cathStep();
  if (!S || !s) return;
  S.t++;
  S.clock++;

  // glass shards tumble down with him
  S.shards.forEach(sh => { sh.x += sh.vx; sh.off += sh.vo; sh.rot += sh.vr; });

  if (s.say) {
    S.typed = Math.min(s.text.length, S.typed + 1.15);
  } else if (s.act === 'fall') {
    const IH = cathInteriorH();
    const floorY = IH - (height - cathDragonSpot().y);
    const u = Math.min(1, S.t / s.frames);
    // he drops faster and faster, then flaps hard near the floor and settles
    const k = u < 0.8 ? Math.pow(u / 0.8, 1.7) * 0.93 : 0.93 + (1 - Math.pow(1 - (u - 0.8) / 0.2, 2)) * 0.07;
    S.dragonY = -60 + (floorY + 60) * k;
    S.rot = u < 0.75 ? Math.sin(S.t * 0.09) * 1.1 * (1 - u) + S.t * 0.04 * (1 - u / 0.75) : S.rot * 0.85;
    if (u > 0.78 && S.t % 9 === 0) { dragon.wingState = 1; sound.flap(); }
  } else if (s.act === 'land') {
    S.rot *= 0.8;
    if (S.t === 1) {
      const d = cathDragonSpot();
      for (let i = 0; i < 18; i++) {
        S.fx.push({ kind: 'dust', x: d.x + (Math.random() - 0.5) * 60, y: d.y + 24, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 1.4, life: 40 + Math.random() * 20 });
      }
    }
  } else if (s.act === 'wake') {
    if (S.t === 30) S.asleep = false;
  } else if (s.act === 'priest') {
    S.clement = Math.min(1, S.t / 70);
  } else if (s.act === 'breath') {
    S.sphere = Math.min(1, Math.max(0, (S.t - 14) / 50));
    const d = cathDragonSpot(), cl = cathClementSpot();
    if (S.t < 150) {
      const mx = d.x + 39 * 1.4, my = d.y - 6;
      for (let i = 0; i < 5; i++) {
        const sp = 7 + Math.random() * 4;
        const ang = Math.atan2(cl.y - CATH_CLEM_MID - my, cl.x - mx) + (Math.random() - 0.5) * 0.28;
        S.fx.push({ kind: 'fire', x: mx, y: my, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 60, size: 16 + Math.random() * 22 });
      }
    }
  } else if (s.act === 'teleport') {
    S.sphere = Math.max(0, 1 - S.t / 40);
  }

  // effect particles (dust, fire that splashes off Clement's sphere)
  const cl = cathClementSpot();
  const R = CATH_SPHERE_R;
  for (let i = S.fx.length - 1; i >= 0; i--) {
    const f = S.fx[i];
    f.x += f.vx; f.y += f.vy; f.life--;
    if (f.kind === 'dust') { f.vx *= 0.95; f.vy *= 0.95; }
    if (f.kind === 'fire') {
      f.size *= 1.012;
      const dx = f.x - cl.x, dy = f.y - (cl.y - CATH_CLEM_MID), dist = Math.hypot(dx, dy);
      if (S.clement > 0 && dist < R + f.size * 0.3 && !f.bounced) {
        // deflected along the sphere: the fire can't touch him
        f.bounced = true;
        const nx = dx / dist, ny = dy / dist;
        const dot = f.vx * nx + f.vy * ny;
        f.vx = (f.vx - 2 * dot * nx) * 0.45 + ny * (Math.random() < 0.5 ? 3 : -3);
        f.vy = (f.vy - 2 * dot * ny) * 0.45 - 1.5;
        f.life = Math.min(f.life, 26);
        if (Math.random() < 0.25) S.fx.push({ kind: 'spark', x: f.x, y: f.y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 22 });
      }
    }
    if (f.life <= 0) S.fx.splice(i, 1);
  }

  if (!s.say && S.t >= s.frames) cathNext();
}

// Tap / click during the cutscene (clickX/Y are canvas coordinates, undefined for the keyboard).
function cathedralTap(x, y) {
  const S = cathScene;
  const s = cathStep();
  if (!S || !s) return;
  if (s.say) {
    if (S.typed < s.text.length) { S.typed = s.text.length; return; }
    if (s.choice) {
      if (x === undefined || !S.buttons) return;
      const hit = S.buttons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
      if (!hit) return;
      sound.score();
      S.steps = S.steps.slice(0, S.i + 1).concat(hit.id === 'rest' ? cathRestSteps() : cathFightSteps());
      cathNext();
      return;
    }
    cathNext();
    return;
  }
  if (s.act === 'dream') {
    // jump to the next picture, or wake up
    if (S.t < CATH_DREAM) S.t = CATH_DREAM; else cathNext();
  } else if (s.act === 'heart' && S.t > 70) {
    cathNext();
  }
}

// Keys for the choice: R = rest, F = fight on
function cathedralKey(code) {
  const s = cathStep();
  if (!s || !s.choice || cathScene.typed < s.text.length) return false;
  if (code !== 'KeyR' && code !== 'KeyF') return false;
  cathScene.steps = cathScene.steps.slice(0, cathScene.i + 1).concat(code === 'KeyR' ? cathRestSteps() : cathFightSteps());
  cathNext();
  return true;
}

function cathReturnToLevel(changed) {
  state = 'PLAYING';
  cathScene = null;
  dragon.x = dragon.baseX;
  dragon.y = height * 0.4;
  dragon.vx = 0;
  dragon.velocity = dragon.jump;
  dragon.wingState = 1;
  invulnerableTimer = 120;     // a moment to get his bearings
  cathedral = null;            // he comes back in open sky (the fade hides the tower going)
  isHoldingAction = false;
  cathFadeIn = { color: changed ? '255,255,255' : '0,0,0', t: 0, dur: 45 };
  if (changed) {
    cathDread = true;
    cathAfter = { text: CATH_LINES.dread, t: 0, dur: 360 };
    // the last of Clement's shimmer clings to him
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 30;
      particles.push({
        x: dragon.x + Math.cos(a) * r, y: dragon.y + Math.sin(a) * r,
        vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5 - 0.5,
        size: 2 + Math.random() * 3, life: 30 + Math.random() * 30,
        color: 'hsl(' + Math.floor(Math.random() * 360) + ', 90%, 85%)'
      });
    }
  }
}

<script>
// render-cathedral.js — Drawing for the level 2 cathedral encounter (logic in cathedral.js):
// the tower with its red tiled roof and great stained-glass window, the cathedral interior (golden vaults,
// rose window, lancet windows, angel statues holding up swords, candelabras, carpeted floor; the static parts
// are painted once into a cached layer three screens tall), Cyndraxx's fall, the dream, the heart container,
// the priest Clement the Simple and his iridescent power, and the dialogue boxes with the REST / FIGHT ON buttons.
// Classic script: shares global scope with the other src/js/*.js files.

const GLASS_COLORS = ['#c0392b', '#e74c3c', '#2e5fb8', '#3b8ee0', '#f1c40f', '#e6a817', '#1e8449', '#27ae60', '#7d3c98', '#a569bd'];
const CATH_STONE = { main: '#8d8371', dark: '#5f5747', light: '#ab9f8a' };
const CATH_STONE_OWNER = { brickStyle: 2, brickSeed: 311 };   // ashlar with quoins (render-masonry.js)

// A pointed (gothic) arch outline: springing line at ys, apex at y, sides down to y + h.
function gothicArchPath(c, x, y, w, h) {
  const ys = y + Math.min(h, w * 0.85);
  c.beginPath();
  c.moveTo(x, y + h);
  c.lineTo(x, ys);
  c.bezierCurveTo(x, ys - (ys - y) * 0.55, x + w * 0.22, y + (ys - y) * 0.12, x + w / 2, y);
  c.bezierCurveTo(x + w * 0.78, y + (ys - y) * 0.12, x + w, ys - (ys - y) * 0.55, x + w, ys);
  c.lineTo(x + w, y + h);
  c.closePath();
}

// Stained glass in a pointed window: colored panes in a lead grid, a mullion, a glow, a gold frame.
function drawLancet(c, x, y, w, h, seed, frame) {
  const LEAD = '#1b130c';
  c.save();
  gothicArchPath(c, x, y, w, h);
  c.clip();
  // a ruby border around a deep blue ground
  c.fillStyle = '#9e1426';
  c.fillRect(x, y, w, h);
  const bw = Math.max(4, w * 0.1);
  gothicArchPath(c, x + bw, y + bw, w - bw * 2, h - bw);
  c.fillStyle = '#1f3f94';
  c.fill();
  // jewels along the border
  for (let yy = y + w * 0.7; yy < y + h; yy += bw * 2) {
    [x + bw / 2, x + w - bw / 2].forEach((jx, k) => {
      c.fillStyle = (Math.floor(yy / bw) + k) % 2 ? '#f5c542' : '#eaf2ff';
      c.fillRect(jx - bw * 0.25, yy - bw * 0.25, bw * 0.5, bw * 0.5);
    });
  }
  // diamond "quarry" leading over the blue
  c.save();
  gothicArchPath(c, x + bw, y + bw, w - bw * 2, h - bw);
  c.clip();
  c.strokeStyle = 'rgba(10,20,50,0.7)';
  c.lineWidth = 1;
  const q = Math.max(8, w * 0.2);
  for (let d = -h; d < w + h; d += q) {
    c.beginPath(); c.moveTo(x + d, y); c.lineTo(x + d + h, y + h); c.stroke();
    c.beginPath(); c.moveTo(x + d, y); c.lineTo(x + d - h, y + h); c.stroke();
  }
  c.restore();
  // a quatrefoil in the head of the arch
  const qx = x + w / 2, qy = y + w * 0.5, qr = w * 0.11;
  [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach(([ox, oy], k) => {
    c.fillStyle = k % 2 ? '#f5c542' : '#d63a2a';
    c.beginPath(); c.arc(qx + ox * qr, qy + oy * qr, qr, 0, Math.PI * 2); c.fill();
    c.strokeStyle = LEAD; c.lineWidth = 1.2; c.stroke();
  });
  // stacked medallions, each with a little robed figure
  const mr = w * 0.27, step = mr * 2.5;
  const robes = ['#c0392b', '#1e8449', '#e6a817', '#7d3c98', '#2e86de'];
  for (let i = 0, my = y + w * 0.5 + step; my + mr < y + h - 4; i++, my += step) {
    c.fillStyle = '#f5c542';
    c.beginPath(); c.arc(qx, my, mr, 0, Math.PI * 2); c.fill();
    c.fillStyle = i % 2 ? '#a3172a' : '#2a7a4a';
    c.beginPath(); c.arc(qx, my, mr * 0.82, 0, Math.PI * 2); c.fill();
    c.fillStyle = robes[(i + Math.floor(seed)) % robes.length];
    c.beginPath(); c.moveTo(qx - mr * 0.38, my + mr * 0.62); c.lineTo(qx, my - mr * 0.2); c.lineTo(qx + mr * 0.38, my + mr * 0.62); c.closePath(); c.fill();
    c.fillStyle = '#f6e7c8';
    c.beginPath(); c.arc(qx, my - mr * 0.34, mr * 0.17, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#f5c542'; c.lineWidth = 1;
    c.beginPath(); c.arc(qx, my - mr * 0.38, mr * 0.26, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    c.strokeStyle = LEAD; c.lineWidth = 1.4;
    c.beginPath(); c.arc(qx, my, mr, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.arc(qx, my, mr * 0.82, 0, Math.PI * 2); c.stroke();
  }
  c.strokeStyle = LEAD;
  c.lineWidth = 1.5;
  gothicArchPath(c, x + bw, y + bw, w - bw * 2, h - bw);
  c.stroke();
  // inner glow
  const gl = c.createRadialGradient(x + w / 2, y + h * 0.45, 2, x + w / 2, y + h * 0.45, h * 0.7);
  gl.addColorStop(0, 'rgba(255,240,200,0.35)');
  gl.addColorStop(1, 'rgba(255,240,200,0)');
  c.fillStyle = gl;
  c.fillRect(x, y, w, h);
  c.restore();
  if (frame !== false) {
    gothicArchPath(c, x, y, w, h);
    c.lineWidth = Math.max(3, w * 0.06);
    c.strokeStyle = '#d9a93a';
    c.stroke();
    c.lineWidth = 1.2;
    c.strokeStyle = '#6b4a12';
    c.stroke();
  }
}

// The great rose window
function drawRose(c, cx, cy, r) {
  c.save();
  c.fillStyle = '#1b130c';
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  const petals = 12;
  const ringCols = [['#c0392b', '#e6a817'], ['#1f3f94', '#2e86de'], ['#a3172a', '#1f3f94']];
  for (let ring = 0; ring < 3; ring++) {
    const r0 = r * (0.22 + ring * 0.26), r1 = r * (0.46 + ring * 0.26);
    const n = petals * (ring + 1);
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      c.fillStyle = ringCols[ring][i % 2];
      c.beginPath();
      c.arc(cx, cy, r1 - 1, a0, a1);
      c.arc(cx, cy, r0 + 1, a1, a0, true);
      c.closePath();
      c.fill();
    }
  }
  // tracery: radial lead lines and little roundels at the petal tips
  c.strokeStyle = '#1b130c';
  c.lineWidth = 1.5;
  for (let i = 0; i < petals * 3; i++) {
    const a = (i / (petals * 3)) * Math.PI * 2;
    const from = i % 3 === 0 ? 0.22 : (i % 3 === 1 ? 0.72 : 0.48);
    c.beginPath(); c.moveTo(cx + Math.cos(a) * r * from, cy + Math.sin(a) * r * from); c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); c.stroke();
  }
  for (let i = 0; i < petals; i++) {
    const a = ((i + 0.5) / petals) * Math.PI * 2;
    const tx = cx + Math.cos(a) * r * 0.86, ty = cy + Math.sin(a) * r * 0.86;
    c.fillStyle = i % 2 ? '#f5c542' : '#eaf2ff';
    c.beginPath(); c.arc(tx, ty, r * 0.07, 0, Math.PI * 2); c.fill(); c.stroke();
    const mx = cx + Math.cos(a) * r * 0.59, my = cy + Math.sin(a) * r * 0.59;
    c.fillStyle = '#1e8449';
    c.beginPath(); c.arc(mx, my, r * 0.06, 0, Math.PI * 2); c.fill(); c.stroke();
  }
  c.fillStyle = '#f5d76e';
  c.beginPath(); c.arc(cx, cy, r * 0.2, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#c0392b';
  c.beginPath(); c.arc(cx, cy, r * 0.11, 0, Math.PI * 2); c.fill();
  const gl = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  gl.addColorStop(0, 'rgba(255,245,210,0.45)');
  gl.addColorStop(1, 'rgba(255,245,210,0.05)');
  c.fillStyle = gl;
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  c.lineWidth = Math.max(4, r * 0.07);
  c.strokeStyle = '#d9a93a';
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();
  c.lineWidth = 2;
  c.strokeStyle = '#8a6418';
  c.beginPath(); c.arc(cx, cy, r * 0.48, 0, Math.PI * 2); c.stroke();
  c.beginPath(); c.arc(cx, cy, r * 0.74, 0, Math.PI * 2); c.stroke();
  c.restore();
}

// A marble angel with outstretched wings holding a sword up high. (x, baseY) = feet; h = figure height.
function drawAngelStatue(c, x, baseY, h) {
  const M = '#ddd6c6', S = '#a89f8d', HI = '#f6f2e8', D = '#7d7465';
  c.save();
  c.lineJoin = 'round';
  // wings, behind the body
  [-1, 1].forEach(side => {
    const sx = x + side * h * 0.05, sy = baseY - h * 0.7;
    c.beginPath();
    c.moveTo(sx, sy);
    c.quadraticCurveTo(x + side * h * 0.35, baseY - h * 1.12, x + side * h * 0.66, baseY - h * 1.02);
    const steps = 6;
    for (let i = 1; i <= steps; i++) {   // scalloped feather tips along the lower edge
      const u = i / steps;
      const px = x + side * h * (0.66 - u * 0.5), py = baseY - h * (1.02 - u * 0.62);
      const mx = x + side * h * (0.66 - (u - 0.5 / steps) * 0.5) + side * h * 0.05, my = baseY - h * (1.02 - (u - 0.5 / steps) * 0.62) + h * 0.06;
      c.quadraticCurveTo(mx, my, px, py);
    }
    c.closePath();
    const wg = c.createLinearGradient(sx, sy - h * 0.4, x + side * h * 0.6, sy + h * 0.2);
    wg.addColorStop(0, HI); wg.addColorStop(0.6, M); wg.addColorStop(1, S);
    c.fillStyle = wg;
    c.fill();
    c.strokeStyle = D; c.lineWidth = 1.2; c.stroke();
    // feather rows
    c.strokeStyle = 'rgba(110,100,85,0.6)';
    c.lineWidth = 1;
    for (let row = 1; row <= 3; row++) {
      c.beginPath();
      for (let i = 0; i <= 8; i++) {
        const u = i / 8;
        const px = sx + (x + side * h * (0.62 - row * 0.05) - sx) * u;
        const py = sy - h * 0.12 * row * (1 - u) - h * (0.28 - row * 0.03) * Math.sin(u * Math.PI * 0.9) + h * 0.06 * row;
        if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.stroke();
    }
  });
  // robe
  c.beginPath();
  c.moveTo(x - h * 0.17, baseY);
  c.lineTo(x - h * 0.08, baseY - h * 0.66);
  c.lineTo(x + h * 0.08, baseY - h * 0.66);
  c.lineTo(x + h * 0.17, baseY);
  c.closePath();
  const rg = c.createLinearGradient(x - h * 0.17, 0, x + h * 0.17, 0);
  rg.addColorStop(0, S); rg.addColorStop(0.4, HI); rg.addColorStop(1, S);
  c.fillStyle = rg; c.fill();
  c.strokeStyle = 'rgba(110,100,85,0.7)'; c.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {     // folds
    c.beginPath(); c.moveTo(x + i * h * 0.02, baseY - h * 0.6); c.lineTo(x + i * h * 0.06, baseY - 2); c.stroke();
  }
  // shoulders and arms raised, hands meeting above the head
  c.fillStyle = M;
  c.fillRect(x - h * 0.09, baseY - h * 0.74, h * 0.18, h * 0.1);
  c.strokeStyle = M; c.lineWidth = h * 0.045; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x - h * 0.08, baseY - h * 0.72); c.lineTo(x - h * 0.06, baseY - h * 0.86); c.lineTo(x, baseY - h * 0.97); c.stroke();
  c.beginPath(); c.moveTo(x + h * 0.08, baseY - h * 0.72); c.lineTo(x + h * 0.06, baseY - h * 0.86); c.lineTo(x, baseY - h * 0.97); c.stroke();
  // halo and head
  c.strokeStyle = '#e8c35a'; c.lineWidth = Math.max(2, h * 0.018);
  c.beginPath(); c.ellipse(x, baseY - h * 0.86, h * 0.07, h * 0.025, 0, 0, Math.PI * 2); c.stroke();
  c.fillStyle = HI;
  c.beginPath(); c.arc(x, baseY - h * 0.8, h * 0.055, 0, Math.PI * 2); c.fill();
  c.fillStyle = S;
  c.beginPath(); c.arc(x + h * 0.015, baseY - h * 0.795, h * 0.04, -0.6, 1.4); c.fill();
  // the sword, held straight up
  c.fillStyle = '#e8eef2';
  c.beginPath();
  c.moveTo(x - h * 0.018, baseY - h * 1.0);
  c.lineTo(x - h * 0.018, baseY - h * 1.36);
  c.lineTo(x, baseY - h * 1.42);
  c.lineTo(x + h * 0.018, baseY - h * 1.36);
  c.lineTo(x + h * 0.018, baseY - h * 1.0);
  c.closePath(); c.fill();
  c.fillStyle = '#b9c3c9';
  c.fillRect(x, baseY - h * 1.36, h * 0.018, h * 0.36);
  c.fillStyle = '#e0b040';
  c.fillRect(x - h * 0.07, baseY - h * 1.0, h * 0.14, h * 0.025);
  c.fillRect(x - h * 0.012, baseY - h * 0.99, h * 0.024, h * 0.05);
  c.restore();
}

// A gold candelabra standing on the floor; returns its candle tips for live flames.
function paintCandelabra(c, x, baseY, h, arms, out) {
  c.save();
  c.fillStyle = '#c9972c';
  c.strokeStyle = '#d9a93a';
  c.lineWidth = Math.max(2, h * 0.025);
  // base
  c.beginPath();
  c.moveTo(x - h * 0.12, baseY); c.lineTo(x + h * 0.12, baseY); c.lineTo(x + h * 0.03, baseY - h * 0.08); c.lineTo(x - h * 0.03, baseY - h * 0.08);
  c.closePath(); c.fill();
  c.beginPath(); c.moveTo(x, baseY - h * 0.08); c.lineTo(x, baseY - h * 0.82); c.stroke();
  for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(x, baseY - h * (0.25 + i * 0.2), h * 0.02, 0, Math.PI * 2); c.fill(); }
  const top = baseY - h * 0.82;
  const spread = h * 0.24;
  for (let i = 0; i < arms; i++) {
    const u = arms === 1 ? 0 : (i / (arms - 1)) * 2 - 1;
    const cx = x + u * spread, cy = top - (1 - Math.abs(u)) * h * 0.08;
    c.beginPath(); c.moveTo(x, top + h * 0.06); c.quadraticCurveTo(cx, top + h * 0.08, cx, cy); c.stroke();
    c.fillStyle = '#c9972c';
    c.fillRect(cx - h * 0.03, cy - h * 0.01, h * 0.06, h * 0.02);
    c.fillStyle = '#f3ead2';                     // the candle
    c.fillRect(cx - h * 0.014, cy - h * 0.1, h * 0.028, h * 0.09);
    out.push({ x: cx, y: cy - h * 0.1, s: Math.max(3, h * 0.03) });
  }
  c.restore();
}

// Everything that doesn't move, laid out for this screen size. Returns { layer, candles, motes }.
const cathLayerCache = {};
function cathInterior() {
  const W = width, H = height, IH = cathInteriorH();
  const key = W + 'x' + H;
  if (cathLayerCache.key === key) return cathLayerCache;
  const candles = [];
  const layer = document.createElement('canvas');
  layer.width = W; layer.height = Math.ceil(IH);
  const c = layer.getContext('2d');
  const hY = IH - H * 0.3;                         // where the floor meets the back wall

  // walls: deep violet up in the vaults to warm candlelit gold below
  const bg = c.createLinearGradient(0, 0, 0, IH);
  bg.addColorStop(0, '#120d22');
  bg.addColorStop(0.35, '#251a2e');
  bg.addColorStop(0.7, '#3a2a24');
  bg.addColorStop(1, '#5a3e22');
  c.fillStyle = bg;
  c.fillRect(0, 0, W, IH);
  // faint stone coursing
  c.strokeStyle = 'rgba(255,230,190,0.05)';
  c.lineWidth = 1;
  for (let y = 0; y < hY; y += 26) {
    c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke();
    for (let x = ((y / 26) % 2) * 30; x < W; x += 60) { c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + 26); c.stroke(); }
  }

  // ---- the vault (top screen): golden ribs meeting at a boss, the rose window below them ----
  const capY = H * 0.62, apexY = H * 0.04;
  const capL = W * 0.035, capR = W * 0.965;
  // the vault web: a blue ceiling scattered with gold stars inside a great pointed arch
  const archCurve = () => {
    c.moveTo(capL, capY);
    c.bezierCurveTo(capL, capY - (capY - apexY) * 0.7, W * 0.3, apexY + 6, W * 0.5, apexY);
    c.bezierCurveTo(W * 0.7, apexY + 6, capR, capY - (capY - apexY) * 0.7, capR, capY);
  };
  c.save();
  c.beginPath(); archCurve(); c.closePath();
  const web = c.createLinearGradient(0, apexY, 0, capY);
  web.addColorStop(0, '#1d2c66'); web.addColorStop(1, '#121838');
  c.fillStyle = web;
  c.fill();
  c.clip();
  c.fillStyle = 'rgba(245,205,95,0.8)';
  for (let i = 0; i < 70; i++) {
    const sx = hash2(i, 3) * W, sy = apexY + hash2(i, 7) * (capY - apexY);
    const s = hash2(i, 11) < 0.25 ? 3 : 2;
    c.fillRect(sx, sy, s, s);
  }
  c.restore();
  // golden ribs fanning up from each capital to the crown of the vault
  c.save();
  c.lineCap = 'round';
  const ribTo = [[0.5, 0], [0.36, 0.06], [0.22, 0.2], [0.64, 0.06], [0.78, 0.2]];
  [capL, capR].forEach(cx0 => {
    ribTo.forEach(([fx, fy]) => {
      const tx = W * fx, ty = apexY + (capY - apexY) * fy;
      c.beginPath();
      c.moveTo(cx0, capY);
      c.quadraticCurveTo(cx0, ty + (capY - ty) * 0.15, tx, ty);
      c.strokeStyle = '#6b4a12'; c.lineWidth = 7; c.stroke();
      c.strokeStyle = '#e2b34a'; c.lineWidth = 3; c.stroke();
    });
  });
  c.beginPath(); archCurve();
  c.strokeStyle = '#6b4a12'; c.lineWidth = 12; c.stroke();
  c.strokeStyle = '#ecc35c'; c.lineWidth = 5; c.stroke();
  c.fillStyle = '#e2b34a';
  c.beginPath(); c.arc(W * 0.5, apexY + 4, 13, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#9a6d16';
  c.beginPath(); c.arc(W * 0.5, apexY + 4, 6, 0, Math.PI * 2); c.fill();
  // gold capitals where the ribs spring
  [capL, capR].forEach(cx0 => {
    c.fillStyle = '#d9a93a';
    c.beginPath(); c.moveTo(cx0 - 16, capY + 10); c.lineTo(cx0 + 16, capY + 10); c.lineTo(cx0 + 9, capY - 4); c.lineTo(cx0 - 9, capY - 4); c.closePath(); c.fill();
  });
  c.restore();
  drawRose(c, W * 0.5, H * 0.75, Math.min(W * 0.28, H * 0.155));

  // clustered columns down both sides, with gold capitals and bands
  [0.035, 0.965].forEach(fx => {
    const cx = W * fx, cw = Math.max(16, W * 0.055);
    const cg = c.createLinearGradient(cx - cw / 2, 0, cx + cw / 2, 0);
    cg.addColorStop(0, '#4a3c34'); cg.addColorStop(0.45, '#8c7a66'); cg.addColorStop(1, '#3a2e28');
    c.fillStyle = cg;
    c.fillRect(cx - cw / 2, capY + 8, cw, hY - capY - 8);
    c.fillStyle = '#d9a93a';
    for (let y = H * 0.85; y < hY; y += H * 0.55) c.fillRect(cx - cw / 2 - 3, y, cw + 6, 7);
  });
  // gold string courses between the levels
  [H * 0.92, H * 1.92].forEach(y => {
    c.fillStyle = '#b8862a'; c.fillRect(0, y, W, 6);
    c.fillStyle = '#ecc35c'; c.fillRect(0, y, W, 2);
  });

  // ---- the middle: tall lancet windows with light falling from them, an angel, a chandelier ----
  const lw = W * 0.2, lh = H * 0.62;
  const lancets = [[W * 0.1, H * 1.08], [W * 0.7, H * 1.08], [W * 0.1, H * 2.02], [W * 0.7, H * 2.02]];
  lancets.forEach(([lx, ly], i) => {
    if (ly + lh > hY - H * 0.62 && i >= 2) return;   // the lower pair only if they fit above the arcade
    drawLancet(c, lx, ly, lw, lh, 40 + i * 17);
  });
  // beams of colored light slanting down from the windows
  c.save();
  c.globalCompositeOperation = 'lighter';
  lancets.slice(0, 2).forEach(([lx, ly], i) => {
    const dir = i === 0 ? 1 : -1;
    const gr = c.createLinearGradient(lx, ly, lx + dir * W * 0.4, ly + H * 1.1);
    gr.addColorStop(0, 'rgba(255,220,160,0.16)');
    gr.addColorStop(1, 'rgba(255,220,160,0)');
    c.fillStyle = gr;
    c.beginPath();
    c.moveTo(lx + lw * 0.15, ly + lh * 0.3);
    c.lineTo(lx + lw * 0.85, ly + lh * 0.3);
    c.lineTo(lx + lw * 0.85 + dir * W * 0.45, ly + H * 1.3);
    c.lineTo(lx + lw * 0.15 + dir * W * 0.45, ly + H * 1.3);
    c.closePath();
    c.fill();
  });
  c.restore();
  // an angel on a gold corbel between the windows
  const angH = Math.min(H * 0.24, W * 0.36);
  const angY = H * 1.66;
  c.fillStyle = '#b8862a';
  c.beginPath(); c.moveTo(W * 0.5 - angH * 0.28, angY); c.lineTo(W * 0.5 + angH * 0.28, angY); c.lineTo(W * 0.5, angY + angH * 0.3); c.closePath(); c.fill();
  c.fillStyle = '#ecc35c'; c.fillRect(W * 0.5 - angH * 0.28, angY, angH * 0.56, 3);
  drawAngelStatue(c, W * 0.5, angY, angH);
  // wall sconces with candles along the columns
  for (let y = H * 1.25; y < hY - H * 0.2; y += H * 0.42) {
    [W * 0.035, W * 0.965].forEach(sx => {
      c.fillStyle = '#c9972c';
      c.fillRect(sx - 9, y, 18, 4);
      c.fillStyle = '#f3ead2';
      c.fillRect(sx - 3, y - 12, 6, 12);
      candles.push({ x: sx, y: y - 12, s: 4 });
    });
  }
  // ---- the bottom: a golden arcade, angel statues in the side arches, the altar, the carpeted floor ----
  const arcTop = IH - H * 0.98;
  const arches = [[0.03, 0.27], [0.33, 0.34], [0.7, 0.27]];
  arches.forEach(([fx, fw], i) => {
    const ax = W * fx, aw = W * fw;
    gothicArchPath(c, ax, arcTop + (i === 1 ? 0 : H * 0.08), aw, hY - arcTop - (i === 1 ? 0 : H * 0.08));
    c.fillStyle = i === 1 ? '#2a1c16' : '#1d1418';
    c.fill();
    c.lineWidth = Math.max(5, W * 0.014);
    c.strokeStyle = '#d9a93a';
    c.stroke();
    c.lineWidth = 1.5;
    c.strokeStyle = '#6b4a12';
    c.stroke();
  });
  // a window glowing behind the altar
  drawLancet(c, W * 0.42, arcTop + H * 0.08, W * 0.16, H * 0.36, 77);
  // golden pillars between the arches
  [[0.3], [0.67]].forEach(([fx]) => {
    const px = W * fx, pw = Math.max(10, W * 0.03);
    const pg = c.createLinearGradient(px - pw / 2, 0, px + pw / 2, 0);
    pg.addColorStop(0, '#8a6418'); pg.addColorStop(0.5, '#ecc35c'); pg.addColorStop(1, '#7a5612');
    c.fillStyle = pg;
    c.fillRect(px - pw / 2, arcTop + H * 0.06, pw, hY - arcTop - H * 0.06);
  });
  // the big angels, swords raised, in the side arches
  const bigH = Math.min(H * 0.34, W * 0.3);
  [W * 0.165, W * 0.835].forEach(ax => {
    c.fillStyle = '#6e6252';
    c.fillRect(ax - bigH * 0.22, hY - bigH * 0.16, bigH * 0.44, bigH * 0.16);
    c.fillStyle = '#d9a93a';
    c.fillRect(ax - bigH * 0.24, hY - bigH * 0.16, bigH * 0.48, 3);
    drawAngelStatue(c, ax, hY - bigH * 0.16, bigH);
  });
  // the chandelier: a gold ring on a chain, candles all around
  const chY = IH - H * 0.66, chR = Math.min(W * 0.2, 90);
  c.strokeStyle = '#8a6418'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(W * 0.5, H * 1.95); c.lineTo(W * 0.5, chY - 18); c.stroke();
  c.beginPath(); c.moveTo(W * 0.5, chY - 18); c.lineTo(W * 0.5 - chR, chY); c.moveTo(W * 0.5, chY - 18); c.lineTo(W * 0.5 + chR, chY); c.stroke();
  c.strokeStyle = '#d9a93a'; c.lineWidth = 4;
  c.beginPath(); c.ellipse(W * 0.5, chY, chR, chR * 0.18, 0, 0, Math.PI * 2); c.stroke();
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const cx = W * 0.5 + Math.cos(a) * chR, cy = chY + Math.sin(a) * chR * 0.18;
    c.fillStyle = '#f3ead2';
    c.fillRect(cx - 2, cy - 10, 4, 10);
    candles.push({ x: cx, y: cy - 10, s: 3.5 });
  }

  // the altar
  const alW = W * 0.2, alH = H * 0.07;
  c.fillStyle = '#5a4636';
  c.fillRect(W * 0.5 - alW * 0.65, hY - 8, alW * 1.3, 8);
  c.fillStyle = '#e8dcc0';
  c.fillRect(W * 0.5 - alW / 2, hY - 8 - alH, alW, alH);
  c.fillStyle = '#d9a93a';
  c.fillRect(W * 0.5 - alW / 2, hY - 8 - alH, alW, 5);
  c.fillRect(W * 0.5 - alW * 0.12, hY - 8 - alH + 10, alW * 0.24, alH - 14);
  paintCandelabra(c, W * 0.5 - alW * 0.36, hY - 8 - alH, H * 0.09, 1, candles);
  paintCandelabra(c, W * 0.5 + alW * 0.36, hY - 8 - alH, H * 0.09, 1, candles);

  // the marble floor in perspective
  const vpX = W / 2, vpY = hY - H * 0.5;
  const fg = c.createLinearGradient(0, hY, 0, IH);
  fg.addColorStop(0, '#5c4632'); fg.addColorStop(1, '#2e2016');
  c.fillStyle = fg;
  c.fillRect(0, hY, W, IH - hY);
  const rowsY = [];
  for (let i = 0; i <= 8; i++) rowsY.push(hY + (IH - hY) * Math.pow(i / 8, 1.6));
  const colX = [];
  for (let j = -6; j <= 6; j++) colX.push(vpX + j * W * 0.18);
  const atY = (bx, y) => vpX + (bx - vpX) * (y - vpY) / (IH - vpY);
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < colX.length - 1; j++) {
      if ((i + j) % 2) continue;
      const y0 = rowsY[i], y1 = rowsY[i + 1];
      c.fillStyle = 'rgba(15,8,4,0.32)';
      c.beginPath();
      c.moveTo(atY(colX[j], y0), y0); c.lineTo(atY(colX[j + 1], y0), y0);
      c.lineTo(atY(colX[j + 1], y1), y1); c.lineTo(atY(colX[j], y1), y1);
      c.closePath(); c.fill();
    }
  }
  // the carpet: deep crimson with gold borders, running to the altar
  const cl = W * 0.1, cr = W * 0.9;
  c.beginPath();
  c.moveTo(atY(cl, hY), hY); c.lineTo(atY(cr, hY), hY); c.lineTo(cr, IH); c.lineTo(cl, IH); c.closePath();
  const cg = c.createLinearGradient(0, hY, 0, IH);
  cg.addColorStop(0, '#6e1018'); cg.addColorStop(1, '#a0202a');
  c.fillStyle = cg;
  c.fill();
  c.strokeStyle = '#e2b34a';
  c.lineWidth = 3;
  [0.06, 0.94].forEach(f => {
    const bx = cl + (cr - cl) * f;
    c.beginPath(); c.moveTo(atY(bx, hY), hY); c.lineTo(bx, IH); c.stroke();
  });
  c.fillStyle = 'rgba(226,179,74,0.75)';
  for (let i = 1; i < 8; i++) {
    const y = rowsY[i], s = 2 + i * 1.3;
    c.beginPath(); c.moveTo(vpX, y - s); c.lineTo(vpX + s * 1.5, y); c.lineTo(vpX, y + s); c.lineTo(vpX - s * 1.5, y); c.closePath(); c.fill();
  }
  // tall floor candelabras at the front
  paintCandelabra(c, W * 0.06, IH - H * 0.04, H * 0.34, 3, candles);
  paintCandelabra(c, W * 0.94, IH - H * 0.04, H * 0.34, 3, candles);

  cathLayerCache.key = key;
  cathLayerCache.layer = layer;
  cathLayerCache.candles = candles;
  return cathLayerCache;
}

// ---- the tower in the level ----
function drawCathedralTower() {
  const c = cathedral;
  if (!c || c.x > width + 40) return;
  const g = cathedralGeom(c);
  const x = c.x, W = CATH_W;
  // stone body
  drawMasonry(x, g.bodyTop, W, g.gY - g.bodyTop, CATH_STONE, CATH_STONE_OWNER);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x + W - 10, g.bodyTop, 10, g.gY - g.bodyTop);
  // little buttresses
  ctx.fillStyle = '#6c6354';
  ctx.fillRect(x - 6, g.bodyTop + 40, 8, g.gY - g.bodyTop - 40);
  ctx.fillRect(x + W - 2, g.bodyTop + 40, 8, g.gY - g.bodyTop - 40);
  // the great window
  if (!c.broken) {
    drawLancet(ctx, g.winX, g.winTop, CATH_WIN_W, CATH_WIN_H, 7);
    // a soft shimmer so it catches the eye (without saying anything)
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const a = 0.12 + Math.sin(Date.now() / 400) * 0.06;
    const gl = ctx.createRadialGradient(g.winX + CATH_WIN_W / 2, g.winTop + CATH_WIN_H / 2, 4, g.winX + CATH_WIN_W / 2, g.winTop + CATH_WIN_H / 2, CATH_WIN_H * 0.75);
    gl.addColorStop(0, 'rgba(255,230,170,' + a + ')');
    gl.addColorStop(1, 'rgba(255,230,170,0)');
    ctx.fillStyle = gl;
    ctx.fillRect(g.winX - 40, g.winTop - 30, CATH_WIN_W + 80, CATH_WIN_H + 60);
    ctx.restore();
  } else {
    // smashed: dark inside, jagged glass left in the frame
    ctx.save();
    gothicArchPath(ctx, g.winX, g.winTop, CATH_WIN_W, CATH_WIN_H);
    ctx.fillStyle = '#140d10';
    ctx.fill();
    ctx.clip();
    for (let i = 0; i < 9; i++) {
      ctx.fillStyle = GLASS_COLORS[i % GLASS_COLORS.length];
      const bx = g.winX + (i / 8) * CATH_WIN_W;
      ctx.beginPath();
      ctx.moveTo(bx - 7, g.winBot); ctx.lineTo(bx, g.winBot - 8 - (i * 7) % 15); ctx.lineTo(bx + 7, g.winBot);
      ctx.fill();
    }
    ctx.restore();
    gothicArchPath(ctx, g.winX, g.winTop, CATH_WIN_W, CATH_WIN_H);
    ctx.lineWidth = 4; ctx.strokeStyle = '#d9a93a'; ctx.stroke();
  }
  // red tiled roof
  const ov = 10;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x - ov, g.bodyTop + 4);
  ctx.lineTo(x + W / 2, g.roofPeak);
  ctx.lineTo(x + W + ov, g.bodyTop + 4);
  ctx.closePath();
  ctx.fillStyle = '#9e2a1e';
  ctx.fill();
  ctx.clip();
  const rowH = 9;
  for (let y = g.roofPeak; y < g.bodyTop + 6; y += rowH) {
    const r = Math.floor((y - g.roofPeak) / rowH);
    for (let tx = x - ov - 12 + (r % 2) * 6; tx < x + W + ov; tx += 12) {
      ctx.fillStyle = (r + Math.floor(tx / 12)) % 3 === 0 ? '#b8361f' : '#c4442a';
      ctx.beginPath(); ctx.arc(tx + 6, y + rowH - 2, 6, 0, Math.PI); ctx.fill();
      ctx.strokeStyle = 'rgba(60,10,5,0.5)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(tx + 6, y + rowH - 2, 6, 0, Math.PI); ctx.stroke();
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(x + W / 2, g.roofPeak, W, g.bodyTop - g.roofPeak + 6);
  ctx.restore();
  ctx.strokeStyle = '#5e140c'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x - ov, g.bodyTop + 4); ctx.lineTo(x + W / 2, g.roofPeak); ctx.lineTo(x + W + ov, g.bodyTop + 4); ctx.stroke();
  // a little gold finial on the peak
  ctx.fillStyle = '#e2b34a';
  ctx.fillRect(x + W / 2 - 1.5, g.roofPeak - 16, 3, 16);
  ctx.beginPath(); ctx.arc(x + W / 2, g.roofPeak - 18, 3.5, 0, Math.PI * 2); ctx.fill();
}

// ---- Cyndraxx in the cathedral (a little bigger than in the level) ----
const CATH_DRAGON_SCALE = 1.4;
function drawCathDragon(x, y, rot, alpha) {
  const S = cathScene;
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.scale(CATH_DRAGON_SCALE, CATH_DRAGON_SCALE);
  const breathe = S.asleep ? Math.sin(S.clock * 0.05) * 0.03 : 0;
  ctx.scale(1, 1 + breathe);
  drawDragon(0, 0, rot);
  const p = 2.6;
  if (S.asleep) {               // eyes closed
    ctx.rotate(rot);
    ctx.fillStyle = '#ff793f';
    ctx.fillRect(4 * p, -6 * p, 5 * p, 5 * p);
    ctx.fillStyle = '#7a1d12';
    ctx.fillRect(4 * p, -3 * p, 5 * p, 1 * p);
  }
  ctx.restore();
  if (S.tears && !S.asleep) {   // tears falling from his eye
    ctx.save();
    ctx.fillStyle = 'rgba(160,215,255,0.9)';
    const tx = x + 7.5 * p * CATH_DRAGON_SCALE;
    ctx.fillRect(tx - 1.5, y - 1 * p * CATH_DRAGON_SCALE, 3, 10);          // a wet streak under his eye
    for (let i = 0; i < 4; i++) {
      const f = ((S.clock + i * 18) % 72) / 72;
      const ty = y - 1 * p * CATH_DRAGON_SCALE + 6 + f * 46;
      ctx.globalAlpha = 1 - f * 0.8;
      ctx.beginPath();
      ctx.moveTo(tx, ty - 7); ctx.quadraticCurveTo(tx + 5, ty + 1, tx, ty + 5); ctx.quadraticCurveTo(tx - 5, ty + 1, tx, ty - 7);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ---- Clement the Simple: a humble-looking priest in a rough brown robe ----
function drawClement(x, footY, alpha, casting) {
  const S = cathScene;
  const p = 3.3;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(Math.round(x), Math.round(footY));
  const R = (cx, cy, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(cx * p, cy * p, w * p, h * p); };
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(0, 1, 7 * p, 1.6 * p, 0, 0, Math.PI * 2); ctx.fill();
  // robe
  R(-5, -7, 10, 7, '#5b4632');
  R(-4.5, -15, 9, 8, '#5b4632');
  R(1.5, -15, 3, 15, '#47362a');
  R(-4, -2, 1, 2, '#47362a'); R(0, -5, 1, 5, '#47362a');

  R(-4.5, -9, 9, 1, '#c9b27a');
  R(-2, -8, 1, 4, '#c9b27a');

  if (casting) {

    R(-8.5, -23, 2, 2, '#e0b08c'); R(6.5, -23, 2, 2, '#e0b08c');
  } else {
    // hands folded in his sleeves
    R(-3.5, -13, 7, 3, '#47362a');
    R(-1, -12.5, 2, 2, '#e0b08c');
  }
  // head: bald crown (tonsure) with a grey fringe, kind old face
  R(-2.5, -21, 5, 5, '#e0b08c');
  R(-2, -21.5, 4, 1, '#ecc3a0');
  R(-3, -20, 1, 3, '#b9b4ac'); R(2, -20, 1, 3, '#b9b4ac');
  R(-2.5, -20.3, 5, 0.6, '#b9b4ac');
  R(-2, -19, 1.2, 0.5, '#8d8780'); R(0.2, -19, 1.2, 0.5, '#8d8780');      // brows
  // eyes: dark... with a pale, shifting glint now and then
  const glint = (S.clock % 140) < 16 || casting;

  R(-1.8, -18.2, 1, 0.7, eyeCol); R(0.3, -18.2, 1, 0.7, eyeCol);
  R(-0.5, -17.5, 1, 1.2, '#c7926e');                                       // nose
  R(-1, -16.4, 2, 0.4, '#9b5e4a');                                         // a mild smile
  ctx.restore();
}
