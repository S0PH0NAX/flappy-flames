<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Dragon Conqueror</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0b1a">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0b1a;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 800px;
      background: #0f0f2d;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      overflow: hidden;
      cursor: pointer;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .score-display {
      position: absolute;
      top: 48px;          /* below the level progress bar, which spans the top right */
      width: 100%;
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      text-shadow: 3px 3px 0px #000, -2px -2px 0px #000;
      pointer-events: none;
      z-index: 10;
    }
    .hearts-display {
      position: absolute;
      top: 55px;
      right: 15px;
      font-size: 18px;
      z-index: 20;
      pointer-events: none;
      text-shadow: 2px 2px 0 #000;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .level-progress-badge {
      position: absolute;
      top: 12px;
      right: 15px;
      width: 150px;
      height: 28px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #f1c40f;
      border-radius: 8px;
      overflow: hidden;
      z-index: 20;
      pointer-events: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .level-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
      transition: width 0.1s linear;
      z-index: 1;
    }
    .level-progress-text {
      position: absolute;
      top: 0;
      right: 10px;
      height: 100%;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
      z-index: 2;
      letter-spacing: 1px;
    }
    .bottom-controls-bar {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      padding: 0 6px;
      gap: 4px;
      z-index: 50;
    }
    .bottom-controls-bar.flipped {
      flex-direction: row-reverse;
    }
    .action-btn {
      background: rgba(16, 20, 30, 0.85);
      border: 2px solid #f1c40f;
      color: #fff;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 11px;
      min-height: 52px;
      padding: 10px 6px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #8e44ad;
      touch-action: manipulation;
      white-space: nowrap;
      flex: 1;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
    }
    .btn-symbol {
      font-size: 18px;
      line-height: 1;
    }
    .btn-symbol-large {
      font-family: 'Segoe UI Symbol', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      font-size: 18px;
      line-height: 1;
      font-weight: 900;
    }
    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #8e44ad;
    }
    .action-btn.active {
      background: rgba(16, 20, 30, 0.85);
      border-color: #f1c40f;
      box-shadow: 0 4px 0 #8e44ad;
    }
/* PAUSE SCREEN & MODAL BUTTON SIZING & TOUCH HITBOXES */
    .modal-btn,
    .pause-btn,
    .pause-overlay button {
      min-height: 60px !important;
      width: 100% !important;
      font-size: 16px !important;
      font-weight: 800 !important;
      padding: 0 16px !important;
      border-radius: 10px !important;
      touch-action: manipulation;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      line-height: 60px;
      pointer-events: auto !important; /* Button itself receives taps */
    }

    /* Prevent icons/text inside pause buttons from blocking clicks */
    .modal-btn *,
    .pause-btn *,
    .pause-overlay button * {
      pointer-events: none !important;
    }
    .fire-btn {
      background: #ff0000 !important;
      border-color: #ffffff !important;
      box-shadow: 0 4px 0 #990000 !important;
      color: #ffffff !important;
      text-shadow: 1px 1px 2px #000;
      flex: 0 0 28% !important;
      max-width: 28% !important;
      width: 28% !important;
    }
    .fire-btn:active {
      box-shadow: 0 2px 0 #990000 !important;
    }
    /* the capture close-up and story images fill the screen */
    #game-container.cinematic .level-progress-badge,
    #game-container.cinematic .score-display,
    #game-container.cinematic .hearts-display,
    #game-container.cinematic .bottom-controls-bar {
      visibility: hidden;
    }
    /* the festival roof: FIRE becomes a blue SING button */
    .fire-btn.sing-btn {
      background: #2f80ed !important;
      box-shadow: 0 4px 0 #1b4f9c !important;
    }
    .fire-btn.sing-btn:active {
      box-shadow: 0 2px 0 #1b4f9c !important;
    }
    /* no fire in the prologue */
    .fire-btn.disabled {
      opacity: 0.35;
      filter: grayscale(1);
    }
    .sound-toggle-btn {
      max-width: 48px;
      min-width: 44px;
      height: 52px;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      flex: 0 0 auto;
    }
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: #11161d;
      border: 3px solid #f1c40f;
      border-radius: 12px;
      padding: 20px;
      width: 95%;
      max-width: 380px;
      text-align: center;
      color: #fff;
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.3);
    }
    .modal-title {
      font-size: 20px;
      font-weight: 800;
      color: #f1c40f;
      margin-bottom: 12px;
    }
    .save-code-box {
      background: #000;
      color: #2ecc71;
      font-size: 24px;
      letter-spacing: 4px;
      font-weight: bold;
      padding: 12px;
      border: 1px dashed #2ecc71;
      border-radius: 6px;
      margin: 14px 0;
      word-break: break-all;
      user-select: all;
      -webkit-user-select: all;
    }
    .save-input-box {
      width: 100%;
      background: #000;
      color: #f1c40f;
      font-size: 18px;
      letter-spacing: 3px;
      font-family: inherit;
      padding: 10px;
      border: 1px solid #f1c40f;
      border-radius: 6px;
      margin: 14px 0;
      text-align: center;
      text-transform: uppercase;
      user-select: text;
      -webkit-user-select: text;
    }
    #shareCanvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #f1c40f;
      margin-bottom: 12px;
    }
  </style>
</head>

  <!-- Classic scripts (no ES modules) so index.html works from file:///. Order matters. -->
<script>
// config.js — Constants, global state, DOM references, canvas setup, image loading
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    function createFallbackCanvas(width, height, color, label) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const x = c.getContext('2d');
      x.fillStyle = color;
      x.fillRect(0, 0, width, height);
      x.fillStyle = '#ffffff';
      x.font = 'bold 12px sans-serif';
      x.textAlign = 'center';
      x.fillText(label, width / 2, height / 2);
      const img = new Image();
      img.src = c.toDataURL();
      return img;
    }

    const bgMusicAudio = document.getElementById('bgMusic');
    const uiMusicAudio = document.getElementById('uiMusic');
    const cutsceneMusicAudio = document.getElementById('cutsceneMusic');

    const sfxBoost = document.getElementById('sfxBoost');
    const sfxRockBreak = document.getElementById('sfxRockBreak');
    const sfxArrow = document.getElementById('sfxArrow');
    const sfxBoulder = document.getElementById('sfxBoulder');
    const sfxQueenEntrance = document.getElementById('sfxQueenEntrance');
    const sfxKingEntrance = document.getElementById('sfxKingEntrance');
    const sfxFireworks = document.getElementById('sfxFireworks');

    bgMusicAudio.volume = 0.25;
    uiMusicAudio.volume = 0.25;
    cutsceneMusicAudio.volume = 0.25;

    const khaleesiFrame1 = new Image(); khaleesiFrame1.src = 'assets/images/sarai1.jpg';
    const khaleesiFrame2 = new Image(); khaleesiFrame2.src = 'assets/images/sarai2.jpg';
    // Noble portraits for the beheading screen and the severed-head inventory.
    // face = [centerX, centerY, size] of the head crop; full = [x, y, size] of the square portrait crop (720px images).
    const NOBLES = [
      { src: 'noble1.jpg', face: [290, 140, 150], full: [0, 0, 535], female: false },
      { src: 'noble2.jpg', face: [235, 105, 140], full: [0, 0, 501], female: false },
      { src: 'noble3.jpg', face: [330, 140, 260], full: [0, 0, 580], female: false },
      { src: 'noble4.jpg', face: [287, 270, 300], full: [0, 60, 573], female: true },
      { src: 'noble5.jpg', face: [320, 345, 320], full: [0, 0, 720], female: true },
      { src: 'noble6.jpg', face: [245, 360, 300], full: [0, 60, 550], female: true },
      { src: 'noble7.jpg', face: [203, 215, 260], full: [0, 20, 378], female: false }
    ];
    const nobleImgs = NOBLES.map(n => { const im = new Image(); im.src = 'assets/images/' + n.src; return im; });
    // type 'QUEEN' picks a woman's portrait, anything else a man's.
    function randomNoble(type) {
      const want = type === 'QUEEN';
      const pool = NOBLES.map((n, i) => i).filter(i => NOBLES[i].female === want);
      return pool[Math.floor(Math.random() * pool.length)];
    }
    // Draw noble i into the square (x, y, s). zoom 0 = the whole portrait, 1 = just the head.
    function drawNoble(i, x, y, s, zoom = 1) {
      const n = NOBLES[i] || NOBLES[0], im = nobleImgs[i] || nobleImgs[0];
      if (!im.complete || !im.naturalWidth) {
        ctx.fillStyle = '#3a2a1a'; ctx.fillRect(x, y, s, s);
        return;
      }
      const f = n.face, p = n.full;
      const fx = f[0] - f[2] / 2, fy = f[1] - f[2] / 2;
      const sx = p[0] + (fx - p[0]) * zoom, sy = p[1] + (fy - p[1]) * zoom, ss = p[2] + (f[2] - p[2]) * zoom;
      ctx.drawImage(im, sx, sy, ss, ss, x, y, s, s);
    }


    // Set a bold font of up to px pixels, shrunk so text fits in maxW.
    function fitFont(text, px, maxW) {
      ctx.font = 'bold ' + px + 'px "Proxima Nova", sans-serif';
      const w = ctx.measureText(text).width;
      if (w > maxW) ctx.font = 'bold ' + Math.floor(px * maxW / w) + 'px "Proxima Nova", sans-serif';
    }

    // Speech bubbles sized to their text: as wide as the longest line plus padding, as tall as the lines.
    const SPEECH_PAD_X = 18, SPEECH_PAD_Y = 13;
    function speechBoxHeight(n, px, lineH) { return SPEECH_PAD_Y * 2 + (n - 1) * lineH + px; }
    // Draws a white rounded bubble centred on cx with its top at y. `shown` (optional) limits how many
    // characters are typed out so far; the box is always sized for the full text so it doesn't grow.
    function drawSpeechBox(lines, cx, y, px, lineH, color, shown) {
      ctx.font = 'bold ' + px + 'px "Proxima Nova", sans-serif';
      let longest = 0;
      lines.forEach(l => { longest = Math.max(longest, ctx.measureText(l).width); });
      const w = Math.min(width - 24, Math.ceil(longest) + SPEECH_PAD_X * 2);
      const h = speechBoxHeight(lines.length, px, lineH);
      const x = cx - w / 2;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, 12); else ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.fillStyle = color || '#000000';
      ctx.textAlign = 'center';
      let left = shown == null ? Infinity : shown;
      lines.forEach((l, i) => {
        const part = left >= l.length ? l : l.slice(0, Math.max(0, left));
        left -= l.length + 1;
        ctx.fillText(part, cx, y + SPEECH_PAD_Y + px * 0.8 + i * lineH);
      });
      return { x: x, y: y, w: w, h: h };
    }

    const fullStoryText = [
      'My beloved Cyndraxx, I have been',
      'captured by the slavers. Burn',
      'their castle to the ground and',
      'find me. You are my heart',
      'and soul. BREAK EVERY CHAIN!'
    ];
    let totalCharCount = fullStoryText.join('\n').length;
    let typedCharIndex = 0;
    let textTypingComplete = false;

    let khaleesiBannerTimer = 0;
    let khaleesiBannerText = "";
    let hudBubbleBottom = 0;   // bottom of Khaleesi's speech bubble this frame (0 = none), so HUD extras can sit below it

    let currentLevel = 1;
    let levelTimerSeconds = 0;
    const LEVEL_DURATIONS = {
      1: 90,
      2: 180,
      3: 150,   // shortened; the end of level 3 starts the siege-tower boss
      4: 240,
      5: 240
    };
    const FINAL_LEVEL = 5;

    let level2KhaleesiSpawned = false;
    let level2RoyalSpawned = false;

    let celebrationTimer = 0;
    let celebrationAngle = 0;
    let celebrationFadeAlpha = 0;

    const gameStats = {
      burnedTowers: 0,
      villagersKilled: 0,
      archersKilled: 0,
      trebuchetsDestroyed: 0,
      kingsBeheaded: 0,
      queensBeheaded: 0,
      khaleesiRescues: 0
    };

    function showKhaleesiBanner(text, duration = 200) {
      khaleesiBannerText = text;
      khaleesiBannerTimer = duration;
    }

    function updateLevelBadgeUI() {
      const progressBarFill = document.getElementById('progressBarFill');
      if (state === "BOSS") {
        levelBadge.innerText = "BOSS";
        if (progressBarFill) progressBarFill.style.width = "100%";
        return;
      }
      if (currentLevel > FINAL_LEVEL) {
        levelBadge.innerText = "VICTORY!";
        if (progressBarFill) progressBarFill.style.width = '100%';
        return;
      }
      const inCaveLvl = typeof caveLevel !== 'undefined' && caveLevel > 0;
      levelBadge.innerText = inCaveLvl ? `CAVE ${caveLevel}` : (currentLevel <= 0 ? proLevelName(currentLevel) : `LVL ${currentLevel}`);
      const maxSecs = inCaveLvl ? CAVE_DURATIONS[caveLevel] : (LEVEL_DURATIONS[currentLevel] || 90);
      const progressPercent = Math.min(100, Math.max(0, (levelTimerSeconds / maxSecs) * 100));
      if (progressBarFill) {
        progressBarFill.style.width = `${progressPercent}%`;
      }
    }


    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const levelBadge = document.getElementById('levelBadge');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const heartsDisplay = document.getElementById('heartsDisplay');
    const heartsText = document.getElementById('heartsText');
    const headsText = document.getElementById('headsText');

    const bottomControlsBar = document.getElementById('bottomControlsBar');
    const toggleFireModeBtn = document.getElementById('toggleFireModeBtn');
    const manualFireBtn = document.getElementById('manualFireBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const soundBtn = document.getElementById('soundBtn');

    const pauseModal = document.getElementById('pauseModal');
    const saveCodeDisplay = document.getElementById('saveCodeDisplay');
    const copyCodeBtn = document.getElementById('copyCodeBtn');
    const closeSaveModalBtn = document.getElementById('closeSaveModalBtn');

    const shareModal = document.getElementById('shareModal');
    const shareCanvas = document.getElementById('shareCanvas');
    const downloadShareBtn = document.getElementById('downloadShareBtn');
    const closeShareModalBtn = document.getElementById('closeShareModalBtn');

    const loadModal = document.getElementById('loadModal');
    const loadCodeInput = document.getElementById('loadCodeInput');
    const confirmLoadBtn = document.getElementById('confirmLoadBtn');
    const cancelLoadBtn = document.getElementById('cancelLoadBtn');

    let state = 'SPLASH';
    let levelDialogueType = 'INTRO';
    let score = 0;
    let lives = 3;
    let maxLives = 3;          // the cathedral's heart container adds one (cathedral.js)
    let royalHeads = 0;
    let royalHeadTypes = [];
    let royalHeadNobles = [];   // which noble portrait (NOBLES index) each collected head shows
    let cutsceneNoble = 0;      // the noble shown on the beheading screen
    let invulnerableTimer = 0;
    let isHoldingAction = false;

    let isFlapLockActive = true;
    let isControlFlipped = false;

    let holdTimer = 0;
    let backgroundParallaxX = 0;
    let lastSpawnedBattlementHeight = 0;

    let khaleesiMounted = false;
    let khaleesiTimer = 0;
    let khaleesiCombo = 0;
    const KHALEESI_MAX_TIME = 600;

    let cutsceneTarget = 'KING';
    let cutsceneTimer = 0;
    let noHeadContinuePopupTimer = 0;
    let headFadingIndex = -1;
    let headFadeTimer = 0;

    const activeTouches = new Map();

    let width, height;
    function resize() {
      width = container.clientWidth;
      height = container.clientHeight;
      canvas.width = width;

<script>
// audio.js — SoundEngine (Web Audio synth + <audio> element playback)
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    const BONK_MIN_GAP = 0.22;   // seconds between peasant bonks
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.isBoostPlaying = false;
        this.hidden = false;   // true while the app is in the background
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended' && !this.hidden) {
          this.ctx.resume();
        }
      }

      playSoundEffect(audioElem, volume = 0.8) {
        if (this.muted || this.hidden) return;
        if (audioElem && audioElem.src) {
          try {
            audioElem.currentTime = 0;
            audioElem.volume = volume;
            audioElem.play().catch(() => {});
          } catch(e) {}
        }
      }

      stopRoyalSounds() {
        if (sfxQueenEntrance) {
          sfxQueenEntrance.pause();
          sfxQueenEntrance.currentTime = 0;
        }
        if (sfxKingEntrance) {
          sfxKingEntrance.pause();
          sfxKingEntrance.currentTime = 0;
        }
      }

      playFlapSound() {
        if (this.muted || this.hidden || this.isBoostPlaying) return;
        
        if (sfxBoost && sfxBoost.src) {
          this.isBoostPlaying = true;
          sfxBoost.currentTime = 0;
          sfxBoost.volume = 0.4;
          
          const handleEnded = () => {
            this.isBoostPlaying = false;
            sfxBoost.removeEventListener('ended', handleEnded);
          };
          
          sfxBoost.addEventListener('ended', handleEnded);
          
          sfxBoost.play().catch(() => {
            this.isBoostPlaying = false;
          });
        }
      }

      whoosh() {
        this.playFlapSound();
      }

      flap() {
        this.playFlapSound();
      }

      // one second of white noise, made once and reused by the fire and bonk sounds
      noiseBuffer() {
        if (!this._noise) {
          const sr = this.ctx.sampleRate;
          this._noise = this.ctx.createBuffer(1, sr, sr);
          const d = this._noise.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        return this._noise;
      }

      // Dragon fire: a breathy "fwoosh" (noise swept from bright to dark), a low rumble under it,
      // and a few random crackles. Rapid shots get a lighter version so auto-fire doesn't pile up.
      fireRoar() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const rapid = this._lastFire != null && now - this._lastFire < 0.12;
        this._lastFire = now;
        const vol = rapid ? 0.55 : 1;
        const len = rapid ? 0.32 : 0.5;
        const out = c.createGain();
        out.gain.value = 0.38 * vol;   // kept below the music and other effects
        out.connect(c.destination);

        // the rush of flame
        const src = c.createBufferSource();
        src.buffer = this.noiseBuffer();
        src.playbackRate.value = 0.9 + Math.random() * 0.2;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 0.7;
        bp.frequency.setValueAtTime(2600, now);
        bp.frequency.exponentialRampToValueAtTime(420, now + len);
        const lp = c.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 5200;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.5, now + 0.03);
        g.gain.exponentialRampToValueAtTime(0.22, now + len * 0.45);
        g.gain.exponentialRampToValueAtTime(0.0001, now + len);
        src.connect(bp).connect(lp).connect(g).connect(out);
        src.start(now, Math.random() * 0.4);
        src.stop(now + len + 0.05);

        // low body underneath
        const o = c.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(110, now);
        o.frequency.exponentialRampToValueAtTime(48, now + len);
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(0.22, now + 0.04);
        og.gain.exponentialRampToValueAtTime(0.0001, now + len * 0.9);
        o.connect(og).connect(out);
        o.start(now);
        o.stop(now + len);

        // crackles
        if (!rapid) {
          for (let i = 0; i < 5; i++) {
            const t = now + 0.05 + Math.random() * (len - 0.1);
            const cs = c.createBufferSource();
            cs.buffer = this.noiseBuffer();
            const hp = c.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.value = 2500 + Math.random() * 2500;
            const cg = c.createGain();
            cg.gain.setValueAtTime(0.0001, t);
            cg.gain.exponentialRampToValueAtTime(0.12 + Math.random() * 0.1, t + 0.003);
            cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.025);
            cs.connect(hp).connect(cg).connect(out);
            cs.start(t, Math.random() * 0.8);
            cs.stop(t + 0.03);
          }
        }
      }

      // Cartoon "bonk" for peasants knocked flying: a quick falling boing with a woody knock and a click.
      // Pitch varies a little each time. At most one plays every BONK_MIN_GAP seconds.
      bonk() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        // one bonk per wing beat: a crowd hit at once (or fast flapping) plays a single bonk, not a trill
        if (this._lastBonk != null && now - this._lastBonk < BONK_MIN_GAP) return;
        this._lastBonk = now;
        const pitch = 0.85 + Math.random() * 0.35;
        const out = c.createGain();
        out.gain.value = 0.6;
        out.connect(c.destination);

        const o = c.createOscillator();             // the boing
        o.type = 'sine';
        o.frequency.setValueAtTime(620 * pitch, now);
        o.frequency.exponentialRampToValueAtTime(150 * pitch, now + 0.13);
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(0.42, now + 0.004);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
        o.connect(og).connect(out);
        o.start(now); o.stop(now + 0.22);

        const w = c.createOscillator();             // woody knock
        w.type = 'triangle';
        w.frequency.setValueAtTime(980 * pitch, now);
        w.frequency.exponentialRampToValueAtTime(420 * pitch, now + 0.05);
        const wg = c.createGain();
        wg.gain.setValueAtTime(0.0001, now);
        wg.gain.exponentialRampToValueAtTime(0.18, now + 0.002);
        wg.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
        w.connect(wg).connect(out);
        w.start(now); w.stop(now + 0.08);

        const n = c.createBufferSource();           // impact click
        n.buffer = this.noiseBuffer();
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = 2200;
        bp.Q.value = 1.2;
        const ng = c.createGain();
        ng.gain.setValueAtTime(0.0001, now);
        ng.gain.exponentialRampToValueAtTime(0.3, now + 0.002);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
        n.connect(bp).connect(ng).connect(out);
        n.start(now, Math.random() * 0.8); n.stop(now + 0.04);
      }

      // ---- cathedral encounter (cathedral.js) ----
      // a short ringing tone; used for glass tinkles and the priest's shimmering magic
      _ping(t, freq, vol, dur, type, out) {
        const c = this.ctx;
        const o = c.createOscillator();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(out);
        o.start(t); o.stop(t + dur + 0.02);
      }

      // the great stained-glass window shattering: a bright crash and a shower of tinkles
      glassShatter() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const out = c.createGain();
        out.gain.value = 0.5;
        out.connect(c.destination);
        const n = c.createBufferSource();
        n.buffer = this.noiseBuffer();
        const hp = c.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 2400;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.7, now + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
        n.connect(hp).connect(g).connect(out);
        n.start(now); n.stop(now + 0.5);
        for (let i = 0; i < 18; i++) {
          this._ping(now + 0.02 + Math.random() * 0.7, 2200 + Math.random() * 4200, 0.05 + Math.random() * 0.08, 0.12 + Math.random() * 0.25, 'sine', out);
        }
      }

      // Cyndraxx's giant breath of flame: a long, deep roar
      bigBreath() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime, len = 1.8;
        const out = c.createGain();
        out.gain.value = 0.5;
        out.connect(c.destination);
        const src = c.createBufferSource();
        src.buffer = this.noiseBuffer();
        src.loop = true;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 0.6;
        bp.frequency.setValueAtTime(900, now);
        bp.frequency.linearRampToValueAtTime(2200, now + 0.25);
        bp.frequency.exponentialRampToValueAtTime(380, now + len);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.6, now + 0.08);
        g.gain.setValueAtTime(0.5, now + len * 0.6);
        g.gain.exponentialRampToValueAtTime(0.0001, now + len);
        src.connect(bp).connect(g).connect(out);
        src.start(now); src.stop(now + len + 0.05);
        const o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(70, now);
        o.frequency.exponentialRampToValueAtTime(40, now + len);
        const lp = c.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = 260;
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(0.35, now + 0.1);
        og.gain.exponentialRampToValueAtTime(0.0001, now + len);
        o.connect(lp).connect(og).connect(out);
        o.start(now); o.stop(now + len);
      }

      // the priest's strange power: a glassy, rising shimmer of bell tones
      magicShimmer(dur = 1.6, vol = 0.35) {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const out = c.createGain();
        out.gain.value = vol;
        out.connect(c.destination);
        const notes = [1046.5, 1174.7, 1396.9, 1568, 1760, 2093, 2349.3, 2793.8];
        const count = Math.round(dur * 14);
        for (let i = 0; i < count; i++) {
          const t = now + (i / count) * dur;
          const f = notes[Math.floor(Math.random() * notes.length)] * (Math.random() < 0.3 ? 0.5 : 1);
          this._ping(t, f, 0.07, 0.5 + Math.random() * 0.5, 'sine', out);
          this._ping(t, f * 1.003, 0.03, 0.6, 'triangle', out);
        }
      }

      // the teleportation spell: a rushing sweep upward into a bright ring
      teleportWhoosh() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime, len = 1.6;
        const out = c.createGain();
        out.gain.value = 0.45;
        out.connect(c.destination);
        const src = c.createBufferSource();
        src.buffer = this.noiseBuffer();
        src.loop = true;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.Q.value = 2.5;
        bp.frequency.setValueAtTime(250, now);
        bp.frequency.exponentialRampToValueAtTime(6000, now + len);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.6, now + len * 0.8);
        g.gain.exponentialRampToValueAtTime(0.0001, now + len + 0.3);
        src.connect(bp).connect(g).connect(out);
        src.start(now); src.stop(now + len + 0.35);
        const o = c.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(180, now);
        o.frequency.exponentialRampToValueAtTime(1800, now + len);
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(0.18, now + len * 0.7);
        og.gain.exponentialRampToValueAtTime(0.0001, now + len + 0.2);
        o.connect(og).connect(out);
        o.start(now); o.stop(now + len + 0.25);
        this._ping(now + len, 2093, 0.15, 1.2, 'sine', out);
        this._ping(now + len, 3136, 0.08, 1.0, 'sine', out);
      }

      // ---- boss ending (boss-fall.js) ----
      // the chain paying out behind the arrow: a quick run of metallic clinks
      chainRattle(dur = 0.6) {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const out = c.createGain();
        out.gain.value = 0.4;
        out.connect(c.destination);
        const n = Math.round(dur * 22);
        for (let i = 0; i < n; i++) {
          const t = now + (i / n) * dur + Math.random() * 0.02;
          this._ping(t, 2600 + Math.random() * 1800, 0.06, 0.06, 'square', out);
          this._ping(t, 5200 + Math.random() * 2000, 0.03, 0.04, 'sine', out);
        }
      }

      // the arrow striking Cyndraxx's heart: a hard thud and a deep, ringing heartbeat
      // a cave spider's hiss as it leaps (also a web tearing)
      spiderHiss() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const n = c.createBufferSource();
        n.buffer = this.noiseBuffer();
        const hp = c.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 2600;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.Q.value = 3;
        bp.frequency.setValueAtTime(5200, now);
        bp.frequency.exponentialRampToValueAtTime(3200, now + 0.35);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.32, now + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        n.connect(hp).connect(bp).connect(g).connect(c.destination);
        n.start(now); n.stop(now + 0.45);
      }

      // a spider burning up: a wet crackle and a squeal
      spiderSquish() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const n = c.createBufferSource();
        n.buffer = this.noiseBuffer();
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 1.4;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.45, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
        n.connect(bp).connect(g).connect(c.destination);
        n.start(now); n.stop(now + 0.25);
        const o = c.createOscillator();
        o.type = 'square';
        o.frequency.setValueAtTime(1900, now);
        o.frequency.exponentialRampToValueAtTime(700, now + 0.18);
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(0.06, now + 0.01);
        og.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
        o.connect(og).connect(c.destination);
        o.start(now); o.stop(now + 0.22);
      }

      // one slow, muffled heartbeat (lub-dub); `vol` 0..1 so the last ones can fade
      heartbeat(vol = 1) {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const out = c.createGain();
        out.gain.value = 0.9 * vol;
        out.connect(c.destination);
        [0, 0.28].forEach((d, i) => {
          const o = c.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(i ? 52 : 62, now + d);
          o.frequency.exponentialRampToValueAtTime(30, now + d + 0.25);
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, now + d);
          g.gain.exponentialRampToValueAtTime(i ? 0.55 : 0.9, now + d + 0.025);
          g.gain.exponentialRampToValueAtTime(0.0001, now + d + 0.38);
          const lp = c.createBiquadFilter();
          lp.type = 'lowpass'; lp.frequency.value = 160;
          o.connect(lp).connect(g).connect(out);
          o.start(now + d); o.stop(now + d + 0.42);
        });
      }

      // a dying breath: a long, wet, rattling exhale that sinks away
      deathRattle() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime, dur = 2.6;
        const out = c.createGain();
        out.gain.value = 0.55;
        out.connect(c.destination);
        const n = c.createBufferSource();
        n.buffer = this.noiseBuffer();
        n.loop = true;
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.Q.value = 2.2;
        bp.frequency.setValueAtTime(700, now);
        bp.frequency.exponentialRampToValueAtTime(180, now + dur);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.7, now + 0.25);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        // the rattle: the breath stutters through the throat
        const am = c.createGain();
        am.gain.value = 0.5;
        const lfo = c.createOscillator();
        lfo.type = 'square';
        lfo.frequency.setValueAtTime(19, now);
        lfo.frequency.linearRampToValueAtTime(9, now + dur);
        const lfoG = c.createGain();
        lfoG.gain.value = 0.5;
        lfo.connect(lfoG).connect(am.gain);
        n.connect(bp).connect(am).connect(g).connect(out);
        // a low groan under it
        const o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(78, now);
        o.frequency.exponentialRampToValueAtTime(41, now + dur);
        const og = c.createGain();
        og.gain.setValueAtTime(0.0001, now);
        og.gain.exponentialRampToValueAtTime(0.12, now + 0.3);
        og.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.9);
        const olp = c.createBiquadFilter();
        olp.type = 'lowpass'; olp.frequency.value = 300;
        o.connect(olp).connect(og).connect(out);
        n.start(now); n.stop(now + dur + 0.1);
        lfo.start(now); lfo.stop(now + dur + 0.1);
        o.start(now); o.stop(now + dur);
      }

      pierceHit() {
        if (this.muted || this.hidden) return;
        this.init();
        const c = this.ctx;
        if (!c) return;
        const now = c.currentTime;
        const out = c.createGain();
        out.gain.value = 0.6;
        out.connect(c.destination);
        const n = c.createBufferSource();
        n.buffer = this.noiseBuffer();
        const bp = c.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 1;
        const ng = c.createGain();
        ng.gain.setValueAtTime(0.0001, now);
        ng.gain.exponentialRampToValueAtTime(0.8, now + 0.005);
        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
        n.connect(bp).connect(ng).connect(out);
        n.start(now); n.stop(now + 0.15);
        [0, 0.32].forEach((d, i) => {          // lub... dub
          const o = c.createOscillator();
          o.type = 'sine';
          o.frequency.setValueAtTime(i ? 70 : 85, now + 0.05 + d);
          o.frequency.exponentialRampToValueAtTime(38, now + 0.35 + d);
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, now + 0.05 + d);
          g.gain.exponentialRampToValueAtTime(i ? 0.5 : 0.8, now + 0.07 + d);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.5 + d);
          o.connect(g).connect(out);
          o.start(now + 0.05 + d); o.stop(now + 0.55 + d);
        });

          src.start();
          lfo.start();

      if (state !== 'PLAYING' || inPrologue()) return;   // prologue.js ends its own levels

      const targetDuration = LEVEL_DURATIONS[currentLevel] || 90;

      if (levelTimerSeconds >= targetDuration) {
        if (currentLevel === 1) {

        } else if (currentLevel === 2) {
          startLevelCelebration(3, 'LEVEL2_CLEAR');
        } else if (currentLevel === 3) {

    const CODE_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const SAVE_CODE_BOSS = 11;   // level character "B": the code starts the siege-tower boss
    let saveCodeBoss = false;    // set by loadSaveCode() when the code is a boss code
    let saveCodeCave = 0;        // ...or the cave level (1 or 2) for a cave code

    function atBossFight() {
      if (state === 'BOSS_INTRO') return true;
      if (!bossState.active) return false;
      return state === 'BOSS' || (state === 'PAUSED' && statePrePause === 'BOSS');
    }
    
    // Save code: 12 characters, shown as XXXX-XXXX-XXXX.
    // The 3 villager characters also carry the extra heart containers (0-2): value = extra * SAVE_HEART_STEP + villagers,
    // so codes made before this (villagers far below 15,552) still load with no extra hearts.
    const SAVE_HEART_STEP = 15552;   // 36^3 / 3
    //   score (5) · kings (1) · queens (1) · villagers (3) · level (1, "B" = boss) · check (1)
    // Old 6- and 7-character codes still load.
    function codeEncode(n, len) {
      let s = '';
      for (let i = 0; i < len; i++) { s = CODE_CHARS[n % 36] + s; n = Math.floor(n / 36); }
      return s;
    }
    function codeDecode(str) {
      let n = 0;
      for (let i = 0; i < str.length; i++) {
        const v = CODE_CHARS.indexOf(str[i]);
        if (v < 0) return -1;
        n = n * 36 + v;
      }
      return n;
    }
    function codeCheckChar(body) {
      let sum = 0;
      for (let i = 0; i < body.length; i++) sum += CODE_CHARS.indexOf(body[i]) * (i + 3);
      return CODE_CHARS[sum % 36];
    }

    function generateSaveCode() {
      const p = Math.min(Math.max(0, Math.floor(score)), 36 ** 5 - 1);
      const k = Math.min(gameStats.kingsBeheaded, 35);
      const q = Math.min(gameStats.queensBeheaded, 35);
      const extraHearts = Math.max(0, Math.min(2, maxLives - 3));
      const v = Math.min(gameStats.villagersKilled, SAVE_HEART_STEP - 1) + extraHearts * SAVE_HEART_STEP;
      let lvl = atBossFight() ? SAVE_CODE_BOSS : Math.min(currentLevel, FINAL_LEVEL);
      if (inPrologue() || state === 'CAPTURE') lvl = currentLevel === PRO_MEADOW ? PRO_CODE_MEADOW : PRO_CODE_VILLAGE;
      if (caveLevel > 0 && cave) lvl = CAVE_CODES[caveLevel];
      const body = codeEncode(p, 5) + CODE_CHARS[k] + CODE_CHARS[q] + codeEncode(v, 3) + CODE_CHARS[lvl];
      const code = body + codeCheckChar(body);
      return code.slice(0, 4) + '-' + code.slice(4, 8) + '-' + code.slice(8);
    }

    function loadSaveCode(codeStr) {
      if (!codeStr) return false;
      const clean = codeStr.toUpperCase().replace(/[^0-9A-Z]/g, '');
      let savedScore, savedKings, savedQueens, savedVillagers, lvlVal, savedHearts = 0;

      if (clean.length === 12) {
        const body = clean.slice(0, 11);
        if (codeCheckChar(body) !== clean[11]) return false;   // typo
        savedScore = codeDecode(body.slice(0, 5));
        savedKings = codeDecode(body[5]);
        savedQueens = codeDecode(body[6]);
        savedVillagers = codeDecode(body.slice(7, 10));
        if (savedVillagers >= 0) {
          savedHearts = Math.min(2, Math.floor(savedVillagers / SAVE_HEART_STEP));
          savedVillagers = savedVillagers % SAVE_HEART_STEP;
        }
        lvlVal = codeDecode(body[10]);
      } else if (clean.length === 6 || clean.length === 7) {
        // old short format: score (2) kings queens villagers (2) [level]
        savedScore = codeDecode(clean.slice(0, 2));
        savedKings = codeDecode(clean[2]);
        savedQueens = codeDecode(clean[3]);
        savedVillagers = codeDecode(clean.slice(4, 6));
        lvlVal = clean.length === 7 ? codeDecode(clean[6]) : Math.min(3, Math.max(1, Math.floor(savedScore / 1000) + 1));
      } else return false;

      if ([savedScore, savedKings, savedQueens, savedVillagers, lvlVal].some(x => x < 0)) return false;

      const isBoss = lvlVal === SAVE_CODE_BOSS;
      let savedLvl = isBoss ? 3 : Math.max(1, Math.min(FINAL_LEVEL, lvlVal));
      if (clean.length === 12 && isPrologueCode(lvlVal)) savedLvl = lvlVal === PRO_CODE_MEADOW ? PRO_MEADOW : PRO_VILLAGE;
      const caveCode = clean.length === 12 ? (lvlVal === CAVE_CODES[1] ? 1 : (lvlVal === CAVE_CODES[2] ? 2 : 0)) : 0;
      if (caveCode) savedLvl = 4;

      resetGame();
      score = savedScore;
      currentLevel = savedLvl;
      levelTimerSeconds = 0;
      gameStats.kingsBeheaded = savedKings;
      gameStats.queensBeheaded = savedQueens;
      gameStats.villagersKilled = savedVillagers;
      gameStats.burnedTowers = Math.floor(savedScore / 25);

      royalHeads = savedKings + savedQueens;
      royalHeadTypes = [
        ...Array(savedKings).fill('KING'),
        ...Array(savedQueens).fill('QUEEN')
      ];
      royalHeadNobles = royalHeadTypes.map(t => randomNoble(t));
      maxLives = 3 + savedHearts;     // heart containers from the cathedral and Brown Jenkins
      lives = maxLives;

      updateLevelBadgeUI();
      scoreDisplay.innerText = score;
      updateHeartsDisplay();
      saveCodeBoss = isBoss;
      saveCodeCave = caveCode;
      return true;
    }

<script>
// input.js — Click/touch/mouse input, button listeners, modal touch isolation
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    function checkLevelDialogueClick(clientX, clientY) {
      if (state !== 'LEVEL_DIALOGUE') return false;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const pSize = 140;
      const pY = LEVEL_DIALOGUE_PY;
      const isIntroStyle = !!LEVEL_SPEECH[levelDialogueType];
      const statsBoxY = isIntroStyle ? (pY + pSize + 20) : (pY + pSize + 40);
      const statsBoxH = isIntroStyle ? levelSpeechHeight(levelDialogueType) : 175;

      const btnW = 220;
      const btnH = 46;
      const btnX = (width - btnW) / 2;
      const btnY = statsBoxY + statsBoxH + 20;

      if (canvasX >= btnX && canvasX <= btnX + btnW && canvasY >= btnY && canvasY <= btnY + btnH) {
        if (levelDialogueType === 'VICTORY') {
          resetGame();
          state = 'PLAYING';
        } else {
          state = 'PLAYING';
          dragon.velocity = dragon.jump;
          dragon.wingState = 1.0;
          sound.flap();
          announceLevelStart();
        }
        return true;
      }
      return false;
    }

    function checkCutsceneReturnClick(clientX, clientY) {
      if (state !== 'CUTSCENE' || cutsceneTimer < CUTSCENE_BUTTON_FRAME) return false;

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;

      const canvasX = (clientX - rect.left) * scaleX;
      const canvasY = (clientY - rect.top) * scaleY;

      const boxSize = 240;
      const bY = height / 2 - 80;
      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;
      const btnY = bY + boxSize + 45;

      if (canvasX >= btnX && canvasX <= btnX + btnW && canvasY >= btnY && canvasY <= btnY + btnH) {
        state = 'PLAYING';
        dragon.velocity = dragon.jump;
        dragon.wingState = 1.0;
        sound.flap();
        return true;
      }
      return false;
    }

  function checkPauseScreenClick(clickX, clickY) {
      if (state !== 'PAUSED') return false;

      const btnW = 240;
      const btnH = 56;
      const btnGap = 14;
      const btnX = (width - btnW) / 2;

      const resumeBtnY = height / 2 - 80;
      const saveBtnY = resumeBtnY + btnH + btnGap;
      const loadBtnY = saveBtnY + btnH + btnGap;
      const flipBtnY = loadBtnY + btnH + btnGap;
      const shareBtnY = flipBtnY + btnH + btnGap;

      if (clickX >= btnX && clickX <= btnX + btnW) {
        if (clickY >= resumeBtnY && clickY <= resumeBtnY + btnH) {
          resumeFromPause();
          return true;
        }

        if (clickY >= saveBtnY && clickY <= saveBtnY + btnH) {
          saveGame();
          pauseModal.style.display = 'flex';
          return true;
        }

        if (clickY >= loadBtnY && clickY <= loadBtnY + btnH) {
          openLoadGameModal();
          return true;
        }

        if (clickY >= flipBtnY && clickY <= flipBtnY + btnH) {
          isControlFlipped = !isControlFlipped;
          bottomControlsBar.classList.toggle('flipped', isControlFlipped);
          return true;
        }

        if (clickY >= shareBtnY && clickY <= shareBtnY + btnH) {
          generateSharePostGraphic();
          return true;
        }
      }
      return false;
    }
    function checkGameOverClick(clickX, clickY) {
      if (state !== 'GAMEOVER') return false;

      if (noHeadContinuePopupTimer > 0) {
        noHeadContinuePopupTimer = 0;
        return true;
      }

      if (jenkinsRejected) {          // refused Brown Jenkins: CONTINUE goes straight to level 4
        const by = height / 2 - 35;
        if (clickY >= by && clickY <= by + 44 && clickX >= (width - 200) / 2 && clickX <= (width + 200) / 2) finishBossFall();
        return true;
      }

      const btnW = 200;
      const btnH = 44;
      const btnX = (width - btnW) / 2;

      const continueBtnY = height / 2 - 40;
      const restartBtnY = continueBtnY + 54;
      const loadBtnY = restartBtnY + 54;

      if (clickX >= btnX && clickX <= btnX + btnW) {
        if (clickY >= continueBtnY && clickY <= continueBtnY + btnH) {
          if (royalHeads > 0 && headFadingIndex < 0) {
            headFadingIndex = royalHeads - 1;
            headFadeTimer = 35;
          } else if (royalHeads === 0) {
            noHeadContinuePopupTimer = 240;
          }
          return true;
        }

        if (clickY >= restartBtnY && clickY <= restartBtnY + btnH) {
          const proLvl = inPrologue() ? currentLevel : null;   // dying in the prologue restarts that prologue level
          const caveLvl = caveLevel;                            // ...and in the caves, that cave level
          resetGame();
          if (proLvl !== null) startPrologueLevel(proLvl);
          else if (caveLvl) startCaveLevel(caveLvl);
          else state = 'PLAYING';
          return true;
        }

        if (clickY >= loadBtnY && clickY <= loadBtnY + btnH) {
          openLoadGameModal();
          return true;
        }
      }
      return false;
    }

    function handleActionPress(clientX, clientY) {
      if (khaleesiSplash) return;   // ignore taps while the Khaleesi splash is up
      sound.init();

      if (state === 'BOSS_INTRO') { skipBossIntro(); return; }
      if (state === 'CAPTURE') { captureTap(); return; }   // no control during the capture; taps only move through the story images

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clickX = (clientX !== undefined) ? (clientX - rect.left) * scaleX : undefined;
      const clickY = (clientY !== undefined) ? (clientY - rect.top) * scaleY : undefined;

      if (state === 'CATHEDRAL') { cathedralTap(clickX, clickY); return; }
      if (state === 'BOSS_FALL') { bossFallTap(clickX, clickY); return; }   // the boss ending, Brown Jenkins (boss-fall.js)
      if (state === 'SURFACE') { surfaceTap(); return; }   // cathedral cutscene: advance, REST / FIGHT ON

      if (state === 'LEVEL_DIALOGUE') {
        if (clientX !== undefined && clientY !== undefined) {
          checkLevelDialogueClick(clientX, clientY);
        }
        return;
      }

      if (state === 'CUTSCENE') {
        if (clientX !== undefined && clientY !== undefined) {
          checkCutsceneReturnClick(clientX, clientY);
        }
        return;
      }

      if (state === 'PAUSED') {
        if (clickX !== undefined && clickY !== undefined) {
          checkPauseScreenClick(clickX, clickY);
        }
        return;
      }

      if (state === 'SPLASH') {
        if (!textTypingComplete) {
          typedCharIndex = totalCharCount;
          textTypingComplete = true;
        } else {
          state = 'START';
        }
        return;
      }

      if (state === 'CAPTURED_MSG') {
        if (!textTypingComplete) {
          typedCharIndex = totalCharCount;
          textTypingComplete = true;
        } else {
          levelDialogueType = 'INTRO';
          state = 'LEVEL_DIALOGUE';
        }
        return;
      }

      const btnW = 200;
      const btnX = (width - btnW) / 2;

      if (state === 'START') {
        const startBtnY = height / 2 - 10;
        const loadBtnY = startBtnY + 58;

        if (clickX !== undefined && clickY !== undefined && clickX >= btnX && clickX <= btnX + btnW) {
          if (clickY >= loadBtnY && clickY <= loadBtnY + 44) {
            openLoadGameModal();
            return;
          }
          if (clickY >= startBtnY && clickY <= startBtnY + 44) {
            resetGame();
            startPrologueLevel(PRO_MEADOW);
            return;
          }
        }
        resetGame();
        startPrologueLevel(PRO_MEADOW);
        return;
      }

      if (state === 'GAMEOVER') {
        if (clickX !== undefined && clickY !== undefined) {
          checkGameOverClick(clickX, clickY);
        }
        return;
      }

      if (state === 'PLAYING' && festBusy()) { festTap(); return; }   // resting on the festival roof

      if (state === 'PLAYING' || state === 'BOSS'){
        dragon.velocity = dragon.jump;
        dragon.wingState = 1.0;
        sound.flap();
        if (!isFlapLockActive) {
          shootFire();
        }
        isHoldingAction = true;
        holdTimer = 0;
      }
    }

    function handleActionRelease() {
      isHoldingAction = false;
      holdTimer = 0;
    }

    container.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.changedTouches[0];
      for (let i = 0; i < e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
      }
      handleActionPress(touch.clientX, touch.clientY);
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
        handleActionRelease();
      }
    });

    container.addEventListener('touchcancel', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        activeTouches.delete(e.changedTouches[i].identifier);
      }
      if (activeTouches.size === 0) {
        handleActionRelease();
      }
    });

    container.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
      handleActionPress(e.clientX, e.clientY);
    });

    container.addEventListener('mouseup', (e) => {
      handleActionRelease();
    });

    function isolateBtnTouch(btn, callback) {
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();

      }, { passive: false });
      
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();

      btn.addEventListener('click', (e) => {
        e.preventDefault();

        callback(e);
      });
    }

    isolateBtnTouch(manualFireBtn, () => {
      sound.init();

      if (state === 'PLAYING' || state === 'BOSS') {
        shootFire();
      }
    });

    isolateBtnTouch(pauseBtn, () => {
      togglePauseGame();
    });

    isolateBtnTouch(closeSaveModalBtn, () => {
      pauseModal.style.display = 'none';
      // back to the pause menu, not straight into the game
    });

    isolateBtnTouch(closeShareModalBtn, () => {
      shareModal.style.display = 'none';
    });

    isolateBtnTouch(copyCodeBtn, () => {
      const textToCopy = saveCodeDisplay.innerText.trim();
      if (!textToCopy || textToCopy === '-------') return;

      const setCopySuccessVisual = () => {
        const origText = copyCodeBtn.innerText;
        copyCodeBtn.innerText = 'COPIED!';
        copyCodeBtn.style.background = '#2ecc71';
        setTimeout(() => {
          copyCodeBtn.innerText = origText;
          copyCodeBtn.style.background = '';
        }, 1500);
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(textToCopy).then(setCopySuccessVisual).catch(() => {
          fallbackCopyText(textToCopy, setCopySuccessVisual);
        });
      } else {
        fallbackCopyText(textToCopy, setCopySuccessVisual);
      }
    });

    function fallbackCopyText(text, successCallback) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.left = "-999999px";
      textArea.style.top = "-999999px";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        document.execCommand('copy');
        if (successCallback) successCallback();
      } catch (err) {
        alert("Copy failed. Please manually select and copy: " + text);
      }
      document.body.removeChild(textArea);
    }

    isolateBtnTouch(downloadShareBtn, () => {
      if (!shareCanvas) return;

      shareCanvas.toBlob((blob) => {
        if (!blob) return;

        const blobUrl = URL.createObjectURL(blob);

        if (navigator.canShare && navigator.share) {
          const file = new File([blob], 'conqueror.png', { type: 'image/png' });
          if (navigator.canShare({ files: [file] })) {
            navigator.share({
              files: [file],
              title: 'Flappy Dragon Conqueror',
              text: `I scored ${score} pts in Flappy Dragon Conqueror!`
            }).catch(() => {});
          }
        }

        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = blobUrl;
        downloadAnchor.download = 'conqueror.png';
        downloadAnchor.target = '_blank';
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

        setTimeout(() => {
          window.open(blobUrl, '_blank');
        }, 100);

        setTimeout(() => {
          URL.revokeObjectURL(blobUrl);
        }, 10000);
      }, 'image/png');
    });

    isolateBtnTouch(soundBtn, () => {
      sound.muted = !sound.muted;
      soundBtn.innerText = sound.muted ? '🔇' : '🔊';
      sound.updateMusicState(state);

    isolateBtnTouch(confirmLoadBtn, () => {

      } else {

      }
    });

    isolateBtnTouch(cancelLoadBtn, () => {

    pauseModal.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: false });

<script>
// render-sky.js — Night sky, stars, moon, clouds, parallax castle backdrop (cached layers)
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    // ==========================================
    // BACKGROUND: sky, moon, clouds, castle parallax
    // Static layers are painted once into cached offscreen canvases (keyed by size + level)
    // and blitted each frame; only twinkles, window glows and scrolling are per-frame.
    // ==========================================
    const bgCache = {};
    let bgCacheCount = 0;
    function bgLayer(key, w, h, paint) {
      let c = bgCache[key];
      if (!c) {
        if (bgCacheCount > 40) { for (const k in bgCache) delete bgCache[k]; bgCacheCount = 0; }
        c = document.createElement('canvas');
        c.width = Math.max(1, Math.ceil(w));
        c.height = Math.max(1, Math.ceil(h));
        paint(c.getContext('2d'), c.width, c.height);
        bgCache[key] = c;
        bgCacheCount++;
      }
      return c;
    }

    // deterministic 0..1 noise so cached art and per-brick shading never flicker
    function hash2(x, y) {
      let h = (x * 374761393 + y * 668265263) | 0;
      h = (h ^ (h >>> 13)) * 1274126177 | 0;
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }

    function skyTheme() {
      if (currentLevel === 1) return {
        top: '#030817', mid: '#0b1d3d', low: '#1d3f63', horizon: '#3d6b8c',
        haze: '120,170,220', band: '160,190,255', cloudLit: '205,220,245', cloudBody: '60,78,110',
        castleFar: '#16233a', castleNear: '#0c121c', rim: 'rgba(170,200,240,', window: '255,214,140',
        moonTint: null
      };
      if (currentLevel === 2) return {
        top: '#05030f', mid: '#170f35', low: '#34204f', horizon: '#6a3a64',
        haze: '200,130,190', band: '210,170,255', cloudLit: '225,200,240', cloudBody: '70,52,100',
        castleFar: '#221a38', castleNear: '#100b1c', rim: 'rgba(210,180,240,', window: '255,200,130',
        moonTint: null
      };
      if (currentLevel === 4) return {
        // emerald aurora night
        top: '#01080a', mid: '#062a2a', low: '#0f4a44', horizon: '#3d8a6e',
        haze: '90,220,170', band: '140,255,210', cloudLit: '190,240,225', cloudBody: '30,70,72',
        castleFar: '#0f2a2c', castleNear: '#071416', rim: 'rgba(150,255,210,', window: '255,90,90',
        moonTint: 'rgba(90,220,170,0.12)'
      };
      if (currentLevel >= 5) return {
        // golden storm dusk
        top: '#0a0610', mid: '#2a1636', low: '#6e3426', horizon: '#d98a3a',
        haze: '255,190,90', band: '255,220,160', cloudLit: '255,215,160', cloudBody: '78,48,58',
        castleFar: '#2c1a26', castleNear: '#140b12', rim: 'rgba(255,205,120,', window: '255,230,140',
        moonTint: 'rgba(255,190,90,0.18)'
      };
      return {
        top: '#0d0204', mid: '#2c0910', low: '#5a1616', horizon: '#a1421f',
        haze: '255,120,60', band: '255,170,140', cloudLit: '255,190,150', cloudBody: '80,30,32',
        castleFar: '#2a0f14', castleNear: '#140709', rim: 'rgba(255,150,110,', window: '255,170,90',
        moonTint: 'rgba(200,60,30,0.38)'
      };
    }

    function drawNightSky() {
      const th = skyTheme();
      const sky = bgLayer('sky|' + width + 'x' + height + '|' + currentLevel, width, height, (c, w, h) => {
        const g = c.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, th.top);
        g.addColorStop(0.45, th.mid);
        g.addColorStop(0.8, th.low);
        g.addColorStop(1, th.horizon);
        c.fillStyle = g;
        c.fillRect(0, 0, w, h);

        // faint galactic band sweeping diagonally across the sky
        c.save();
        c.translate(w * 0.5, h * 0.3);
        c.rotate(-0.42);
        for (let i = 0; i < 26; i++) {
          const bx = (hash2(i, 1) - 0.5) * w * 1.6;
          const by = (hash2(i, 2) - 0.5) * 70;
          const br = 40 + hash2(i, 3) * 90;
          const rg = c.createRadialGradient(bx, by, 0, bx, by, br);
          rg.addColorStop(0, 'rgba(' + th.band + ',0.07)');
          rg.addColorStop(1, 'rgba(' + th.band + ',0)');
          c.fillStyle = rg;
          c.fillRect(bx - br, by - br, br * 2, br * 2);
        }
        for (let i = 0; i < 380; i++) {
          const sx = (hash2(i, 7) - 0.5) * w * 1.7;
          const sy = (hash2(i, 8) - 0.5) * (hash2(i, 9) < 0.7 ? 60 : 160);
          c.fillStyle = 'rgba(255,255,255,' + (0.08 + hash2(i, 10) * 0.35) + ')';
          c.fillRect(sx, sy, 1, 1);
        }
        c.restore();

        // tiny static background stars
        for (let i = 0; i < 160; i++) {
          c.fillStyle = 'rgba(255,255,255,' + (0.1 + hash2(i, 21) * 0.3) + ')';
          c.fillRect(hash2(i, 22) * w, hash2(i, 23) * h * 0.75, 1, 1);
        }

        // warm/cool haze rising off the horizon
        const hz = c.createLinearGradient(0, h * 0.55, 0, h);
        hz.addColorStop(0, 'rgba(' + th.haze + ',0)');
        hz.addColorStop(1, 'rgba(' + th.haze + ',0.28)');
        c.fillStyle = hz;
        c.fillRect(0, h * 0.55, w, h * 0.45);
      });
      ctx.drawImage(sky, 0, 0);

      // moving, twinkling stars (movement unchanged)
      const tw = Date.now() / 400;
      ctx.fillStyle = '#ffffff';
      stars.forEach((s, i) => {
        const twinkle = 0.65 + 0.35 * Math.sin(tw * (1 + (i % 5) * 0.37) + i * 1.7);
        ctx.globalAlpha = s.alpha * twinkle;
        if (s.size >= 3) {
          ctx.fillRect(s.x, s.y, 2, 2);
          ctx.globalAlpha = s.alpha * twinkle * 0.45;
          ctx.fillRect(s.x - 2, s.y + 0.5, 6, 1);
          ctx.fillRect(s.x + 0.5, s.y - 2, 1, 6);
        } else {
          ctx.fillRect(s.x, s.y, s.size, s.size);
        }
        if (state === 'PLAYING' || state === 'LEVEL_CELEBRATE') {
          s.x -= s.speed * (khaleesiMounted ? 2.2 : 1.0);
          if (s.x < 0) s.x = width;
        }
      });
      ctx.globalAlpha = 1.0;
    }

    function drawMoon() {
      const moonX = width * 0.72;
      const moonY = height * 0.22;
      const R = 54;
      const th = skyTheme();

      // soft layered halo
      const glow = ctx.createRadialGradient(moonX, moonY, R * 0.8, moonX, moonY, R * 3.4);
      const haloCol = currentLevel === 3 ? '255,150,110' : (currentLevel >= 5 ? '255,215,150' : '255,243,205');
      glow.addColorStop(0, 'rgba(' + haloCol + ',0.42)');
      glow.addColorStop(0.35, 'rgba(' + haloCol + ',0.12)');
      glow.addColorStop(1, 'rgba(' + haloCol + ',0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(moonX, moonY, R * 3.4, 0, Math.PI * 2);
      ctx.fill();

      const moon = bgLayer('moon2|' + currentLevel, R * 2 + 8, R * 2 + 8, (c, w, h) => {
        const cx = w / 2, cy = h / 2;
        c.save();
        c.beginPath();
        c.arc(cx, cy, R, 0, Math.PI * 2);
        c.clip();

        // bright cratered highlands
        c.fillStyle = '#ecebe2';
        c.fillRect(0, 0, w, h);
        for (let i = 0; i < 260; i++) {
          const a = hash2(i, 31) * Math.PI * 2, rr = Math.sqrt(hash2(i, 32)) * R;
          c.fillStyle = hash2(i, 33) < 0.5 ? 'rgba(200,198,186,0.35)' : 'rgba(255,255,250,0.35)';

          c.save();
          c.translate(x, y); c.rotate(rot || 0); c.scale(1, rv / ru);
          const g = c.createRadialGradient(0, 0, 0, 0, 0, ru * R);
          g.addColorStop(0, 'rgba(118,120,116,' + alpha + ')');
          g.addColorStop(0.7, 'rgba(126,128,122,' + (alpha * 0.85) + ')');

        mare(-0.58, -0.05, 0.30, 0.48, 0.15, 0.75);
        mare(-0.50, -0.32, 0.22, 0.20, 0, 0.7);
        mare(-0.55, 0.28, 0.24, 0.20, 0, 0.7);
        mare(-0.70, 0.05, 0.16, 0.30, 0, 0.6);

        mare(0.18, -0.66, 0.20, 0.06, 0.1, 0.6);
        // Mare Serenitatis and Mare Vaporum
        mare(0.16, -0.33, 0.17, 0.16, 0, 0.85);
        mare(-0.02, -0.16, 0.10, 0.08, 0, 0.7);
        // Mare Tranquillitatis
        mare(0.30, -0.04, 0.21, 0.16, 0.3, 0.85);
        mare(0.20, 0.08, 0.12, 0.10, 0, 0.75);
        // Mare Crisium (isolated oval near the eastern limb)
        mare(0.64, -0.27, 0.12, 0.10, 0, 0.9);
        // Mare Fecunditatis and Mare Nectaris
        mare(0.56, 0.14, 0.12, 0.19, 0.2, 0.75);
        mare(0.36, 0.30, 0.09, 0.09, 0, 0.75);
        // Mare Nubium, Mare Cognitum and Mare Humorum
        mare(-0.14, 0.34, 0.18, 0.14, 0, 0.75);
        mare(-0.30, 0.18, 0.12, 0.09, 0, 0.65);

        // Tycho: bright young crater in the south with long rays
        const tx = cx - 0.12 * R, ty = cy + 0.70 * R;
        c.strokeStyle = 'rgba(255,255,250,0.11)';
        c.lineWidth = 1;
        for (let i = 0; i < 14; i++) {
          const a = (i / 14) * Math.PI * 2 + hash2(i, 41) * 0.3;
          const len = R * (0.4 + hash2(i, 42) * 0.9);
          c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx + Math.cos(a) * len, ty + Math.sin(a) * len); c.stroke();
        }
        const tg = c.createRadialGradient(tx, ty, 0, tx, ty, 6);
        tg.addColorStop(0, 'rgba(255,255,255,1)');
        tg.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = tg; c.fillRect(tx - 6, ty - 6, 12, 12);
        c.fillStyle = 'rgba(150,148,140,0.8)'; c.beginPath(); c.arc(tx, ty, 1.6, 0, Math.PI * 2); c.fill();
        // Copernicus and Kepler: small bright ray craters in the western seas
        [[-0.30, -0.08, 4.5], [-0.62, -0.06, 3.2], [-0.36, -0.52, 2.4]].forEach(k => {
          const kx = cx + k[0] * R, ky = cy + k[1] * R;
          const kg = c.createRadialGradient(kx, ky, 0, kx, ky, k[2]);
          kg.addColorStop(0, 'rgba(255,255,250,0.95)');
          kg.addColorStop(1, 'rgba(255,255,250,0)');
          c.fillStyle = kg; c.fillRect(kx - k[2], ky - k[2], k[2] * 2, k[2] * 2);
        });
        // a few small craters in the highlands
        [[0.42, 0.55, 2.2], [0.10, 0.58, 1.8], [0.55, 0.42, 1.6], [-0.30, 0.62, 1.6], [0.70, 0.10, 1.4]].forEach(k => {
          c.fillStyle = 'rgba(170,168,158,0.6)';
          c.beginPath(); c.arc(cx + k[0] * R, cy + k[1] * R, k[2], 0, Math.PI * 2); c.fill();
          c.fillStyle = 'rgba(255,255,250,0.6)';
          c.beginPath(); c.arc(cx + k[0] * R + 0.6, cy + k[1] * R + 0.6, k[2] * 0.6, 0, Math.PI * 2); c.fill();
        });

        // gentle limb darkening (a full moon has no hard terminator)
        const limb = c.createRadialGradient(cx, cy, R * 0.55, cx, cy, R);
        limb.addColorStop(0, 'rgba(40,40,60,0)');
        limb.addColorStop(1, 'rgba(40,40,60,0.28)');
        c.fillStyle = limb;
        c.fillRect(0, 0, w, h);

        if (th.moonTint) {
          c.fillStyle = th.moonTint;

      });

    }

    // a soft cumulus: overlapping puffs, moon-lit tops, darker bellies
    function paintCloud(c, x, y, scale, th, alpha) {

        g.addColorStop(0, 'rgba(' + th.cloudLit + ',0.9)');
        g.addColorStop(0.55, 'rgba(' + th.cloudBody + ',0.85)');
        g.addColorStop(1, 'rgba(' + th.cloudBody + ',0)');
        c.fillStyle = g;
        c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2); c.fill();
      });
      // flat, darker underside
      const ub = c.createLinearGradient(0, y, 0, y + 40 * scale);
      ub.addColorStop(0, 'rgba(' + th.cloudBody + ',0)');
      ub.addColorStop(1, 'rgba(' + th.cloudBody + ',0.55)');

    function drawGiantClouds() {

      const layers = [
        { speed: 0.08, tile: 1400, alpha: 0.35, key: 'far',
          clouds: [[160, 0.10, 0.9], [620, 0.20, 0.7], [1080, 0.06, 1.1]] },

      ];
      layers.forEach(L => {

          L.clouds.forEach(cl => {

    // One castle silhouette tile. towers: [x, w, hFrac, roof], walls: [x, w, hFrac]
    function paintCastleTile(c, w, h, baseY, maxH, color, rim, detail) {
      c.fillStyle = color;
      const crenels = (x, top, ww, cw, gap) => {
        for (let bx = x; bx < x + ww - cw + 1; bx += cw + gap) c.fillRect(bx, top - cw * 0.8, cw, cw * 0.8);
      };
      const towers = detail
        ? [[20, 50, 1.0, 'cone'], [190, 110, 0.88, 'flat'], [400, 60, 0.95, 'cone'], [520, 40, 0.7, 'cone']]
        : [[60, 70, 0.85, 'cone'], [300, 50, 1.0, 'cone'], [470, 90, 0.75, 'flat']];
      const walls = detail
        ? [[70, 120, 0.65], [300, 100, 0.58], [460, 140, 0.45]]
        : [[0, 60, 0.5], [130, 170, 0.55], [350, 120, 0.6], [560, 40, 0.5]];

      walls.forEach(wl => {
        const top = baseY - maxH * wl[2];
        c.fillRect(wl[0], top, wl[1], baseY - top);
        crenels(wl[0], top, wl[1], detail ? 8 : 6, detail ? 8 : 6);
      });

      towers.forEach(t => {
        const tx = t[0], tw = t[1], top = baseY - maxH * t[2];
        c.fillStyle = color;
        c.fillRect(tx, top, tw, baseY - top);
        if (t[3] === 'cone') {
          c.beginPath();
          c.moveTo(tx - 6, top);
          c.lineTo(tx + tw / 2, top - tw * 0.95);
          c.lineTo(tx + tw + 6, top);
          c.closePath();
          c.fill();
          // pennant
          c.fillRect(tx + tw / 2 - 1, top - tw * 0.95 - 14, 2, 14);
          c.beginPath();
          c.moveTo(tx + tw / 2 + 1, top - tw * 0.95 - 14);
          c.lineTo(tx + tw / 2 + 14, top - tw * 0.95 - 10);
          c.lineTo(tx + tw / 2 + 1, top - tw * 0.95 - 6);
          c.fill();
        } else {
          c.fillRect(tx - 4, top - 6, tw + 8, 6);
          crenels(tx - 4, top - 6, tw + 8, 10, 8);
        }

        if (detail) {
          // moonlit right edge and roof edge
          c.fillStyle = rim + '0.16)';
          c.fillRect(tx + tw - 3, top, 3, baseY - top);
          if (t[3] === 'cone') {
            c.strokeStyle = rim + '0.25)';
            c.lineWidth = 2;
            c.beginPath();
            c.moveTo(tx + tw / 2, top - tw * 0.95);
            c.lineTo(tx + tw + 6, top);
            c.stroke();

          // dark arrow slits
          c.fillStyle = 'rgba(0,0,0,0.45)';
          for (let sy = top + 40; sy < baseY - 40; sy += 46) c.fillRect(tx + tw / 2 - 2, sy, 4, 14);
          // faint stone courses
          c.fillStyle = 'rgba(255,255,255,0.025)';
          for (let sy = top + 8; sy < baseY; sy += 10) c.fillRect(tx, sy, tw, 1);
          c.fillStyle = color;
        }
      });

      if (detail) {
        // great gate on the big tower
        c.fillStyle = 'rgba(0,0,0,0.55)';
        c.beginPath();
        c.arc(245, baseY - 40, 24, Math.PI, 0);
        c.rect(221, baseY - 40, 48, 40);
        c.fill();
        c.strokeStyle = 'rgba(0,0,0,0.5)';
        c.lineWidth = 1;
        for (let gx = 225; gx < 268; gx += 6) { c.beginPath(); c.moveTo(gx, baseY - 60); c.lineTo(gx, baseY); c.stroke(); }
        // moonlit wall tops
        c.fillStyle = rim + '0.12)';
        walls.forEach(wl => c.fillRect(wl[0], baseY - maxH * wl[2], wl[1], 2));
      }
    }

    // window positions (relative to the near tile) that glow and flicker
    const CASTLE_WINDOWS = [
      [45, 0.92], [105, 0.58], [155, 0.58], [215, 0.80], [275, 0.80], [245, 0.70],
      [350, 0.52], [430, 0.86], [490, 0.38], [540, 0.62]
    ];

    function drawParallaxCastleBackground() {
      const gY = height - groundHeight;
      const maxCastleH = height * 0.40;
      const th = skyTheme();
      const tileH = Math.ceil(maxCastleH * 1.6 + 40);
      const tileBase = tileH;   // ground line inside the tile

      // far hills + distant castle (slower)
      const farTile = bgLayer('castleFar|' + height + '|' + currentLevel, 640, tileH, (c, w, h) => {
        c.fillStyle = th.castleFar;
        c.beginPath();
        c.moveTo(0, h);
        for (let x = 0; x <= w; x += 16) {
          const y = h - maxCastleH * 0.32 - Math.sin(x / w * Math.PI * 2) * 18 - Math.sin(x / w * Math.PI * 6 + 1) * 8;
          c.lineTo(x, y);
        }
        c.lineTo(w, h);
        c.closePath();
        c.fill();
        paintCastleTile(c, w, h, h - maxCastleH * 0.25, maxCastleH * 0.55, th.castleFar, th.rim, false);
        // distance haze over the far layer
        const hz = c.createLinearGradient(0, h - maxCastleH, 0, h);
        hz.addColorStop(0, 'rgba(' + th.haze + ',0.10)');
        hz.addColorStop(1, 'rgba(' + th.haze + ',0.22)');
        c.fillStyle = hz;
        c.globalCompositeOperation = 'source-atop';
        c.fillRect(0, 0, w, h);
        c.globalCompositeOperation = 'source-over';
      });
      const farScroll = backgroundParallaxX * 0.45;
      const farStart = -(farScroll % 640);
      for (let offset = farStart - 640; offset < width + 640; offset += 640) {
        ctx.drawImage(farTile, Math.round(offset), gY - tileBase);
      }

      // tiny far windows
      const t = Date.now();
      ctx.fillStyle = 'rgba(' + th.window + ',0.55)';
      for (let offset = farStart - 640; offset < width + 640; offset += 640) {
        [[90, 0.62], [200, 0.6], [330, 0.78], [505, 0.55]].forEach(wd => {
          const wx = offset + wd[0];
          if (wx < -10 || wx > width + 10) return;
          ctx.fillRect(Math.round(wx), Math.round(gY - maxCastleH * 0.25 - maxCastleH * 0.55 * wd[1] + 12), 2, 3);
        });
      }

      // near castle (same 600px pattern and speed as before)
      const nearTile = bgLayer('castleNear|' + height + '|' + currentLevel, 600, tileH, (c, w, h) => {
        paintCastleTile(c, w, h, h, maxCastleH, th.castleNear, th.rim, true);
      });
      const patternWidth = 600;
      const startX = -(backgroundParallaxX % patternWidth);
      for (let offset = startX - patternWidth; offset < width + patternWidth; offset += patternWidth) {
        ctx.drawImage(nearTile, Math.round(offset), gY - tileBase);

        CASTLE_WINDOWS.forEach((wd, i) => {
          const lx = offset + wd[0];
          if (lx < -20 || lx > width + 20) return;
          const ly = gY - maxCastleH * wd[1] + 14;
          const flick = 0.75 + 0.25 * Math.sin(t / 230 + i * 2.1) * Math.sin(t / 97 + i);
          const r = 9 + flick * 3;
          const radial = ctx.createRadialGradient(lx, ly, 1, lx, ly, r);
          radial.addColorStop(0, 'rgba(' + th.window + ',' + (0.55 * flick) + ')');
          radial.addColorStop(1, 'rgba(' + th.window + ',0)');
          ctx.fillStyle = radial;
          ctx.fillRect(lx - r, ly - r, r * 2, r * 2);
          // arched window pane with a mullion
          ctx.fillStyle = 'rgba(' + th.window + ',' + (0.75 + 0.25 * flick) + ')';
          ctx.fillRect(lx - 3, ly - 3, 6, 8);
          ctx.beginPath(); ctx.arc(lx, ly - 3, 3, Math.PI, 0); ctx.fill();
          ctx.fillStyle = th.castleNear;
          ctx.fillRect(lx - 0.5, ly - 5, 1, 10);
        });
      }

      // low ground mist in front of the backdrop
      const mist = ctx.createLinearGradient(0, gY - 50, 0, gY);
      mist.addColorStop(0, 'rgba(' + th.haze + ',0)');
      mist.addColorStop(1, 'rgba(' + th.haze + ',0.18)');
      ctx.fillStyle = mist;
      ctx.fillRect(0, gY - 50, width, 50);
    }
