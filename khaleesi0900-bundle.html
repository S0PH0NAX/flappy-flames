<script>
// render-world.js — Ground, ground flames, battlements, archers & arrows
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    function drawGround() {
      const gY = height - groundHeight;
      const scrollSpeed = getLevelScrollSpeed();

      ctx.fillStyle = '#181e28';
      ctx.fillRect(0, gY, width, groundHeight);
      
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(0, gY, width, 8);
      const gScroll = (state === 'BOSS' && bossState.active) ? bossState.groundScroll : 0;
      ctx.fillStyle = '#2ecc71';
      for (let x = -(gScroll % 12); x < width; x += 12) {
        ctx.fillRect(x, gY - 2, 6, 4);
      }
      if (gScroll > 0) {
        // stones and dirt streaks rushing past in the foreground
        for (let k = 0; k < 9; k++) {
          const px = (((k * 61 - gScroll * 1.5) % (width + 60)) + (width + 60)) % (width + 60) - 30;
          ctx.fillStyle = '#232c3a';
          ctx.fillRect(px, gY + 14 + (k % 3) * 16, 16 + (k % 4) * 6, 3);
          ctx.fillStyle = '#2c3748';
          ctx.fillRect(px + 2, gY + 11 + (k % 3) * 16, 8, 3);
        }
      }

      const t = Date.now() / 150;
      groundFlames.forEach((gf) => {
        gf.x -= scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);
        gf.life--;

        const boostMult = gf.boostIntensity || 1.0;
        const flick = Math.sin(t * 2 + gf.x) * (4 * boostMult);

        drawFlame(gf.x, gY, 20 * boostMult, 30 * boostMult, gf.x * 0.07, Math.min(1, gf.life / 30));

        if (gf.boostIntensity > 1.0) gf.boostIntensity *= 0.98;
      });

      groundFlames = groundFlames.filter(gf => gf.life > 0 && gf.x > -20);
    }

    function drawBattlements() {
      const gY = height - groundHeight;

      battlements.forEach(b => {
        const bX = b.x;
        const bY = gY - b.height;
        const bW = b.width;

        if (bW <= 0 || bX + bW < -40 || bX > width + 40) return;

        const useP = (b.isCrushed || b.isCharred) ? charPalette : stonePalette;

        drawMasonry(bX, bY, bW, b.height, useP, b);

        ctx.fillStyle = useP.light;
        ctx.fillRect(bX, bY, bW, 3);

        const crenelW = 28;
        const crenelH = 20;
        const crenelGap = 16;
        const step = crenelW + crenelGap;

        for (let relX = 4; relX <= bW - crenelW - 4; relX += step) {
          const x = bX + relX;
          drawMasonry(x, bY - crenelH, crenelW, crenelH, useP, b);

          ctx.fillStyle = useP.light;
          ctx.fillRect(x, bY - crenelH, crenelW, 3);
          ctx.fillRect(x, bY - crenelH, 3, crenelH);

          ctx.fillStyle = useP.dark;
          ctx.fillRect(x + crenelW - 3, bY - crenelH, 3, crenelH);
        }
      });
    }

    // Level 5: every archer on screen follows one shared clock, like the siege tower's archers:
    // they rise, draw together, a "LOOSE!" shout goes up, and they all fire at once.
    const ARCHER_VOLLEY_CYCLE = 240;
    const ARCHER_VOLLEY = { reveal: 100, draw: 150, shout: 192, fire: 210, hide: 235 };
    let archerVolleyT = 0;

    function archerVolleyState(t) {
      if (t < ARCHER_VOLLEY.reveal || t >= ARCHER_VOLLEY.hide) return 'HIDDEN';
      if (t < ARCHER_VOLLEY.draw) return 'REVEALED';
      if (t < ARCHER_VOLLEY.fire) return 'GLOWING';
      return 'HOLDING';
    }

    function fireArcherArrow(archerX, bY) {
      const archerY = bY - 14;
      const dx = dragon.x - archerX;
      const dy = dragon.y - archerY;
      const dist = Math.hypot(dx, dy) || 1;
      const speed = 4.2;
      arrows.push({ x: archerX, y: archerY, vx: (dx / dist) * speed, vy: (dy / dist) * speed, angle: Math.atan2(dy, dx), life: 180 });
    }

    function drawArchersAndArrows() {
      const gY = height - groundHeight;
      const volley = currentLevel >= 5;
      let volleyPhase = -1;
      if (volley) {
        if (state === 'PLAYING') archerVolleyT++;
        volleyPhase = archerVolleyT % ARCHER_VOLLEY_CYCLE;
        if (state === 'PLAYING' && volleyPhase === ARCHER_VOLLEY.fire && archers.some(a => !a.destroyed && a.battlementRef && a.battlementRef.x + a.relX > 0 && a.battlementRef.x + a.relX < width)) sound.arrowLaunch();
      }
      const shouters = [];

      archers.forEach(a => {
        const b = a.battlementRef;
        if (!b || a.destroyed) return;

        const bX = b.x;
        const bY = gY - b.height;
        const archerX = bX + a.relX;

        if (archerX < -40 || (bX + b.width) < -40) {
          a.destroyed = true;
          return;
        }

        if (state === 'PLAYING' && volley) {
          a.state = archerVolleyState(volleyPhase);
          a.isExposed = a.state !== 'HIDDEN';
          if (volleyPhase === ARCHER_VOLLEY.fire && archerX > 0 && archerX < width) fireArcherArrow(archerX, bY);
          if (volleyPhase >= ARCHER_VOLLEY.shout && volleyPhase < ARCHER_VOLLEY.hide && archerX > 10 && archerX < width - 10 && !shouters.some(s => s.b === b)) shouters.push({ b: b, x: archerX, y: bY - 14 });
        } else if (state === 'PLAYING') {
          a.timer++;
          a.cycleTimer++;

          switch (a.state) {
            case 'HIDDEN':
              a.isExposed = false;
              if (a.cycleTimer >= 220) {
                a.state = 'REVEALED';
                a.timer = 0;
                a.isExposed = true;
              }
              break;
            case 'REVEALED':
              a.isExposed = true;
              if (a.timer >= 50) {
                a.state = 'GLOWING';
                a.timer = 0;
              }
              break;
            case 'GLOWING':
              a.isExposed = true;
              if (a.timer >= 60) {
                a.state = 'HOLDING';
                a.timer = 0;
              }
              break;
            case 'HOLDING':
              a.isExposed = true;
              if (a.timer >= 25 && !a.isFiring) {
                a.isFiring = true;
                sound.arrowLaunch();

                const archerY = bY - 14;
                const dx = dragon.x - archerX;
                const dy = dragon.y - archerY;
                const dist = Math.hypot(dx, dy) || 1;
                const speed = 4.2;

                arrows.push({
                  x: archerX,
                  y: archerY,
                  vx: (dx / dist) * speed,
                  vy: (dy / dist) * speed,
                  angle: Math.atan2(dy, dx),
                  life: 180
                });
              }
              if (a.timer >= 35) {
                a.state = 'HIDDEN';
                a.timer = 0;
                a.cycleTimer = 0;
                a.isExposed = false;
                a.isFiring = false;
              }
              break;
          }
        }

        if (a.isExposed && !a.archerAwarded) {
          const archerY = bY - 14;

          flames.forEach(f => {
            if (Math.hypot(f.x - archerX, f.y - archerY) < 24) {
              a.destroyed = true;
              a.archerAwarded = true;
              gameStats.villagersKilled++;
              gameStats.archersKilled++;
              sound.knightHit();
              const scoreResult = addScore(20);
              floatingTexts.push({ x: archerX - 15, y: archerY - 20, text: 'ARCHER! +' + scoreResult.totalPts, color: '#f1c40f', alpha: 1.0, vy: -1.5 });
              
              for (let p = 0; p < 12; p++) {
                particles.push({
                  x: archerX,
                  y: archerY,
                  vx: (Math.random() - 0.5) * 8,
                  vy: (Math.random() - 0.5) * 8,
                  size: 3 + Math.random() * 3,
                  life: 25,
                  color: '#e74c3c'
                });
              }
            }
          });
        }

        if (a.destroyed) return;

        ctx.save();
        ctx.translate(archerX, bY - 14);

        {
          let pose = 'hidden';
          if (a.isExposed) pose = a.state === 'REVEALED' ? 'alert' : (a.state === 'GLOWING' ? 'draw' : 'hold');
          if (pose === 'hidden') ctx.translate(0, -10);
          drawArcherDetail(pose, Date.now() / 16, false);
        }

        ctx.restore();
      });

      archers = archers.filter(a => !a.destroyed);

      // one "LOOSE!" shout per battlement during a level 5 volley
      shouters.forEach(s => drawLooseBubble(s.x, s.y));

      arrows.forEach(arr => {
        if (state === 'PLAYING') {
          arr.x += arr.vx;
          arr.y += arr.vy;
          arr.life--;

          if (arr.bounced) {
            // deflected arrow tumbles away under gravity
            arr.vy += 0.3;
            arr.angle += arr.spin;
          } else {
            const distToDragon = Math.hypot(dragon.x - arr.x, dragon.y - arr.y);
            if (distToDragon < dragon.size / 2 + 4) {
              if (dragonShielded()) {
                shieldDeflect(arr.x, arr.y);
                arr.bounced = true;
                arr.vx = Math.abs(arr.vx) * 0.5 + 2;
                arr.vy = -3.5 - Math.random() * 2.5;
                arr.spin = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 0.3);
                arr.life = Math.max(arr.life, 60);
              } else {
                if (!khaleesiMounted) triggerHit();
                arr.life = 0;
              }
            }
          }
        }

        ctx.save();
        ctx.translate(arr.x, arr.y);
        ctx.rotate(arr.angle);

        ctx.strokeStyle = '#784e24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(6, 0);
        ctx.stroke();

        ctx.fillStyle = '#bdc3c7';
        ctx.beginPath();
        ctx.moveTo(6, -3);
        ctx.lineTo(12, 0);
        ctx.lineTo(6, 3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(-10, -2, 3, 4);

        ctx.restore();
      });

      arrows = arrows.filter(arr => arr.life > 0 && arr.x > -40 && arr.x < width + 40 && arr.y > -40 && arr.y < height + 40);
    }


    // speech bubble matching the siege tower's "LOOSE!" shout
    function drawLooseBubble(ax, ay) {
      const bwid = 62, bh = 26;
      const bubX = Math.max(4, Math.min(width - bwid - 4, ax - bwid / 2 + 14)), bubY = ay - 64;
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.rect(bubX, bubY, bwid, bh); ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ax + 4, bubY + bh);
      ctx.lineTo(ax, bubY + bh + 12);
      ctx.lineTo(ax + 16, bubY + bh);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(ax + 5, bubY + bh - 2, 10, 3);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('LOOSE!', bubX + bwid / 2, bubY + 18);
      ctx.restore();
    }

          if (k.relX < 4) { k.relX = 4; k.direction = 1; }
          if (k.relX > obs.width - 20) { k.relX = obs.width - 20; k.direction = -1; }

          const kx = obs.x + k.relX;
          const ky = obs.bottomY - 14;
          const dist = Math.hypot(dragon.x - kx, dragon.y - ky);

          if (dist < dragon.size / 2 + 18) {
            k.rescued = true;
            khaleesiMounted = true;
            showKhaleesiSplash();
            khaleesiTimer = KHALEESI_MAX_TIME;
            gameStats.khaleesiRescues++;
            
            lives = maxLives;
            updateHeartsDisplay();
            const scoreResult = addScore(500);

            sound.powerup();

            floatingTexts.push({
              x: Math.max(8, dragon.x - 30),
              y: dragon.y - 60,
              text: 'DRAGON QUEEN SARAI!',
              color: '#f6b93b',
              alpha: 1.0,
              vy: -1.8
            });
            floatingTexts.push({
              x: Math.max(8, dragon.x - 30),
              y: dragon.y - 32,
              text: '+' + scoreResult.totalPts + ' (' + scoreResult.multiplier + 'x Combo!)',
              color: '#f6b93b',
              alpha: 1.0,
              vy: -1.8
            });
          }
        }

        const kx = obs.x + k.relX;
        const ky = obs.bottomY - 14;

        // a bright, pulsing white-gold halo so her red hair stands out against the stone
        const now = Date.now();
        const glowRadius = 30 + Math.sin(now / 150) * 6;
        const radial = ctx.createRadialGradient(kx, ky - 6, 2, kx, ky - 6, glowRadius);
        radial.addColorStop(0, 'rgba(255, 252, 230, 0.95)');
        radial.addColorStop(0.35, 'rgba(255, 220, 120, 0.7)');
        radial.addColorStop(0.7, 'rgba(246, 185, 59, 0.3)');
        radial.addColorStop(1, 'rgba(246, 185, 59, 0)');
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';   // additive, so it really lights up the dark stone
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(kx, ky - 6, glowRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        // twinkling sparkles circling her
        for (let s = 0; s < 4; s++) {
          const a = now / 600 + s * Math.PI / 2;
          const tw = 0.5 + 0.5 * Math.sin(now / 90 + s * 1.7);
          const sx = kx + Math.cos(a) * 20, sy = ky - 8 + Math.sin(a) * 14;
          const r = 1.5 + tw * 2.5;
          ctx.fillStyle = `rgba(255, 255, 240, ${0.4 + tw * 0.6})`;
          ctx.fillRect(sx - r, sy - 0.75, r * 2, 1.5);
          ctx.fillRect(sx - 0.75, sy - r, 1.5, r * 2);
        }

        drawKhaleesiSprite(kx, ky);
      });

      khaleesis = khaleesis.filter(k => !k.rescued && k.obsRef && k.obsRef.x + k.obsRef.width > -50);
    }

    function renderMountedKhaleesiHUD() {
      hudBubbleBottom = 0;
      const pSize = 64;
      const pX = 15;
      const pY = 15;

      const renderBubbleBelow = (textString, isMountedSubtitle = false) => {
        ctx.save();
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        
        const rawWords = textString.replace(/"/g, '').split(' ');
        const lines = [];
        let currentLine = '';
        const maxTextWidth = width * 0.76;

        for (let i = 0; i < rawWords.length; i++) {
          let testLine = currentLine ? (currentLine + ' ' + rawWords[i]) : rawWords[i];
          if (ctx.measureText(testLine).width > maxTextWidth && currentLine) {
            lines.push(currentLine);
            currentLine = rawWords[i];
          } else {
            currentLine = testLine;
          }
        }
        if (currentLine) lines.push(currentLine);

        let longestLineW = 0;
        lines.forEach(l => {
          const w = ctx.measureText(l).width;
          if (w > longestLineW) longestLineW = w;
        });

        const bPaddingX = 14;
        const bPaddingY = 10;
        const lineH = 20;
        const bW = Math.max(160, longestLineW + (bPaddingX * 2));
        const bH = (lines.length * lineH) + (bPaddingY * 2);

        const bX = Math.min(width - bW - 15, pX);
        const bY = pY + pSize + 14;
        hudBubbleBottom = bY + bH;

        ctx.fillStyle = '#ffffff';

        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(bX, bY, bW, bH, 10);
        } else {
          ctx.fillRect(bX, bY, bW, bH);
        }
        ctx.fill();

        ctx.fillStyle = isMountedSubtitle ? '#d63031' : '#000000';
        ctx.font = 'bold 15px "Proxima Nova", sans-serif';
        ctx.textAlign = 'center';

        lines.forEach((l, idx) => {
          ctx.fillText(l, bX + (bW / 2), bY + bPaddingY + 14 + (idx * lineH));
        });

        ctx.restore();
      };

      if (khaleesiMounted) {
        const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, pSize, pSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, pSize, pSize);

        renderBubbleBelow('BREAK EVERY CHAIN!', true);
      } else if (khaleesiBannerTimer > 0) {
        khaleesiBannerTimer--;
        const activeFrame = (Math.floor(Date.now() / 300) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

        ctx.fillStyle = '#11161d';
        ctx.fillRect(pX, pY, pSize, pSize);

        if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
          ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
        }

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f1c40f';
        ctx.strokeRect(pX, pY, pSize, pSize);

        renderBubbleBelow(khaleesiBannerText, false);
      }
    }

    function drawCastleWalls(obs) {
      const gY = height - groundHeight;
      
      let pBottom;
      if (obs.isCharred || obs.charProgress > 0) { pBottom = charPalette; }
      else { pBottom = stonePalette; }

      let pTop;
      if (obs.topIsCharred) { pTop = charPalette; }
      else { pTop = stonePalette; }

      const drawStoneRect = (rx, ry, rw, rh, useP) => {
        drawMasonry(rx, ry, rw, rh, useP, obs);

        ctx.fillStyle = useP.light;
        ctx.fillRect(rx, ry, rw, 3);
        ctx.fillRect(rx, ry, 3, rh);

        ctx.fillStyle = useP.dark;
        ctx.fillRect(rx + rw - 3, ry, 3, rh);
      };

      const drawLevelTorch = (tx, ty) => {
        ctx.fillStyle = '#111';
        ctx.fillRect(tx - 3, ty + 6, 6, 8);
        ctx.fillRect(tx - 1, ty + 14, 2, 6);

        let glowColor = 'rgba(46, 204, 113, 0.45)';
        let flameMain = '#2ecc71';
        let flameCore = '#abebc6';

        if (currentLevel === 1) {
          glowColor = 'rgba(52, 152, 219, 0.45)';
          flameMain = '#3498db';
          flameCore = '#a9cce3';
        } else if (currentLevel === 4) {
          glowColor = 'rgba(155, 89, 230, 0.5)';
        } else if (currentLevel >= 5) {
          glowColor = 'rgba(255, 215, 120, 0.5)';
        } else if (currentLevel >= 3) {
          glowColor = 'rgba(231, 76, 60, 0.45)';
          flameMain = '#e74c3c';
          flameCore = '#f9e79f';
        }

        const glow = ctx.createRadialGradient(tx, ty, 2, tx, ty, 26);
        glow.addColorStop(0, glowColor);
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(tx, ty, 26, 0, Math.PI * 2);
        ctx.fill();

        const torchPal = currentLevel === 1 ? FLAME_PAL_BLUE : (currentLevel === 2 ? FLAME_PAL_GREEN : (currentLevel === 4 ? FLAME_PAL_VIOLET : (currentLevel >= 5 ? FLAME_PAL_GOLD : FLAME_PAL_FIRE)));
        drawFlame(tx, ty + 6, 14, 26, tx * 0.31, 1, torchPal);
      };

      const drawArchedWindow = (wx, wy) => {
        const ww = 32;
        const wh = 54;

        ctx.fillStyle = '#e67e22';
        ctx.fillRect(wx, wy + 14, ww, wh - 14);
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy + 14, ww / 2, Math.PI, 0);
        ctx.fill();

        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(wx + 3, wy + 16, ww - 6, wh - 18);

        ctx.strokeStyle = '#141d26';
        ctx.lineWidth = 3;
        ctx.strokeRect(wx, wy + 14, ww, wh - 14);
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy + 14, ww / 2, Math.PI, 0);
        ctx.stroke();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1e2b37';
        
        ctx.beginPath();
        ctx.arc(wx + 8, wy + 26, 8, Math.PI, 0);
        ctx.arc(wx + 24, wy + 26, 8, Math.PI, 0);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(wx + ww / 2, wy + 6);
        ctx.lineTo(wx + ww / 2, wy + wh);
        ctx.moveTo(wx + 3, wy + 34);
        ctx.lineTo(wx + ww - 3, wy + 34);
        ctx.stroke();

        ctx.fillStyle = '#1e2b37';
        ctx.beginPath();
        ctx.arc(wx + ww / 2, wy + 14, 3, 0, Math.PI * 2);
        ctx.fill();
      };

      drawStoneRect(obs.x, 0, obs.width, obs.topHeight - 12, pTop);
      drawStoneRect(obs.x - 6, obs.topHeight - 12, obs.width + 12, 12, pTop);
      if (obs.topHeight > 90) {
        drawArchedWindow(obs.x + obs.width / 2 - 16, obs.topHeight / 2 - 28);
        if (obs.width > 80) {
          drawLevelTorch(obs.x + 10, obs.topHeight / 2);
          drawLevelTorch(obs.x + obs.width - 10, obs.topHeight / 2);
        }
      }

      const bHeight = gY - obs.bottomY;
      if (bHeight > 0) {
        drawStoneRect(obs.x - 6, obs.bottomY, obs.width + 12, 12, pBottom);
        drawStoneRect(obs.x, obs.bottomY + 12, obs.width, bHeight - 12, pBottom);
        
        if (obs.charProgress > 0 && !obs.isCharred) {
          ctx.save();
          const charredH = bHeight * obs.charProgress;
          
          ctx.beginPath();
          ctx.rect(obs.x - 6, obs.bottomY, obs.width + 12, bHeight);
          ctx.clip();
          
          ctx.fillStyle = 'rgba(5, 7, 10, 0.75)';
          ctx.fillRect(obs.x - 6, obs.bottomY, obs.width + 12, charredH);
          ctx.restore();
        }

        let archTopY = 9999;
        if (obs.hasLargeArch && bHeight > 60) {
          const maxArchWidth = obs.width * 0.5;
          const archWidth = Math.min(maxArchWidth, 110);
          const archRadius = archWidth / 2;
          const archX = obs.x + obs.width / 2 - archRadius;

          const maxAllowedHeight = bHeight * 0.75;
          const desiredArchHeight = 120;
          const archHeight = Math.min(desiredArchHeight, maxAllowedHeight - archRadius, bHeight - 20);

          if (archHeight > 10) {
            const archCenterY = obs.bottomY + bHeight - archHeight;
            archTopY = archCenterY - archRadius;

            drawWoodenDoor(archX, archCenterY, archWidth, archRadius, archHeight, pBottom === charPalette, obs);
          }
        }

        if (bHeight > 90) {
          const winY = obs.bottomY + 28;
          if (winY + 54 < archTopY - 10) {
            drawArchedWindow(obs.x + obs.width / 2 - 16, winY);
            if (obs.width > 80) {
              drawLevelTorch(obs.x + 10, obs.bottomY + bHeight / 2);
              drawLevelTorch(obs.x + obs.width - 10, obs.bottomY + bHeight / 2);
            }
          }
        }

        if (obs.hasRubble) {
          ctx.fillStyle = pBottom.dark;

          ctx.beginPath();
          ctx.moveTo(obs.x - 45, gY);
          ctx.lineTo(obs.x - 8, gY - 42);
          ctx.lineTo(obs.x + 32, gY);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(obs.x + obs.width - 28, gY);
          ctx.lineTo(obs.x + obs.width + 12, gY - 48);
          ctx.lineTo(obs.x + obs.width + 50, gY);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = pBottom.main;
          ctx.fillRect(obs.x - 36, gY - 20, 22, 16);
          ctx.fillRect(obs.x - 18, gY - 12, 18, 12);
          ctx.fillRect(obs.x + obs.width + 14, gY - 24, 24, 18);
          ctx.fillRect(obs.x + obs.width + 30, gY - 12, 16, 12);

          ctx.fillStyle = '#0f171e';
          ctx.fillRect(obs.x - 30, gY - 18, 10, 2);
          ctx.fillRect(obs.x + obs.width + 20, gY - 20, 12, 2);
        }

        const t = Date.now() / 180;
        
        obs.surfaceFlames.forEach(sf => {
          if (sf.width < sf.maxWidth) sf.width += 0.45;
          if (sf.height < sf.maxHeight) sf.height += 0.55;
          sf.relX += sf.spreadSpeed;

          if (sf.relX < 0) sf.relX = 0;
          if (sf.relX > obs.width) sf.relX = obs.width;

          const baseFx = obs.x + sf.relX;
          const currentFlameY = obs.bottomY + (bHeight * obs.charProgress);

          drawFlame(baseFx, currentFlameY, sf.width, sf.height, baseFx * 0.37);
        });
      }
    }

    const HEART_DRIFT_DELAY = 240;   // frames before a floating heart starts drifting up like a balloon

    function drawCollectableHearts() {
      const now = Date.now();
      const scrollSpeed = getLevelScrollSpeed();

      collectableHearts.forEach((h) => {
        if (h.collected) return;

        const worldStep = scrollSpeed * (khaleesiMounted ? 2.2 : 1.0);
        h.x -= worldStep;
        h.bobPhase += 0.05;
        // after a while the heart slips its mooring and floats up through the castle like a balloon
        h.age = (h.age || 0) + 1;
        const drifting = h.age > HEART_DRIFT_DELAY;
        if (drifting && (state === 'PLAYING' || state === 'LEVEL_CELEBRATE')) {
          const ease = Math.min(1, (h.age - HEART_DRIFT_DELAY) / 90);
          h.x += worldStep * 0.55 * ease;            // lags behind the scrolling towers
          h.baseY -= 0.5 * ease;                     // rises slowly
        }
        h.y = h.baseY + Math.sin(h.bobPhase) * (drifting ? 4 : 8);
        const swayX = drifting ? Math.sin(h.bobPhase * 0.7) * 3 : 0;

        ctx.save();
        ctx.translate(h.x + swayX, h.y);
        if (drifting) ctx.rotate(Math.sin(h.bobPhase * 0.7) * 0.12);

        const glowRadius = 24 + Math.sin(now / 150) * 4;
        const radial = ctx.createRadialGradient(0, 0, 4, 0, 0, glowRadius);
        radial.addColorStop(0, 'rgba(235, 77, 75, 0.85)');
        radial.addColorStop(0.5, 'rgba(235, 77, 75, 0.35)');
        radial.addColorStop(1, 'rgba(235, 77, 75, 0)');
        ctx.fillStyle = radial;
        ctx.beginPath();
        ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        const hSize = 1.3;
        ctx.beginPath();
        ctx.moveTo(0, -5 * hSize);
        ctx.bezierCurveTo(-6 * hSize, -15 * hSize, -16 * hSize, -6 * hSize, -14 * hSize, 2 * hSize);
        ctx.bezierCurveTo(-12 * hSize, 10 * hSize, -4 * hSize, 16 * hSize, 0, 20 * hSize);
        ctx.bezierCurveTo(4 * hSize, 16 * hSize, 12 * hSize, 10 * hSize, 14 * hSize, 2 * hSize);
        ctx.bezierCurveTo(16 * hSize, -6 * hSize, 6 * hSize, -15 * hSize, 0, -5 * hSize);
        ctx.closePath();

        ctx.fillStyle = '#ff2052';
        ctx.fill();

        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#a40021';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-7 * hSize, -5 * hSize, 3 * hSize, 4 * hSize);
        ctx.fillRect(-4 * hSize, -8 * hSize, 3 * hSize, 3 * hSize);

        ctx.restore();
      });

      collectableHearts = collectableHearts.filter(h => !h.collected && h.x > -40 && h.y > -60);
    }


    // Arched wooden castle door in a stone frame (replaces the old open archways).
    function drawWoodenDoor(x, archCenterY, w, r, archHeight, charred, owner) {
      const top = archCenterY - r, bottom = archCenterY + archHeight;
      const cxm = x + r;
      const base = charred ? '#2a1a10' : (currentLevel === 4 ? '#7a1220' : '#6b4423');
      const seed = owner && owner.brickSeed !== undefined ? owner.brickSeed : 7;
      const doorPath = () => {
        ctx.beginPath();
        ctx.arc(cxm, archCenterY, r, Math.PI, 0);
        ctx.lineTo(x + w, bottom);
        ctx.lineTo(x, bottom);
        ctx.closePath();
      };

      // stone surround: voussoirs around the arch and blocks down the jambs
      ctx.save();
      const frame = 7;
      for (let i = 0; i < 9; i++) {
        const a0 = Math.PI + (i / 9) * Math.PI, a1 = Math.PI + ((i + 1) / 9) * Math.PI;
        ctx.beginPath();
        ctx.arc(cxm, archCenterY, r + frame, a0, a1);
        ctx.arc(cxm, archCenterY, r, a1, a0, true);
        ctx.closePath();
        ctx.fillStyle = charred ? (i % 2 ? '#141a20' : '#1b232b') : (i === 4 ? '#5c7690' : (i % 2 ? '#3e5871' : '#4a6580'));
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1; ctx.stroke();
      }
      for (let y = archCenterY, j = 0; y < bottom; y += 12, j++) {
        const hh = Math.min(12, bottom - y);
        ctx.fillStyle = charred ? '#161d24' : (j % 2 ? '#3e5871' : '#4a6580');
        ctx.fillRect(x - frame, y, frame - 1, hh - 1);
        ctx.fillRect(x + w + 1, y, frame - 1, hh - 1);
      }

      // the door itself
      doorPath();
      ctx.save();
      ctx.clip();
      const wg = ctx.createLinearGradient(x, 0, x + w, 0);
      wg.addColorStop(0, shadeHex(base, -30));
      wg.addColorStop(0.5, base);
      wg.addColorStop(1, shadeHex(base, -40));
      ctx.fillStyle = wg;
      ctx.fillRect(x, top, w, bottom - top);
      // planks with seams and grain
      const plankW = Math.max(8, w / Math.max(3, Math.round(w / 11)));
      for (let px = x, i = 0; px < x + w; px += plankW, i++) {
        ctx.fillStyle = 'rgba(' + (hash2(i, seed) < 0.5 ? '255,220,170,' : '0,0,0,') + (0.04 + hash2(seed, i) * 0.07) + ')';
        ctx.fillRect(px, top, plankW, bottom - top);
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(px, top, 1.5, bottom - top);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        for (let gy = top + 6 + hash2(i, 3) * 10; gy < bottom; gy += 14 + hash2(i, gy | 0) * 10) ctx.fillRect(px + 3, gy, plankW - 6, 1);
      }
      // shadow under the arch
      const sg = ctx.createLinearGradient(0, top, 0, top + r * 0.9);
      sg.addColorStop(0, 'rgba(0,0,0,0.45)');
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(x, top, w, r);
      ctx.restore();

      // iron straps with strap hinges and rivets
      const iron = charred ? '#0c0f12' : '#2b3138';
      const strapYs = [archCenterY + 4, archCenterY + archHeight * 0.45, bottom - 12].filter(y => y < bottom - 4);
      strapYs.forEach((sy, i) => {
        ctx.fillStyle = iron;
        ctx.fillRect(x, sy, w * (i === 1 ? 1 : 0.72), 5);
        ctx.beginPath(); ctx.arc(x + w * (i === 1 ? 1 : 0.72), sy + 2.5, 3.5, -Math.PI / 2, Math.PI / 2); ctx.fill();
        ctx.fillStyle = '#7d8a96';
        for (let rx = x + 4; rx < x + w * (i === 1 ? 1 : 0.72) - 2; rx += 9) ctx.fillRect(rx, sy + 1.5, 2, 2);
      });
      // barred peephole near the top
      if (r > 18) {
        ctx.fillStyle = '#0b0b0f';
        ctx.fillRect(cxm - 6, archCenterY - r * 0.45, 12, 9);
        ctx.fillStyle = iron;
        ctx.fillRect(cxm - 2.5, archCenterY - r * 0.45, 1.5, 9); ctx.fillRect(cxm + 1, archCenterY - r * 0.45, 1.5, 9);
      }
      // ring handle
      const hy = archCenterY + archHeight * 0.62;
      ctx.strokeStyle = charred ? '#2a2f34' : '#c9a54a';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x + w * 0.78, hy, 4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = iron;
      ctx.fillRect(x + w * 0.78 - 2, hy - 6, 4, 3);

      // outline of the opening
      doorPath();
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();

      if (charred && Math.random() < 0.05) {
        particles.push({ x: x + Math.random() * w, y: archCenterY + Math.random() * archHeight, vx: 0, vy: -0.6, size: 1.5, life: 20, color: '#ff8a3a' });
      }
      ctx.restore();
    }

    // ---------------------------------------------------------------------
    // Splash when the dragon reaches Khaleesi and becomes invincible (~1.7 s)
    // ---------------------------------------------------------------------
    const KHALEESI_SPLASH_FRAMES = 60;   // one second; the game is frozen while it shows
    let khaleesiSplash = null;

    function showKhaleesiSplash() { khaleesiSplash = { t: 0, frozen: null }; }

    // snapshot of the game screen taken the frame the splash starts, shown underneath it
    function freezeFrameForSplash() {
      if (!khaleesiSplash || khaleesiSplash.frozen || logicOnlyPass) return;   // snapshot a frame that was really drawn
      const c = document.createElement('canvas');
      c.width = canvas.width; c.height = canvas.height;
      c.getContext('2d').drawImage(canvas, 0, 0);
      khaleesiSplash.frozen = c;
    }

    function drawKhaleesiSplash() {
      const s = khaleesiSplash;
      if (!s) return;
      s.t++;
      const p = s.t / KHALEESI_SPLASH_FRAMES;
      if (p >= 1) { khaleesiSplash = null; return; }
      const fade = p < 0.1 ? p / 0.1 : (p > 0.8 ? 1 - (p - 0.8) / 0.2 : 1);
      const cx = width / 2, cy = height * 0.42;
      const rainbow = ['#ff5e5e', '#ffb84d', '#fff35e', '#5eff8a', '#5ed6ff', '#b45eff'];
      ctx.save();
      ctx.globalAlpha = fade;

      // dark backdrop with spinning rainbow rays
      ctx.fillStyle = 'rgba(8, 6, 20, 0.72)';
      ctx.fillRect(0, 0, width, height);
      for (let i = 0; i < 18; i++) {
        const a = i * Math.PI / 9 + s.t * 0.025;
        ctx.fillStyle = rainbow[i % rainbow.length];
        ctx.globalAlpha = fade * 0.22;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a - 0.08) * height, cy + Math.sin(a - 0.08) * height);
        ctx.lineTo(cx + Math.cos(a + 0.08) * height, cy + Math.sin(a + 0.08) * height);
        ctx.closePath();
        ctx.fill();
      }

    function drawKnights() {

      const gY = height - groundHeight;

      knights.forEach((k) => {
        const obs = k.obsRef;
        // a royal you missed scrolls off the left edge: silence their entrance sound
        if (k.isRoyal && k.state === 'ALIVE' && !k.soundStopped && (!obs || obs.x + k.relX < -24)) {
          k.soundStopped = true;
          sound.stopRoyalSounds();
        }
        if (!obs || obs.x + obs.baseWidth < -50) return;

        if (k.state === 'FALLING') {
          k.fallVelocityY += 0.48;
          k.fallYOffset += k.fallVelocityY;
          k.relX += k.knockbackVelocity;
          k.rotation += 0.12 * Math.sign(k.knockbackVelocity || 1);

          const currentY = obs.bottomY - 26 + k.fallYOffset;
          if (currentY >= gY - 26) {
            if (!k.pointAwarded) {
              k.pointAwarded = true;
              gameStats.villagersKilled++;
              const scoreResult = addScore(2);

            if (k.relX > obs.width - 26) { k.relX = obs.width - 26; k.direction = -1; }

        const ky = obs.bottomY - 26 + k.fallYOffset;

        if (k.state === 'ALIVE' && k.isRoyal && state === 'PLAYING') {
          const dist = Math.hypot(dragon.x - kx, dragon.y - ky);
          if (dist < dragon.size / 2 + 18) {
            k.state = 'BEHEADED';
            triggerBeheadingCutscene(k.royalType);
            return;
          }
        }

        // invincible (Khaleesi riding): villagers touched by the dragon go flying
        if (k.state === 'ALIVE' && !k.isRoyal && khaleesiMounted && state === 'PLAYING' &&
            Math.hypot(dragon.x - (kx + 11), dragon.y - (ky + 10)) < dragon.size / 2 + 14) {
          k.state = 'FALLING';
          k.fallVelocityY = -4;
          k.knockbackVelocity = (kx + 11 >= dragon.x ? 1 : -1) * 7;
          sound.bonk();
        }

        const hasFireOnKnight = k.state === 'ALIVE' && (obs.isCharred || obs.charProgress > 0 || obs.surfaceFlames.some(sf => Math.abs((obs.x + sf.relX) - kx) < 24));

        if (hasFireOnKnight) {
          k.state = 'BURNING';
          if (k.isRoyal) {
            sound.stopRoyalSounds();
            resetScoreToZero();
          } else if (!k.pointAwarded) {
            k.pointAwarded = true;
            gameStats.villagersKilled++;
            const scoreResult = addScore(2);
            sound.knightHit();
            floatingTexts.push({ x: kx + 4, y: ky - 8, text: '+' + scoreResult.totalPts + (khaleesiMounted ? ' (' + scoreResult.multiplier + 'x)' : ''), alpha: 1.0, vy: -1.2 });

        }

          ctx.save();
          ctx.translate(kx + 10, ky + 14);
          ctx.rotate(k.rotation);
          ctx.translate(-11, -10);
          if (k.isRoyal) drawRoyalSprite(k, 0);

          ctx.globalAlpha = 0.85;
          if (k.isRoyal) drawRoyalSprite(k, 0);
          else drawVillagerSprite(k, 0, 0);
          ctx.restore();
          return;
        }

        if (k.state === 'ALIVE') {
          const isStunned = k.stunTimer > 0;
          const isRoyal = k.isRoyal;

          if (isRoyal) {
            const bob = isStunned ? 0 : Math.abs(Math.sin(time * 2 + kx * 0.1)) * -1;
            withFacing(kx, ky, k.direction, () => drawRoyalSprite(k, bob));
          } else {
            const legMove = isStunned ? 0 : Math.sin(time * 2 + kx) * 1.5;
            const armSwing = isStunned ? 0 : Math.sin(time * 2 + kx + 1.2) * 1.5;
            withFacing(kx, ky, k.direction, () => drawVillagerSprite(k, legMove, armSwing));
          }
        } else if (k.state === 'BURNING') {
          k.burnTimer++;
          ctx.fillStyle = 'rgba(18,22,28,' + Math.max(0, 0.9 - k.burnTimer / 45) + ')';
          ctx.fillRect(kx, ky - 2, 22, 28);
          const grow = Math.min(1, 0.4 + k.burnTimer / 20);

<script>
// render-masonry.js — Stone/brick textures for castle obstacles and battlements
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).
//
// Each obstacle gets a random masonry style the first time it is drawn. Textures are painted once
// into offscreen canvases (cached by size/style/palette/seed) so scrolling stays cheap.
//   0 running-bond brick   1 rough fieldstone   2 big ashlar blocks with quoins + string courses
//   3 Flemish bond (stretchers + dark headers make a diamond pattern)

const MASONRY_STYLES = 4;
const masonryCache = new Map();

function masonryStyleOf(o) {
  if (o.brickStyle === undefined) {
    o.brickStyle = Math.floor(Math.random() * MASONRY_STYLES);
    o.brickSeed = Math.floor(Math.random() * 1000);
  }
  return o.brickStyle;
}

function masonryRoundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

// one stone with a lit top edge and a shadowed bottom/right edge
function masonryBrick(c, x, y, w, h, col) {
  c.fillStyle = col;
  c.fillRect(x, y, w, h);
  c.fillStyle = 'rgba(255,255,255,0.11)';
  c.fillRect(x, y, w, 1.5);
  c.fillRect(x, y, 1, h);
  c.fillStyle = 'rgba(0,0,0,0.24)';
  c.fillRect(x, y + h - 1.5, w, 1.5);
  c.fillRect(x + w - 1, y, 1, h);
}

function paintMasonry(c, w, h, pal, style, seed, charred) {
  const tone = (i, j, spread) => shadeHex(pal.main, Math.round((hash2(i + seed * 31, j + seed * 17) - 0.5) * (spread || 26)));
  c.fillStyle = pal.dark;   // mortar
  c.fillRect(0, 0, w, h);

  if (h <= 14) {
    // cornice / ledge: lit top band, dentil blocks underneath
    c.fillStyle = pal.main;
    c.fillRect(0, 0, w, h);
    c.fillStyle = pal.light;
    c.fillRect(0, 0, w, 3);
    c.fillStyle = 'rgba(255,255,255,0.08)';
    c.fillRect(0, 3, w, 2);
    c.fillStyle = pal.dark;
    for (let x = 3; x < w; x += 9) c.fillRect(x, h - 5, 4, 5);
    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.fillRect(0, h - 1, w, 1);
    return;
  }

  if (style === 0) {
    const bh = 14, bw = 26;
    for (let r = 0, y = 0; y < h; r++, y += bh) {
      const off = (r % 2) * (bw / 2);
      for (let q = -1, x = -off; x < w; q++, x += bw) masonryBrick(c, x + 1, y + 1, bw - 2, bh - 2, tone(q, r));
    }
  } else if (style === 1) {
    // irregular fieldstone laid in uneven courses
    let y = 0, r = 0;
    while (y < h) {
      const rowH = 11 + Math.floor(hash2(r, seed) * 9);
      let x = -Math.floor(hash2(seed, r) * 14), q = 0;
      while (x < w) {
        const sw = 12 + Math.floor(hash2(q + r * 13, seed + 5) * 20);
        const inset = 1 + hash2(q, r + 99) * 1.5;
        c.fillStyle = tone(q, r, 34);
        masonryRoundRect(c, x + inset, y + inset, sw - inset * 2, rowH - inset * 2, 4);
        c.fill();
        c.fillStyle = 'rgba(255,255,255,0.12)';
        masonryRoundRect(c, x + inset + 1, y + inset, sw - inset * 2 - 3, 3, 2);
        c.fill();
        c.fillStyle = 'rgba(0,0,0,0.22)';
        masonryRoundRect(c, x + inset + 2, y + rowH - inset - 3, sw - inset * 2 - 3, 2, 1);
        c.fill();
        x += sw; q++;
      }
      y += rowH; r++;
    }
  } else if (style === 2) {
    // large ashlar blocks, quoin stones on the corners, string course every few rows
    const bh = 22, bw = 42;
    for (let r = 0, y = 0; y < h; r++, y += bh) {
      if (r % 6 === 5) {
        c.fillStyle = pal.light;
        c.fillRect(0, y + 1, w, 6);
        c.fillStyle = 'rgba(0,0,0,0.3)';
        c.fillRect(0, y + 7, w, 2);
        masonryBrick(c, 0, y + 9, w, bh - 10, tone(0, r, 10));
        continue;
      }
      const off = (r % 2) * (bw / 2);
      for (let q = -1, x = -off; x < w; q++, x += bw) masonryBrick(c, x + 1, y + 1, bw - 2, bh - 2, tone(q, r, 18));
      // quoins: alternating long/short pale corner stones
      const qw = r % 2 ? 16 : 26;
      const qc = shadeHex(pal.main, 22);
      masonryBrick(c, 0, y + 1, qw, bh - 2, qc);
      masonryBrick(c, w - qw, y + 1, qw, bh - 2, qc);
    }
  } else {
    // Flemish bond: stretcher + header alternate; offset rows line headers up into diamonds
    const bh = 12, sw = 24, hw = 12;
    for (let r = 0, y = 0; y < h; r++, y += bh) {
      let x = (r % 2) ? -18 : 0, q = 0;
      while (x < w) {
        const header = q % 2 === 1;
        const bw2 = header ? hw : sw;
        const col = header ? shadeHex(pal.main, -22 + Math.round((hash2(q, r + seed) - 0.5) * 10)) : tone(q, r, 20);
        masonryBrick(c, x + 1, y + 1, bw2 - 2, bh - 2, col);
        x += bw2; q++;
      }
    }
  }

  // weathering: cracks, chipped stones, moss (or soot + embers when charred)
  const area = w * h;
  const cracks = Math.max(1, Math.floor(area / 9000));
  c.strokeStyle = 'rgba(0,0,0,0.45)';
  c.lineWidth = 1;
  for (let i = 0; i < cracks; i++) {
    let cx = hash2(i, seed + 1) * w, cy = hash2(seed + 2, i) * h;
    c.beginPath();
    c.moveTo(cx, cy);
    for (let s = 0; s < 4; s++) {
      cx += (hash2(i * 7 + s, seed) - 0.5) * 10;
      cy += 4 + hash2(s, i + seed) * 6;
      c.lineTo(cx, cy);
    }
    c.stroke();
  }
  const chips = Math.floor(area / 2500);
  for (let i = 0; i < chips; i++) {
    c.fillStyle = 'rgba(0,0,0,0.3)';
    c.fillRect(Math.floor(hash2(i + 50, seed) * w), Math.floor(hash2(seed, i + 50) * h), 2 + Math.floor(hash2(i, 3) * 3), 2);
  }

  if (!charred) {
    const moss = Math.floor(area / 6000);
    for (let i = 0; i < moss; i++) {
      const mx = hash2(i + 200, seed) * w;
      const my = h * (0.5 + hash2(seed, i + 200) * 0.5);
      const mr = 4 + hash2(i, seed + 9) * 8;
      const g = c.createRadialGradient(mx, my, 0, mx, my, mr);
      g.addColorStop(0, 'rgba(70,120,60,0.45)');
      g.addColorStop(1, 'rgba(70,120,60,0)');
      c.fillStyle = g;
      c.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
    }
    // moss along the base
    const base = c.createLinearGradient(0, h - 18, 0, h);
    base.addColorStop(0, 'rgba(60,100,50,0)');
    base.addColorStop(1, 'rgba(60,100,50,0.22)');
    c.fillStyle = base;
    c.fillRect(0, h - 18, w, 18);
  } else {
    const streaks = Math.floor(w / 14);
    for (let i = 0; i < streaks; i++) {
      const sx = hash2(i, seed + 40) * w;
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(0,0,0,0.35)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.fillRect(sx, 0, 3 + hash2(seed, i) * 5, h * (0.3 + hash2(i, i) * 0.6));
    }
    const embers = Math.floor(area / 3000);
    for (let i = 0; i < embers; i++) {
      c.fillStyle = hash2(i, 77) < 0.5 ? 'rgba(255,120,40,0.55)' : 'rgba(255,190,80,0.45)';
      c.fillRect(Math.floor(hash2(i + 9, seed) * w), Math.floor(hash2(seed, i + 9) * h), 1.5, 1.5);
    }
  }

  // ambient occlusion toward the bottom
  const ao = c.createLinearGradient(0, 0, 0, h);
  ao.addColorStop(0, 'rgba(0,0,0,0)');
  ao.addColorStop(1, 'rgba(0,0,0,0.18)');
  c.fillStyle = ao;
  c.fillRect(0, 0, w, h);
}

// Draw a textured masonry rectangle at (rx, ry). `owner` (obstacle/battlement) supplies style + seed.
function drawMasonry(rx, ry, rw, rh, pal, owner) {
  const w = Math.round(rw), h = Math.round(rh);
  if (w <= 0 || h <= 0) return;
  const style = masonryStyleOf(owner);
  const charred = pal === charPalette;
  const key = w + '|' + h + '|' + style + '|' + (charred ? 'c' : 's') + '|' + owner.brickSeed;
  let tex = masonryCache.get(key);
  if (!tex) {
    tex = document.createElement('canvas');
    tex.width = w;
    tex.height = h;
    paintMasonry(tex.getContext('2d'), w, h, pal, style, owner.brickSeed, charred);
    masonryCache.set(key, tex);
    if (masonryCache.size > 70) masonryCache.delete(masonryCache.keys().next().value);
  }
  ctx.drawImage(tex, Math.round(rx), Math.round(ry));
}

<script>
// effects.js — Flame renderer, breath blobs, archer detail, particles/debris/floating text
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    let flameDrawCount = 0;
    const FLAME_PAL_FIRE  = { outer: [231, 76, 60],  mid: [243, 156, 18],  inner: [241, 196, 15],  core: [255, 248, 214] };
    const FLAME_PAL_VIOLET = { outer: [142, 68, 173], mid: [187, 107, 230], inner: [222, 180, 255], core: [250, 240, 255] };
    const FLAME_PAL_GOLD   = { outer: [214, 137, 16], mid: [245, 196, 48],  inner: [255, 230, 140], core: [255, 252, 235] };
    const FLAME_PAL_BLUE  = { outer: [41, 128, 185], mid: [93, 173, 226],  inner: [169, 204, 227], core: [235, 245, 255] };
    const FLAME_PAL_GREEN = { outer: [30, 168, 90],  mid: [88, 214, 141],  inner: [171, 235, 198], core: [240, 255, 245] };

    function hexToRgb(hex) {
      if (typeof hex !== 'string' || hex[0] !== '#') return [255, 136, 0];
      let h = hex.slice(1);
      if (h.length === 3) h = h.split('').map(c => c + c).join('');
      const n = parseInt(h, 16);
      if (isNaN(n)) return [255, 136, 0];
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function rgbaStr(c, a) {
      return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
    }

    // x,y = centre of the flame's base; w = base width; h = height; seed = per-flame phase offset
    function drawFlame(x, y, w, h, seed, alpha, pal) {
      if (w < 1 || h < 1) return;
      const a = (alpha === undefined) ? 1 : alpha;
      if (a <= 0.01) return;
      const P = pal || FLAME_PAL_FIRE;
      const cheap = ++flameDrawCount > 40;      // keep the frame rate up when lots of fire is on screen
      const t = Date.now() / 1000;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      if (!cheap) {
        const gy = y - h * 0.35;
        const gr = Math.max(w, h * 0.7) * 1.15;
        const glow = ctx.createRadialGradient(x, gy, 1, x, gy, gr);
        glow.addColorStop(0, rgbaStr(P.outer, 0.30 * a));
        glow.addColorStop(1, rgbaStr(P.outer, 0));
        ctx.fillStyle = glow;
        ctx.fillRect(x - gr, gy - gr, gr * 2, gr * 2);
      }

      const tongues = cheap
        ? [{ dx: 0, wk: 1.0, hk: 1.0, ph: 0 }]
        : [{ dx: -0.28, wk: 0.62, hk: 0.68, ph: 1.9 }, { dx: 0.30, wk: 0.58, hk: 0.74, ph: 3.7 }, { dx: 0, wk: 1.0, hk: 1.0, ph: 0 }];
      const layers = [
        { c: P.outer, s: 1.00, a: 0.55, grad: true },
        { c: P.mid,   s: 0.72, a: 0.60, grad: true },
        { c: P.inner, s: 0.46, a: 0.70, grad: false },
        { c: P.core,  s: 0.24, a: 0.80, grad: false }
      ];

      for (let li = 0; li < layers.length; li++) {
        const L = layers[li];
        for (let ti = 0; ti < tongues.length; ti++) {
          const T = tongues[ti];
          const flick = 1 + Math.sin(t * 11 + seed * 2 + T.ph) * 0.10 + Math.sin(t * 5.3 + seed + T.ph) * 0.08;
          const sway = (Math.sin(t * 8 + seed + T.ph) * 0.5 + Math.sin(t * 13.7 + seed * 1.7 + T.ph) * 0.3) * w * 0.35;
          const px = x + T.dx * w;
          const bw = w * 0.5 * T.wk * L.s;
          const th = h * T.hk * L.s * flick;
          const tipX = px + sway * (0.5 + 0.5 * L.s);
          const tipY = y - th;

          ctx.beginPath();
          ctx.moveTo(px - bw, y);
          ctx.bezierCurveTo(px - bw * 1.1, y - th * 0.35, px - bw * 0.35 + sway * 0.4, y - th * 0.72, tipX, tipY);
          ctx.bezierCurveTo(px + bw * 0.35 + sway * 0.2, y - th * 0.66, px + bw * 1.1, y - th * 0.30, px + bw, y);
          ctx.quadraticCurveTo(px, y + bw * 0.35, px - bw, y);
          ctx.closePath();

          const aa = L.a * a;
          if (L.grad && !cheap) {
            const g = ctx.createLinearGradient(0, y, 0, tipY);
            g.addColorStop(0, rgbaStr(L.c, aa));
            g.addColorStop(0.55, rgbaStr(L.c, aa * 0.7));
            g.addColorStop(1, rgbaStr(L.c, 0));
            ctx.fillStyle = g;
          } else {
            ctx.fillStyle = rgbaStr(L.c, aa * 0.8);
          }
          ctx.fill();
        }
      }
      ctx.restore();

      // rising embers
      if (Math.random() < 0.06 * a && particles.length < 500) {
        particles.push({
          x: x + (Math.random() - 0.5) * w * 0.6,
          y: y - h * 0.5 * Math.random(),
          vx: (Math.random() - 0.5) * 0.9,
          vy: -0.8 - Math.random() * 1.4,
          size: 1.5 + Math.random() * 1.5,
          life: 22 + Math.random() * 18,
          color: Math.random() < 0.5 ? '#ffb347' : '#ffd966'
        });
      }
    }

    // The dragon's breath: a soft, additive, motion-stretched fireball instead of a hard square.
    function drawBreathBlob(f, lifeRatio, size) {
      const c = hexToRgb(f.color);
      const flick = 1 + Math.sin(Date.now() / 45 + f.x * 0.13 + f.y) * 0.1;
      const r = Math.max(3, size * 0.95 * flick);
      const a = Math.min(1, 0.15 + lifeRatio * 0.95);
      const hot = lifeRatio > 0.55;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(f.x + size / 2, f.y + size / 2);
      ctx.rotate(Math.atan2(f.vy, f.vx));
      ctx.translate(-r * 0.7, 0);
      ctx.scale(2.0, 1);
      const g = ctx.createRadialGradient(r * 0.15, 0, 0, 0, 0, r);
      g.addColorStop(0, hot ? rgbaStr([255, 255, 236], a) : rgbaStr(c, a));
      g.addColorStop(0.3, rgbaStr(c, a * 0.85));
      g.addColorStop(0.65, rgbaStr(c, a * 0.35));
      g.addColorStop(1, rgbaStr(c, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ==========================================
    // DETAILED ARCHER (used by wall archers AND the siege-tower archers)
    // Origin = centre of the body; the old sprite's footprint (10 wide, ~20 tall, bow on the left).
    // poses: hidden, alert, draw (glowing), hold (aiming), ready, walk, climb
    // ==========================================
    function drawArcherDetail(pose, anim, legs) {
      if (pose === 'hidden') {
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(-5, 0, 10, 5);
        ctx.fillRect(-3, -3, 6, 3);
        ctx.fillStyle = '#58d68d';
        ctx.fillRect(-3, -3, 4, 1);
        ctx.fillStyle = '#1e8449';
        ctx.fillRect(-5, 4, 10, 1);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(1, -6, 1, 3);
        ctx.fillStyle = '#ecf0f1';
        ctx.fillRect(2, -5, 1, 2);
        return;
      }

      const glowing = pose === 'draw';
      const drawn = pose === 'draw' || pose === 'hold';
      const walking = pose === 'walk';
      const climbing = pose === 'climb';
      const alert = pose === 'alert';
      const step = Math.sin((anim || 0) * 0.4);

      if (glowing) {
        const glowFactor = Math.sin(Date.now() / 30) * 0.5 + 0.5;
        const radialGlow = ctx.createRadialGradient(0, -6, 2, 0, -6, 26);
        radialGlow.addColorStop(0, 'rgba(241, 196, 15, ' + (0.4 + glowFactor * 0.4) + ')');
        radialGlow.addColorStop(1, 'rgba(241, 196, 15, 0)');
        ctx.fillStyle = radialGlow;
        ctx.beginPath();
        ctx.arc(0, -6, 26, 0, Math.PI * 2);
        ctx.fill();
      }

      // quiver on the back, fletchings poking out
      ctx.fillStyle = '#5b3a1e';
      ctx.fillRect(3, -5, 3, 11);
      ctx.fillStyle = '#3e2713';
      ctx.fillRect(3, 4, 3, 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(3, -7, 1, 2);
      ctx.fillRect(5, -7, 1, 2);
      ctx.fillStyle = '#ecf0f1';
      ctx.fillRect(4, -8, 1, 3);

      // legs (boss archers walk and climb; wall archers are cut off by the parapet)
      if (legs) {
        const l1 = walking ? step * 2 : (climbing ? (step > 0 ? -2 : 0) : 0);
        const l2 = walking ? -step * 2 : (climbing ? (step > 0 ? 0 : -2) : 0);
        ctx.fillStyle = '#3d4a5c';
        ctx.fillRect(-4 + (walking ? l1 : 0), 8 + (climbing ? l1 : 0), 3, 3);
        ctx.fillRect(1 + (walking ? l2 : 0), 8 + (climbing ? l2 : 0), 3, 3);
        ctx.fillStyle = '#2c1c10';
        ctx.fillRect(-4 + (walking ? l1 : 0), 10 + (climbing ? l1 : 0), 3, 1);
        ctx.fillRect(1 + (walking ? l2 : 0), 10 + (climbing ? l2 : 0), 3, 1);
      }

      // tunic with shading, belt, buckle and quiver strap
      const tunic = glowing ? '#f1c40f' : '#2980b9';
      ctx.fillStyle = tunic;
      ctx.fillRect(-5, -2, 10, 10);
      ctx.fillStyle = glowing ? '#d4ac0d' : '#1f6391';
      ctx.fillRect(3, -2, 2, 10);
      ctx.fillStyle = glowing ? '#f7dc6f' : '#3498db';
      ctx.fillRect(-5, -2, 10, 1);
      ctx.fillRect(-5, -2, 1, 8);
      ctx.fillStyle = '#5b3a1e';
      ctx.fillRect(-5, 5, 10, 2);
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(-1, 5, 2, 2);
      ctx.fillStyle = '#5b3a1e';
      ctx.fillRect(-4, -2, 1, 1); ctx.fillRect(-3, -1, 1, 1); ctx.fillRect(-2, 0, 1, 1);
      ctx.fillRect(-1, 1, 1, 1);  ctx.fillRect(0, 2, 1, 1);  ctx.fillRect(1, 3, 1, 1);

      // scarf
      const tail = (walking || climbing) ? Math.round(step) : 0;
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(-5, -3, 10, 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(-5, -3, 10, 1);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(4 + tail, -1, 2, 4);

      // arms
      if (climbing) {
        ctx.fillStyle = tunic;
        ctx.fillRect(-7, -4 + (step > 0 ? 0 : 3), 2, 3);
        ctx.fillRect(5, -4 + (step > 0 ? 3 : 0), 2, 3);
        ctx.fillStyle = '#f8c291';
        ctx.fillRect(-7, -5 + (step > 0 ? 0 : 3), 2, 1);
        ctx.fillRect(5, -5 + (step > 0 ? 3 : 0), 2, 1);
      } else if (!walking) {
        ctx.fillStyle = tunic;
        ctx.fillRect(-8, -2, 3, 2);
        ctx.fillStyle = '#95a5a6';
        ctx.fillRect(-6, -2, 1, 2);
        ctx.fillStyle = '#f8c291';
        ctx.fillRect(-10, -2, 2, 2);
        if (drawn) {
          ctx.fillStyle = '#f8c291';
          ctx.fillRect(-3, -4, 2, 2);
        }
      }

      // head: face, eye, nose, brow, jaw shadow
      ctx.fillStyle = '#f8c291';
      ctx.fillRect(-4, -7, 8, 5);
      ctx.fillStyle = '#e0a878';
      ctx.fillRect(-4, -3, 8, 1);
      ctx.fillRect(-5, -5, 1, 2);
      ctx.fillStyle = '#3e2713';
      ctx.fillRect(-4, -6, 3, 1);
      ctx.fillStyle = '#1b1b1b';
      ctx.fillRect(-3, -5, 1, 1);

      // hood with brim, highlight and feather
      ctx.fillStyle = glowing ? '#f39c12' : '#27ae60';
      ctx.fillRect(-5, -12, 10, 5);
      ctx.fillStyle = glowing ? '#f8c471' : '#58d68d';
      ctx.fillRect(-4, -12, 6, 1);
      ctx.fillStyle = glowing ? '#ca6f1e' : '#1e8449';
      ctx.fillRect(-6, -8, 12, 1);
      ctx.fillRect(3, -11, 2, 4);
      ctx.fillStyle = '#e74c3c';
      ctx.fillRect(2, -15, 1, 4);
      ctx.fillStyle = '#ecf0f1';
      ctx.fillRect(3, -14, 1, 3);

      // bow
      if (walking || climbing) {
        ctx.strokeStyle = '#784e24';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(5, -2, 8, Math.PI * 0.6, Math.PI * 1.4);
        ctx.stroke();
      } else {
        const R = glowing ? 9 : 8;
        ctx.strokeStyle = glowing ? '#3498db' : (alert ? '#c0392b' : '#784e24');
        ctx.lineWidth = glowing ? 3 : 2;
        ctx.beginPath();
        ctx.arc(-6, -2, R, -Math.PI * 0.4, Math.PI * 0.4);
        ctx.stroke();
        ctx.fillStyle = '#d4a76a';
        ctx.fillRect(-4, -10, 2, 1);
        ctx.fillRect(-4, 5, 2, 1);
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(-6 - R - 1, -3, 2, 3);

        ctx.strokeStyle = '#ecf0f1';
        ctx.lineWidth = 1;
        ctx.beginPath();
        if (drawn) {
          ctx.moveTo(-3.5, -9.6);
          ctx.lineTo(-1, -2);
          ctx.lineTo(-3.5, 5.6);
        } else {
          ctx.moveTo(-6, -9);
          ctx.lineTo(-6, 5);
        }
        ctx.stroke();

        if (drawn) {
          ctx.fillStyle = '#d5b07a';
          ctx.fillRect(-16, -3, 15, 1);
          ctx.fillStyle = '#bdc3c7';
          ctx.fillRect(-19, -3, 3, 1);
          ctx.fillRect(-18, -4, 1, 3);
          ctx.fillStyle = '#e74c3c';
          ctx.fillRect(-3, -4, 2, 1);
          ctx.fillRect(-3, -2, 2, 1);
        }
      }
    }

    function drawParticles() {
  const gY = height - groundHeight;
  
  for (let i = blackDebris.length - 1; i >= 0; i--) {
    const d = blackDebris[i];
    d.x += d.vx;
    d.y += d.vy;
    d.vy += d.gravity;
    d.rotation += d.rotSpeed;

    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rotation);
    
    ctx.fillStyle = '#11161d';
    const halfSize = d.size / 2;
    ctx.beginPath();
    ctx.moveTo(0, -halfSize);
    ctx.lineTo(halfSize, -halfSize * 0.6);
    ctx.lineTo(halfSize * 0.8, halfSize);
    ctx.lineTo(-halfSize * 0.8, halfSize);
    ctx.lineTo(-halfSize, -halfSize * 0.6);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    if (d.y >= gY) {
      for (let s = 0; s < 5; s++) {
         particles.push({
            x: d.x,
            y: gY,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.7) * 4,
            size: 2 + Math.random() * 2,
            life: 15 + Math.random() * 10,
            color: '#e74c3c'
          });
      }
      blackDebris.splice(i, 1);
    }
  }

  for (let i = flames.length - 1; i >= 0; i--) {
    const f = flames[i];

    // Physics update runs in both PLAYING and BOSS states
    f.vx *= f.dragX;
    f.vy += f.gravity;
    f.x += f.vx;
    f.y += f.vy;
    f.life--;

    const lifeRatio = f.life / f.maxLife;
    const curSize = f.size * lifeRatio;

    if (Math.random() < 0.25) {
      particles.push({
        x: f.x + (Math.random() - 0.5) * 6,
        y: f.y + (Math.random() - 0.5) * 6,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        size: 2 + Math.random() * 2,
        life: 15,
        color: f.color
      });
    }

    drawBreathBlob(f, lifeRatio, curSize);

    if (f.y >= gY - 4) {
      if (Math.random() < 0.35) {
        groundFlames.push({
          x: f.x,
          life: 80 + Math.random() * 60,
          boostIntensity: 1.0
        });
      }
      flames.splice(i, 1);
      continue;
    }

    obstacles.forEach(obs => {
      if (f.x >= obs.x - 10 && f.x <= obs.x + obs.width + 10 && f.y >= obs.bottomY - 14 && f.y <= obs.bottomY + 20) {
        if (Math.random() < 0.45) {
          obs.surfaceFlames.push({
            relX: f.x - obs.x,
            width: 12,
            maxWidth: 32 + Math.random() * 22,
            height: 14,
            maxHeight: 38 + Math.random() * 24,
            spreadSpeed: (Math.random() - 0.5) * 1.4
          });
        }
      }
    });

    if (f.life <= 0) flames.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    
    ctx.fillStyle = p.color;
    
    if (p.isSmoke) {
      ctx.globalAlpha = p.life / 60.0;
      ctx.beginPath();
      const halfSize = p.size / 2;
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.arc(p.x - halfSize, p.y + halfSize * 0.7, p.size * 0.8, 0, Math.PI * 2);
      ctx.arc(p.x + halfSize, p.y - halfSize * 0.3, p.size * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    } else {
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }

    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.font = 'bold 24px "Proxima Nova", sans-serif';
    ctx.fillStyle = ft.color || '#2ecc71';
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();

    ft.y += ft.vy;
    ft.alpha -= 0.015;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
}

<script>
// screens.js — Level dialogue, beheading cutscene, game-over screens
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    const LEVEL_DIALOGUE_PY = 150;   // portrait top; keeps the title below the score and hearts (input.js uses it for the button)

    // Sarai's words on the level-start / level-1-clear dialogue (input.js sizes the button tap area from these)
    const LEVEL_SPEECH = {
      INTRO: { px: 15, lineH: 22, lines: [
        'My brave Cyndraxx, burn their',
        'towers, slay the slavers, and bring',
        'me to victory. I love you!'] },
      LEVEL1_CLEAR: { px: 14, lineH: 21, lines: [
        'My beloved Cyndraxx, you will now',
        'encounter the nobles. DO NOT BURN',
        'THE NOBLES! Bring me their heads to',
        'mount on the city walls!'] }
    };
    function levelSpeechHeight(type) {
      const sp = LEVEL_SPEECH[type];
      return speechBoxHeight(sp.lines.length, sp.px, sp.lineH);
    }

    function renderLevelDialogue() {
      ctx.fillStyle = 'rgba(10, 10, 20, 0.92)';
      ctx.fillRect(0, 0, width, height);

      const pSize = 140;
      const pX = (width - pSize) / 2;
      const pY = LEVEL_DIALOGUE_PY;
      const activeFrame = (Math.floor(Date.now() / 5000) % 2 === 0) ? khaleesiFrame1 : khaleesiFrame2;

      ctx.fillStyle = '#11161d';
      ctx.fillRect(pX, pY, pSize, pSize);
      if (activeFrame.complete && activeFrame.naturalWidth !== 0) {
        ctx.drawImage(activeFrame, pX, pY, pSize, pSize);
      }
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#f1c40f';
      ctx.strokeRect(pX, pY, pSize, pSize);

      ctx.fillStyle = '#f1c40f';
      ctx.font = 'bold 22px "Proxima Nova", sans-serif';
      ctx.textAlign = 'center';

      let title = "LEVEL 1: THE SIEGE BEGINS!";
      let buttonText = "BEGIN CONQUEST";

      if (levelDialogueType === 'LEVEL1_CLEAR') {
        title = "LEVEL 1 CONQUERED!";
        buttonText = "START LEVEL 2";
      } else if (levelDialogueType === 'LEVEL2_CLEAR') {
        title = "LEVEL 2 CONQUERED!";
        buttonText = "START LEVEL 3";
      } else if (levelDialogueType === 'BOSS_CLEAR') {
        title = "SIEGE TOWER DESTROYED!";
        buttonText = "START LEVEL 4";
      } else if (levelDialogueType === 'LEVEL4_CLEAR') {
        title = "LEVEL 4 CONQUERED!";
        buttonText = "START LEVEL 5";
      } else if (levelDialogueType === 'CAVE_CLEAR') {
        title = "OUT OF THE DEPTHS!";
        buttonText = "START LEVEL 4";
      } else if (levelDialogueType === 'VICTORY') {
        title = "SLAVERS DEFEATED! VICTORY!";
        buttonText = "PLAY AGAIN";
      }

      fitFont(title, 22, width - 24);
      ctx.fillText(title, width / 2, pY - 20);

<script>
// boss.js — Siege engine boss state, geometry, archer spawning/waves, burn helpers
// Classic script: shares global scope with the other src/js files. Load order matters (see index.html).

    // ==========================================
// SIEGE ENGINE BOSS LOGIC & RENDERING
// ==========================================

function bossBurnNew() {
  return { flames: [], charProgress: 0, charred: false };
}

var bossState = {
  active: false,
  x: 0,
  baseX: 0,
  swayAmp: 0,
  frame: 0,
  bump: 0,
  rumbleY: 0,
  groundScroll: 0,
  roll: 1,
  wheelAngle: 0,
  topHp: 100,
  midHp: 100,
  botHp: 100,
  topTimer: 0,
  botTimer: 0,
  topChainProgress: 0,
  botChainProgress: 0,
  topState: 'IDLE',
  botState: 'IDLE',
  archers: [],
  groupShootTimer: 0,
  speechBubbleTimer: 0,
  spawnTimer: 0,
  clearHold: 0,
  topFlash: 0,
  midFlash: 0,
  botFlash: 0,
  burn: { top: bossBurnNew(), mid: bossBurnNew(), bot: bossBurnNew() }
};

const BOSS_MAX_ARCHERS = 50;
const BOSS_CANNON_RELOAD = 160;   // frames between cannon shots (was 220, then 190)
const BOSS_WINDOW_FRAMES = 300;   // how long the center is open after you clear a wave
const BOSS_ROLL_SPEED = 9.0;      // ground speed under the wheels (px/frame); was 3
const BOSS_BG_SPEED = 2.2;        // sky/castle parallax speed during the chase (normal play is 0.4)
const BOSS_CHASE_AHEAD = 0.14;    // how far (fraction of screen width) the tower can lunge toward the dragon
const BOSS_CHASE_BACK = 0.03;     // how far it can fall back to the right
let bossRocks = [];               // dirt and stones thrown up by the wheels
let bossCinematic = false;        // true while the intro cinematic draws the tower (no HUD bars)
const BOSS_FIRST_WAVE = 14;       // garrison already on the platform
const BOSS_WAVE_GROWTH = 6;       // each later wave brings this many more archers
const BOSS_WAVE_SPAWN_GAP = 22;   // frames between archers coming out of the door during a wave
const BOSS_REINFORCE_FRAMES = 480; // next wave starts this long after the last one finished climbing out, even if it is still alive
const BOSS_REINFORCE_MAX_ALIVE = 30; // ...unless this many archers are already alive
const BOSS_VOLLEY_CYCLE = 155;    // frames between archer volleys (was 180)
const BOSS_KILLS_PER_SHOT = 3;    // one breath (6 flames) can take out at most this many archers

// Archers come in waves: SPAWNING (climbing out) -> FIGHTING (no reinforcements) -> OPEN (center exposed).
function bossWaveSize(wave) {
  return Math.min(BOSS_MAX_ARCHERS, BOSS_FIRST_WAVE + (wave - 1) * BOSS_WAVE_GROWTH);
}

// The center can be burned whenever no archer is standing ready on the platform
// (an empty platform, or a new wave still climbing the ladder).
function bossMidOpen() {
  if (bossState.midHp <= 0) return false;
  for (let i = 0; i < bossState.archers.length; i++) if (bossState.archers[i].phase === 'READY') return false;
  return true;
}

// All boss dimensions in one place. Archer x values are relative to the tower's left edge.
function bossGeom() {
  const bw = width * 0.40;
  const gY = height - groundHeight;
  // the tower rides on a wheeled platform that is wider than the tower itself
  const over = bw * 0.16;                                  // platform overhang on each side
  const wheelR = Math.max(40, Math.min((bw + 2 * over) * 0.235, height * 0.09, 80));
  const deckH = 20;
  const deckTop = gY - 2 * wheelR + 6;                     // deck rides on top of the wheels
  const turretH = height / 3;
  const baseTop = deckTop - 84;                            // stone lower section rests on the deck
  const platY = turretH + (baseTop - turretH) * 0.42;   // upper archer platform
  const platY2 = baseTop - 22;                            // lower archer platform
  const rBall = height / 6.8;
  const ladderX = bw * 0.58;
  const slots = [];
  const rowDy = [0, -6, -12];
  // upper platform: 3 rows; lower platform: 2 rows
  [[platY, 3, 1], [platY2, 2, 2]].forEach(pl => {
    for (let row = 0; row < pl[1]; row++) {
      const off = row * 5;
      for (let sx = 20 + off; sx <= ladderX - 12; sx += 10) slots.push({ x: sx, row: row, dy: rowDy[row], py: pl[0], plat: pl[2] });
      for (let sx = ladderX + 14 + off; sx <= bw - 14; sx += 10) slots.push({ x: sx, row: row, dy: rowDy[row], py: pl[0], plat: pl[2] });
    }
  });
  return {
    bw, gY, wheelR, turretH, baseTop, platY, platY2, rBall, ladderX,
    over, deckTop, deckH,
    wheelXs: [-over + wheelR + 2, bw + over - wheelR - 2],
    sillY: baseTop + 64,
    doorCx: bw * 0.83,
    doorW: Math.max(24, Math.min(34, bw * 0.17)),
    doorH: 38,
    cyTop: rBall + 4,
    cyBot: baseTop + 50,
    barrelLen: 36,
    slots: slots
  };
}

function bossAliveArchers() {
  let n = 0;
  for (let i = 0; i < bossState.archers.length; i++) if (bossState.archers[i].phase !== 'DYING') n++;
  return n;
}

function bossFreeSlot() {
  const g = bossGeom();
  const used = {};
  const perPlat = { 1: 0, 2: 0 };
  bossState.archers.forEach(a => { if (a.slot >= 0 && g.slots[a.slot]) { used[a.slot] = true; perPlat[g.slots[a.slot].plat]++; } });
  // fill whichever platform currently has fewer archers
  const want = perPlat[2] < perPlat[1] ? 2 : 1;
  for (let i = 0; i < g.slots.length; i++) if (!used[i] && g.slots[i].plat === want) return i;
  for (let i = 0; i < g.slots.length; i++) if (!used[i]) return i;
  return -1;
}

function bossSpawnArcher(instant) {
  if (bossAliveArchers() >= BOSS_MAX_ARCHERS) return false;
  const g = bossGeom();
  const slot = bossFreeSlot();
  const a = { slot: slot, anim: Math.random() * 10, phase: 'EMERGE', fade: 0, recoil: 0, aim: false, fireIn: -1, dieT: 0, x: g.doorCx, y: g.sillY };
  if (instant) {
    if (slot < 0) return false;
    a.phase = 'READY';
    a.fade = 1;
    a.x = g.slots[slot].x;
    a.y = g.slots[slot].py + g.slots[slot].dy;
  }
  bossState.archers.push(a);
  return true;
}

function bossKillArcher(a) {
  if (!a || a.phase === 'DYING') return;
  a.phase = 'DYING';
  a.dieT = 0;
  a.slot = -1;
  a.aim = false;
  a.fireIn = -1;
  if (sound.knightHit) sound.knightHit();
}

function bossResetState() {
  bossState.baseX = width;
  bossState.x = width;
  bossState.swayAmp = 0;
  bossState.arrived = false;
  bossState.chaseOff = 0;
  bossState.chaseV = 0;
  bossState.chaseTarget = 0;
  bossState.chaseTimer = 120;
  bossState.frame = 0;
  bossState.bump = 0;
  bossState.rumbleY = 0;
  bossState.groundScroll = 0;
  bossState.roll = 1;
  bossState.wheelAngle = 0;
  bossState.topHp = 100;
  bossState.midHp = 100;
  bossState.botHp = 100;
  bossState.topState = 'IDLE';
  bossState.botState = 'IDLE';
  bossState.topTimer = 100;
  bossState.botTimer = 180;
  bossState.topChainProgress = 0;
  bossState.botChainProgress = 0;
  bossState.groupShootTimer = 0;
  bossState.speechBubbleTimer = 0;
  bossState.spawnTimer = 0;
  bossState.clearHold = 0;
  bossState.wave = 1;
  bossState.waveState = 'FIGHTING';
  bossState.waveToSpawn = 0;
  bossState.fightTimer = 0;
  bossState.shotKills = {};
  bossState.topFlash = 0;
  bossState.midFlash = 0;
  bossState.botFlash = 0;
  bossState.burn = { top: bossBurnNew(), mid: bossBurnNew(), bot: bossBurnNew() };
  invulnerableTimer = 0;

  // A garrison is already on the platform; more keep coming up the ladder.
  bossState.archers = [];
  for (let i = 0; i < BOSS_FIRST_WAVE; i++) bossSpawnArcher(true);
  bossRocks = [];
}

// Clear the level so only the dragon and the tower are left.
function bossClearWorld() {

  obstacles = [];
  battlements = [];
  archers = [];
  knights = [];
  clearLevelExtras();
  trebuchets = [];
  arrows = [];
  trebuchetBoulders = [];
  flames = [];
  groundFlames = [];
  collectableHearts = [];
  khaleesis = [];
  isHoldingAction = false;
  holdTimer = 0;
}

function triggerBossBattle() {
  bossIntro = null;
  bossCinematic = false;
  state = 'BOSS';
  bossState.active = true;
  bossResetState();
  bossClearWorld();
  invulnerableTimer = 0;
  // the beheading music plays during the boss fight; start it from the top
  if (cutsceneMusicAudio.paused) cutsceneMusicAudio.currentTime = 0;
  showKhaleesiBanner('Here it comes! Burn it down, Cyndraxx!', 220);
  updateLevelBadgeUI();
}

// Where a launched sphere is, and how big. Starts small at the cannon mouth, then "swells" as it
// flies at the dragon. Shared by rendering and collision so they always agree.
function bossBall(progress, cy) {
  const g = bossGeom();
  const muzzleX = bossState.x - g.barrelLen;
  const grow = Math.min(1, 0.12 + progress * 4.2);
  const r = Math.max(13, g.rBall * grow);
  return { x: muzzleX - progress * width, y: cy, r: r, rot: -(progress * width) / g.rBall, muzzleX: muzzleX };
}

function bossMuzzleBlast(cy) {
  const g = bossGeom();
  const mx = bossState.x - g.barrelLen;
  sound.boulderLaunch();
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: mx, y: cy,
      vx: -1 - Math.random() * 4, vy: (Math.random() - 0.5) * 3,
      size: 10 + Math.random() * 12, life: 40 + Math.random() * 20,
      color: 'rgba(70,70,80,0.8)', isSmoke: true
    });
  }
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: mx, y: cy,
      vx: -3 - Math.random() * 6, vy: (Math.random() - 0.5) * 6,
      size: 2 + Math.random() * 3, life: 12 + Math.random() * 10,
      color: Math.random() < 0.5 ? '#f1c40f' : '#e67e22'
    });
  }
}

// Same destruction sequence as the castle towers: ignite, a dark char wave sweeps down with
// falling debris and smoke, then the section is charred and the tower-destroyed sound plays.
function bossSectionRange(sec, g) {
  if (sec === 'top') return [0, g.turretH];
  if (sec === 'mid') return [g.turretH, g.baseTop];
  return [g.baseTop, g.gY];
}

function bossUpdateBurn(sec, hp, g) {
  const b = bossState.burn[sec];

  // surface flames grow, drift and eventually die down (unless the section is going down)
  for (let i = b.flames.length - 1; i >= 0; i--) {
    const f = b.flames[i];
    if (f.w < f.mw) f.w += 0.45;
    if (f.h < f.mh) f.h += 0.55;
    f.x += f.spread;
    f.x = Math.max(6, Math.min(g.bw - 6, f.x));
    f.life--;
    if (f.life <= 0 && !(hp <= 0 && !b.charred)) b.flames.splice(i, 1);
  }

  if (hp <= 0 && b.charProgress === 0 && !b.charred) {
    b.charProgress = 0.01;
    sound.score();
  }

  if (b.charProgress > 0 && !b.charred) {
    b.charProgress += 0.007;
    const range = bossSectionRange(sec, g);
    const waveY = range[0] + (range[1] - range[0]) * b.charProgress;

    if (Math.random() < 0.6) {
      blackDebris.push({
        x: bossState.x + Math.random() * g.bw,
        y: waveY,
        vx: (Math.random() - 0.5) * 3,
        vy: -Math.random() * 2,
        gravity: 0.25,
        size: 8 + Math.random() * 8,
        life: 60,
        rotation: Math.random() * Math.PI,
        rotSpeed: (Math.random() - 0.5) * 0.15
      });
    }
    if (Math.random() < 0.4) {
      particles.push({
        x: bossState.x + Math.random() * g.bw,
        y: waveY - 5,
        vx: (Math.random() - 0.5) * 2.0,
        vy: -Math.random() * 1.5,
        size: 6 + Math.random() * 6,
        life: 60,
        color: 'rgba(10, 10, 15, 0.9)',
        isSmoke: true
      });
    }
    if (b.charProgress >= 1.0) {
      b.charProgress = 1.0;
      b.charred = true;
      b.flames = [];
      gameStats.burnedTowers++;
      sound.towerDestroy();
    }
  }

  // smouldering once it is a burnt-out shell
  if (b.charred && Math.random() < 0.03) {
    const range = bossSectionRange(sec, g);
    particles.push({
      x: bossState.x + Math.random() * g.bw,
      y: range[0] + Math.random() * (range[1] - range[0]),
      vx: (Math.random() - 0.5) * 0.8,
      vy: -0.6 - Math.random() * 0.8,
      size: 5 + Math.random() * 5,
      life: 50,
      color: 'rgba(10, 10, 15, 0.7)',
      isSmoke: true
    });
  }
}

function bossAddSurfaceFlame(sec, f, g) {
  const b = bossState.burn[sec];
  if (b.flames.length >= 14 || Math.random() > 0.45) return;
  b.flames.push({
    x: Math.max(8, Math.min(g.bw - 8, f.x - bossState.x)),
    y: f.y,
    w: 12, mw: 28 + Math.random() * 20,
    h: 14, mh: 34 + Math.random() * 22,
    spread: (Math.random() - 0.5) * 0.8,
    life: 240 + Math.random() * 120
  });
}
